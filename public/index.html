<style>
  /* Neutral, CRM-style palette: grey-scale surfaces, one brand accent, colour reserved for status and data. */
  :root{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F7F8FA; --border:#E4E7EC;
    --ink:#101828; --ink-soft:#475467; --ink-mute:#667085;
    --sidebar:#FFFFFF; --sidebar-2:#F7F8FA; --sidebar-line:#EAECF0; --sidebar-text:#344054; --sidebar-text-dim:#98A2B3; --sidebar-title:#101828;
    --nav-active-bg:#FDF1EA; --nav-active-ink:#B8481A;
    --accent:#D9582A; --accent-ink:#FFFFFF; --accent-soft:#FDF1EA; --accent-dark:#B8481A;
    --green:#12B76A; --green-soft:#ECFDF3; --red:#E5484D; --red-soft:#FEF3F2; --amber:#DC8A0E; --amber-soft:#FFF8EB;
    --blue:#2E6BE6; --blue-soft:#EEF4FF; --violet:#7A5AF8; --violet-soft:#F4F3FF; --cyan:#0E9384; --cyan-soft:#F0FDF9; --emerald:#079455; --emerald-soft:#ECFDF3;

    --ig:#E1306C; --fb:#1877F2; --tt:#111111; --yt:#FF0033; --gbp:#0F9D58;
    --radius:10px; --radius-sm:8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C111D; --surface:#161B26; --surface-2:#1F242F; --border:#2A303C;
      --ink:#F5F5F6; --ink-soft:#CECFD2; --ink-mute:#94969C;
      --sidebar:#161B26; --sidebar-2:#1F242F; --sidebar-line:#2A303C; --sidebar-text:#CECFD2; --sidebar-text-dim:#85888E; --sidebar-title:#F5F5F6;

      --accent:#EA6A3B; --accent-soft:#2B2019; --accent-dark:#F4A47A;
      --green-soft:#0C2A1C; --red-soft:#2E1517; --amber-soft:#2E2210; --blue-soft:#14213D; --violet-soft:#221C3D; --cyan-soft:#0A2724; --emerald-soft:#0C2A1C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C111D; --surface:#161B26; --surface-2:#1F242F; --border:#2A303C;
    --ink:#F5F5F6; --ink-soft:#CECFD2; --ink-mute:#94969C;

  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,-apple-system,sans-serif; font-feature-settings:"cv11","ss01"; -webkit-font-smoothing:antialiased; letter-spacing:-.005em;}
  h1,h2,h3,h4,.font-display{font-family:"Inter",system-ui,sans-serif; font-weight:600; letter-spacing:-.02em; text-wrap:balance;}
  /* Calmer type: the UI was built with heavy 700/800 weights everywhere, which read as chunky. Step them down one notch. */
  #cf-root [style*="font-weight: 800"]{font-weight:700 !important;}
  #cf-root [style*="font-weight: 700"]{font-weight:600 !important;}
  input, select, textarea{font-family:inherit;}
  select:focus, input:focus, textarea:focus{outline:none; border-color:var(--accent) !important; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  ::selection{background:var(--accent); color:#fff;}
  button{font-family:inherit;}
  a{color:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  #cf-root{min-height:100%;}
  /* Mobile usability pass: iOS Safari zooms the whole page in when a focused form field is under
     16px, which feels broken on every tap — force real form fields to 16px on phone-sized screens. */
  @media (max-width:640px){
    input, select, textarea { font-size:16px !important; }
    .cf-field-grid { grid-template-columns:1fr !important; }
  }
  /* Bigger, easier-to-hit tap targets on touch screens (buttons, nav items, checkboxes). */
  @media (pointer:coarse){
    button, [role="button"] { min-height:40px; }
  }
  @keyframes cf-shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
  @keyframes cf-toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes cf-card-in{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  @keyframes cf-fade-in{from{opacity:0;} to{opacity:1;}}
  body.cf-immersive .cf-toasts{top:calc(16px + env(safe-area-inset-top, 0px)); bottom:auto !important; left:16px; right:16px !important; margin:0 auto;}
  @media (max-width:700px){ .cf-hide-narrow{display:none !important;} }
  .cf-dots span{animation:cfdot 1.2s infinite both;} .cf-dots span:nth-child(2){animation-delay:.2s;} .cf-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes cfdot{0%,80%,100%{opacity:.2} 40%{opacity:1}}
  @media (max-width:640px){ .cf-make-row{grid-template-columns:1fr !important; gap:8px !important;} }
  .cf-clickcard{transition:border-color .12s, box-shadow .12s, transform .12s;} .cf-clickcard:hover{border-color:var(--ink-mute) !important; box-shadow:var(--shadow-md) !important;} .cf-clickcard:active{transform:scale(.99);}
  .cf-noscrollbar{scrollbar-width:none;} .cf-noscrollbar::-webkit-scrollbar{display:none;}
  @keyframes cf-spin{to{transform:rotate(360deg);}}
  @keyframes cf-pop-in{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}

const CAPS = {db:null, user:null, sample:null, viewerEmail:null, viewerName:"", canEdit:false, ready:false};

(async function initCaps(){
  try{
    if(typeof claude !== "undefined" && claude.use){
      const [db, user, sample] = await Promise.all([
        claude.use("db").catch(()=>null),
        claude.use("user").catch(()=>null),
        claude.use("sample").catch(()=>null),
      ]);
      CAPS.db = db; CAPS.user = user; CAPS.sample = sample;
      if(user){
        try{ const me = await user.me(); CAPS.viewerEmail = me.email; CAPS.viewerName = me.name; CAPS.canEdit = me.canEdit; }catch(e){}
      }
    }
  }catch(e){ /* capabilities unavailable — app falls back to local demo state */ }
  CAPS.ready = true;
  capsListeners.forEach(fn=>{ try{ fn(); }catch(e){} });

const ANY_APPROVER = "any";
// Average time from a post being sent for approval to this person's decision on it, from the real activity log.
function reviewTurnaround(log, userId){
  const sentAt = {}; const waits = [];
  [...(log||[])].sort((a,b)=> new Date(a.at)-new Date(b.at)).forEach(a=>{
    if(a.type==="submitted" || (a.type==="created" && /submitted/i.test(a.detail||""))) sentAt[a.contentId] = new Date(a.at).getTime();
    else if(["approved","rejected","changes_requested"].includes(a.type) && a.user===userId && sentAt[a.contentId]){
      waits.push(new Date(a.at).getTime() - sentAt[a.contentId]); delete sentAt[a.contentId];
    }
  });
  if(!waits.length) return "—";
  const h = waits.reduce((x,y)=>x+y,0)/waits.length/3600e3;
  return h < 1 ? Math.max(1, Math.round(h*60))+"m" : h < 48 ? h.toFixed(1)+"h" : (h/24).toFixed(1)+"d";
}

function grad(seed){
  const pairs = [["#6D6FF2","#4548C9"],["#F472B6","#DB2777"],["#38BDF8","#0891B2"],["#FBBF24","#D97706"],["#34D399","#059669"],["#A78BFA","#7C3AED"],["#FB923C","#EA580C"]];

/* Turn an uploaded image into a resized JPEG data URL, so real content previews render
   instead of a placeholder gradient, without bloating localStorage with a full-res photo. */
function imageFileToPreview(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxDim/Math.max(img.naturalWidth||maxDim, img.naturalHeight||maxDim));
      const w = Math.max(1, Math.round((img.naturalWidth||maxDim)*scale));
      const h = Math.max(1, Math.round((img.naturalHeight||maxDim)*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ resolve(canvas.toDataURL("image/jpeg", quality)); }catch(e){ reject(e); }
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
/* Read an uploaded file's real shape and length, so aspect ratio + duration fill themselves in. */
function readMediaInfo(file, isVideo){
  return new Promise(resolve=>{
    const isUrl = typeof file==="string";
    const url = isUrl ? file : URL.createObjectURL(file);
    let settled = false;
    const done = info=>{ if(settled) return; settled = true; if(!isUrl) URL.revokeObjectURL(url); resolve(info); };
    if(isVideo){
      const v = document.createElement("video");
      v.preload = "metadata"; v.muted = true;
      v.onloadedmetadata = ()=>done({w:v.videoWidth, h:v.videoHeight, duration:v.duration});
      v.onerror = ()=>done(null);
      v.src = url;
    } else {
      const img = new Image();
      img.onload = ()=>done({w:img.naturalWidth, h:img.naturalHeight});
      img.onerror = ()=>done(null);
      img.src = url;
    }
    setTimeout(()=>done(null), 8000);
  });
}
function nearestAspect(w, h){
  if(!w || !h) return null;
  const r = w/h;
  const opts = [["9:16",9/16],["4:5",4/5],["1:1",1],["16:9",16/9]];
  return opts.reduce((a,b)=> Math.abs(Math.log(r/b[1])) < Math.abs(Math.log(r/a[1])) ? b : a)[0];
}
/* Grab a real frame from an uploaded video as a poster-image preview (we don't store the
   whole video — just a still from partway through it, so the card shows the actual clip). */
function videoFileToPoster(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.muted = true; video.playsInline = true; video.preload = "metadata"; video.src = url;
    const cleanup = ()=>URL.revokeObjectURL(url);
    video.addEventListener("loadeddata", ()=>{
      try{ video.currentTime = Math.min(Math.max((video.duration||2)*0.3, 0.1), 3); }
      catch(e){ /* some codecs reject seeks before enough data; grabFrame below still runs on 'seeked' or falls back */ }
    });
    video.addEventListener("seeked", grabFrame);
    video.addEventListener("loadedmetadata", ()=>{ if(video.readyState>=2) grabFrame(); });
    let grabbed = false;
    function grabFrame(){
      if(grabbed) return; grabbed = true;
      const scale = Math.min(1, maxDim/Math.max(video.videoWidth||maxDim, video.videoHeight||maxDim));
      const w = Math.max(1, Math.round((video.videoWidth||maxDim)*scale));
      const h = Math.max(1, Math.round((video.videoHeight||maxDim)*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      try{
        canvas.getContext("2d").drawImage(video, 0, 0, w, h);
        cleanup();
        resolve(canvas.toDataURL("image/jpeg", quality));
      }catch(e){ cleanup(); reject(e); }
    }
    video.addEventListener("error", (e)=>{ cleanup(); reject(e); });
    setTimeout(()=>{ if(!grabbed) reject(new Error("timeout")); }, 6000);
  });
}

function PriorityDot({priority}){ const m=PRIORITY_META[priority]; return <span style={{display:"inline-flex", alignItems:"center", gap:6, fontSize:12.5, color:"var(--ink-soft)", fontWeight:600}}><span style={{width:7,height:7,borderRadius:99,background:m.color}}/>{m.label}</span>; }

function Thumb({item, radius=12, iconSize=22, bare}){

      {!bare && item.media.type==="video" && item.media.duration ? <span style={{position:"absolute", bottom:6, right:7, fontSize:10.5, fontWeight:700, color:"#fff", background:"rgba(0,0,0,.4)", borderRadius:5, padding:"1px 5px"}}>{item.media.duration}s</span> : null}

function Tooltip({x,y,children}){

function BarChart({data, colorKey="color", height=200, valueFmt=fmtNum, unit=""}){
  const [hover,setHover]=useState(null);
  const max = Math.max(...data.map(d=>d.value), 1);
  return (
    <div style={{position:"relative"}}>
      <div style={{display:"flex", alignItems:"flex-end", gap:"3.5%", height, padding:"4px 2px"}}>

          <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:8, height:"100%", justifyContent:"flex-end"}}
            onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
            <div style={{width:"100%", height:Math.max((d.value/max)*(height-46),4), borderRadius:"7px 7px 3px 3px", background:d[colorKey]||"var(--accent)", opacity: hover===null||hover===i?1:0.45, transition:"opacity .15s, height .3s ease", cursor:"pointer", position:"relative"}}>
              {hover===i && <Tooltip x="50%" y="-6px">{d.label}: {valueFmt(d.value)}{unit}</Tooltip>}
            </div>
            <div style={{fontSize:11.5, color:CHART_INK, fontWeight:600, textAlign:"center", lineHeight:1.2}}>{d.shortLabel||d.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LineChart({series, height=220, xLabels, valueFmt=fmtNum}){
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const W = 640, H = height, padL=36, padR=12, padT=14, padB=26;
  const allVals = series.flatMap(s=>s.points);
  const max = Math.max(...allVals)*1.12 || 1;
  const min = Math.min(0, Math.min(...allVals));
  const n = series[0].points.length;
  const x = i => padL + (i/(n-1))*(W-padL-padR);
  const y = v => padT + (1-( (v-min)/(max-min || 1) ))*(H-padT-padB);
  const ticks = 4;
  function handleMove(e){
    const rect = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX-rect.left)/rect.width)*W;
    let idx = Math.round(((px-padL)/(W-padL-padR))*(n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    setHoverIdx(idx);
  }
  return (
    <div style={{position:"relative"}}>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height:"auto", display:"block", overflow:"visible"}}
        onMouseMove={handleMove} onMouseLeave={()=>setHoverIdx(null)}>
        {Array.from({length:ticks+1}).map((_,i)=>{
          const v = min + (max-min)*(i/ticks);
          return <g key={i}>
            <line x1={padL} x2={W-padR} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1"/>
            <text x={padL-8} y={y(v)+3} fontSize="10.5" textAnchor="end" fill={CHART_INK}>{valueFmt(v)}</text>
          </g>;
        })}
        {series.map((s,si)=>{
          const d = s.points.map((v,i)=> (i===0?"M":"L")+x(i)+","+y(v)).join(" ");
          const area = d + ` L ${x(n-1)},${y(min)} L ${x(0)},${y(min)} Z`;
          return <g key={si}>
            {!s.dashed && <path d={area} fill={s.color} opacity="0.08"/>}
            <path d={d} fill="none" stroke={s.color} strokeWidth={s.dashed? 1.6 : 2.5} strokeDasharray={s.dashed? "5,5" : undefined} opacity={s.dashed? .7 : 1} strokeLinecap="round" strokeLinejoin="round"/>
            {!s.dashed && s.points.map((v,i)=> (i===n-1) && <circle key={i} cx={x(i)} cy={y(v)} r="4" fill={s.color} stroke="var(--surface)" strokeWidth="1.5"/>)}
          </g>;
        })}
        {hoverIdx!=null && <line x1={x(hoverIdx)} x2={x(hoverIdx)} y1={padT} y2={H-padB} stroke="var(--ink-mute)" strokeWidth="1" strokeDasharray="3,3"/>}
        {hoverIdx!=null && series.map((s,si)=> <circle key={si} cx={x(hoverIdx)} cy={y(s.points[hoverIdx])} r="4.5" fill={s.color} stroke="var(--surface)" strokeWidth="2"/>)}
        {xLabels.map((l,i)=> (i%Math.ceil(n/6)===0 || i===n-1) && <text key={i} x={x(i)} y={H-8} fontSize="10.5" textAnchor="middle" fill={CHART_INK}>{l}</text>)}
      </svg>
      {hoverIdx!=null && (
        <div style={{position:"absolute", left:`${(x(hoverIdx)/W)*100}%`, top:8, transform:"translateX(-50%)", background:"var(--ink)", color:"var(--surface)", borderRadius:8, padding:"7px 10px", fontSize:11.5, fontWeight:600, pointerEvents:"none", whiteSpace:"nowrap", boxShadow:"var(--shadow-md)"}}>
          <div style={{opacity:.7, marginBottom:2}}>{xLabels[hoverIdx]}</div>
          {series.map((s,si)=><div key={si} style={{display:"flex", gap:6, alignItems:"center"}}><span style={{width:7,height:7,borderRadius:99,background:s.color, opacity:s.dashed?.6:1}}/>{s.name}: {valueFmt(s.points[hoverIdx])}</div>)}
        </div>
      )}
      {series.length>1 && <div style={{display:"flex", gap:16, marginTop:8, flexWrap:"wrap"}}>
        {series.map((s,i)=><div key={i} style={{display:"flex", alignItems:"center", gap:6, fontSize:12, fontWeight:600, color:"var(--ink-soft)"}}>{s.dashed ? <span style={{width:14, borderTop:"2px dashed "+s.color}}/> : <span style={{width:9,height:9,borderRadius:3,background:s.color}}/>}{s.name}</div>)}
      </div>}
    </div>
  );
}

function FunnelChart({stages}){
  const max = Math.max(...stages.map(s=>s.value),1);
  return (
    <div style={{display:"flex", flexDirection:"column", gap:9}}>
      {stages.map((s,i)=>(
        <div key={i} style={{display:"flex", alignItems:"center", gap:10}}>
          <div style={{width:118, fontSize:12.5, fontWeight:600, color:"var(--ink-soft)", flexShrink:0}}>{s.label}</div>
          <div style={{flex:1, background:"var(--surface-2)", borderRadius:8, height:22, position:"relative", overflow:"hidden"}}>
            <div style={{width:`${Math.max((s.value/max)*100,3)}%`, height:"100%", borderRadius:8, background:s.color, transition:"width .4s ease"}}/>
          </div>
          <div className="num" style={{width:34, fontSize:12.5, fontWeight:700, textAlign:"right"}}>{s.value}</div>
        </div>
      ))}
    </div>
  );
}

/* ============================== TOASTS ============================== */
function ToastHost({toasts, remove}){
  return (
    <div className="cf-toasts" style={{position:"fixed", bottom:20, right:20, display:"flex", flexDirection:"column", gap:10, zIndex:200, maxWidth:340}}>
      {toasts.map(t=>(
        <div key={t.id} style={{background:"var(--ink)", color:"var(--surface)", padding:"12px 14px", borderRadius:11, boxShadow:"var(--shadow-lg)", display:"flex", alignItems:"flex-start", gap:10, animation:"cf-toast-in .25s ease"}}>
          <div style={{width:22, height:22, borderRadius:99, background: t.variant==="danger"?"var(--red)": t.variant==="warn"?"var(--amber)":"var(--green)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:1}}>
            <Icon name={t.variant==="danger"?"x":"check"} size={12} strokeWidth={3} style={{color:"#fff"}}/>
          </div>
          <div style={{fontSize:13, fontWeight:600, lineHeight:1.4}}>{t.message}</div>
          <button onClick={()=>remove(t.id)} style={{background:"none", border:"none", color:"var(--sidebar-text-dim)", cursor:"pointer", marginLeft:"auto", padding:2}}><Icon name="x" size={14} /></button>
        </div>
      ))}
    </div>
  );
}
</script>

<script type="text/babel" data-presets="react">
/* ============================== STATE ============================== */
const LS_KEY = "contentflow_state_v1";
const WELCOME_KEY = "contentflow_signed_in_as";
function readWelcome(){ try{ return localStorage.getItem(WELCOME_KEY); }catch(e){ return null; } }
function loadPersisted(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function savePersisted(state){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      contentItems: state.contentItems, activityLog: state.activityLog, currentUserId: state.currentUserId,
      currentBrandId: state.currentBrandId, decisionHistory: state.decisionHistory, theme: state.theme, campaigns: state.campaigns,
    }));
  }catch(e){ /* storage unavailable — ignore */ }
}

/* ============================== SERVER SYNC (Cloudflare D1 via Pages Functions) ==============================
   localStorage above is just an instant-paint cache for one browser. The real shared record — the one
   every device and every teammate sees — lives in /api/state, backed by D1. We fetch it once on load and
   push the whole content-relevant slice back up (debounced) whenever it changes. */
async function fetchServerState(){
  try{
    const res = await fetch("/api/state");
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; /* offline, or running somewhere /api isn't wired up yet */ }
}
function pushServerState(state){
  const payload = {
    resetId: state.serverResetId || null,
    contentItems: state.contentItems, activityLog: state.activityLog, decisionHistory: state.decisionHistory,
    calendarTemplate: state.calendarTemplate, adminEmails: state.adminEmails, theme: state.theme, campaigns: state.campaigns,
    chatUpdates: state.chatUpdates !== false,
  };
  fetch("/api/state", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)}).then(res=>{
    // 409 = the shared workspace was reset after this page loaded. Don't write the old copy back — reload fresh.
    if(res.status===409){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      let once = false; try{ once = sessionStorage.getItem("cf_reset_reload")==="1"; sessionStorage.setItem("cf_reset_reload","1"); }catch(e){}
      if(!once) window.location.reload();
    }
  }).catch(()=>{
    /* offline or /api not available — localStorage cache above still has this device covered */
  });
}
async function uploadMediaFile(file, onProgress){
  const fd = new FormData();
  fd.append("file", file, file.name);
  const res = await fetch("/api/upload", {method:"POST", body: fd});
  if(!res.ok) throw new Error("Upload failed ("+res.status+")");
  return await res.json(); // { url, key }
}

function initState(){
  const persisted = loadPersisted();
  // Guard against localStorage saved by an earlier version of this app (with the old demo brands/users) —
  // if any persisted content references a brand or user that no longer exists, start fresh instead of crashing.
  const brandIds = new Set(BRANDS.map(b=>b.id));
  const userIds = new Set(USERS.map(u=>u.id));
  const persistedItemsValid = persisted && Array.isArray(persisted.contentItems) && persisted.contentItems.every(i=> brandIds.has(i.brand) && userIds.has(i.creator));
  return {
    contentItems: persistedItemsValid ? persisted.contentItems : CONTENT_ITEMS,
    activityLog: persistedItemsValid && Array.isArray(persisted.activityLog) ? persisted.activityLog : ACTIVITY_LOG,
    publishedPosts: PUBLISHED_POSTS,
    // Whoever picked their name on the welcome page is the current user on this device.
    currentUserId: (userIds.has(readWelcome()) && readWelcome()) || (persisted && userIds.has(persisted.currentUserId) && persisted.currentUserId) || "u_cyrus",
    currentBrandId: "sanjugo",
    decisionHistory: persistedItemsValid && Array.isArray(persisted.decisionHistory) ? persisted.decisionHistory : [],
    theme: (persisted && persisted.theme) || "system",
    calendarTemplate: DEFAULT_CALENDAR_TEMPLATE,
    adminEmails: [DEFAULT_ADMIN_EMAIL],
    campaigns: (persisted && Array.isArray(persisted.campaigns)) ? persisted.campaigns : CAMPAIGNS,
    chatUpdates: true,
    toasts: [],
    route: "dashboard",
    signedInAs: readWelcome(),
  };
}

function reducer(state, action){
  switch(action.type){
    case "LOAD_STATE": {
      // Replaces locally-derived data with what the shared server actually has, once it answers.
      // toasts/route stay local — those are per-tab UI state, not shared content.
      const s = action.data || {};
      return {
        ...state,
        contentItems: Array.isArray(s.contentItems) ? withTagsFixed(s.contentItems) : state.contentItems,
        activityLog: Array.isArray(s.activityLog) ? s.activityLog : state.activityLog,
        decisionHistory: Array.isArray(s.decisionHistory) ? s.decisionHistory : state.decisionHistory,
        calendarTemplate: Array.isArray(s.calendarTemplate) ? s.calendarTemplate : state.calendarTemplate,
        adminEmails: Array.isArray(s.adminEmails) ? s.adminEmails : state.adminEmails,
        campaigns: Array.isArray(s.campaigns) ? s.campaigns : state.campaigns,
        chatUpdates: s.chatUpdates !== false,
        theme: s.theme || state.theme,
        serverResetId: s.resetId || null,
        serverLoaded: true,
      };
    }
    case "SET_USER": return {...state, currentUserId: action.id};
    case "WELCOME_SIGN_IN": {
      try{ localStorage.setItem(WELCOME_KEY, action.id); }catch(e){}
      return {...state, currentUserId: action.id, signedInAs: action.id};
    }
    case "BOOT_DONE": return {...state, bootDone:true};
    case "WELCOME_SIGN_OUT": {
      try{ localStorage.removeItem(WELCOME_KEY); }catch(e){}
      return {...state, signedInAs: null};
    }
    case "TEAM_LOADED": {
      applyTeam(action.members);
      // A welcome-page pick of someone added later than the built-in team only resolves once the list arrives.
      const picked = !(state.me && state.me.accessEnabled) && state.signedInAs && action.members.some(m=>m.id===state.signedInAs && m.active!==false);
      return {...state, team: action.members, teamRev:(state.teamRev||0)+1, ...(picked? {currentUserId: state.signedInAs} : {})};
    }
    case "SET_ME": return {...state, me: action.me, lock: action.lock || null, ...(action.me && action.me.member ? {currentUserId: action.me.member.id} : {})};
    case "SET_BRAND": return {...state, currentBrandId: action.id};
    case "SET_ROUTE": return {...state, route: action.route, createPrefill: action.createPrefill || null, libraryQuery: action.libraryQuery || "", driveReturn: action.driveReturn || state.driveReturn || null,
      queueTab: action.queueTab || null, calendarPreset: action.calendarPreset || null};
    case "CLEAR_DRIVE_RETURN": return {...state, driveReturn: null};
    case "SET_THEME": return {...state, theme: action.theme};
    case "ADD_TOAST": return {...state, toasts:[...state.toasts, {id:uid("toast"), message:action.message, variant:action.variant||"ok"}]};
    case "REMOVE_TOAST": return {...state, toasts: state.toasts.filter(t=>t.id!==action.id)};

    case "CREATE_CONTENT": {
      const log = {id:uid("act"), at:new Date().toISOString(), type:"created", contentId:action.item.id, contentTitle:action.item.title, user:state.currentUserId, detail: action.item.status==="submitted"?"Content created and submitted for approval":"Draft created"};
      return {...state, contentItems:[action.item, ...state.contentItems], activityLog:[log, ...state.activityLog]};
    }
    case "UPDATE_CONTENT": {
      return {...state, contentItems: state.contentItems.map(it=> it.id===action.id? {...it, ...action.patch} : it)};
    }
    case "RETRY_PUBLISH": {
      const items = state.contentItems.map(it=>{
        if(it.id!==action.contentId) return it;
        const variants = {...it.variants};
        Object.keys(variants).forEach(p=>{
          if(!action.platform || p===action.platform){
            if(variants[p].publishStatus==="failed") variants[p] = {...variants[p], publishStatus:"publishing", errorMessage:null};
          }
        });
        const stillFailed = Object.values(variants).some(v=>v.publishStatus==="failed");
        return {...it, variants, status: stillFailed? "failed":"publishing"};
      });
      const log = {id:uid("act"), at:new Date().toISOString(), type:"scheduled", contentId:action.contentId, contentTitle:(state.contentItems.find(i=>i.id===action.contentId)||{}).title, user:state.currentUserId, detail:"Publish retried"};
      return {...state, contentItems:items, activityLog:[log,...state.activityLog], toasts:[...state.toasts,{id:uid("toast"),message:"Retrying publish…",variant:"ok"}]};
    }

    case "SUBMIT_DECISION": {
      const {contentId, platform, decision, feedback, tags, dueDate} = action;
      const item = state.contentItems.find(i=>i.id===contentId);
      if(!item) return state;
      const prevItemStatus = item.status;
      const prevVariants = JSON.parse(JSON.stringify(item.variants));
      const statusMap = {approved:"approved", rejected:"rejected", changes_requested:"changes_requested"};
      const newStatus = statusMap[decision];
      const variants = {...item.variants};
      let autoFilled = [];
      Object.keys(variants).forEach(p=>{
        if(!platform || p===platform){
          variants[p] = {...variants[p], status:newStatus};
          if(decision==="approved"){
            if(!variants[p].scheduledAt){
              const slot = findTemplateSlot(item, p, state.contentItems, state.calendarTemplate);
              if(slot){ variants[p] = {...variants[p], scheduledAt:slot.date, templateRuleId:slot.ruleId}; autoFilled.push(PLATFORM_META[p].label); }
            }
            variants[p].publishStatus = variants[p].scheduledAt? "scheduled" : "not_scheduled";
          }
        }
      });
      const nextVersion = item.currentVersion + (decision!=="approved"?0:0);
      const versionEntry = {
        version: item.currentVersion, editor: USERS.find(u=>u.id===item.creator).name, date: new Date().toISOString(),
        changes: platform? `Reviewed ${PLATFORM_META[platform].label} variant` : "Reviewed full package",
        decision: decision==="approved"?"Approved": decision==="rejected"?"Rejected":"Changes Requested",
        feedback: feedback||null,
      };
      const versions = [...item.versions.slice(0,-1), versionEntry];
      const patch = {
        status: platform? item.status : newStatus,
        variants,
        versions,
        lastFeedback: (decision!=="approved")? {by: state.currentUserId, at:new Date().toISOString(), tags: tags||[], text: feedback||""} : item.lastFeedback,
      };
      const items = state.contentItems.map(i=> i.id===contentId? {...i, ...patch} : i);
      const log = {
        id:uid("act"), at:new Date().toISOString(), contentId, contentTitle:item.title, user: state.currentUserId,
        type: decision, version:item.currentVersion,
        detail: (decision==="approved"?"Approved":decision==="rejected"?"Rejected":"Requested changes") + (platform? " — "+PLATFORM_META[platform].label : " — full package") + (dueDate? ` (due ${fmtDate(dueDate)})` : ""),
        comment: feedback||null,
      };
      const historyEntry = {id: log.id, contentId, platform, prevItemStatus, prevVariants, decision};
      const approvedMsg = "Approved — "+item.title + (autoFilled.length? " · auto-scheduled into next "+autoFilled.join("/")+" slot" : (decision==="approved"? " · waiting for an empty calendar slot" : ""));
      return {...state, contentItems: items, activityLog:[log, ...state.activityLog], decisionHistory:[...state.decisionHistory, historyEntry],
        toasts:[...state.toasts, {id:uid("toast"), message: decision==="approved"? approvedMsg : decision==="rejected"? "Rejected — "+item.title : "Changes requested — "+item.title, variant: decision==="approved"?"ok": decision==="rejected"?"danger":"warn"}]};
    }
    case "SET_TEMPLATE": return {...state, calendarTemplate: action.template};
    case "MARK_PUBLISHED": {
      // Until auto-publishing is wired up, someone records when a post actually went live. Once every platform
      // is published the post counts as Published, and 7 days later its file moves out of Creator Studio storage.
      const {contentId, platforms, publishedAt, urls} = action;
      const item = state.contentItems.find(i=>i.id===contentId);
      if(!item) return state;
      const variants = {...item.variants};
      platforms.forEach(p=>{ if(variants[p]) variants[p] = {...variants[p], publishStatus:"published", publishedAt, postUrl: (urls&&urls[p]) || variants[p].postUrl || null}; });
      const all = Object.values(variants).every(v=>v.publishStatus==="published");
      const items = state.contentItems.map(i=> i.id===contentId ? {...i, variants, status: all? "published" : i.status} : i);
      const log = {id:uid("act"), at:new Date().toISOString(), type:"published", contentId, contentTitle:item.title, user:state.currentUserId,
        detail:"Marked as published — "+platforms.map(p=>PLATFORM_META[p].label).join(", ")};
      return {...state, contentItems:items, activityLog:[log, ...state.activityLog],
        toasts:[...state.toasts, {id:uid("toast"), message: all? "Published — "+item.title : "Marked "+platforms.length+" platform"+(platforms.length>1?"s":"")+" as published", variant:"ok"}]};
    }
    case "MAKE_JOB_RESULT": {
      // A Make publishing job moved on: sending → live (with the link) or failed (with the reason).
      const {job} = action;
      const item = state.contentItems.find(i=>i.id===job.contentId);
      const v = item && item.variants && item.variants[job.platform];
      if(!v || v.publishStatus==="published") return state;
      const nv = job.status==="done" ? {...v, publishStatus:"published", publishedAt: job.updatedAt, postUrl: job.permalink || v.postUrl || null, makeJobId: job.id, errorMessage:null}
        : job.status==="failed" ? {...v, publishStatus:"failed", makeJobId: job.id, errorMessage: job.error || "Make reported an error"}
        : {...v, publishStatus:"publishing", makeJobId: job.id, errorMessage:null};
      const variants = {...item.variants, [job.platform]: nv};
      const all = Object.values(variants).every(x=>x.publishStatus==="published");
      const anyFailed = Object.values(variants).some(x=>x.publishStatus==="failed");
      const status = all ? "published" : anyFailed ? "failed" : job.status==="sent" ? "publishing" : item.status==="failed" ? "approved" : item.status;
      const items = state.contentItems.map(i=> i.id===item.id ? {...i, variants, status} : i);
      // Server already posted the Team Chat update for this; the "act_make_" id keeps it from posting a second one.
      const logId = "act_make_"+job.id;
      const log = job.status==="done" && !state.activityLog.some(a=>a.id===logId) ? [{id:logId, at:job.updatedAt, type:"published", contentId:item.id, contentTitle:item.title,
        user: job.requestedBy || item.approver || item.creator, detail:"Published automatically via Make — "+PLATFORM_META[job.platform].label}] : [];
      return {...state, contentItems:items, activityLog:[...log, ...state.activityLog]};
    }
    case "SET_ADMIN_EMAILS": return {...state, adminEmails: action.emails};
    case "SET_CHAT_UPDATES": return {...state, chatUpdates: !!action.on};
    case "ADD_CAMPAIGN": return {...state, campaigns:[...state.campaigns, action.campaign]};
    case "UPDATE_CAMPAIGN": return {...state, campaigns: state.campaigns.map(c=> c.id===action.id? {...c, ...action.patch} : c)};
    case "DELETE_CAMPAIGN": {
      // Posts in a deleted campaign aren't lost — they just move to "No campaign".
      const moved = state.contentItems.filter(i=>i.campaign===action.id).length;
      return {...state, campaigns: state.campaigns.filter(c=>c.id!==action.id),
        contentItems: state.contentItems.map(i=> i.campaign===action.id? {...i, campaign:""} : i),
        toasts:[...state.toasts, {id:uid("toast"), message:"Campaign deleted" + (moved? " · "+moved+" post"+(moved>1?"s":"")+" moved to No campaign" : ""), variant:"ok"}]};
    }
    case "RESCHEDULE": {
      const {contentId, platform, scheduledAt} = action;
      const item = state.contentItems.find(i=>i.id===contentId);
      if(!item || !item.variants[platform]) return state;
      const variants = {...item.variants, [platform]: {...item.variants[platform], scheduledAt, templateRuleId:null,
        publishStatus: scheduledAt? (item.variants[platform].publishStatus==="published"?"published":"scheduled") : "not_scheduled"}};
      const items = state.contentItems.map(i=> i.id===contentId? {...i, variants} : i);
      const log = {id:uid("act"), at:new Date().toISOString(), contentId, contentTitle:item.title, user: state.currentUserId,
        type:"scheduled", detail: (scheduledAt? "Rescheduled — "+PLATFORM_META[platform].label+" set to "+fmtDateTime(scheduledAt) : "Removed publish time — "+PLATFORM_META[platform].label), comment:null};
      return {...state, contentItems: items, activityLog:[log, ...state.activityLog],
        toasts:[...state.toasts, {id:uid("toast"), message: scheduledAt? "Scheduled for "+fmtDateTime(scheduledAt) : "Publish time cleared", variant:"ok"}]};
    }
    case "REVISE_CONTENT": {
      const {contentId, patch, resubmit, note} = action;
      const item = state.contentItems.find(i=>i.id===contentId);
      if(!item) return state;
      const editor = (USERS.find(u=>u.id===state.currentUserId)||{}).name || "Someone";
      const variants = {...item.variants};
      Object.entries(patch.variants||{}).forEach(([p,v])=>{ if(variants[p]) variants[p] = {...variants[p], ...v, ...(resubmit? {status:"submitted"} : {})}; });
      const nextVersion = resubmit ? item.currentVersion + 1 : item.currentVersion;
      const versions = resubmit ? [...(item.versions||[]), {version:nextVersion, editor, date:new Date().toISOString(), changes: note || "Revised after feedback", decision:"—", feedback:null}] : item.versions;
      const updated = {...item, ...(patch.title!=null? {title:patch.title} : {}), ...(patch.media? {media:{...item.media, ...patch.media}} : {}),
        ...(patch.libraryRef!==undefined? {libraryRef:patch.libraryRef} : {}), variants, versions, currentVersion:nextVersion,
        ...(resubmit? {status:"submitted"} : {})};
      const log = {id:uid("act"), at:new Date().toISOString(), contentId, contentTitle:updated.title, user:state.currentUserId, version:nextVersion,
        type: resubmit? "submitted" : "edited", detail: resubmit? "Resubmitted as v"+nextVersion+" after "+(item.status==="rejected"? "rejection" : "feedback") : "Edited", comment: note || null};
      return {...state, contentItems: state.contentItems.map(i=> i.id===contentId? updated : i), activityLog:[log, ...state.activityLog],
        toasts:[...state.toasts, {id:uid("toast"), message: resubmit? "Resubmitted for approval — "+updated.title : "Changes saved", variant:"ok"}]};
    }
    case "UNDO_DECISION": {
      if(state.decisionHistory.length===0) return state;
      const last = state.decisionHistory[state.decisionHistory.length-1];
      const items = state.contentItems.map(i=> i.id===last.contentId? {...i, status:last.prevItemStatus, variants:last.prevVariants} : i);
      const activityLog = state.activityLog.filter(a=>a.id!==last.id);
      return {...state, contentItems: items, activityLog, decisionHistory: state.decisionHistory.slice(0,-1),
        toasts:[...state.toasts, {id:uid("toast"), message:"Last decision undone", variant:"ok"}]};
    }
    default: return state;
  }
}

function isoToLocalInput(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
}
function ScheduleEditor({item, platform, scheduledAt}){
  const {state, dispatch} = useApp();
  const user = USERS.find(u=>u.id===state.currentUserId);
  const perms = PERMS[user.role];
  const [value, setValue] = useState(scheduledAt? isoToLocalInput(scheduledAt) : "");
  useEffect(()=>{ setValue(scheduledAt? isoToLocalInput(scheduledAt) : ""); }, [scheduledAt]);

  if(!perms.schedule){
    return scheduledAt ? <FieldRow label="Scheduled" value={fmtDateTime(scheduledAt)}/> : <div style={{color:"var(--ink-mute)"}}>Not scheduled yet</div>;
  }
  function save(){ dispatch({type:"RESCHEDULE", contentId:item.id, platform, scheduledAt: value? value+":00" : null}); }
  return (
    <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", paddingTop:2}}>
      <span style={{fontWeight:700, color:"var(--ink-mute)", flexShrink:0}}>Scheduled</span>
      <input type="datetime-local" value={value} onChange={e=>setValue(e.target.value)} style={{borderRadius:8, border:"1px solid var(--border)", padding:"5px 8px", fontSize:12, background:"var(--surface)", color:"var(--ink)"}}/>
      <Button size="sm" variant="primary" onClick={save} disabled={value===(scheduledAt? isoToLocalInput(scheduledAt):"")}>Save</Button>
      {scheduledAt && <Button size="sm" variant="ghost" onClick={()=>{setValue(""); dispatch({type:"RESCHEDULE", contentId:item.id, platform, scheduledAt:null});}}>Clear</Button>}
    </div>
  );
}
// ---------- Make.com: auto-publishing + real analytics ----------
// Each platform has its own Make scenarios — "Publish · <platform>" posts approved content and reports back the live
// link, "Pull · <platform>" brings back real stats — each with its own webhook saved in Settings → Make.com.
// A platform without a Publish webhook is published by hand ("Mark as published").
const MAKE_PLATFORMS = ["instagram","facebook","tiktok","youtube","gbp"];
const makeReady = (dir, p)=> !!(makeStore.info && makeStore.info.platforms && makeStore.info.platforms[p] && makeStore.info.platforms[p][dir].configured);
const makeStore = {info:null, jobs:[], since:null, rev:0, listeners:new Set()};
function makeEmit(){ makeStore.rev++; makeStore.listeners.forEach(f=>f()); }
function mergeMakeJobs(list){
  if(!list || !list.length) return;
  const m = new Map(makeStore.jobs.map(j=>[j.id, j]));
  list.forEach(j=>m.set(j.id, j));
  makeStore.jobs = [...m.values()].sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
}
async function loadMakeInfo(){
  try{
    const r = await fetch("/api/make", {cache:"no-store"});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || "Make status unavailable");
    makeStore.info = d; mergeMakeJobs(d.jobs);
  }catch(e){ makeStore.info = {error: e.message}; }
  makeEmit();
  return makeStore.info;
}
function useMakeStore(){
  const [, force] = useState(0);
  useEffect(()=>{
    const f = ()=>force(x=>x+1);
    makeStore.listeners.add(f);
    if(!makeStore.info) loadMakeInfo();
    return ()=>{ makeStore.listeners.delete(f); };
  }, []);
  return makeStore;
}
// The newest Make job for each post × platform.
function latestMakeJobs(contentId){
  const out = {};
  makeStore.jobs.forEach(j=>{ if(j.contentId===contentId) out[j.platform] = j; });
  return out;
}
async function publishViaMake(contentId, platforms, userId){
  const r = await fetch("/api/make/publish", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({contentId, platforms, userId})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "Couldn't reach Make");
  makeStore.since = null; // make the poller pick the new jobs up straight away
  return d.results || [];
}

function MakePublishSection({item, onDone}){
  const {state, dispatch} = useApp();
  const mk = useMakeStore();
  const jobs = latestMakeJobs(item.id);
  const pending = MAKE_PLATFORMS.filter(p=> makeReady("publish", p) && item.variants && item.variants[p] && item.variants[p].publishStatus!=="published" && !(jobs[p] && jobs[p].status==="sent"));
  const [sel, setSel] = useState(pending);
  const [busy, setBusy] = useState(false);
  const [results, setResults] = useState(null);
  const cantMedia = !(item.media && item.media.fileUrl);
  if(!mk.info || mk.info.error || !mk.info.platforms) return null;
  if(!pending.length && !results) return null;
  async function go(){
    setBusy(true);
    try{
      const r = await publishViaMake(item.id, sel, state.currentUserId);
      setResults(r);
      const sent = r.filter(x=>x.status==="sent").length;
      dispatch({type:"ADD_TOAST", message: sent ? "Sent to Make — you'll get a Team Chat update when it's live" : "Nothing was sent — see the notes", variant: sent? "ok" : "warn"});
      syncMakeJobsNow();
      if(sent && r.every(x=>x.status==="sent")) onDone && onDone();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  return (
    <div style={{border:"1px solid var(--accent)", background:"var(--accent-soft)", borderRadius:10, padding:12, marginBottom:16}}>
      <div style={{fontSize:13.5, fontWeight:600, marginBottom:4, display:"flex", alignItems:"center", gap:6}}><Icon name="send" size={14}/> Publish now with Make</div>
      <div style={{fontSize:12, color:"var(--ink-soft)", lineHeight:1.5, marginBottom:10}}>Posts straight to the accounts connected in Make — publicly, right away. You'll see the live link here and in Team Chat.</div>
      {cantMedia && <div style={{fontSize:12.5, color:"var(--red)", marginBottom:8}}>This post's file isn't stored in Creator Studio yet, so Make can't fetch it. Re-upload or import the file first.</div>}
      {pending.map(p=>(
        <label key={p} style={{display:"flex", alignItems:"center", gap:8, fontSize:13, fontWeight:600, cursor:"pointer", padding:"4px 0"}}>
          <input type="checkbox" checked={sel.includes(p)} onChange={e=>setSel(s=> e.target.checked? [...s,p] : s.filter(x=>x!==p))}/>
          <PlatformIcon platform={p} size={12}/>{PLATFORM_META[p].label}
          {jobs[p] && jobs[p].status==="failed" && <span style={{fontWeight:400, color:"var(--red)", fontSize:12}}>· last try failed</span>}
        </label>
      ))}
      {results && results.filter(r=>r.skipped || r.error).map(r=>(
        <div key={r.platform} style={{fontSize:12, color:"var(--ink-soft)", marginTop:4}}><strong>{PLATFORM_META[r.platform].label}:</strong> {r.skipped || r.error}</div>
      ))}
      {pending.length>0 && <div style={{marginTop:10}}><Button variant="primary" size="sm" icon="send" disabled={busy || !sel.length || cantMedia} onClick={go}>{busy? "Sending…" : "Publish now"}</Button></div>}
    </div>
  );
}

function MakeStatusLine({item}){
  const {state, dispatch} = useApp();
  const mk = useMakeStore();
  const jobs = latestMakeJobs(item.id);
  const list = Object.values(jobs);
  const [busy, setBusy] = useState(null);
  if(!list.length) return null;
  async function retry(p){
    setBusy(p);
    try{ await publishViaMake(item.id, [p], state.currentUserId); syncMakeJobsNow(); dispatch({type:"ADD_TOAST", message:"Sent to Make again"}); }
    catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(null);
  }
  return (
    <div style={{display:"flex", flexDirection:"column", gap:6, marginTop:12}}>
      {list.map(j=>(
        <div key={j.id} style={{display:"flex", alignItems:"center", gap:8, fontSize:12.5, flexWrap:"wrap"}}>
          <PlatformIcon platform={j.platform} size={12}/>
          {j.status==="sent" && <span style={{color:"var(--blue)"}}>Publishing via Make…</span>}
          {j.status==="done" && <span style={{color:"var(--green)", fontWeight:600}}>Live{j.permalink && <> · <a href={j.permalink} target="_blank" rel="noopener" style={{color:"var(--accent)"}}>open post</a></>}</span>}
          {j.status==="failed" && <>
            <span style={{color:"var(--red)", minWidth:0, flex:"1 1 200px"}}>Failed: {j.error || "Make reported an error"}</span>
            {(item.variants[j.platform]||{}).publishStatus!=="published" && <Button size="sm" variant="ghost" icon="refresh" disabled={busy===j.platform} onClick={()=>retry(j.platform)}>{busy===j.platform? "Sending…" : "Try again"}</Button>}
          </>}
        </div>
      ))}
    </div>
  );
}

// Keeps Make job results flowing into the posts: live links, "Published", or the error to fix.
let makeSyncTimer = null, makeSyncKick = null;
function syncMakeJobsNow(){ if(makeSyncKick) makeSyncKick(); }
function useMakeSync(state, dispatch){
  const mk = useMakeStore();
  useEffect(()=>{
    let stop = false;
    const tick = async ()=>{
      clearTimeout(makeSyncTimer);
      try{
        const r = await fetch("/api/make/jobs"+(makeStore.since? "?since="+encodeURIComponent(makeStore.since) : ""), {cache:"no-store"});
        if(r.ok){ const d = await r.json(); makeStore.since = d.now; if(d.jobs && d.jobs.length){ mergeMakeJobs(d.jobs); makeEmit(); } }
      }catch(e){}
      if(stop) return;
      const pending = makeStore.jobs.some(j=>j.status==="sent");
      makeSyncTimer = setTimeout(tick, pending? 6000 : 60000);
    };
    makeSyncKick = ()=>{ setTimeout(tick, 1500); };
    tick();
    return ()=>{ stop = true; clearTimeout(makeSyncTimer); makeSyncKick = null; };
  }, []);
  useEffect(()=>{
    if(!state.serverLoaded) return;
    const latest = {};
    makeStore.jobs.forEach(j=>{ if(j.contentId) latest[j.contentId+"|"+j.platform] = j; });
    Object.values(latest).forEach(j=>{
      const item = state.contentItems.find(i=>i.id===j.contentId);
      const v = item && item.variants && item.variants[j.platform];
      if(!v || v.publishStatus==="published") return;
      const want = j.status==="done" ? "published" : j.status==="failed" ? "failed" : "publishing";
      if(v.publishStatus!==want || v.makeJobId!==j.id) dispatch({type:"MAKE_JOB_RESULT", job:j});
    });
  }, [mk.rev, state.serverLoaded, state.contentItems]);
}

const MAKE_PLATFORM_ALIASES = {instagram:"instagram", ig:"instagram", facebook:"facebook", fb:"facebook", tiktok:"tiktok", youtube:"youtube", yt:"youtube", gbp:"gbp", google:"gbp", "google business":"gbp", "google business profile":"gbp"};
// Reads lines like "Publish · Instagram  https://hook.eu1.make.com/…" (any order, one per line).
function parseMakeSetup(text){
  const hooks = {publish:{}, pull:{}}; let n = 0;
  String(text||"").split(/\n+/).forEach(line=>{
    const url = (line.match(/https:\/\/hook\.[a-z0-9]+\.make\.com\/[A-Za-z0-9]+/)||[])[0];
    if(!url) return;
    const l = line.replace(url, "").toLowerCase();
    const dir = /pull|stats|analytics/.test(l) ? "pull" : /publish|post/.test(l) ? "publish" : null;
    const key = Object.keys(MAKE_PLATFORM_ALIASES).sort((x,y)=>y.length-x.length).find(k=> new RegExp("(^|[^a-z])"+k+"([^a-z]|$)").test(l));
    if(dir && key){ hooks[dir][MAKE_PLATFORM_ALIASES[key]] = url; n++; }
  });
  return {hooks, n};
}

  const [busy, setBusy] = useState(false);
  const toast = (message, variant)=>dispatch({type:"ADD_TOAST", message, variant});
  async function save(patch, okMsg){
    setBusy(true);
    try{
      const r = await fetch("/api/make/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(patch)});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't save");
      toast(okMsg || "Make settings saved"); setEdit(null); await loadMakeInfo(); return true;
    }catch(e){ toast(e.message, "danger"); return false; }
    finally{ setBusy(false); }
  }
  async function saveSetup(){
    const {hooks, n} = parseMakeSetup(setup);
    if(!n){ toast("No Make webhook addresses found — each line needs the platform, Publish or Pull, and the https://hook… address", "warn"); return; }
    if(await save({hooks}, "Saved "+n+" webhook"+(n===1?"":"s"))){ setSetup(""); setShowSetup(false); }
  }
  async function clearStats(p){
    setBusy(true);
    try{
      const r = await fetch("/api/make/stats/clear", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({platform:p})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't clear stats");
      toast("Removed "+d.removed+" "+PLATFORM_META[p].label+" post"+(d.removed===1?"":"s")+" from Analytics");
      loadRealAnalytics(true); await loadMakeInfo();
    }catch(e){ toast(e.message, "danger"); }
    setBusy(false);
  }
  async function pull(){
    setBusy(true);
    try{
      const r = await fetch("/api/make/pull", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't reach Make");
      const failed = d.failed || [];
      toast("Asked Make for stats from "+(d.requested||[]).map(p=>PLATFORM_META[p].label).join(", ")+(failed.length? " — couldn't reach "+failed.map(f=>PLATFORM_META[f.platform].label).join(", ") : "")+". They'll appear in Analytics shortly.", failed.length? "warn" : "ok");
      [20000, 45000, 90000].forEach(ms=>setTimeout(()=>{ loadRealAnalytics(true); loadMakeInfo(); }, ms));
    }catch(e){ toast(e.message, "danger"); }

      <div style={{display:"flex", gap:6}}>
        <input autoFocus value={edit.value} onChange={e=>setEdit({...edit, value:e.target.value})} placeholder="https://hook.eu1.make.com/…" style={input}/>
        <Button size="sm" variant="primary" disabled={busy || !edit.value.trim()} onClick={()=>save({hooks:{[dir]:{[p]: edit.value.trim()}}})}>Save</Button>
        <Button size="sm" variant="subtle" onClick={()=>setEdit(null)}>Cancel</Button>
      </div>
    );
    return (
      <div style={{display:"flex", alignItems:"center", gap:6, minWidth:0, flexWrap:"wrap"}}>
        <span style={{width:8, height:8, borderRadius:8, background: st.configured? "var(--green)" : "var(--border)", flexShrink:0}}/>
        <span style={{fontSize:12.5, color: st.configured? "var(--ink)" : "var(--ink-mute)", whiteSpace:"nowrap"}}>{st.configured? "Connected" : "Not set"}</span>

        {canEdit && <span style={{marginLeft:"auto", display:"inline-flex", gap:10}}>

        {MAKE_PLATFORMS.map((p,i)=>(

            <div style={{display:"flex", alignItems:"center", gap:7, fontWeight:600, fontSize:13}}><PlatformIcon platform={p} size={12}/>{PLATFORM_META[p].label}</div>
            <div style={{minWidth:0}}><div style={{fontSize:10.5, fontWeight:700, letterSpacing:".3px", color:"var(--ink-mute)", marginBottom:3}}>PUBLISH</div>{cell("publish", p)}</div>
            <div style={{minWidth:0}}><div style={{fontSize:10.5, fontWeight:700, letterSpacing:".3px", color:"var(--ink-mute)", marginBottom:3}}>PULL STATS</div>{cell("pull", p)}</div>
          </div>
        ))}
      </div>
      {canEdit && <div style={{marginTop:10}}>
        {!showSetup ? <Button size="sm" variant="ghost" onClick={()=>setShowSetup(true)}>Paste all webhooks at once</Button> : <div>
          <textarea value={setup} onChange={e=>setSetup(e.target.value)} rows={6} placeholder={"One per line, e.g.\nPublish · Instagram  https://hook.eu1.make.com/…\nPull · Instagram  https://hook.eu1.make.com/…"} style={{...input, fontFamily:"ui-monospace, Menlo, monospace", fontSize:12, resize:"vertical"}}/>
          <div style={{display:"flex", gap:8, marginTop:6}}><Button size="sm" variant="primary" disabled={busy || !setup.trim()} onClick={saveSetup}>Save webhooks</Button><Button size="sm" variant="subtle" onClick={()=>{setShowSetup(false); setSetup("");}}>Cancel</Button></div>
        </div>}
      </div>}
      <label style={{display:"flex", gap:10, alignItems:"flex-start", cursor: canEdit? "pointer":"default", marginTop:14, opacity: anyPublish? 1 : .5}}>

      <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginTop:14}}>
        <Button size="sm" icon="refresh" disabled={busy || !anyPull} onClick={pull}>Get latest stats now</Button>

      </div>
      {recent.length>0 && <div style={{marginTop:14, borderTop:"1px solid var(--border)", paddingTop:10}}>
        <div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", marginBottom:6}}>Recent publishing</div>
        {recent.map(j=>{
          const it = state.contentItems.find(i=>i.id===j.contentId);
          return <div key={j.id} style={{display:"flex", alignItems:"center", gap:8, fontSize:12.5, padding:"4px 0"}}>

// Real post stats from Make, shaped like the analytics posts the reports already use.
const realAnalyticsStore = {data:null, loading:null, listeners:new Set()};
async function loadRealAnalytics(force){
  if(realAnalyticsStore.loading && !force) return realAnalyticsStore.loading;
  realAnalyticsStore.loading = fetch("/api/make/analytics", {cache:"no-store"}).then(r=> r.ok ? r.json() : null).catch(()=>null).then(d=>{
    realAnalyticsStore.data = d || {posts:[], lastPull:null};
    realAnalyticsStore.listeners.forEach(f=>f());
    return realAnalyticsStore.data;
  });
  return realAnalyticsStore.loading;
}
function useRealAnalytics(){
  const [, force] = useState(0);
  useEffect(()=>{
    const f = ()=>force(x=>x+1);
    realAnalyticsStore.listeners.add(f);
    if(!realAnalyticsStore.data) loadRealAnalytics();
    return ()=>{ realAnalyticsStore.listeners.delete(f); };
  }, []);
  return realAnalyticsStore.data;
}
// Picture for a real post (its own thumbnail when the platform gave one), falling back to the colour tile.
function PostThumb({post, radius=0, iconSize=24}){
  const [broken, setBroken] = useState(false);
  if(post && post.thumb && !broken) return <img src={post.thumb} alt="" loading="lazy" referrerPolicy="no-referrer" onError={()=>setBroken(true)} style={{width:"100%", height:"100%", objectFit:"cover", borderRadius:radius, display:"block"}}/>;
  return <Thumb item={{gradient:post.gradient, media:{type:"video"}}} radius={radius} iconSize={iconSize}/>;
}
function realAnalyticsPosts(data, items){
  if(!data || !data.posts) return [];
  const byId = new Map((items||[]).map(i=>[i.id, i]));
  return data.posts.filter(p=>p.publishedAt).map(p=>{
    const item = p.contentId ? byId.get(p.contentId) : null;
    const title = item ? item.title : ((p.caption||"").split("\n")[0].slice(0, 70) || "Untitled post");
    const views = p.views || p.reach || 0;
    const eng = (p.likes||0)+(p.comments||0)+(p.shares||0)+(p.saves||0);
    const t0 = new Date(p.publishedAt).getTime();
    return {
      id:"rp_"+p.platform+"_"+p.postId, real:true, contentId: item? item.id : "ext_"+p.platform+"_"+p.postId, contentTitle:title,
      brand:"sanjugo", campaign: item? (item.campaign||"") : "", pillar: item? item.pillar : "", platform:p.platform,
      account: (BRANDS[0].accounts||{})[p.platform] || "", publishedAt:p.publishedAt, gradient:grad(title), thumb:p.thumb || null, permalink:p.permalink,
      views, reach:p.reach||0, likes:p.likes||0, comments:p.comments||0, shares:p.shares||0, saves:p.saves||0,
      engagementRate: views? eng/views*100 : 0, followsGained:0, analyticsUpdatedAt:p.updatedAt,
      snapshots:(p.snapshots||[]).map(s=>{ const hrs = Math.max(1, Math.round((new Date(s.day+"T21:00:00").getTime()-t0)/3600e3)); return {label:fmtDate(s.day+"T12:00:00",{day:"numeric", month:"short"}), hours:hrs, views:s.views||s.reach||0, likes:s.likes||0, comments:s.comments||0, shares:s.shares||0, saves:s.saves||0}; }),
    };
  });
}

  const decisionWord = pending.type==="approve"?"Approve": pending.type==="reject"?"Reject":"Request Edits";

/* ============================== APPROVAL QUEUE ============================== */
function buildQueue(items, mode, filters){
  let pool = items.filter(i=>i.status==="submitted");
  if(filters.brand) pool = pool.filter(i=>i.brand===filters.brand);
  if(filters.creator) pool = pool.filter(i=>i.creator===filters.creator);
  if(filters.campaign) pool = pool.filter(i=>matchCampaign(filters.campaign, i.campaign));
  if(filters.priority) pool = pool.filter(i=>i.priority===filters.priority);
  if(filters.platform) pool = pool.filter(i=>i.platforms.includes(filters.platform));
  if(mode==="package") return pool.map(it=>({key:it.id, contentId:it.id, item:it, platform:null}));
  const flat = [];
  pool.forEach(it=> it.platforms.forEach(p=> filters.platform && filters.platform!==p ? null : flat.push({key:it.id+"_"+p, contentId:it.id, item:it, platform:p})));
  return flat;
}

/* -------- phone-accurate per-platform previews: what the approver sees is what gets published -------- */
function seedNum(str, min, max){
  let h=0; for(const c of str) h=(h*131+c.charCodeAt(0))>>>0;
  return min + (h%(max-min));
}
function initials(str){ return (str||"").replace(/[@.]/g,"").split(/[\s_]+/).map(s=>s[0]).slice(0,2).join("").toUpperCase(); }

function BrandGlyph({brand, size=32, radius=99}){
  if(brand.logo && brand.id==="sanjugo"){
    return <img src={LOGO_SANJUGO} alt="Sanjugo" style={{width:size, height:size, borderRadius:radius, flexShrink:0, objectFit:"cover", background:"#fff"}}/>;
  }
  const [c1,c2] = grad(brand.id);
  return <span style={{width:size, height:size, borderRadius:radius, flexShrink:0, background:`linear-gradient(135deg, ${c1}, ${c2})`, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:size*0.36}}>{initials(brand.name)}</span>;
}
function aspectFor(item){ return item.media.aspectRatio==="9:16" ? "9/16" : item.media.aspectRatio==="16:9" ? "16/9" : item.media.aspectRatio==="1:1" ? "1/1" : "4/5"; }

function useIsNarrow(maxWidth=900){
  const q = "(max-width:"+maxWidth+"px)";
  const [narrow, setNarrow] = useState(()=> !!(window.matchMedia && window.matchMedia(q).matches));
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia(q);
    const on = ()=>setNarrow(mq.matches);
    on();
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return ()=>{ mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, [q]);
  return narrow;
}

/* Everything inside the phone is sized in iPhone points (390pt-wide screen) and scales with the frame. */
const pt = n => `calc(${n} * 100cqw / 390)`;
const PHONE_FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, Arial, sans-serif';
const PHONE_W = "min(100cqw, calc(100cqh * 9 / 19.5))";
function handleOf(s){ return (s||"").replace(/^@/,"").toLowerCase().replace(/[^a-z0-9._]/g,""); }
// "#Sanjugo, sushi #LondonEats" → ["#Sanjugo", "#sushi", "#LondonEats"]
function parseTags(text){ return String(text||"").split(/[\s,]+/).filter(Boolean).map(t=> t.startsWith("#")? t : "#"+t); }
// Posts created before the fix kept typed hashtags in hashtagsText only; move them into hashtags.
function withTagsFixed(items){
  let changed = false;
  const out = (items||[]).map(it=>{
    let vChanged = false; const variants = {...(it.variants||{})};
    Object.entries(variants).forEach(([p,v])=>{
      if(v && v.hashtagsText !== undefined){
        const {hashtagsText, ...rest} = v;
        variants[p] = {...rest, hashtags: (v.hashtags||[]).length ? v.hashtags : parseTags(hashtagsText)}; vChanged = true;
      }
    });
    if(!vChanged) return it; changed = true; return {...it, variants};
  });
  return changed ? out : items;
}
function fullCaption(v){ return [v.caption, (v.hashtags||[]).join(" ")].filter(Boolean).join(" "); }
function withTags(text, tagStyle){
  return (text||"").split(/(#[\p{L}\p{N}_]+)/u).map((part,i)=> part.startsWith("#") ? <span key={i} style={tagStyle}>{part}</span> : part);
}

/* Shared by everything inside one phone screen: playback state, real progress, and whether we draw
   the fake iPhone chrome (status bar etc. — hidden in full-screen mode, where the real phone has its own). */
const PhoneCtx = React.createContext({chrome:true, playing:false, muted:true, paused:false, progress:null, setProgress:()=>{}, togglePause:()=>{}, onAutoMuted:()=>{}, canTap:()=>true});

function ScreenBox({children, bg="#000", chrome=true, playing, muted, onAutoMuted, canTap, style}){
  const [paused, setPaused] = useState(false);
  const [progress, setProgress] = useState(null);
  const ctx = {chrome, playing: !!playing, muted: !!muted, paused, progress, setProgress,
    togglePause: ()=>setPaused(p=>!p), onAutoMuted: onAutoMuted||(()=>{}), canTap: canTap||(()=>true)};
  return (
    <PhoneCtx.Provider value={ctx}>
      <div style={{position:"relative", overflow:"hidden", background:bg, containerType:"size", fontFamily:PHONE_FONT, WebkitFontSmoothing:"antialiased", lineHeight:1.3, userSelect:"none", ...style}}>
        {children}
        {chrome && <div style={{position:"absolute", top:pt(11), left:"50%", transform:"translateX(-50%)", width:pt(122), height:pt(35), borderRadius:99, background:"#000", zIndex:9, pointerEvents:"none"}}/>}
      </div>
    </PhoneCtx.Provider>
  );
}

function PhoneStatusBar({dark}){
  const {chrome} = React.useContext(PhoneCtx);
  if(!chrome) return null;
  const c = dark? "#0c0c0c" : "#fff";
  return (

        <svg viewBox="0 0 27 13" style={{width:pt(26), height:pt(13)}}><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke={c} opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill={c}/><rect x="25" y="4.5" width="1.5" height="4" rx=".7" fill={c} opacity=".4"/></svg>

/* The actual uploaded file when we have it (so approvers watch the real video), otherwise the poster / placeholder.
   Tapping a real video pauses/plays it, like the apps do. */
function ScreenMedia({item, fit="cover"}){
  const m = item.media || {};
  const ctx = React.useContext(PhoneCtx);
  const ref = useRef(null);
  const [failed, setFailed] = useState(false);
  const [imgFailed, setImgFailed] = useState(false);
  const isVideo = !!(m.fileUrl && m.type==="video") && !failed;
  const shouldPlay = ctx.playing && !ctx.paused;
  useEffect(()=>{
    const v = ref.current; if(!v) return;
    v.muted = ctx.muted;
    if(!shouldPlay){ v.pause(); return; }
    const p = v.play();
    if(p && p.catch) p.catch(()=>{
      // Browsers can refuse to autoplay with sound — fall back to muted playback rather than a frozen frame.
      if(!v.muted){ v.muted = true; ctx.onAutoMuted(); const p2 = v.play(); if(p2 && p2.catch) p2.catch(()=>{}); }
    });
  }, [shouldPlay, ctx.muted, m.fileUrl, isVideo]);
  const fill = {width:"100%", height:"100%", objectFit:fit, background:"#000", display:"block"};
  if(isVideo){
    return (
      <div style={{position:"absolute", inset:0, cursor:"pointer"}}
        onClick={e=>{ e.stopPropagation(); if(ctx.canTap()) ctx.togglePause(); }}>
        <video ref={ref} src={m.fileUrl} poster={m.previewUrl||undefined} muted loop playsInline preload={ctx.playing? "auto" : "metadata"} style={{...fill, pointerEvents:"none"}}
          onTimeUpdate={e=>{ const v=e.currentTarget; if(v.duration) ctx.setProgress(v.currentTime/v.duration); }}
          onError={()=>setFailed(true)}/>
        {ctx.paused && <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}>
          <svg viewBox="0 0 24 24" style={{width:pt(64), height:pt(64), opacity:.8, filter:"drop-shadow(0 2px 6px rgba(0,0,0,.4))"}}><path d="M7 4.5v15l12.5-7.5z" fill="#fff"/></svg>
        </div>}
      </div>
    );
  }
  const src = (m.type!=="video" && m.fileUrl) || m.previewUrl;
  return (
    <div style={{position:"absolute", inset:0, pointerEvents:"none"}}>
      {src && !imgFailed ? <img src={src} alt="" draggable={false} onError={()=>setImgFailed(true)} style={fill}/> : <Thumb item={item} radius={0} iconSize={38} bare/>}
      {failed && <div style={{position:"absolute", left:pt(24), right:pt(24), top:"38%", background:"rgba(0,0,0,.72)", color:"#fff", borderRadius:pt(12), padding:pt(14), fontSize:pt(13.5), lineHeight:1.4, textAlign:"center"}}>
        This browser can't play this video format (usually an iPhone HEVC .MOV). It plays on iPhone/Safari and Chrome on Mac — or export it as MP4 (H.264) to play everywhere.
      </div>}
    </div>
  );
}

/* Tap to expand, like "…more" in the real apps. Stops the tap from opening the details drawer. */
function PhoneCaption({children, lines=1, style}){
  const [open, setOpen] = useState(false);
  const clamp = open ? {maxHeight:pt(260), overflowY:"auto"} : {display:"-webkit-box", WebkitLineClamp:lines, WebkitBoxOrient:"vertical", overflow:"hidden"};
  return <div onPointerDown={e=>e.stopPropagation()} onClick={e=>{ e.stopPropagation(); setOpen(o=>!o); }} style={{cursor:"pointer", wordBreak:"break-word", ...clamp, ...style}}>{children}</div>;
}

/* Full-screen review: the post fills the approver's screen exactly like opening the app, with the decision
   buttons underneath. Stays open and moves on to the next post after each decision. */
function ImmersiveViewer({entry, platform, onPlatform, onDecision, onClose, busy}){
  const item = entry.item;
  const brand = BRANDS.find(b=>b.id===item.brand);
  const platforms = entry.platform ? [entry.platform] : item.platforms;
  const [muted, setMuted] = useState(false);
  const hasVideo = item.media.type==="video" && !!item.media.fileUrl;
  const [screen, bg] = platformScreen(platform, item, item.variants[platform], brand);
  useEffect(()=>{
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.body.classList.add("cf-immersive");
    return ()=>{ document.body.style.overflow = prev; document.body.classList.remove("cf-immersive"); };
  }, []);
  useEffect(()=>{
    if(busy) return;
    const onKey = e=>{
      if(e.key==="Escape") onClose();
    };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  }, [busy, onClose, onDecision]);
  const round = {borderRadius:99, width:58, height:58, padding:0, justifyContent:"center"};
  return ReactDOM.createPortal(
    <div onPointerDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}
      style={{position:"fixed", inset:0, zIndex:90, background:"#000", display:"flex", flexDirection:"column", paddingTop:"env(safe-area-inset-top, 0px)", animation:"cf-fade-in .18s ease"}}>
      <div style={{flex:1, minHeight:0, containerType:"size", display:"flex", justifyContent:"center"}}>
        <ScreenBox key={entry.key+platform} bg={bg} chrome={false} playing={!busy} muted={muted} onAutoMuted={()=>setMuted(true)}
          style={{width:"min(100cqw, calc(100cqh * 9 / 16))", height:"100%"}}>{screen}</ScreenBox>
      </div>
      <div style={{flexShrink:0, background:"#111", borderTop:"1px solid #222", padding:"10px 14px calc(12px + env(safe-area-inset-bottom, 0px))", color:"#fff"}}>
        <div className="cf-noscrollbar" style={{display:"flex", alignItems:"center", gap:6, overflowX:"auto", marginBottom:10}}>
          <button onClick={onClose} title="Exit full screen (Esc)" style={{display:"flex", alignItems:"center", gap:5, padding:"6px 11px", borderRadius:99, border:"1px solid #333", background:"#1c1c1e", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0}}><Icon name="x" size={13}/>Exit</button>
          {platforms.length>1 && platforms.map(p=>(
            <button key={p} onClick={()=>onPlatform(p)} style={{display:"flex", alignItems:"center", gap:6, padding:"5px 11px 5px 5px", borderRadius:99, border:"1px solid "+(platform===p?PLATFORM_HEX[p]:"#333"), background: platform===p? PLATFORM_HEX[p]+"33":"#1c1c1e", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0}}>
              <PlatformIcon platform={p} size={12}/>{PLATFORM_META[p].label}
            </button>
          ))}
          <span style={{flex:1}}/>
          {hasVideo && <button onClick={()=>setMuted(m=>!m)} style={{display:"flex", alignItems:"center", gap:5, padding:"6px 11px", borderRadius:99, border:"1px solid #333", background:"#1c1c1e", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0}}>
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>{muted ? <path d="m16 9.5 5 5M21 9.5l-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/> : <path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/>}</svg>
            {muted? "Sound off":"Sound on"}
          </button>}
        </div>
        <div style={{display:"flex", alignItems:"center", justifyContent:"center", gap:14}}>
          <Button variant="danger" size="lg" icon="x" onClick={()=>onDecision("reject")} style={round}/>
          <Button variant="amber" size="lg" icon="edit" onClick={()=>onDecision("edits")} style={{borderRadius:99}}>Request Edits</Button>
          <Button variant="success" size="lg" icon="check" onClick={()=>onDecision("approve")} style={round}/>
        </div>
      </div>
    </div>,
    document.body
  );
}
