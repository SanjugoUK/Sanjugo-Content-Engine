function WsProject({id, onBack}){
  const {state, dispatch} = useApp();
  const post = useWsPost();
  const me = USERS.find(u=>u.id===state.currentUserId);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState(null);
  const [editing, setEditing] = useState(false);
  const [naming, setNaming] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const autoNamed = useRef(false);
  const load = useCallback(()=> wsGet("/project?id="+encodeURIComponent(id)).then(d=>{ setData(d); setError(null); return d; }).catch(e=>setError(e.message)), [id]);
  useEffect(()=>{ load(); const t = setInterval(()=>{ if(!document.hidden) load(); }, 20000); return ()=>clearInterval(t); }, [load]);
  const act = useCallback(async (path, body, ok)=>{
    try{ const d = await post(path, {projectId:id, ...body}); if(ok) dispatch({type:"ADD_TOAST", message:ok}); await load(); return d; }
    catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); return null; }
  }, [post, id, load, dispatch]);

  const p = data && data.project;
  const items = (data && data.items) || [];
  const drafts = items.filter(i=>i.kind==="draft");
  const stageDraftId = p && ((p.approval && p.approval.draftId) || (p.submitted && p.submitted.draftId));
  const stageDraft = drafts.find(d=>d.id===stageDraftId);
  // The person who uploaded the approved cut gets the file-name check straight away.
  useEffect(()=>{
    if(p && p.status==="approved" && stageDraft && stageDraft.author===me.id && !autoNamed.current){ autoNamed.current = true; setNaming(true); }
  }, [p && p.status, stageDraft && stageDraft.id, me.id]);

  if(error && !data) return <div><Button icon="chevronLeft" onClick={onBack}>Workspace</Button><Card style={{padding:20, marginTop:14, color:"var(--red)"}}>{error}</Card></div>;
  if(!data) return <div><Skeleton h={28} w="40%"/><div style={{height:14}}/><Skeleton h={300} r={14}/></div>;

  const voters = p.voters || [];
  const ideas = items.filter(i=>(i.kind==="link"||i.kind==="idea") && !wsIsRemoved(i, voters) && (!wsOnlyPicked(p, me.id) || wsPicked(i, voters)));
  const toVote = voters.includes(me.id) ? ideas.filter(i=>!(i.yes||[]).includes(me.id) && !(i.no||[]).includes(me.id)).length : 0;
  const shots = items.filter(i=>i.kind==="shot");
  const openNotes = p.counts ? p.counts.openNotes : 0;
  const current = tab || (drafts.length ? "draft" : ideas.length ? "ideas" : "plan");
  const tabs = [
    ["ideas", "bulb", "Ideas", ideas.length, toVote ? toVote+" to vote" : null],
    ["plan", "list", "Plan", shots.length ? shots.filter(s=>s.done).length+"/"+shots.length : null, null],
    ["draft", "film", "Draft review", drafts.length ? "draft "+drafts.length : null, openNotes ? openNotes+" to-do"+(openNotes>1?"s":"") : null],
  ];
  const branch = (WS_BRANCH_OPTS.find(b=>b.value===p.branch)||{}).label;
  const canDelete = !p.filed && (me.role==="admin" || p.createdBy===me.id);
  const stage = (p.status==="waiting" || p.status==="approved") && stageDraft;
  const body = (
    <div>
      <div className="cf-noscrollbar" style={{display:"flex", gap:4, overflowX:"auto", borderBottom:"1px solid var(--border)", marginBottom:16}}>
        {tabs.map(([k, icon, label, count, flag])=>(
          <button key={k} onClick={()=>setTab(k)} style={{flexShrink:0, display:"flex", alignItems:"center", gap:7, padding:"10px 12px", border:"none", background:"none", cursor:"pointer", fontSize:13.5, fontWeight:600,
            color: current===k? "var(--ink)":"var(--ink-mute)", borderBottom:"2px solid "+(current===k? "var(--accent)":"transparent"), marginBottom:-1}}>
            <Icon name={icon} size={15}/>{label}{count!=null && <span style={{color:"var(--ink-mute)", fontWeight:500}}>{count}</span>}
            {flag && <span style={{fontSize:10.5, fontWeight:700, padding:"1px 7px", borderRadius:99, background:"var(--accent)", color:"#fff"}}>{flag}</span>}
          </button>
        ))}
      </div>
      {current==="ideas" && <WsIdeas p={p} items={items} act={act}/>}
      {current==="plan" && <WsPlan p={p} items={items} act={act}/>}
      {current==="draft" && <WsDrafts p={p} items={items} act={act}/>}
    </div>
  );
  return (
    <div>
      <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:6}}>
        <IconButton icon="chevronLeft" title="Back to Workspace" onClick={onBack}/>
        <h1 style={{fontSize:22, margin:0, fontWeight:600, flex:"1 1 200px", minWidth:0}}>{p.title}</h1>
        <WsStatusBadge status={p.status}/>
        {!p.filed && <Button size="sm" icon="edit" onClick={()=>setEditing(true)}>Edit</Button>}
        {canDelete && <ConfirmButton confirmLabel="Delete project?" onConfirm={async()=>{ if(await act("/project/delete", {id:p.id}, "Project deleted")) onBack(); }}>Delete</ConfirmButton>}
      </div>
      <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center", margin:"0 0 18px"}}>
        <WsChip>{branch}</WsChip><WsChip>{LIB_CATEGORY[p.category]}</WsChip>{wsDishLabel(p) && <WsChip>{wsDishLabel(p)}</WsChip>}
        <WsChip>Creator: {wsCreatorName(p)}</WsChip>
        <span style={{fontSize:12, color:"var(--ink-mute)", marginLeft:4}}>
          Created {wsDay(p.createdAt)} by {wsUser(p.createdBy).name}{p.finishedAt ? " · Finished "+wsDay(p.finishedAt)+" ("+wsDays(p.createdAt, p.finishedAt)+")" : wsDays(p.createdAt)==="same day" ? "" : " · open for "+wsDays(p.createdAt)}{p.due && !p.filed ? " · due "+wsDay(p.due) : ""}
        </span>
      </div>

      {p.filed ? <>
        <WsFiled p={p}/>
        <div style={{margin:"18px 0 10px"}}><Button size="sm" icon={showDetails? "chevronDown":"chevronRight"} onClick={()=>setShowDetails(v=>!v)}>{showDetails? "Hide" : "Show"} ideas, plan and cuts</Button></div>
        {showDetails && body}
      </> : stage ? <>
        <WsApprovalStage p={p} draft={stageDraft} items={items} act={act} onName={()=>setNaming(true)}/>
        <div style={{margin:"18px 0 10px"}}><Button size="sm" icon={showDetails? "chevronDown":"chevronRight"} onClick={()=>setShowDetails(v=>!v)}>{showDetails? "Hide" : "Show"} ideas, plan and cuts</Button></div>
        {showDetails && body}
      </> : body}

      <WsProjectForm open={editing} project={p} onClose={()=>setEditing(false)} onSaved={()=>{ setEditing(false); load(); }}/>
      {naming && p.status==="approved" && <WsNameModal p={p} onClose={()=>setNaming(false)} onFiled={()=>{ setNaming(false); LIBRARY_CACHE = null; load(); }}/>}
    </div>
  );
}

  const list = items.filter(i=>i.kind==="comment" && i.parentId===it.id);
  const [open, setOpen] = useState(!!startOpen);
  const [text, setText] = useState("");
  async function send(){ const t = text.trim(); if(!t) return; if(await act("/item", {kind:"comment", parentId:it.id, text:t})) setText(""); }
  return (
    <div>
      <button onClick={()=>setOpen(o=>!o)} style={{border:"none", background:"none", padding:0, fontSize:12, fontWeight:600, color: list.length? "var(--ink-soft)" : "var(--ink-mute)", cursor:"pointer"}}>💬 {list.length ? list.length+" comment"+(list.length>1?"s":"") : "Comment"}{open? " ▴" : ""}</button>
      {open && <div style={{marginTop:8, display:"flex", flexDirection:"column", gap:8}}>
        {list.map(c=>(
          <div key={c.id} style={{display:"flex", gap:7, alignItems:"flex-start"}}>
            <Avatar user={wsUser(c.author)} size={20}/>
            <div style={{fontSize:12.5, lineHeight:1.4, minWidth:0}}><b>{wsUser(c.author).name}</b> <span style={{fontSize:10.5, color:"var(--ink-mute)"}}>{wsAgo(c.createdAt)}</span><div style={{whiteSpace:"pre-wrap", wordBreak:"break-word"}}>{c.text}</div></div>
            <WsDelete it={c} act={act}/>
          </div>
        ))}
        <div style={{display:"flex", gap:6}}>
          <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") send(); }} placeholder="Add a comment…" style={{flex:1, minWidth:0, borderRadius:8, border:"1px solid var(--border)", padding:"6px 8px", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"}}/>
          <Button size="sm" variant="primary" disabled={!text.trim()} onClick={send}>Send</Button>
        </div>
      </div>}
    </div>
  );
}

// Ideas: anyone adds reels or ideas; everyone except the creator votes Yes/No and can comment on each one.
// Ranked list: no No's on top, then one, then two; three No's and it's gone. Ones you haven't voted on are outlined.
function WsIdeas({p, items, act}){
  const {state} = useApp();
  const me = state.currentUserId;
  const voters = p.voters || [];
  const canVote = voters.includes(me) && !p.filed;
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);

  const onlyPicked = wsOnlyPicked(p, me);
  const all = wsRank(items.filter(i=>(i.kind==="link"||i.kind==="idea") && !wsIsRemoved(i, voters)), voters);
  const [pickedView, setPickedView] = useState(false);
  const visible = onlyPicked || pickedView ? all.filter(i=>wsPicked(i, voters)) : all;
  const waiting = all.length - all.filter(i=>wsPicked(i, voters)).length;
  const canStar = !onlyPicked && !p.filed;
  const unvoted = it=> canVote && !(it.yes||[]).includes(me) && !(it.no||[]).includes(me);
  async function add(){
    const t = text.trim(); if(!t) return;
    const link = /https:\/\/\S+/i.exec(t);
    setBusy(true);
    const ok = await act("/item", link ? {kind:"link", url:link[0].replace(/[).,]+$/,""), text:t.replace(link[0],"").trim()} : {kind:"idea", text:t});
    if(ok) setText("");
    setBusy(false);
  }
  const noCount = it=>(it.no||[]).filter(v=>voters.includes(v)).length;

  return (
    <div>
      {!p.filed && <div style={{display:"flex", gap:8, marginBottom:14}}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") add(); }} placeholder="Paste a reel link (Instagram, TikTok, YouTube) or write an idea"
          style={{flex:1, minWidth:0, borderRadius:10, border:"1px solid var(--border)", padding:"9px 11px", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        <Button variant="primary" icon="plus" onClick={add} disabled={busy || !text.trim()}>Add</Button>
      </div>}
      <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:14}}>
        {onlyPicked ? <span style={{fontSize:12, color:"var(--ink-soft)", marginLeft:4, lineHeight:1.5}}><b>These are the ideas the team picked for you</b> — ⭐ Priority first, then the ones {wsNeed(voters)} or more people said Yes to. {waiting>0 && <span style={{color:"var(--ink-mute)"}}>{waiting} more {waiting>1? "are" : "is"} still being voted on.</span>}</span> : <>
        <span style={{display:"inline-flex", border:"1px solid var(--border)", borderRadius:99, overflow:"hidden", marginRight:4}}>
          {[[false, "All "+all.length], [true, "Picked for the creator "+(all.length-waiting)]].map(([v, l])=><button key={String(v)} onClick={()=>setPickedView(v)} style={{border:"none", padding:"5px 11px", fontSize:12, fontWeight:600, cursor:"pointer", background: pickedView===v? "var(--accent-soft)" : "var(--surface)", color: pickedView===v? "var(--accent-dark)" : "var(--ink-soft)"}}>{l}</button>)}
        </span>
        <span style={{fontSize:11.5, color:"var(--ink-mute)", marginLeft:4}}>{!p.filed && !voters.includes(me) ? "You're set as this project's creator, so only "+voters.map(v=>wsUser(v).name).join(" and ")+" vote. Not the creator? Edit → Creator → Not assigned yet." : "Vote 👍 or 👎 on each idea — "+voters.map(v=>wsUser(v).name).join(", ")+" vote · "+wsNeed(voters)+" 👍 or ⭐ Priority and the creator sees it · 3 👎 and it's removed"}</span></>}
      </div>

      {!visible.length && onlyPicked ? <div style={{fontSize:13, color:"var(--ink-mute)"}}>{all.length ? "The team is still voting on the ideas — they'll show here once they're picked." : "No ideas yet."} You can still check the Plan tab for what to film.</div>
       : !visible.length && pickedView ? <div style={{fontSize:13, color:"var(--ink-mute)"}}>Nothing picked yet. An idea gets here with {wsNeed(voters)} 👍 or when someone taps ⭐ Priority.</div>
       : !visible.length ? <div style={{fontSize:13, color:"var(--ink-mute)"}}>No ideas yet. Ideas are optional — paste reels you like or write an idea if you want the team's input, or go straight to the plan and the draft.</div> : (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(min(330px, 100%), 1fr))", gap:12, alignItems:"start"}}>
          {visible.map((it, i)=>{
            const n = noCount(it);
            const yes = wsYes(it, voters), picked = wsPicked(it, voters);
            const tag = voters.length && yes===voters.length ? ["Everyone said yes", "var(--green)"] : yes>=wsNeed(voters) ? [yes+" of "+voters.length+" said yes", "var(--green)"] : n===1 ? ["1 No", "var(--amber)"] : n>1 ? ["2 No's", "var(--red)"] : null;
            return (
              <div key={it.id} style={{border:(it.priority? "2px solid var(--amber)" : "1px solid "+(unvoted(it)? "var(--accent)" : "var(--border)")), borderRadius:12, overflow:"hidden", background:"var(--surface)", display:"flex", flexDirection:"column"}}>
                <div style={{position:"relative"}}>
                  <WsIdeaMedia it={it} height={it.kind==="link" ? 280 : 150}/>
                  <span style={{position:"absolute", top:8, left:8, display:"flex", gap:5, pointerEvents:"none"}}>
                    <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:99, background:"rgba(0,0,0,.62)", color:"#fff"}}>#{i+1}</span>
                    {unvoted(it) && <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:99, background:"var(--accent)", color:"#fff"}}>Your vote?</span>}
                    {!onlyPicked && picked && !it.priority && <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:99, background:"var(--green)", color:"#fff"}}>✓ Creator sees it</span>}
                  </span>
                  <WsPriority it={it} act={act} canEdit={canStar}/>
                </div>
                <div style={{padding:10, display:"flex", flexDirection:"column", gap:8}}>
                  {it.kind==="link" && it.text && <div style={{fontSize:13, lineHeight:1.45, whiteSpace:"pre-wrap"}}>{it.text}</div>}
                  <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}><WsVoteDots it={it} voters={voters}/>{tag && <span style={{fontSize:11, fontWeight:700, color:tag[1]}}>{tag[0]}</span>}</div>
                  <WsYesNo it={it} act={act} voters={voters} readOnly={!canVote}/>
                  {it.kind==="link" && <a href={it.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12, fontWeight:600, color:"var(--accent)", textDecoration:"none"}}>Doesn't play here? Open on {(wsEmbed(it.url).platform && PLATFORM_META[wsEmbed(it.url).platform]) ? PLATFORM_META[wsEmbed(it.url).platform].label : "the app"} ↗</a>}
                  <WsIdeaThread it={it} items={items} act={act}/>
                  <WsMeta it={it} act={act}/>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// The song for this video, picked in the plan: from the music library (listen, pick — the creator films to it, and it's
// ready to mix into a draft or the post), or a song from Instagram's own library typed in by name.
function WsPlanMusic({p, act, ro}){
  const [finding, setFinding] = useState(false);
  const [typing, setTyping] = useState(false);
  const [typed, setTyped] = useState({title:"", url:""});
  const [playing, setPlaying] = useState(false);
  const m = p.music && p.music.title ? p.music : null, t = m && m.track;
  useEffect(()=>()=>stopMusicPreview(), []);
  function listen(){
    if(playing){ stopMusicPreview(); setPlaying(false); return; }
    stopMusicPreview(); const a = new Audio("/api/music/audio/"+t.id); a.play().catch(()=>{}); a.onended = ()=>setPlaying(false); MUSIC_PREVIEW = a; setPlaying(true);
  }
  const save = (music, msg)=> act("/project", {id:p.id, music}, msg);
  const head = <div style={{display:"flex", alignItems:"center", gap:7, fontWeight:600, fontSize:13.5, marginBottom:8}}><span style={{color:"var(--violet)", display:"inline-flex"}}><Icon name="musicNote" size={15}/></span>Music</div>;
  return (
    <div>
      {head}
      {m && <div style={{display:"flex", alignItems:"center", gap:10, padding:"9px 11px", borderRadius:10, background:"var(--violet-soft)", border:"1px solid var(--violet)", flexWrap:"wrap", marginBottom: finding||typing? 10 : 0}}>
        {t && <button onClick={listen} title={playing? "Stop" : "Listen"} style={{width:32, height:32, borderRadius:99, border:"none", background: playing? "var(--violet)" : "#fff", color: playing? "#fff" : "var(--violet)", cursor:"pointer", flexShrink:0}}>{playing? "■" : "▶"}</button>}
        <span style={{flex:"1 1 180px", minWidth:0, fontSize:13}}><b>{t ? t.title : m.title}</b>{t && <> — {t.artist}</>}
          <span style={{display:"block", fontSize:11.5, color:"var(--ink-mute)"}}>{t ? (t.duration? fmtSecs(t.duration)+" · " : "")+t.licenseLabel+" · from the music library — add it to a draft in Draft review" : "Instagram song — added in the app when posting from the phone"}</span></span>
        {!t && m.url && <a href={m.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12, fontWeight:700, color:"var(--violet)", textDecoration:"none"}}>Open song ↗</a>}
        {!ro && <><Button size="sm" onClick={()=>{ setFinding(true); setTyping(false); }}>Change</Button><Button size="sm" variant="subtle" onClick={()=>save(null, "Song removed")}>Remove</Button></>}
      </div>}
      {!m && !finding && !typing && (ro ? <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>No song picked.</div> :
        <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
          <span style={{flex:"1 1 200px", fontSize:12, color:"var(--ink-mute)", lineHeight:1.45}}>Optional. Pick the song so the creator can film to the beat. It can then be mixed into a draft (Draft review) or the post.</span>
          <Button size="sm" variant="primary" icon="search" onClick={()=>setFinding(true)}>Find music</Button>
          <Button size="sm" variant="text" onClick={()=>setTyping(true)}>Instagram song instead</Button>
        </div>)}
      {finding && <MusicSearch pickLabel="Pick" selectedId={t && t.id} onPick={tr=>{ setFinding(false); save({title:tr.title+" — "+tr.artist, url:tr.page, ...trackInfo(tr)}, "Song picked for this video"); }} onClose={()=>setFinding(false)}/>}
      {typing && <div>
        <MusicFields value={typed} onChange={setTyped} hint={false}/>
        <div style={{display:"flex", gap:8, justifyContent:"flex-end", marginTop:8}}>
          <span style={{flex:1, fontSize:11.5, color:"var(--ink-mute)", lineHeight:1.45}}>Instagram's own songs can't be mixed in by an app, so this one is added when posting from the phone.</span>
          <Button size="sm" variant="subtle" onClick={()=>setTyping(false)}>Cancel</Button>
          <Button size="sm" variant="primary" disabled={!cleanMusic(typed)} onClick={()=>{ save(cleanMusic(typed), "Song saved"); setTyping(false); }}>Save song</Button>
        </div>
      </div>}
    </div>
  );
}

// The plan: what the video is (the brief) and the shot list the creator ticks off while filming. Optional.
function WsPlan({p, items, act}){
  const [brief, setBrief] = useState(p.brief || "");
  const [savedBrief, setSavedBrief] = useState(p.brief || "");
  const [shot, setShot] = useState("");
  useEffect(()=>{ if((p.brief||"")!==savedBrief){ setSavedBrief(p.brief||""); setBrief(p.brief||""); } }, [p.brief]);
  const shots = items.filter(i=>i.kind==="shot");
  const done = shots.filter(s=>s.done).length;
  const ro = !!p.filed;
  async function addShot(){ const t = shot.trim(); if(!t) return; if(await act("/item", {kind:"shot", text:t})) setShot(""); }
  return (
    <div className="cf-ws-plan">
      <Card style={{padding:16}}>
        <div style={{fontWeight:600, fontSize:14, marginBottom:4}}>The idea</div>
        <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:10}}>Hook, dish, where, props, sound, the feeling — whatever the creator needs to know.</div>
        {ro ? <div style={{fontSize:13.5, lineHeight:1.55, whiteSpace:"pre-wrap"}}>{p.brief || "No plan was written."}</div> : <>
          <textarea value={brief} onChange={e=>setBrief(e.target.value)} rows={8} placeholder={"Hook: knife on the board, real sound, no music\nDish: Spicy Tuna Roll\nWhere: Shoreditch counter, before service\nEnd: a guest's first bite"}
            style={{width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:11, fontSize:13.5, lineHeight:1.5, fontFamily:"inherit", resize:"vertical", background:"var(--surface)", color:"var(--ink)"}}/>
          <div style={{display:"flex", justifyContent:"flex-end", marginTop:8}}><Button size="sm" variant="primary" disabled={brief===(p.brief||"")} onClick={()=>act("/project", {id:p.id, brief}, "Plan saved")}>Save plan</Button></div>
        </>}
        <div style={{borderTop:"1px solid var(--border)", marginTop:12, paddingTop:12}}>
          <WsPlanMusic p={p} act={act} ro={ro}/>
        </div>
      </Card>
      <Card style={{padding:16}}>
        <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10}}>
          <div style={{fontWeight:600, fontSize:14, flex:1}}>Shot list</div>
          {shots.length>0 && <span style={{fontSize:12, fontWeight:700, color: done===shots.length? "var(--green)":"var(--ink-mute)"}}>{done} of {shots.length} filmed</span>}
        </div>
        {shots.length>0 && <div style={{height:5, borderRadius:99, background:"var(--surface-2)", marginBottom:10}}><div style={{height:5, borderRadius:99, width:(done/shots.length*100)+"%", background:"var(--green)", transition:"width .2s"}}/></div>}
        {!shots.length && <div style={{fontSize:12.5, color:"var(--ink-mute)", marginBottom:10}}>Optional. List the shots, and the creator ticks them off on their phone while filming.</div>}
        {shots.map((s, i)=>(
          <label key={s.id} style={{display:"flex", alignItems:"flex-start", gap:10, padding:"8px 0", borderTop: i? "1px solid var(--border)" : "none", cursor: ro? "default":"pointer"}}>
            <input type="checkbox" checked={!!s.done} disabled={ro} onChange={e=>act("/item/resolve", {id:s.id, resolved:e.target.checked})} style={{marginTop:3, width:16, height:16}}/>
            <span style={{flex:1, fontSize:13.5, lineHeight:1.45, textDecoration: s.done? "line-through":"none", color: s.done? "var(--ink-mute)":"var(--ink)"}}>{s.text}
              {s.done && <span style={{display:"block", fontSize:11, textDecoration:"none", color:"var(--green)"}}>Filmed · {wsUser(s.done.by).name}</span>}</span>
            {!ro && <WsDelete it={s} act={act}/>}
          </label>
        ))}
        {!ro && <div style={{display:"flex", gap:8, marginTop:10}}>
          <input value={shot} onChange={e=>setShot(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addShot(); }} placeholder="Add a shot, e.g. close-up of the knife slice"
            style={{flex:1, minWidth:0, borderRadius:10, border:"1px solid var(--border)", padding:"8px 10px", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
          <Button icon="plus" onClick={addShot} disabled={!shot.trim()}>Add</Button>
        </div>}
      </Card>
    </div>
  );
}



function WsDrafts({p, items, act}){
  const {state, dispatch} = useApp();
  const drafts = items.filter(i=>i.kind==="draft");
  const [sel, setSel] = useState(null);
  const [seekTo, setSeekTo] = useState(null);
  const pos = useRef({cut:null, t:0, draftId:null});
  const vapi = useRef(null);
  const jump = (cut, t)=>{ const d = drafts.find(x=>x.cut===cut); if(!d){ dispatch({type:"ADD_TOAST", message:"There's no draft "+cut+" yet", variant:"warn"}); return; } setSel(d.id); setSeekTo({draftId:d.id, t:t||0, n:Date.now()}); };
  const [upload, setUpload] = useState(null); // {pct, name}
  const fileRef = useRef(null);
  const draft = drafts.find(d=>d.id===sel) || drafts[drafts.length-1] || null;
  const locked = !!(p.submitted || p.approval || p.filed);
  async function pick(e){
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if(!file) return;
    if(!/^video\//.test(file.type)){ dispatch({type:"ADD_TOAST", message:"Drafts need to be a video file", variant:"warn"}); return; }
    if(file.size > 500*1024*1024){ dispatch({type:"ADD_TOAST", message:"That video is over 500 MB — export a smaller version", variant:"warn"}); return; }
    setUpload({pct:0, name:file.name});
    try{
      const info = await readMediaInfo(file, true);
      const up = await wsUpload(file, pct=>setUpload({pct, name:file.name}));
      const d = await act("/item", {kind:"draft", media:{fileUrl:up.url, mime:file.type, name:file.name, size:file.size, duration: info && info.duration, w: info && info.w, h: info && info.h}}, "Draft uploaded");
      if(d && d.item) setSel(d.item.id);
    }catch(err){ dispatch({type:"ADD_TOAST", message:err.message, variant:"danger"}); }
    setUpload(null);
  }
  const openNotes = items.filter(i=>i.kind==="note" && !i.resolved).length;
  async function submit(){
    if(openNotes && !confirm(openNotes+" to-do"+(openNotes>1?"s aren't":" isn't")+" ticked as fixed yet. Send draft "+draft.cut+" for approval anyway?")) return;
    await act("/submit", {draftId:draft.id}, "Sent for content approval");
  }
  const uploadBtn = !locked && <>
    {draft && draft.id===drafts[drafts.length-1].id && <Button size="sm" onClick={()=>setMusicOpen(o=>!o)} disabled={!!upload}><span style={{color:"var(--violet)", display:"inline-flex", marginRight:2}}><Icon name="musicNote" size={14}/></span>{draft.media && draft.media.music ? "Change music" : "Add music"}</Button>}
    <Button size="sm" icon="upload" onClick={()=>fileRef.current && fileRef.current.click()} disabled={!!upload}>{drafts.length? "Upload new draft" : "Upload draft 1"}</Button>
  </>;
  const [musicOpen, setMusicOpen] = useState(false);
  const planned = p.music && p.music.track;
  const [musicPick, setMusicPick] = useState(null);
  useEffect(()=>{ if(musicOpen) setMusicPick(planned || null); else setMusicPick(null); }, [musicOpen]);
  // The draft's video without music, so a song can be swapped without stacking two songs.
  const sourceDraft = draft && draft.media && draft.media.music && draft.media.music.sourceUrl ? draft.media.music.sourceUrl : draft && draft.media && draft.media.fileUrl;
  async function saveMusicDraft(blob, settings, setBusy){
    setBusy("Uploading the new draft…");
    const up = await wsUpload(new File([blob], "draft"+(drafts.length+1)+"-music.mp4", {type:"video/mp4"}), pct=>setBusy("Uploading the new draft… "+pct+"%"));
    const m = draft.media || {};
    const d = await act("/item", {kind:"draft", media:{fileUrl:up.url, mime:"video/mp4", name:"Draft "+(drafts.length+1)+" with music.mp4", size:blob.size, duration:m.duration, w:m.w, h:m.h,
      music:{...trackInfo(musicPick), ...settings, sourceUrl: sourceDraft}}}, "Draft "+(drafts.length+1)+" uploaded with the music");
    if(d && d.item) setSel(d.item.id);
    setMusicOpen(false);
  }
  return (
    <Card style={{padding:16}}>
      <input ref={fileRef} type="file" accept="video/*" onChange={pick} style={{display:"none"}}/>
      {drafts.length>0 && <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:12, flexWrap:"wrap"}}>
        <div className="cf-noscrollbar" style={{display:"flex", gap:6, overflowX:"auto", flex:1, minWidth:0}}>
          {drafts.map(d=><button key={d.id} onClick={()=>setSel(d.id)} style={{flexShrink:0, padding:"5px 12px", borderRadius:99, fontSize:12.5, fontWeight:600, cursor:"pointer", border:"1px solid "+(d.id===draft.id? "var(--accent)":"var(--border)"), background: d.id===draft.id? "var(--accent-soft)":"var(--surface)", color: d.id===draft.id? "var(--accent-dark)":"var(--ink-soft)"}}>Draft {d.cut}{d.media && d.media.music ? " 🎵" : ""}{d.id===drafts[drafts.length-1].id && drafts.length>1 ? " · latest" : ""}</button>)}
        </div>
        {uploadBtn}
      </div>}
      {musicOpen && draft && <div style={{border:"1px solid var(--violet)", borderRadius:12, padding:12, marginBottom:14, background:"var(--surface)"}}>
        <div style={{fontWeight:600, fontSize:13.5, marginBottom:4}}>🎵 Add music to draft {draft.cut}</div>
        <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:10}}>The music is mixed into a copy, saved as <b>draft {drafts.length+1}</b>, so everyone reviews the final sound before approving.{planned && musicPick && musicPick.id===planned.id ? " This is the song picked in the plan." : ""}</div>
        {musicPick ? <>
          <MusicFitter key={musicPick.id} videoUrl={sourceDraft} duration={draft.media && draft.media.duration} track={musicPick} init={draft.media && draft.media.music && draft.media.music.id===musicPick.id ? draft.media.music : null} applyLabel={"Save as draft "+(drafts.length+1)} onApply={saveMusicDraft}/>
          <div style={{display:"flex", gap:8, marginTop:10}}><Button size="sm" variant="text" onClick={()=>setMusicPick(null)}>Choose another song</Button><Button size="sm" variant="subtle" onClick={()=>setMusicOpen(false)}>Close</Button></div>
        </> : <MusicSearch selectedId={planned && planned.id} onPick={setMusicPick} onClose={()=>setMusicOpen(false)}/>}
      </div>}
      {upload && <div style={{marginBottom:14}}>
        <div style={{fontSize:12.5, marginBottom:6, color:"var(--ink-soft)"}}>Uploading {upload.name}… {upload.pct}%</div>
        <div style={{height:6, borderRadius:99, background:"var(--surface-2)"}}><div style={{height:6, width:upload.pct+"%", borderRadius:99, background:"var(--accent)", transition:"width .2s"}}/></div>
      </div>}
      {!draft ? (!upload && <div style={{textAlign:"center", padding:"26px 10px", color:"var(--ink-mute)", fontSize:13}}>
          <Icon name="film" size={26} style={{margin:"0 auto 10px"}}/>When the video is filmed and edited, upload the first draft here.<br/>Everyone watches it and writes in the review chat — pinned to a second if needed.
          {!locked && <div style={{marginTop:14}}><Button variant="primary" icon="upload" onClick={()=>fileRef.current && fileRef.current.click()}>Upload draft 1</Button></div>}
        </div>)
      : <div className="cf-ws-review">
        <WsPlayer key={draft.id} draft={draft} items={items} seekTo={seekTo} apiRef={vapi} onTime={t=>{ pos.current = {cut:draft.cut, t, draftId:draft.id}; }}/>
        <WsReviewChat items={items} act={act} drafts={drafts} draft={draft} onJump={jump} vapi={vapi} readOnly={!!p.filed}/>
      </div>}
      {draft && !locked && draft.id===drafts[drafts.length-1].id && (
        <div style={{borderTop:"1px solid var(--border)", marginTop:14, paddingTop:14, display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
          <div style={{fontSize:12.5, color: openNotes? "var(--amber)":"var(--green)", flex:"1 1 200px"}}>{openNotes? openNotes+" to-do"+(openNotes>1?"s":"")+" not fixed yet" : "All to-dos fixed"} · anyone except the uploader can approve</div>
          <Button variant="primary" icon="send" onClick={submit}>Send draft {draft.cut} for approval</Button>
        </div>
      )}
      {draft && locked && !p.filed && <div style={{marginTop:12, fontSize:12.5, color:"var(--ink-mute)"}}>Draft {(p.approval||p.submitted).cut} is {p.approval? "approved" : "waiting for approval"} — a new draft can be uploaded if changes are requested.</div>}
    </Card>
  );
}

// "draft 1 at 0:12" (or "cut 1 at 0:12") in a message becomes a link that opens that draft at that second.
const WS_CUT_REF = /\b(?:draft|cut)\s?(\d{1,2})(?:\s*(?:at|@)\s*(\d{1,2}:\d{2}))?/gi;
function WsCutText({text, onJump}){
  const out = []; let last = 0, m;
  WS_CUT_REF.lastIndex = 0;
  while((m = WS_CUT_REF.exec(text))){
    out.push(text.slice(last, m.index));
    const cut = Number(m[1]), t = m[2] ? Number(m[2].split(":")[0])*60 + Number(m[2].split(":")[1]) : 0;
    out.push(<button key={m.index} onClick={()=>onJump(cut, t)} style={{display:"inline", border:"none", background:"var(--blue-soft)", color:"var(--blue)", borderRadius:4, padding:"0 4px", margin:0, fontSize:"inherit", lineHeight:"inherit", fontFamily:"inherit", fontWeight:700, cursor:"pointer", verticalAlign:"baseline"}}>{m[0]}</button>);
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return out;
}
const wsParseT = s=>{ const m = /^(\d{1,2}):(\d{1,2})$/.exec(String(s||"").trim()); return m ? Number(m[1])*60+Number(m[2]) : null; };

// The player: the draft, its to-dos as marks on the timeline, and review controls (back/forward 2s, slow motion, loop,
// download). iPhone HEVC .MOV files don't play in some browsers — then it says so instead of showing a black box.
function WsPlayer({draft, items, seekTo, apiRef, onTime}){
  const vref = useRef(null);
  const [t, setT] = useState(0);
  const [dur, setDur] = useState(draft.media.duration || 0);
  const [rate, setRate] = useState(1);
  const [loop, setLoop] = useState(false);
  const [broken, setBroken] = useState(false);
  const marks = items.filter(i=>i.kind==="note" && i.draftId===draft.id && i.t!=null);
  const seek = s=>{ const v = vref.current; if(!v) return; v.currentTime = Math.max(0, Math.min(s, v.duration||s)); v.play().catch(()=>{}); };
  apiRef.current = {time:()=> vref.current ? vref.current.currentTime : t, pause:()=> vref.current && vref.current.pause(), seek, cut:draft.cut, draftId:draft.id};
  useEffect(()=>{ if(seekTo && seekTo.draftId===draft.id && vref.current){ const v = vref.current; const go = ()=>{ v.currentTime = seekTo.t||0; v.play().catch(()=>{}); }; if(v.readyState>=1) go(); else v.addEventListener("loadedmetadata", go, {once:true}); v.scrollIntoView({block:"center", behavior:"smooth"}); } }, [seekTo && seekTo.n]);
  useEffect(()=>{ if(vref.current) vref.current.playbackRate = rate; }, [rate]);
  const portrait = !draft.media.w || draft.media.h >= draft.media.w;
  const ctl = (label, onClick, on, title)=> <button onClick={onClick} title={title||label} style={{padding:"4px 9px", borderRadius:7, fontSize:12, fontWeight:700, cursor:"pointer", border:"1px solid "+(on? "var(--accent)":"var(--border)"), background: on? "var(--accent-soft)":"var(--surface)", color: on? "var(--accent-dark)":"var(--ink-soft)"}}>{label}</button>;
  return (
    <div style={{minWidth:0}}>
      <div style={{position:"relative", background:"#000", borderRadius:12, overflow:"hidden", display:"flex", justifyContent:"center", minHeight:200}}>
        <video ref={vref} src={draft.media.fileUrl} controls playsInline preload="metadata" loop={loop}
          onTimeUpdate={e=>{ setT(e.currentTarget.currentTime); onTime && onTime(e.currentTarget.currentTime); }}
          onLoadedMetadata={e=>{ setDur(e.currentTarget.duration||0); setTimeout(()=>{ const v = vref.current; if(v && v.readyState>=2 && !v.videoWidth) setBroken(true); }, 1500); }}
          onError={()=>setBroken(true)}
          style={{display:"block", width: portrait? "auto":"100%", maxWidth:"100%", height: portrait? "min(60vh, 560px)" : "auto", maxHeight:"60vh"}}/>
        {broken && <div style={{position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8, padding:20, textAlign:"center", color:"#fff", background:"rgba(0,0,0,.78)", fontSize:13, lineHeight:1.5}}>
          <b>This browser can't play this video format</b>
          <span style={{color:"#ccc"}}>iPhone videos (.MOV, HEVC) play in Safari and on iPhone. For everyone else, export it as MP4 (H.264) and upload it as a new draft.</span>
          <a href={draft.media.fileUrl} download={draft.media.name || "draft.mov"} style={{color:"#FDBA74", fontWeight:700}}>Download the file</a>
        </div>}
      </div>
      {dur>0 && <div style={{position:"relative", height:14, margin:"8px 2px 0"}} title="To-dos on this draft">
        <div style={{position:"absolute", left:0, right:0, top:6, height:2, background:"var(--border)", borderRadius:2}}/>
        <div style={{position:"absolute", left:0, top:6, height:2, width:Math.min(100, t/dur*100)+"%", background:"var(--accent)", borderRadius:2}}/>
        {marks.map(it=><button key={it.id} onClick={()=>seek(it.t)} title={wsFmtT(it.t)+" · "+it.text}
          style={{position:"absolute", left:"calc("+Math.min(100, it.t/dur*100)+"% - 4px)", top:1, width:8, height:12, borderRadius:3, border:"none", padding:0, cursor:"pointer", background: it.resolved? "var(--green)":"var(--red)"}}/>)}
      </div>}
      <div style={{display:"flex", alignItems:"center", gap:5, flexWrap:"wrap", marginTop:8}}>
        {ctl("−2s", ()=>seek((vref.current? vref.current.currentTime : t)-2), false, "Back 2 seconds")}
        {ctl("+2s", ()=>seek((vref.current? vref.current.currentTime : t)+2), false, "Forward 2 seconds")}
        {ctl("0.5×", ()=>setRate(r=>r===0.5? 1 : 0.5), rate===0.5, "Slow motion")}
        {ctl("Loop", ()=>setLoop(l=>!l), loop, "Play on repeat")}
        <a href={draft.media.fileUrl} download={draft.media.name || "draft"} style={{textDecoration:"none"}}>{ctl("Download", ()=>{}, false, "Download this draft")}</a>
        <span style={{flex:1}}/>
        <span className="num" style={{fontSize:12, color:"var(--ink-mute)", fontFamily:'ui-monospace, "SF Mono", Menlo, monospace'}}>{wsFmtT(t)}{dur? " / "+wsFmtT(dur) : ""}</span>
      </div>
      <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:6}}>Draft {draft.cut} · {wsUser(draft.author).name} · {wsAgo(draft.createdAt)}</div>
    </div>
  );
}

// One review chat for every draft of this video. A message can be pinned to a second of a draft (a to-do the creator
// ticks off as Fixed), be about a whole draft (also a to-do), or be general chat. Tap a time to jump to it.
function WsReviewChat({items, act, drafts, draft, onJump, vapi, readOnly, compact}){
  const [filter, setFilter] = useState("all");
  const [mode, setMode] = useState(vapi ? "moment" : "general");
  const [tText, setTText] = useState("");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [, tick] = useState(0);
  useEffect(()=>{ if(compact) return; const id = setInterval(()=>tick(x=>x+1), 500); return ()=>clearInterval(id); }, [compact]);
  const cutOf = id=>(drafts.find(d=>d.id===id)||{}).cut;
  const list = items.filter(i=>(i.kind==="note") || (i.kind==="comment" && !i.parentId))
    .filter(i=> filter==="todo" ? i.kind==="note" && !i.resolved : filter==="this" ? i.kind==="note" && i.draftId===(draft&&draft.id) : true)
    .sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const todoCount = items.filter(i=>i.kind==="note" && !i.resolved).length;
  const now = vapi && vapi.current ? vapi.current.time() : 0;
  const atT = mode==="moment" ? (tText ? wsParseT(tText) : now) : null;
  async function send(){
    const t = text.trim(); if(!t || !draft) return;
    if(mode==="moment" && tText && atT==null){ alert("Write the time like 0:05"); return; }
    setBusy(true);
    if(vapi && vapi.current && mode==="moment") vapi.current.pause();
    const ok = mode==="general" ? await act("/item", {kind:"comment", text:t}) : await act("/item", {kind:"note", draftId:draft.id, t: mode==="moment" ? atT : null, text:t});
    if(ok){ setText(""); setTText(""); }
    setBusy(false);
  }
  const chip = (k, l)=> <button key={k} onClick={()=>setFilter(k)} style={{padding:"3px 10px", borderRadius:99, fontSize:11.5, fontWeight:600, cursor:"pointer", border:"1px solid "+(filter===k? "var(--accent)":"var(--border)"), background: filter===k? "var(--accent-soft)":"var(--surface)", color: filter===k? "var(--accent-dark)":"var(--ink-soft)"}}>{l}</button>;
  return (
    <div style={{minWidth:0, display:"flex", flexDirection:"column"}}>
      <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:8}}>
        <span style={{fontSize:13.5, fontWeight:700, marginRight:4}}>Review chat</span>
        {chip("all", "All")}{chip("todo", "To-dos"+(todoCount? " · "+todoCount : ""))}{!compact && draft && chip("this", "Draft "+draft.cut)}
      </div>
      <div style={{display:"flex", flexDirection:"column", gap:2, maxHeight: compact? 260 : "min(52vh, 480px)", overflowY:"auto", marginBottom:10}}>
        {!list.length && <div style={{fontSize:12.5, color:"var(--ink-mute)", padding:"6px 0"}}>{filter==="todo" ? "No open to-dos." : "Pause the video and write what you think — it's pinned to that second. Use “General” for anything else."}</div>}
        {list.map(it=>{
          const note = it.kind==="note", c = note ? cutOf(it.draftId) : null;
          return (
            <div key={it.id} style={{display:"flex", gap:9, alignItems:"flex-start", padding:"8px 0", borderTop:"1px solid var(--border)", opacity: it.resolved? .6:1}}>
              <Avatar user={wsUser(it.author)} size={24}/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
                  <b style={{fontSize:12.5}}>{wsUser(it.author).name}</b><span style={{fontSize:11, color:"var(--ink-mute)"}}>{wsAgo(it.createdAt)}</span>
                  {note && <button onClick={()=>onJump(c, it.t||0)} title={it.t!=null? "Jump to this moment" : "Open this draft"} style={{border:"none", borderRadius:6, padding:"1px 7px", fontSize:11, fontWeight:700, cursor:"pointer", background:"var(--blue-soft)", color:"var(--blue)", fontFamily: it.t!=null? 'ui-monospace, "SF Mono", Menlo, monospace' : "inherit"}}>Draft {c}{it.t!=null? " · "+wsFmtT(it.t) : " · whole"}</button>}
                  {it.decision==="changes" && <span style={{fontSize:10.5, fontWeight:700, color:"var(--amber)"}}>Changes requested</span>}
                </div>
                <div style={{fontSize:13.5, lineHeight:1.45, whiteSpace:"pre-wrap", wordBreak:"break-word", textDecoration: it.resolved? "line-through":"none", color: it.decision==="changes"? "var(--amber)" : "var(--ink)"}}><WsCutText text={it.text} onJump={onJump}/></div>
                {it.resolved && <div style={{fontSize:11, color:"var(--green)"}}>Fixed · {wsUser(it.resolved.by).name}</div>}
              </div>
              {note && !readOnly && <label title={it.resolved? "Mark as not fixed" : "Mark as fixed"} style={{display:"flex", alignItems:"center", gap:4, fontSize:11.5, fontWeight:600, color: it.resolved? "var(--green)":"var(--ink-mute)", cursor:"pointer", flexShrink:0}}>
                <input type="checkbox" checked={!!it.resolved} onChange={e=>act("/item/resolve", {id:it.id, resolved:e.target.checked})}/>Fixed</label>}
              <WsDelete it={it} act={act}/>
            </div>
          );
        })}
      </div>
      {!readOnly && draft && <div>
        <div style={{display:"flex", gap:4, alignItems:"center", flexWrap:"wrap", marginBottom:6}}>
          {[...(vapi? [["moment", "📍 Draft "+draft.cut+" at"]] : []), ["whole", "Whole draft "+draft.cut], ["general", "General"]].map(([k, l])=>(
            <button key={k} onClick={()=>setMode(k)} style={{padding:"3px 10px", borderRadius:99, fontSize:11.5, fontWeight:600, cursor:"pointer", border:"1px solid "+(mode===k? "var(--accent)":"var(--border)"), background: mode===k? "var(--accent-soft)":"var(--surface)", color: mode===k? "var(--accent-dark)":"var(--ink-soft)"}}>{l}</button>
          ))}
          {mode==="moment" && <input value={tText} onChange={e=>setTText(e.target.value)} placeholder={wsFmtT(now)} title="Change the time, e.g. 0:05" style={{width:56, borderRadius:7, border:"1px solid var(--border)", padding:"3px 6px", fontSize:12, fontFamily:'ui-monospace, "SF Mono", Menlo, monospace', background:"var(--surface)", color:"var(--ink)"}}/>}
        </div>
        <div style={{display:"flex", gap:8, alignItems:"flex-end"}}>
          <textarea value={text} onChange={e=>setText(e.target.value)} rows={1} placeholder={mode==="general" ? "Write to the team about this video…" : mode==="whole" ? "What should change in draft "+draft.cut+"?" : "What should change at "+wsFmtT(atT==null? now : atT)+"?"}
            onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } }}
            style={{flex:1, minWidth:0, borderRadius:10, border:"1px solid var(--border)", padding:"9px 11px", fontSize:13, fontFamily:"inherit", resize:"vertical", background:"var(--surface)", color:"var(--ink)"}}/>
          <Button variant="primary" icon="send" onClick={send} disabled={busy || !text.trim()}>Send</Button>
        </div>
      </div>}
    </div>
  );
}

// After "Send for approval": everything else folds away and the cut plays in the phone, as it will look on each app.
function WsApprovalStage({p, draft, items, act, onName}){
  const {state} = useApp();
  const me = USERS.find(u=>u.id===state.currentUserId);

  const noDecide = PERMS[me.role].wsApprove===false; // video creators upload drafts; the rest of the team approves
  const caption = p.title;
  const item = useMemo(()=>({id:"ws_"+p.id, brand:"sanjugo", format:"post", title:p.title, platforms:WS_PREVIEW_PLATFORMS,
    media:{type:"video", fileUrl:draft.media.fileUrl, previewUrl:null, aspectRatio: nearestAspect(draft.media.w, draft.media.h) || "9:16", duration: draft.media.duration || null},
    variants:Object.fromEntries(WS_PREVIEW_PLATFORMS.map(pl=>[pl, makeVariant(pl, {caption})]))}), [p.id, draft.id, caption]);

            <PlatformIcon platform={pl} size={12}/>{PLATFORM_META[pl].label}
          </button>
        ))}
        <button onClick={()=>setMuted(m=>!m)} style={{padding:"5px 12px", borderRadius:99, border:"1px solid var(--border)", background:"var(--surface)", fontSize:12.5, fontWeight:600, cursor:"pointer", color:"var(--ink-soft)"}}>{muted? "Sound off":"Sound on"}</button>
      </div>
      <div className="cf-ws-stage">
        <div style={{height:"min(66vh, 640px)", minHeight:420}}>
          <PhonePreview platform={platform} item={item} variant={item.variants[platform]} brand={BRANDS[0]} playing={true} muted={muted} onAutoMuted={()=>setMuted(true)}/>
        </div>
        <div style={{minWidth:0, display:"flex", flexDirection:"column", gap:14}}>
          <div>
            <div style={{fontSize:16, fontWeight:600}}>Draft {draft.cut} · {approved? "approved" : "waiting for approval"}</div>
            <div style={{fontSize:12.5, color:"var(--ink-mute)", marginTop:3}}>Uploaded by {wsUser(draft.author).name}{p.submitted? ", sent "+wsAgo(p.submitted.at) : ""}. This is content approval for the library — publishing is a separate post in the Approval Queue.</div>
          </div>
          {approved ? <>
            <div style={{padding:12, borderRadius:10, background:"var(--green-soft)", color:"var(--green)", fontSize:13, fontWeight:600}}>✓ Approved by {wsUser(p.approval.by).name} {wsAgo(p.approval.at)}{p.approval.note? " — "+p.approval.note : ""}</div>
            <div style={{fontSize:13, color:"var(--ink-soft)", lineHeight:1.5}}>Next: {isUploader? "check" : wsUser(draft.author).name+" checks"} the file name, then the video is saved to Google Drive and added to the Content Library.</div>
            <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
              <Button variant="primary" icon="file" onClick={onName}>Confirm file name</Button>
              {(p.approval.by===me.id || me.role==="admin") && <Button icon="undo" onClick={()=>act("/unapprove", {}, "Approval undone")}>Undo approval</Button>}
            </div>
          </> : isUploader ? <>
            <div style={{padding:12, borderRadius:10, background:"var(--blue-soft)", color:"var(--blue)", fontSize:13, fontWeight:600}}>Waiting for someone else on the team to approve.</div>
            <div><Button icon="undo" onClick={()=>act("/withdraw", {}, "Taken back — you can upload a new cut")}>Take it back</Button></div>
          </> : noDecide ? <div style={{padding:12, borderRadius:10, background:"var(--blue-soft)", color:"var(--blue)", fontSize:13, fontWeight:600}}>Waiting for the team to approve this draft.</div>

              <Button onClick={()=>setAsking(false)}>Cancel</Button>
              <Button variant="amber" icon="edit" disabled={!changes.trim()} onClick={async()=>{ if(await act("/review", {decision:"changes", note:changes}, "Sent back with your changes")){ setAsking(false); setChanges(""); } }}>Send back for changes</Button>
            </div>
          </div> : <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <Button icon="edit" onClick={()=>setAsking(true)} style={{color:"var(--amber)", borderColor:"var(--amber)", whiteSpace:"nowrap"}}>Needs changes</Button>
            <Button variant="success" icon="check" onClick={()=>act("/review", {decision:"approve"}, "Approved — "+wsUser(draft.author).name+" will confirm the file name")} style={{whiteSpace:"nowrap"}}>Approve content</Button>
          </div>}
          <WsReviewChat compact items={items} act={act} drafts={items.filter(i=>i.kind==="draft")} draft={draft} onJump={()=>{}} vapi={null} readOnly={!!p.filed}/>
        </div>
      </div>
    </Card>
  );
}

// The file-name check: Creator Studio suggests a name from the rule book, the creator can change any part,
// and nothing is saved until every check passes (the server checks again before writing to Drive).
function WsNameModal({p, onClose, onFiled}){
  const {dispatch} = useApp();
  const post = useWsPost();
  const [sug, setSug] = useState(null);
  const [x, setX] = useState(null);
  const [used, setUsed] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(()=>{
    wsGet("/name?id="+encodeURIComponent(p.id)).then(d=>{ setSug(d); setX({...d.parts, dish1:d.parts.dishes[0]||"", dish2:d.parts.dishes[1]||""}); }).catch(e=>setErr(e.message));
    loadLibrary(true).then(lib=>setUsed(new Set(lib.files.map(f=>f.barcode).filter(Boolean)))).catch(()=>setUsed(new Set()));
  }, [p.id]);
  if(!x) return <Modal open onClose={onClose} width={560}><div style={{padding:22}}>{err ? <div style={{color:"var(--red)"}}>{err}</div> : <><Skeleton h={20} w="50%"/><div style={{height:12}}/><Skeleton h={44}/></>}</div></Modal>;
  const set = patch => setX(v=>({...v, ...patch}));
  const barcode = String(x.barcode||"").toUpperCase().trim();
  const dishes = [x.dish1, x.dish2].filter(Boolean);
  const name = [x.date, x.social, x.category, ...dishes, x.stage, x.version, barcode].join("_") + "." + x.ext;
  const d = x.date; const dt = /^\d{8}$/.test(d) && new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8));
  const letter = WS_BRANCH_LETTER[p.branch] || "G";
  const checks = [
    [!!dt && dt.getMonth()+1===+d.slice(4,6) && dt.getDate()===+d.slice(6,8), "Date is a real date in YYYYMMDD format"],
    [/^[SAVG]\d{3}$/.test(barcode), "Barcode is a branch letter (S, A, V or G) plus 3 digits"],
    [!used || !used.has(barcode), used ? "Barcode "+barcode+" isn't used anywhere in the Content Library" : "Checking the barcode against the Content Library…"],
    [!x.dish2 || x.dish2!==x.dish1, "Dish codes aren't repeated"],
    [true, "Every code comes from the SANJUGO filing system rule book"],
    [true, "Underscores only — no spaces or hyphens"],
  ];
  const warn = barcode[0] && barcode[0]!==letter ? "Barcodes for "+(WS_BRANCH_OPTS.find(b=>b.value===p.branch)||{}).label+" usually start with "+letter+"." : null;
  const ok = checks.every(c=>c[0]) && used;
  async function save(){
    setBusy(true); setErr(null);
    try{ await post("/file", {projectId:p.id, name}); dispatch({type:"ADD_TOAST", message:"Saved to Google Drive as "+barcode+" — it's in the Content Library now"}); onFiled(); }
    catch(e){ setErr(e.message); }
    setBusy(false);
  }
  const field = (lbl, el) => <div style={{minWidth:0}}><label style={{fontSize:11.5, fontWeight:700, color:"var(--ink-mute)", display:"block", marginBottom:5}}>{lbl}</label>{el}</div>;
  const inp = {width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:"8px 10px", fontSize:13, background:"var(--surface)", color:"var(--ink)", fontFamily:'ui-monospace, "SF Mono", Menlo, monospace'};
  return (
    <Modal open onClose={busy? ()=>{} : onClose} width={600}>
      <div style={{padding:20}}>
        <h3 style={{margin:"0 0 4px", fontSize:17}}>Is this file name right?</h3>
        <div style={{fontSize:12.5, color:"var(--ink-mute)", marginBottom:14}}>{p.title} · draft {p.approval.cut} approved by {wsUser(p.approval.by).name}. Change any part if it's not right.</div>
        <div className="num" style={{fontFamily:'ui-monospace, "SF Mono", Menlo, monospace', fontSize:14.5, fontWeight:600, padding:"12px 14px", borderRadius:10, background:"var(--surface-2)", wordBreak:"break-all", marginBottom:14}}>{name}</div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(3, minmax(0,1fr))", gap:10, marginBottom:14}} className="cf-ws-namegrid">
          {field("Date", <input value={x.date} onChange={e=>set({date:e.target.value.replace(/\D/g,"").slice(0,8)})} style={inp}/>)}
          {field("Social", <Select value={x.social} onChange={v=>set({social:v})} options={WS_SOCIAL_OPTS}/>)}
          {field("Category", <Select value={x.category} onChange={v=>set({category:v})} options={WS_CATEGORY_OPTS}/>)}
          {field("Dish", <Select value={x.dish1} onChange={v=>set({dish1:v, ...(v? {} : {dish2:""})})} options={WS_DISH_OPTS}/>)}
          {field("Second dish", <Select value={x.dish2} onChange={v=>set({dish2:v})} options={WS_DISH_OPTS.map(o=>o.value? o : {...o, label:"None"})}/>)}
          {field("Stage", <Select value={x.stage} onChange={v=>set({stage:v})} options={WS_STAGE_OPTS}/>)}
          {field("Version", <Select value={x.version} onChange={v=>set({version:v})} options={Array.from({length:Math.max(9, +String(x.version).slice(1))}, (_,i)=>({value:"v"+(i+1), label:"v"+(i+1)}))}/>)}
          {field("Barcode", <input value={x.barcode} onChange={e=>set({barcode:e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4)})} style={inp}/>)}
          {field("File type", <input value={"."+x.ext} disabled style={{...inp, opacity:.7}}/>)}
        </div>
        <div style={{display:"flex", flexDirection:"column", gap:5, marginBottom:14}}>
          {checks.map(([pass, text])=><div key={text} style={{display:"flex", alignItems:"center", gap:7, fontSize:12.5, color: pass? "var(--green)":"var(--red)"}}><Icon name={pass? "check":"warn"} size={14} strokeWidth={2.4}/>{text}</div>)}
          {warn && <div style={{display:"flex", alignItems:"center", gap:7, fontSize:12.5, color:"var(--amber)"}}><Icon name="warn" size={14}/>{warn}</div>}
        </div>
        <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>Saves to Google Drive → Creator Studio Projects → {(WS_BRANCH_OPTS.find(b=>b.value===p.branch)||{}).label==="All branches"? "All-Branches" : (WS_BRANCH_OPTS.find(b=>b.value===p.branch)||{}).label}, and adds it to the Content Library.</div>
        {err && <div style={{fontSize:13, color:"var(--red)", marginBottom:12}}>{err}</div>}
        <div style={{display:"flex", justifyContent:"flex-end", gap:8, flexWrap:"wrap"}}>
          <Button onClick={onClose} disabled={busy}>Not now</Button>
          <Button variant="primary" icon="check" onClick={save} disabled={!ok || busy}>{busy? "Saving to Google Drive…" : "Looks right, save to Drive"}</Button>
        </div>
      </div>
      <style>{`@media (max-width:520px){ .cf-ws-namegrid{ grid-template-columns:1fr 1fr !important; } }`}</style>
    </Modal>
  );
}

      <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>

function ChatText({text, me}){
  const meName = (USERS.find(u=>u.id===me)||{}).name||"";
  return text.split(mentionRe()).map((part,i)=>{
    if(i%2===0) return <React.Fragment key={i}>{part}</React.Fragment>;
    const isMe = part.toLowerCase()==="@"+meName.toLowerCase() || /^@(everyone|all|team)$/i.test(part);
    return <span key={i} style={{fontWeight:600, color: isMe? "var(--accent-dark)" : "var(--blue)", background: isMe? "var(--accent-soft)" : "var(--blue-soft)", borderRadius:4, padding:"0 3px"}}>{part}</span>;
  });
}
function dayLabel(iso){
  const d = new Date(iso), t = new Date();
  const y = new Date(); y.setDate(t.getDate()-1);
  const same = (a,b)=> a.toDateString()===b.toDateString();
  if(same(d,t)) return "Today";
  if(same(d,y)) return "Yesterday";
  return d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
}

/* Team Chat: messages with replies, reactions and pins; live cards for Workspace projects, posts and calendar days
   with the next action right on them (approve, vote, review); any message can become a Workspace project, and reel
   links play in place and can be dropped into a project's ideas. */
const CHAT_EMOJIS = ["👍", "✅", "👀", "❤️", "😂", "🔥"];
const chatLinks = text => (String(text||"").match(/https:\/\/[^\s)]+/g) || []).map(u=>u.replace(/[.,!?]+$/,""));

function ChatPage(){
  const {state, chat, openDetails, dispatch} = useApp();
  const me = state.currentUserId;
  const narrow = useIsNarrow(900);
  const [text, setText] = useState("");
  const [attach, setAttach] = useState(null); // {kind:"post"|"project"|"day", id}
  const [dayPick, setDayPick] = useState("");
  const [menu, setMenu] = useState(false);
  const [replyTo, setReplyTo] = useState(null);
  const [view, setView] = useState("all"); // all | mentions | updates | pinned
  const [q, setQ] = useState("");
  const [sending, setSending] = useState(false);
  const [mention, setMention] = useState(null);
  const [mIndex, setMIndex] = useState(0);
  const [actionsFor, setActionsFor] = useState(null); // message id with its action bar open (phones)
  const [toProject, setToProject] = useState(null); // {url, messageId} — add a reel to a project's ideas
  const [flash, setFlash] = useState(null);
  const [projects, setProjects] = useState([]);
  const listRef = useRef(null);
  const taRef = useRef(null);
  const firstUnread = useRef(chat.seen);
  const loadProjects = useCallback(()=> fetch("/api/workspace?me="+encodeURIComponent(me), {cache:"no-store"}).then(r=>r.ok? r.json() : {projects:[]}).then(d=>setProjects(d.projects||[])).catch(()=>{}), [me]);
  useEffect(()=>{ loadProjects(); const t = setInterval(()=>{ if(!document.hidden) loadProjects(); }, 30000); return ()=>clearInterval(t); }, [loadProjects]);

  useEffect(()=>{ chat.markSeen(); }, [chat.messages.length, me]);
  const byId = useMemo(()=>new Map(chat.messages.map(m=>[m.id, m])), [chat.messages]);
  const pinned = chat.messages.filter(m=>m.pinnedAt).sort((a,b)=>b.pinnedAt.localeCompare(a.pinnedAt));
  const ql = q.trim().toLowerCase();
  const shown = (view==="mentions" ? chat.messages.filter(m=>(m.mentions||[]).includes(me))
    : view==="updates" ? chat.messages.filter(m=>m.author==="system")
    : view==="pinned" ? [...pinned].reverse() : chat.messages).filter(m=>!ql || m.text.toLowerCase().includes(ql));
  useEffect(()=>{ const el = listRef.current; if(el && !ql) el.scrollTop = el.scrollHeight; }, [shown.length, view]);

  const candidates = mention ? [{key:BOT_ID, label:BOT_NAME, sub:"AI assistant — ask it anything", bot:true}, ...activeUsers().filter(u=>u.id!==me).map(u=>({key:u.id, label:u.name, sub:ROLE_META[u.role].label, user:u})), {key:"everyone", label:"everyone", sub:"Notify the whole team"}]
      .filter(c=>c.label.toLowerCase().startsWith(mention.query.toLowerCase())) : [];
  function onChange(e){
    const v = e.target.value; setText(v);
    const caret = e.target.selectionStart;
    const m = /(^|\s)@([^\s@]*)$/.exec(v.slice(0, caret));
    if(m){ setMention({query:m[2], start: caret - m[2].length - 1}); setMIndex(0); } else setMention(null);
    e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140)+"px";
  }
  function pick(c){
    const caret = taRef.current ? taRef.current.selectionStart : text.length;
    setText(text.slice(0, mention.start) + "@" + c.label + " " + text.slice(caret)); setMention(null);
    setTimeout(()=>{ const el = taRef.current; if(el){ el.focus(); const pos = mention.start + c.label.length + 2; el.setSelectionRange(pos, pos); } }, 0);
  }
  async function submit(){
    const body = text.trim() || (attach ? {post:"Have a look 👇", project:"Have a look at this project 👇", day:"Here's this day 👇"}[attach.kind] : "");
    if(!body || sending) return;
    setSending(true);
    const ok = await chat.send(body, attach && attach.kind==="post" ? attach.id : null, {replyTo: replyTo && replyTo.id, card: attach && attach.kind!=="post" ? {type:attach.kind, id:attach.id} : null});
    setSending(false);
    if(ok){ setText(""); setAttach(null); setReplyTo(null); if(taRef.current) taRef.current.style.height = "auto"; }
  }
  function onKeyDown(e){
    if(mention && candidates.length){
      if(e.key==="ArrowDown"){ e.preventDefault(); setMIndex(i=>(i+1)%candidates.length); return; }
      if(e.key==="ArrowUp"){ e.preventDefault(); setMIndex(i=>(i-1+candidates.length)%candidates.length); return; }
      if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); pick(candidates[mIndex]); return; }
      if(e.key==="Escape"){ setMention(null); return; }
    }
    if(e.key==="Escape" && replyTo){ setReplyTo(null); return; }
    if(e.key==="Enter" && !e.shiftKey && !narrow){ e.preventDefault(); submit(); }
  }
  function jumpTo(id){
    if(view!=="all" || ql){ setView("all"); setQ(""); }
    setTimeout(()=>{ const el = document.getElementById("msg-"+id); if(el){ el.scrollIntoView({block:"center", behavior:"smooth"}); setFlash(id); setTimeout(()=>setFlash(null), 1600); } }, 80);
  }
  // A message becomes a Workspace project: its text is the plan, its links become ideas, and the project is shared back here.
  async function makeProject(m){
    try{
      const post = (path, b)=>fetch("/api/workspace"+path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...b, userId:me})}).then(async r=>{ const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error || "Couldn't start the project"); return d; });
      const firstLine = m.text.replace(/https:\/\/\S+/g, "").replace(/@\S+(\s\S+)?/g, "").trim().split("\n")[0].slice(0, 60) || "New project from chat";
      const {project} = await post("/project", {title:firstLine, branch:"all", category:"FC", brief:m.text, creatorId:""});
      for(const url of chatLinks(m.text).slice(0, 5)) await post("/item", {projectId:project.id, kind:"link", url, text:"From Team Chat"});
      await chat.send("📁 Started a Workspace project from this", null, {replyTo:m.id, card:{type:"project", id:project.id}});
      loadProjects();
      dispatch({type:"ADD_TOAST", message:"Project \""+project.title+"\" created"});
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
  }

  const recentPosts = [...state.contentItems].sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0)).slice(0,40);
  const openProjects = projects.filter(p=>!p.deleted);
  const attachLabel = attach && (attach.kind==="post" ? (state.contentItems.find(i=>i.id===attach.id)||{}).title : attach.kind==="project" ? (projects.find(p=>p.id===attach.id)||{}).title : fmtDate(attach.id+"T12:00:00", {weekday:"long", day:"numeric", month:"short"}));
  let lastDay = null, prev = null;
  const tabBtn = (label, v, n)=>(
    <button key={v} onClick={()=>setView(v)} style={{padding:"6px 11px", borderRadius:7, border:"1px solid "+(view===v?"var(--ink)":"var(--border)"), background: view===v? "var(--ink)":"var(--surface)", color: view===v? "var(--surface)":"var(--ink-soft)", fontSize:12.5, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap"}}>{label}{n? " · "+n : ""}</button>
  );
  return (
    <div>
      <PageHeader title="Team Chat" action={narrow ? null : <div style={{display:"flex"}}>{activeUsers().map((u,i)=><span key={u.id} title={u.name} style={{marginLeft:i?-8:0, borderRadius:99, boxShadow:"0 0 0 2px var(--surface)"}}><Avatar user={u} size={28}/></span>)}</div>}/>
      <Card style={{padding:0, display:"flex", flexDirection:"column", height: narrow? "calc(100dvh - 190px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))" : "calc(100dvh - 170px)", minHeight:380, overflow:"hidden"}}>
        <div className="cf-noscrollbar" style={{display:"flex", alignItems:"center", gap:6, padding:"10px 14px", borderBottom:"1px solid var(--border)", overflowX:"auto"}}>
          {tabBtn("All", "all")}{tabBtn(narrow? "@ me" : "Mentions of me", "mentions")}{tabBtn("Updates", "updates")}{tabBtn("📌 Pinned", "pinned", pinned.length)}
          {!narrow && <><span style={{flex:1, minWidth:8}}/>
          <div style={{position:"relative", flex:"0 1 200px", minWidth:120}}>
            <Icon name="search" size={14} style={{position:"absolute", left:9, top:8, color:"var(--ink-mute)"}}/>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search" style={{width:"100%", padding:"6px 8px 6px 28px", borderRadius:8, border:"1px solid var(--border)", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"}}/>
          </div></>}
        </div>
        {narrow && <div style={{padding:"10px 14px", borderBottom:"1px solid var(--border)"}}>
          <div style={{position:"relative"}}>
            <Icon name="search" size={14} style={{position:"absolute", left:9, top:9, color:"var(--ink-mute)"}}/>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search messages" style={{width:"100%", padding:"7px 8px 7px 28px", borderRadius:8, border:"1px solid var(--border)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
          </div>
        </div>}
        {pinned.length>0 && view!=="pinned" && (
          <button onClick={()=>jumpTo(pinned[0].id)} style={{display:"flex", alignItems:"center", gap:8, padding:"8px 14px", border:"none", borderBottom:"1px solid var(--border)", background:"var(--amber-soft)", cursor:"pointer", textAlign:"left", color:"var(--ink)"}}>
            <span>📌</span><span style={{flex:1, minWidth:0, fontSize:12.5, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}><b>{(USERS.find(u=>u.id===pinned[0].author)||{name: pinned[0].author==="system"? "Creator Studio" : "Someone"}).name}:</b> {pinned[0].text}</span>
            {pinned.length>1 && <span onClick={e=>{ e.stopPropagation(); setView("pinned"); }} style={{fontSize:11.5, fontWeight:700, color:"var(--amber)", whiteSpace:"nowrap"}}>{pinned.length} pinned ›</span>}
          </button>
        )}
        {chat.mode==="local" && <div style={{padding:"8px 14px", fontSize:12, background:"var(--amber-soft)", color:"var(--amber)", fontWeight:600}}>Can't reach the chat server — messages are only saved on this device.</div>}

        <div ref={listRef} onClick={()=>narrow && setActionsFor(null)} style={{flex:1, minHeight:0, overflowY:"auto", padding:"8px 0 12px"}}>
          {shown.length===0 ? (
            <EmptyState icon="chat" title={ql? "Nothing found" : view==="pinned"? "Nothing pinned" : view==="mentions"? "No mentions yet" : view==="updates"? "No updates yet" : "No messages yet"} subtitle={view==="pinned"? "Pin shoot days, brand rules or anything the team keeps asking for." : null}/>
          ) : shown.map(m=>{
            const isUpdate = m.author==="system", isBot = m.author===BOT_ID;
            const author = isUpdate ? {id:"system", name:"Creator Studio"} : isBot ? {id:BOT_ID, name:BOT_NAME} : (USERS.find(u=>u.id===m.author) || {name:"Unknown", avatarColor:"#888", id:m.author});
            const day = dayLabel(m.createdAt);
            const showDay = day!==lastDay && view!=="pinned"; lastDay = day;
            const grouped = !showDay && view!=="pinned" && prev && prev.author===m.author && !m.replyTo && (new Date(m.createdAt)-new Date(prev.createdAt) < 5*60000);
            const showUnreadLine = view==="all" && !ql && prev && prev.id<=firstUnread.current && m.id>firstUnread.current && m.author!==me;
            prev = m;
            const mentionsMe = (m.mentions||[]).includes(me) && m.author!==me;
            const item = m.contentId && state.contentItems.find(i=>i.id===m.contentId);
            const quoted = m.replyTo && byId.get(m.replyTo);
            const links = chatLinks(m.text).filter(u=>wsEmbed(u).platform);
            const showActions = actionsFor===m.id;
            return (
              <React.Fragment key={m.id}>
                {showDay && <div style={{display:"flex", alignItems:"center", gap:10, padding:"12px 16px 6px", fontSize:11.5, fontWeight:600, color:"var(--ink-mute)"}}><span style={{flex:1, height:1, background:"var(--border)"}}/>{day}<span style={{flex:1, height:1, background:"var(--border)"}}/></div>}
                {showUnreadLine && <div style={{display:"flex", alignItems:"center", gap:10, padding:"4px 16px", fontSize:11, fontWeight:700, color:"var(--red)"}}><span style={{flex:1, height:1, background:"var(--red)", opacity:.4}}/>New</div>}
                <div id={"msg-"+m.id} className="cf-chat-msg" onClick={e=>{ if(narrow){ e.stopPropagation(); setActionsFor(showActions? null : m.id); } }}
                  style={{position:"relative", display:"flex", gap:10, padding: grouped? "2px 16px" : "8px 16px 2px", transition:"background .3s",
                    background: flash===m.id ? "var(--amber-soft)" : mentionsMe? "var(--accent-soft)" : "transparent", borderLeft: mentionsMe? "3px solid var(--accent)" : "3px solid transparent"}}>
                  <div style={{width:32, flexShrink:0}}>{!grouped && (isUpdate ? <img src={LOGO_SANJUGO} alt="" style={{width:32, height:32, borderRadius:99}}/> : isBot ? <BotAvatar size={32}/> : <Avatar user={author} size={32}/>)}</div>
                  <div style={{flex:1, minWidth:0}}>
                    {!grouped && <div style={{display:"flex", alignItems:"baseline", gap:8, marginBottom:1}}>
                      <span style={{fontSize:13.5, fontWeight:700}}>{author.name}</span>
                      <span style={{fontSize:11.5, color:"var(--ink-mute)"}}>{view==="pinned" ? fmtDateTime(m.createdAt) : new Date(m.createdAt).toLocaleTimeString("en-GB",{hour:"2-digit", minute:"2-digit"})}</span>
                      {m.pinnedAt && <span title={"Pinned by "+((USERS.find(u=>u.id===m.pinnedBy)||{}).name||"someone")} style={{fontSize:11}}>📌</span>}
                    </div>}
                    {quoted && <button onClick={e=>{ e.stopPropagation(); jumpTo(quoted.id); }} style={{display:"block", maxWidth:"100%", margin:"2px 0 4px", padding:"3px 9px", borderLeft:"3px solid var(--accent)", border:"none", borderRadius:"0 6px 6px 0", background:"var(--surface-2)", fontSize:12, color:"var(--ink-soft)", cursor:"pointer", textAlign:"left", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>
                      <b>{(USERS.find(u=>u.id===quoted.author)||{name: quoted.author==="system"? "Creator Studio" : quoted.author===BOT_ID? BOT_NAME : "Someone"}).name}</b> {quoted.text.slice(0,100)}</button>}
                    <div style={{fontSize:13.5, lineHeight:1.5, whiteSpace:"pre-wrap", wordBreak:"break-word", color:"var(--ink)"}}><ChatText text={m.text} me={me}/></div>
                    {links.map(u=><ChatReel key={u} url={u} onAdd={()=>setToProject({url:u, messageId:m.id})}/>)}
                    {item && <ChatPostCard item={item}/>}
                    {m.card && m.card.type==="post" && (()=>{ const it = state.contentItems.find(i=>i.id===m.card.id); return it ? <ChatPostCard item={it}/> : null; })()}
                    {m.card && m.card.type==="project" && <ChatProjectCard p={projects.find(p=>p.id===m.card.id)} id={m.card.id}/>}
                    {m.card && m.card.type==="day" && <ChatDayCard date={m.card.id}/>}
                    {Object.keys(m.reactions||{}).length>0 && <div style={{display:"flex", gap:4, flexWrap:"wrap", marginTop:5}}>
                      {Object.entries(m.reactions).map(([e, who])=>(
                        <button key={e} onClick={ev=>{ ev.stopPropagation(); chat.react(m.id, e); }} title={who.map(id=>(USERS.find(u=>u.id===id)||{}).name||"?").join(", ")}
                          style={{display:"inline-flex", alignItems:"center", gap:4, padding:"1px 8px", borderRadius:99, fontSize:12.5, cursor:"pointer", border:"1px solid "+(who.includes(me)? "var(--accent)":"var(--border)"), background: who.includes(me)? "var(--accent-soft)":"var(--surface)", color:"var(--ink)"}}>{e}<b style={{fontSize:11.5}}>{who.length}</b></button>
                      ))}
                    </div>}
                  </div>
                  {chat.mode==="server" && <div className={"cf-chat-actions"+(showActions? " cf-chat-actions-on" : "")} onClick={e=>e.stopPropagation()}>
                    {CHAT_EMOJIS.map(e=><button key={e} title={"React "+e} onClick={()=>{ chat.react(m.id, e); setActionsFor(null); }}>{e}</button>)}
                    <span className="cf-chat-sep"/>
                    <button title="Reply" onClick={()=>{ setReplyTo(m); setActionsFor(null); setTimeout(()=>taRef.current && taRef.current.focus(), 0); }}>↩︎</button>
                    <button title={m.pinnedAt? "Unpin" : "Pin for everyone"} onClick={()=>{ chat.pin(m.id, !m.pinnedAt); setActionsFor(null); }}>{m.pinnedAt? "📍" : "📌"}</button>
                    {!isUpdate && <button title="Make a Workspace project from this" onClick={()=>{ setActionsFor(null); makeProject(m); }}>📁</button>}
                  </div>}
                </div>
              </React.Fragment>

// A calendar day in chat: what's going out that day.

  const days = (occ.byDate && occ.byDate[ymd(d)]) || [];

function ChatToProject({url, projects, onClose, onDone}){
  const {state, dispatch} = useApp();
  const [pid, setPid] = useState(projects[0] ? projects[0].id : "");
  const [busy, setBusy] = useState(false);
  async function add(){
    setBusy(true);
    try{
      const r = await fetch("/api/workspace/item", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({userId:state.currentUserId, projectId:pid, kind:"link", url, text:"From Team Chat"})});
      const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error || "Couldn't add it");
      dispatch({type:"ADD_TOAST", message:"Added to "+((projects.find(p=>p.id===pid)||{}).title||"the project")+"'s ideas"}); onDone();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  return (
    <Modal open onClose={onClose} width={420}>
      <div style={{padding:20}}>
        <h3 style={{margin:"0 0 12px", fontSize:16}}>Add this reel to a project's ideas</h3>
        {projects.length ? <Select value={pid} onChange={setPid} options={projects.map(p=>({value:p.id, label:p.title}))}/> : <div style={{fontSize:13, color:"var(--ink-mute)"}}>No open projects — create one in the Workspace first.</div>}
        <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:16}}><Button onClick={onClose}>Cancel</Button><Button variant="primary" disabled={!pid || busy} onClick={add}>{busy? "Adding…" : "Add"}</Button></div>
      </div>
    </Modal>
  );
}

// Workload and turnaround per person — shown to admins in Settings (it used to be its own Team page).
function TeamWorkload(){
  const {state} = useApp();
  // Phone & desktop alerts per person (from the devices that switched them on).
  const [alerts, setAlerts] = useState(null);
  useEffect(()=>{ fetch("/api/push/status", {cache:"no-store"}).then(r=>r.ok? r.json() : null).then(d=>setAlerts(d? d.users || {} : false)).catch(()=>setAlerts(false)); }, []);
  const ago = iso=>{ const m = Math.round((Date.now()-new Date(iso))/60000); return m<60? m+" min ago" : m<1440? Math.round(m/60)+" h ago" : Math.round(m/1440)+" d ago"; };
  const alertCell = u=>{
    if(alerts===null) return <Skeleton h={14} w={50}/>;
    if(alerts===false) return <span style={{color:"var(--ink-mute)"}}>—</span>;
    const ds = alerts[u.id] || [];
    if(!ds.length) return <span title="No phone or computer has alerts switched on for this person" style={{display:"inline-flex", alignItems:"center", gap:6, color:"var(--ink-mute)", fontWeight:600}}><span style={{width:8, height:8, borderRadius:99, background:"var(--border)"}}/>Off</span>;
    const last = ds.map(d=>d.lastOk).filter(Boolean).sort().pop();
    return <div title={ds.map(d=>(d.device||"Device")+" — on since "+fmtDate(d.since)+(d.lastOk? ", last alert delivered "+ago(d.lastOk) : ", no alert delivered yet")).join("\n")}>
      <span style={{display:"inline-flex", alignItems:"center", gap:6, color:"var(--green)", fontWeight:700}}><span style={{width:8, height:8, borderRadius:99, background:"var(--green)"}}/>On</span>
      <div style={{fontSize:11, color:"var(--ink-mute)"}}>{ds.length} device{ds.length>1?"s":""}{last? " · last "+ago(last) : ""}</div>
    </div>;
  };
  return (
    <div>
      <SectionTitle>Team workload</SectionTitle>
      <Card style={{padding:0, marginBottom:26, overflow:"auto"}}>
        <style>{`@media (max-width:600px){ .cf-team-table th, .cf-team-table td{ padding:9px 6px !important; } .cf-team-table th{ font-size:10.5px !important; } }`}</style>
        <table className="cf-team-table" style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
          <thead><tr style={{textAlign:"left", borderBottom:"1px solid var(--border)"}}>
            {["Person","Posts","Waiting","Speed","Alerts"].map(h=><th key={h} style={{padding:"10px 12px", fontSize:11.5, color:"var(--ink-mute)", fontWeight:700, textTransform:"uppercase"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {activeUsers().map(u=>{
              const created = state.contentItems.filter(i=>i.creator===u.id).length;
              const pending = state.contentItems.filter(i=>(i.creator===u.id || i.approver===u.id || ((i.approver===ANY_APPROVER || i.approver===EITHER_APPROVER) && isReviewer(u))) && ["submitted","changes_requested"].includes(i.status)).length;
              const turnaround = isReviewer(u) ? reviewTurnaround(state.activityLog, u.id) : "—";
              return (
                <tr key={u.id} style={{borderBottom:"1px solid var(--border)"}}>
                  <td style={{padding:"10px 12px"}}><div style={{display:"flex", alignItems:"center", gap:9}}><Avatar user={u} size={30}/><div><div style={{fontWeight:700}}>{u.name}</div><div style={{fontSize:11, color:"var(--ink-mute)"}}>{u.title}</div></div></div></td>
                  <td className="num" style={{padding:"10px 12px", fontWeight:700}}>{created}</td>
                  <td className="num" style={{padding:"10px 12px"}}>{pending}</td>
                  <td className="num" style={{padding:"10px 12px"}}>{turnaround}</td>
