/* ============================== ANALYTICS ============================== */
function AnalyticsPage(){
  const {state} = useApp();
  const todayStr = TODAY.toISOString().slice(0,10);
  const monthAgoStr = (()=>{ const d=new Date(TODAY); d.setDate(d.getDate()-29); return d.toISOString().slice(0,10); })();
  const [filters, setFilters] = useState({brand:"", platform:"", campaign:"", contentType:"", range:"30", customFrom:monthAgoStr, customTo:todayStr});

  const {rangeStart, rangeEnd, rangeDays} = useMemo(()=>{
    let start, end;
    if(filters.range==="custom" && filters.customFrom && filters.customTo){
      start = new Date(filters.customFrom+"T00:00:00"); end = new Date(filters.customTo+"T23:59:59");
      if(start>end){ const t=start; start=end; end=t; }
    } else {
      const n = Number(filters.range)||30;
      end = new Date(TODAY); end.setHours(23,59,59,999);
      start = new Date(TODAY); start.setDate(start.getDate()-n+1); start.setHours(0,0,0,0);
    }
    const days = Math.max(1, Math.min(120, Math.round((end-start)/86400000)+1));
    return {rangeStart:start, rangeEnd:end, rangeDays:days};
  }, [filters.range, filters.customFrom, filters.customTo]);

  let posts = state.publishedPosts.filter(p=>{ const d=new Date(p.publishedAt); return d>=rangeStart && d<=rangeEnd; });
  if(filters.brand) posts = posts.filter(p=>p.brand===filters.brand);
  if(filters.platform) posts = posts.filter(p=>p.platform===filters.platform);
  if(filters.campaign) posts = posts.filter(p=>p.campaign===filters.campaign);

  const totalViews = posts.reduce((s,p)=>s+p.views,0);
  const totalReach = posts.reduce((s,p)=>s+p.reach,0);
  const totalEng = posts.reduce((s,p)=>s+p.likes+p.comments+p.shares+p.saves,0);
  const engRate = totalViews? totalEng/totalViews*100 : 0;
  const shares = posts.reduce((s,p)=>s+p.shares,0);
  const saves = posts.reduce((s,p)=>s+p.saves,0);

  const byPlatform = Object.keys(PLATFORM_META).map(p=>({label:PLATFORM_META[p].label, shortLabel:PLATFORM_META[p].short, value: posts.filter(x=>x.platform===p).reduce((s,x)=>s+x.views,0), color:PLATFORM_META[p].color})).filter(d=>d.value>0);
  const bestPlatform = byPlatform.slice().sort((a,b)=>b.value-a.value)[0];
  const byCampaign = {};
  posts.forEach(p=>{ byCampaign[p.campaign]=(byCampaign[p.campaign]||0)+p.views; });
  const bestCampaignId = Object.entries(byCampaign).sort((a,b)=>b[1]-a[1])[0];
  const bestCampaign = bestCampaignId ? CAMPAIGNS.find(c=>c.id===bestCampaignId[0]) : null;

  const days = rangeDays;
  const seriesViews = Array.from({length:days}).map((_,i)=>{
    let seed=i*7+3; let sum=0; posts.forEach(p=>{ seed=(seed*13+p.id.length)%97; sum += Math.round((p.views/days)*(0.5+ (seed%50)/50)); }); return sum;
  });
  const seriesEng = seriesViews.map(v=>Math.round(v*(engRate/100)));
  const xLabels = Array.from({length:days}).map((_,i)=>{ const d=new Date(rangeStart); d.setDate(d.getDate()+i); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); });

  const top5 = [...posts].sort((a,b)=>b.views-a.views).slice(0,5);
  const funnel = ["draft","submitted","approved","scheduled","published"].map(s=>({label:STATUS_META[s].label, value: state.contentItems.filter(i=>i.status===s).length, color:STATUS_META[s].color}));
  const pubFrequency = (posts.length/(days/7)).toFixed(1);

  return (
    <div>
      <PageHeader title="Analytics" subtitle={"Cross-platform performance, "+rangeStart.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+rangeEnd.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+" — all figures are demonstration data."}/>
      <Card style={{padding:14, marginBottom:18, display:"flex", flexWrap:"wrap", gap:10, alignItems:"center"}}>
        <Select value={filters.range} onChange={v=>setFilters(f=>({...f,range:v}))} options={[{value:"7",label:"Last 7 days"},{value:"30",label:"Last 30 days"},{value:"90",label:"Last 90 days"},{value:"365",label:"Last 12 months"},{value:"custom",label:"Custom range…"}]} style={{width:160}}/>
        {filters.range==="custom" && (
          <>
            <input type="date" value={filters.customFrom} max={filters.customTo} onChange={e=>setFilters(f=>({...f, customFrom:e.target.value}))} style={{padding:"8px 10px", borderRadius:9, border:"1px solid var(--border)", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"}}/>
            <span style={{color:"var(--ink-mute)", fontSize:12.5}}>to</span>
            <input type="date" value={filters.customTo} min={filters.customFrom} max={todayStr} onChange={e=>setFilters(f=>({...f, customTo:e.target.value}))} style={{padding:"8px 10px", borderRadius:9, border:"1px solid var(--border)", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"}}/>
          </>
        )}
        <Select value={filters.platform} onChange={v=>setFilters(f=>({...f,platform:v}))} placeholder="All platforms" options={Object.entries(PLATFORM_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:160}}/>
        <Select value={filters.campaign} onChange={v=>setFilters(f=>({...f,campaign:v}))} placeholder="All campaigns" options={CAMPAIGNS.map(c=>({value:c.id,label:c.name}))} style={{width:170}}/>
        <Select value={filters.contentType} onChange={v=>setFilters(f=>({...f,contentType:v}))} placeholder="All content types" options={PILLARS.map(p=>({value:p,label:p}))} style={{width:170}}/>
      </Card>

      <div style={{display:"flex", gap:14, flexWrap:"wrap", marginBottom:18}}>
        <StatTile label="Total views" value={fmtNum(totalViews)} icon="trend" color="var(--accent)"/>
        <StatTile label="Reach" value={fmtNum(totalReach)} icon="share" color="var(--blue)"/>
        <StatTile label="Engagement rate" value={fmtPct(engRate)} icon="heart" color="var(--emerald)"/>
        <StatTile label="Shares" value={fmtNum(shares)} icon="share" color="var(--violet)"/>
        <StatTile label="Saves" value={fmtNum(saves)} icon="save" color="var(--cyan)"/>
        <StatTile label="Publishing frequency" value={pubFrequency+"/wk"} icon="calendar" color="var(--amber)"/>
      </div>
      <div style={{display:"flex", gap:14, flexWrap:"wrap", marginBottom:18}}>
        <StatTile label="Follower growth" value="+312" sub="Demonstration data" icon="team" color="var(--accent)"/>
        <StatTile label="Best platform" value={bestPlatform? bestPlatform.label : "—"} icon="zap" color="var(--emerald)"/>
        <StatTile label="Best campaign" value={bestCampaign? bestCampaign.name : "—"} icon="trend" color="var(--emerald)"/>
      </div>

      <div className="cf-an-grid" style={{display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:16, marginBottom:16}}>
        <Card style={{padding:18}}>
          <SectionTitle>Performance over time <span style={{fontWeight:500, color:"var(--ink-mute)", fontSize:12}}>(demo data)</span></SectionTitle>
          <LineChart height={230} xLabels={xLabels} series={[{name:"Views", color:"var(--accent)", points:seriesViews},{name:"Engagements", color:"var(--emerald)", points:seriesEng}]}/>
        </Card>
        <Card style={{padding:18}}>
          <SectionTitle>Content status funnel</SectionTitle>
          <FunnelChart stages={funnel}/>
        </Card>
      </div>

      <div className="cf-an-grid" style={{display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:16}}>
        <Card style={{padding:18}}>
          <SectionTitle>Top 5 posts</SectionTitle>
          {top5.length===0 ? <EmptyState icon="trend" title="No data yet"/> :
          <div>
            {top5.map((p,i)=>(
              <div key={p.id} style={{display:"flex", alignItems:"center", gap:12, padding:"10px 0", borderTop:i>0?"1px solid var(--border)":"none"}}>
                <div className="num" style={{width:20, fontWeight:800, color:"var(--ink-mute)"}}>{i+1}</div>
                <div style={{width:38,height:38,borderRadius:9,overflow:"hidden",flexShrink:0}}><Thumb item={{gradient:p.gradient, media:{type:"video"}}} radius={9} iconSize={14}/></div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.contentTitle}</div>
                  <div style={{fontSize:11.5, color:"var(--ink-mute)", display:"flex", alignItems:"center", gap:5}}><PlatformIcon platform={p.platform} size={11}/>{fmtDate(p.publishedAt)}</div>
                </div>
                <div className="num" style={{fontWeight:800, fontSize:13.5}}>{fmtNum(p.views)}</div>
              </div>
            ))}
          </div>}
        </Card>
        <Card style={{padding:18}}>
          <SectionTitle>Cross-platform comparison</SectionTitle>
          {byPlatform.length? <BarChart data={byPlatform} height={190}/> : <EmptyState icon="analytics" title="No data yet"/>}
        </Card>
      </div>
      <style>{`@media (max-width:900px){ .cf-an-grid{ grid-template-columns:1fr !important; } }`}</style>
    </div>
  );
}

function SettingsPage(){

    if(!webhookUrl){ dispatch({type:"ADD_TOAST", message:"Enter a webhook URL first", variant:"warn"}); return; }
    setTestState("testing");

  }

  function saveConfig(patch){
    const next = {adminEmails: state.adminEmails, calendarTemplate: state.calendarTemplate, ...patch, updatedAt:new Date().toISOString()};

    if(caps.db){ caps.db.doc("settings/config").set(next).catch(()=>dispatch({type:"ADD_TOAST", message:"Could not save — you may not have edit access to this artifact's data.", variant:"danger"})); }

        <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>

  const [draft, setDraft] = useState("");
  function addEmail(){
    const e = draft.trim().toLowerCase();
    if(!e || !e.includes("@") || emails.includes(e)) return;
    onChange([...emails, e]); setDraft("");
  }
  function removeEmail(e){ if(emails.length<=1) return; onChange(emails.filter(x=>x!==e)); }
  return (
    <div>
      <div style={{display:"flex", flexDirection:"column", gap:8, marginBottom:14}}>
        {emails.map(e=>(
          <div key={e} style={{display:"flex", alignItems:"center", gap:10, padding:"9px 12px", borderRadius:10, border:"1px solid var(--border)", background:"var(--surface-2)"}}>
            <Icon name="team" size={14} style={{color:"var(--ink-mute)"}}/>
            <span style={{fontSize:12.5, fontWeight:600, flex:1}}>{e}</span>
            {e===viewerEmail && <Badge label="You" color="var(--green)" soft="var(--green-soft)"/>}
            {emails.length>1 && <IconButton icon="x" onClick={()=>removeEmail(e)}/>}
          </div>
        ))}
      </div>
      <div style={{display:"flex", gap:10}}>
        <input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") addEmail();}} placeholder="name@sanjugo.co.uk" style={{flex:1, minWidth:200, padding:"9px 12px", borderRadius:9, border:"1px solid var(--border)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        <Button variant="primary" icon="plus" onClick={addEmail}>Add admin</Button>
      </div>
    </div>
  );
}

/* ============================== APP ROOT ============================== */
function App(){
  const [state, dispatch] = useReducer(reducer, null, initState);
  const [detailItem, setDetailItem] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const caps = useCaps();

  useEffect(()=>{ savePersisted(state); }, [state.contentItems, state.activityLog, state.currentUserId, state.currentBrandId, state.decisionHistory, state.theme]);

  // Pull the shared server copy once on load — this is what makes content visible across every
  // device/teammate instead of being stuck in one browser's localStorage.
  useEffect(()=>{
    let cancelled = false;
    fetchServerState().then(data=>{
      if(!cancelled && data) dispatch({type:"LOAD_STATE", data});
    });
    return ()=>{ cancelled = true; };
  }, []);

  // Push changes back up, debounced so a burst of edits (typing, dragging) doesn't fire a request per keystroke.
  const pushTimer = useRef(null);
  useEffect(()=>{
    if(!state.serverLoaded) return; // don't push the seed data over a real server copy before we've loaded it
    if(pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(()=> pushServerState(state), 700);
    return ()=>clearTimeout(pushTimer.current);
  }, [state.contentItems, state.activityLog, state.decisionHistory, state.calendarTemplate, state.adminEmails, state.theme, state.serverLoaded]);

  useEffect(()=>{
    if(state.toasts.length===0) return;
    const t = setTimeout(()=> dispatch({type:"REMOVE_TOAST", id: state.toasts[0].id}), 3400);
    return ()=>clearTimeout(t);
  }, [state.toasts]);

  // Long-term settings (admin allowlist + the recurring calendar template) live in the artifact's
  // shared `db`, so they persist across sessions/devices rather than one browser's localStorage.
  useEffect(()=>{
    if(!caps.ready || !caps.db) return;
    const ref = caps.db.doc("settings/config");
    let cancelled = false;
    ref.get().then(snap=>{
      if(cancelled) return;
      if(!snap.exists){
        ref.set({adminEmails:[DEFAULT_ADMIN_EMAIL], calendarTemplate:DEFAULT_CALENDAR_TEMPLATE, updatedAt:new Date().toISOString()}).catch(()=>{});
      }
    }).catch(()=>{});
    const unsub = ref.onSnapshot(snap=>{
      if(!snap.exists) return;
      const d = snap.data();
      if(Array.isArray(d.adminEmails)) dispatch({type:"SET_ADMIN_EMAILS", emails:d.adminEmails});
      if(Array.isArray(d.calendarTemplate)) dispatch({type:"SET_TEMPLATE", template:d.calendarTemplate});
    }, ()=>{});
    return ()=>{ cancelled=true; unsub(); };
  }, [caps.ready, caps.db]);

  const user = USERS.find(u=>u.id===state.currentUserId);
  const perms = PERMS[user.role];
  const viewerIsRealAdmin = !!(caps.viewerEmail && state.adminEmails.includes(caps.viewerEmail));
  const ctx = useMemo(()=>({state, dispatch, openDetails: setDetailItem, caps, viewerIsRealAdmin}), [state, caps, viewerIsRealAdmin]);

  useEffect(()=>{
    if(state.route==="queue" && !perms.approve) dispatch({type:"SET_ROUTE", route:"dashboard"});
    if(state.route==="create" && !perms.create) dispatch({type:"SET_ROUTE", route:"dashboard"});
  }, [state.route, user.role]);

  const pages = {
    dashboard: <DashboardPage/>, calendar: <ContentCalendarPage/>, queue: <ApprovalQueuePage/>,
    create: <CreateContentPage/>, published: <PublishedContentPage/>, analytics: <AnalyticsPage/>,
    team: <TeamPage/>, settings: <SettingsPage/>,
  };
  const titles = {dashboard:"Dashboard", calendar:"Calendar", queue:"Approval Queue", create:"Create Content", published:"Published", analytics:"Analytics", team:"Team", settings:"Settings"};

  return (
    <AppCtx.Provider value={ctx}>
      <div style={{display:"flex", height:"100%", minHeight:"100vh"}}>
        <Sidebar open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
        <div style={{flex:1, minWidth:0, display:"flex", flexDirection:"column"}}>
          <MobileTopBar onMenu={()=>setSidebarOpen(true)} title={titles[state.route]}/>
          <main style={{flex:1, padding:"26px 28px 60px", maxWidth:1280, width:"100%", margin:"0 auto"}} className="cf-main">
            {pages[state.route] || <DashboardPage/>}
          </main>
        </div>
      </div>
      <ContentDetailDrawer item={detailItem} onClose={()=>setDetailItem(null)}/>
      <ToastHost toasts={state.toasts} remove={id=>dispatch({type:"REMOVE_TOAST", id})}/>
      <style>{`@media (max-width:600px){ .cf-main{ padding:18px 16px 50px !important; } }`}</style>
    </AppCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("cf-root"));
root.render(<App/>);
</script>

<script>
  // Registers the service worker so ContentFlow can be installed as an app (home-screen icon,
  // full-screen, no browser bar) instead of only living as a browser tab.
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("/sw.js").catch(()=>{ /* not fatal — app still works as a normal page */ });
    });
  }
</script>

</body></html>
