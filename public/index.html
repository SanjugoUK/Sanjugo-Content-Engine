        <Button size="sm" variant="primary" icon="refresh" onClick={generate} disabled={loading}>{loading? (configured? "Claude is thinking…" : "Working…") : result? "Refresh" : "Generate"}</Button>
      </div>
      {error && <div style={{fontSize:12, color:"var(--amber)", fontWeight:600, marginBottom:8}}>{error}</div>}
      {!result && !loading && <div style={{fontSize:13, color:"var(--ink-soft)"}}>{configured? "Ask Claude to read this month's numbers and the approval pipeline and suggest what to do next." : "Get a quick read on what's working, the best time to post, and what's holding things up."}</div>}
      {result && <div>
        {result.headline && <div style={{fontSize:15, fontWeight:600, lineHeight:1.4, marginBottom:12}}>{result.headline}</div>}
        {result.insights && result.insights.length>0 && <div className="cf-insights" style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:10, marginBottom:10}}>
          {result.insights.map((it,i)=>(
            <div key={i} style={{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:9, padding:"10px 12px"}}>
              <div style={{fontSize:13, fontWeight:600, marginBottom:4}}>{it.title}</div>
              <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.5, marginBottom:6}}>{it.detail}</div>
              {it.action && <div style={{fontSize:12.5, lineHeight:1.45, display:"flex", gap:6}}><Icon name="chevronRight" size={13} style={{color:"var(--accent)", marginTop:2}}/><span><strong>Do:</strong> {it.action}</span></div>}
            </div>
          ))}
        </div>}
        {result.text && !result.insights?.length && <div style={{fontSize:13.5, lineHeight:1.6, whiteSpace:"pre-wrap", marginBottom:8}}>{result.text}</div>}
        {result.risk && <div style={{display:"flex", gap:8, alignItems:"flex-start", fontSize:13, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:9, padding:"9px 12px"}}><Icon name="warn" size={15} style={{color:"var(--amber)", marginTop:1}}/><span><strong>Watch out:</strong> {result.risk}</span></div>}
        {!configured && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:10}}>Add a Claude API key (Settings → Smart insights) for deeper, written analysis by Claude.</div>}
      </div>}
    </Card>
  );
}

/* The Dashboard is a morning brief: what's waiting on *you* first (most urgent on top), private sticky notes, then this week's posting days (gaps stand out),
   the last 7 days against the 7 before, the best post, where Workspace projects are, and approved videos
   that haven't been posted yet. */
// Top-right corner of "Waiting on you": the team's key numbers; each opens its list.
function DashGlance({items, go}){
  const week = Date.now() + 7*86400e3;
  const failed = items.filter(i=>i.status==="failed" || Object.values(i.variants||{}).some(v=>v.publishStatus==="failed")).length;
  const n = st=>items.filter(i=>i.status===st).length;
  const soon = items.filter(i=>["approved","scheduled"].includes(i.status) && Object.values(i.variants||{}).some(v=>v.scheduledAt && v.publishStatus!=="published" && new Date(v.scheduledAt).getTime()>=Date.now() && new Date(v.scheduledAt).getTime()<=week)).length;
  const tiles = [
    ["Awaiting approval", n("submitted"), "var(--blue)", "var(--blue-soft)", ()=>go("queue", {queueTab:"review"})],
    ["Changes requested", n("changes_requested"), "var(--amber)", "var(--amber-soft)", ()=>go("queue", {queueTab:"changes"})],
    ["Scheduled this week", soon, "var(--green)", "var(--green-soft)", ()=>go("calendar", {calendarPreset:{view:"week"}})],
    ["Failed", failed, "var(--red)", "var(--red-soft)", ()=>go("calendar", {calendarPreset:{view:"list", status:"failed"}})],
  ];
  return (
    <div className="cf-glance">
      {tiles.map(([label, num, color, bg, on])=>(
        <button key={label} onClick={on} title={"Open: "+label}
          style={{textAlign:"left", padding:"6px 9px", borderRadius:8, border:"1px solid "+(num ? "transparent" : "var(--border)"), background: num ? bg : "var(--surface)", cursor:"pointer", minWidth:0}}>
          <div className="num" style={{fontSize:17, fontWeight:800, lineHeight:1.1, color: num ? color : "var(--ink-mute)"}}>{num}</div>
          <div className="cf-gl-l" style={{fontSize:10.5, fontWeight:600, color: num ? color : "var(--ink-mute)", lineHeight:1.2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{label}</div>
        </button>
      ))}
    </div>
  );
}

function DashboardPage(){
  const {state, openDetails, dispatch} = useApp();
  const me = USERS.find(u=>u.id===state.currentUserId);
  const perms = PERMS[me.role];
  const items = state.contentItems;
  const realData = useRealAnalytics();
  const occ = useOccasions();
  const [ws, setWs] = useState(null);
  useEffect(()=>{ fetch("/api/workspace?me="+encodeURIComponent(me.id), {cache:"no-store"}).then(r=>r.ok? r.json() : {projects:[]}).then(d=>setWs(d.projects||[])).catch(()=>setWs([])); }, [me.id]);
  const projects = ws || [];
  const go = (route, extra)=>dispatch({type:"SET_ROUTE", route, ...(extra||{})});
  const openProject = id=>go("workspace", {workspaceProject:id});

  // ---- Your to-do ----
  const todo = [];
  if(perms.approve){
    const seen = new Set();
    buildQueue(items, "package", {}, me.id).forEach(e=>{
      const it = e.item || e; if(seen.has(it.id)) return; seen.add(it.id);
      const next = Object.values(it.variants||{}).map(v=>v.scheduledAt).filter(Boolean).sort()[0];
      const soon = next && new Date(next).getTime() - Date.now() < 24*3600e3;
      todo.push({key:"q"+it.id, urgent: soon, rank: next? new Date(next).getTime() : 9e15, tag:["Approve post", "var(--blue)", "var(--blue-soft)"], text:it.title, sub: next? "goes out "+fmtDateTime(next) : "no date yet", btn:"Review", on:()=>go("queue", {queueTab:"review"})});
    });
  }
  items.filter(i=>i.status==="changes_requested" && i.creator===me.id).forEach(it=>todo.push({key:"c"+it.id, rank:1, tag:["Changes", "var(--amber)", "var(--amber-soft)"], text:it.title, sub:"sent back to you", btn:"Fix", on:()=>openDetails(it)}));
  items.filter(i=>i.status==="failed" || Object.values(i.variants||{}).some(v=>v.publishStatus==="failed")).forEach(it=>{
    const where = Object.values(it.variants||{}).filter(v=>v.publishStatus==="failed").map(v=>PLATFORM_META[v.platform].label).join(", ");
    todo.push({key:"f"+it.id, urgent:true, rank:0, tag:["Failed", "var(--red)", "var(--red-soft)"], text:it.title, sub: where? where+" didn't post" : "didn't post", btn:"Fix", on:()=>openDetails(it)});
  });
  projects.forEach(p=>{
    if(p.status==="waiting" && p.submitted && p.submitted.by!==me.id) todo.push({key:"w"+p.id, rank:2, tag:["Approve draft", "var(--blue)", "var(--blue-soft)"], text:p.title, sub:"draft "+p.submitted.cut+" · waiting "+wsDays(p.submitted.at), btn:"Watch", on:()=>openProject(p.id)});
    if(p.status==="approved" && p.submitted && p.submitted.by===me.id) todo.push({key:"n"+p.id, rank:2, tag:["Name file", "var(--violet)", "var(--violet-soft)"], text:p.title, sub:"approved — confirm the file name", btn:"Name", on:()=>openProject(p.id)});
    if(p.counts && p.counts.toVote>0) todo.push({key:"v"+p.id, rank:3, tag:["Vote", "var(--amber)", "var(--amber-soft)"], text:p.title, sub:p.counts.toVote+" idea"+(p.counts.toVote>1?"s":"")+" to vote on", btn:"Vote", on:()=>openProject(p.id)});
  });
  // Occasions: big ones (Christmas, Valentine's…) two weeks ahead, the rest three days ahead — until someone says Done or Not for us.
  occ.list.forEach(o=>{
    const n = daysUntil(o.date);
    if(n < 0 || n > (o.big ? 14 : 3) || occ.status[o.id]) return;
    const planned = items.filter(i=>Object.values(i.variants||{}).some(v=>v.scheduledAt && ymd(new Date(v.scheduledAt))===o.date)).length;
    todo.push({key:"o"+o.id, rank:2.5, tag:["Coming up", "var(--violet)", "var(--violet-soft)"], text:o.emoji+" "+o.name+" — "+(n===0? "today" : n===1? "tomorrow" : "in "+n+" days"),
      sub: planned ? planned+" post"+(planned>1?"s":"")+" already planned that day" : "Nothing planned yet — any ideas?", btn:"Plan", on:()=>go("create", {createPrefill:{scheduledAt: localDateTime(new Date(o.date+"T12:00:00"), "12:00")}}),
      extra:[["Done", ()=>occ.setStatus(o.id, "done", me.id)], ["Skip", ()=>occ.setStatus(o.id, "skip", me.id)]]});
  });
  todo.sort((a,b)=> (b.urgent?1:0)-(a.urgent?1:0) || a.rank-b.rank);
  if(perms.only) todo.splice(0, todo.length, ...todo.filter(t=>/^[nv]/.test(t.key))); // video creators: name files and vote

  // ---- This week (Monday to Sunday) ----
  const monday = new Date(); monday.setHours(0,0,0,0); monday.setDate(monday.getDate() - ((monday.getDay()+6)%7));
  const days = Array.from({length:7}, (_,i)=>{ const d = new Date(monday); d.setDate(d.getDate()+i); return d; });
  const entries = items.filter(i=>i.status!=="rejected").flatMap(i=>Object.values(i.variants||{}).filter(v=>v.scheduledAt).map(v=>({item:i, v})));
  const dayKey = d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
  const byDay = {};
  entries.forEach(x=>{ const k = dayKey(new Date(x.v.scheduledAt)); (byDay[k] = byDay[k]||[]).push(x); });
  const todayKey = dayKey(new Date());
  const emptyAhead = days.filter(d=> d >= new Date(new Date().setHours(0,0,0,0)) && !(byDay[dayKey(d)]||[]).length).length;

  // ---- Last 7 days vs the 7 before ----
  const all = useMemo(()=>realAnalyticsPosts(realData, items), [realData, items]);
  const now = Date.now();
  const inRange = (p, from, to)=>{ const t = new Date(p.publishedAt).getTime(); return t >= now-from*86400e3 && t < now-to*86400e3; };
  const cur = all.filter(p=>inRange(p, 7, 0)), prev = all.filter(p=>inRange(p, 14, 7));
  const sum = (ps, f)=>ps.reduce((s,p)=>s+f(p), 0);
  const views = ps=>sum(ps, p=>p.views), eng = ps=>sum(ps, p=>p.likes+p.comments+p.shares+p.saves), keep = ps=>sum(ps, p=>p.saves+p.shares);
  const rate = ps=>views(ps)? eng(ps)/views(ps)*100 : 0;
  const goal = (state.calendarTemplate||[]).length || 7;
  const delta = (a, b, pts)=>{
    if(!b) return null;
    const d = pts ? a-b : (a-b)/b*100;
    if(Math.abs(d) < (pts? .05 : 1)) return <span style={{fontSize:11.5, color:"var(--ink-mute)"}}>same</span>;
    return <span style={{fontSize:11.5, fontWeight:700, color: d>0? "var(--green)":"var(--red)"}}>{d>0?"▲":"▼"} {pts? Math.abs(d).toFixed(1) : Math.round(Math.abs(d))+"%"}</span>;
  };
  const pulse = [
    ["Views", fmtNum(views(cur)), delta(views(cur), views(prev))],
    ["Engagement", fmtPct(rate(cur)), delta(rate(cur), rate(prev), true)],
    ["Posts out", cur.length, <span style={{fontSize:11.5, color: cur.length>=goal? "var(--green)" : "var(--ink-mute)"}}>goal {goal}</span>],
    ["Saves + shares", fmtNum(keep(cur)), delta(keep(cur), keep(prev))],
  ];

  // ---- Best post (this week, else this month) and how it compares with that platform's usual ----
  const month = all.filter(p=>inRange(p, 30, 0));
  const pool = cur.length ? cur : month;
  const best = [...pool].sort((a,b)=>b.views-a.views)[0];
  let times = null;
  if(best){
    const vs = month.filter(p=>p.platform===best.platform && p.id!==best.id).map(p=>p.views).sort((a,b)=>a-b);
    const median = vs.length ? vs[Math.floor(vs.length/2)] : 0;
    if(median) times = best.views/median;
  }
  async function likeThis(){
    try{
      const post = (path, body)=>fetch("/api/workspace"+path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...body, userId: me.id})}).then(async r=>{ const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error || "Couldn't start the project"); return d; });
      const {project} = await post("/project", {title:"Another like: "+best.contentTitle.slice(0, 80), branch:"all", category:"FC", creatorId:"", brief:"Do another video like \""+best.contentTitle+"\" — it got "+fmtNum(best.views)+" views on "+PLATFORM_META[best.platform].label+"."});
      if(best.permalink && /^https:\/\//.test(best.permalink)) await post("/item", {projectId:project.id, kind:"link", url:best.permalink, text:"Our best post — "+fmtNum(best.views)+" views"});
      openProject(project.id);
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
  }

  // ---- Workspace and approved videos not posted yet ----
  const stageCount = s=>projects.filter(p=>p.status===s).length;
  const stuck = projects.filter(p=>p.status==="waiting" && p.submitted).sort((a,b)=>a.submitted.at.localeCompare(b.submitted.at))[0];
  const used = new Set(items.map(i=>i.libraryRef && i.libraryRef.id).filter(Boolean));
  const usedMarks = useUsedMarks();
  const ready = projects.filter(p=>p.filed && !used.has(p.filed.driveId) && !usedMarks[p.filed.driveId]);

  const hour = new Date().getHours();
  const hello = (hour<12? "Good morning" : hour<18? "Good afternoon" : "Good evening")+", "+me.name.split(" ")[0];
  const card = {padding:16, height:"100%"};
  const h = (icon, text, extra)=> <div style={{display:"flex", alignItems:"center", gap:7, fontWeight:600, fontSize:14, marginBottom:12}}><Icon name={icon} size={16} style={{color:"var(--accent)"}}/>{text}{extra}</div>;
  return (
    <div>
      <PageHeader title={hello} subtitle={fmtDate(new Date().toISOString(), {weekday:"short", day:"numeric", month:"short"})+" · "+(ws===null ? "checking…" : todo.length ? todo.length+" thing"+(todo.length>1?"s":"")+" need"+(todo.length>1?"":"s")+" you" : "nothing waiting for you")}
        action={perms.create && <Button variant="primary" icon="plus" onClick={()=>go("create")}>Create</Button>}/>

      <Card style={{padding:16, minWidth:0}}>
        <div className="cf-todo-head">
          <div style={{display:"flex", alignItems:"center", gap:7, fontWeight:600, fontSize:14}}><Icon name="bell" size={16} style={{color:"var(--accent)"}}/>Waiting on you{todo.length>0 && <span style={{fontSize:11, fontWeight:700, padding:"1px 8px", borderRadius:99, background:"var(--accent)", color:"#fff"}}>{todo.length}</span>}</div>
          {!perms.only && <DashGlance items={items} go={go}/>}
        </div>
        {ws===null ? <Skeleton h={60}/> : !todo.length ? <div style={{fontSize:13, color:"var(--ink-mute)", padding:"4px 0"}}>✓ Nothing waiting on you — approvals, votes and fixes show up here.</div> : (
          <div className="cf-dash-todo">
            {todo.map(t=>(
              <div key={t.key} className="cf-todo-row" style={{display:"flex", alignItems:"center", gap:10, padding:"9px 12px", borderRadius:10, border:"1px solid "+(t.urgent? "var(--red)" : "var(--border)"), background: t.urgent? "var(--red-soft)" : "var(--surface)", minWidth:0}}>
                <span style={{fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:99, background:t.tag[2], color:t.tag[1], whiteSpace:"nowrap", flexShrink:0}}>{t.urgent? "Urgent · " : ""}{t.tag[0]}</span>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{t.text}</div>
                  <div style={{fontSize:11.5, color:"var(--ink-mute)"}}>{t.sub}</div>
                </div>
                <span className="cf-todo-btns" style={{display:"flex", alignItems:"center", gap:8, flexShrink:0}}>
                {(t.extra||[]).map(([l, f])=><button key={l} onClick={f} style={{border:"none", background:"none", padding:"4px 2px", fontSize:12, fontWeight:600, color: l==="Done"? "var(--green)" : "var(--ink-mute)", cursor:"pointer", whiteSpace:"nowrap"}}>{l==="Done"? "✓ Done" : l}</button>)}
                <Button size="sm" variant={t.urgent? "primary" : "ghost"} onClick={t.on}>{t.btn}</Button>
                </span>
              </div>
            ))}
          </div>
        )}
      </Card>

      {perms.only ? <div style={{marginTop:14}}><Card style={card}><StickyNotes/></Card></div> : <>
      <div className="cf-dash-top" style={{marginTop:14}}>
        <Card style={card}>
          {h("trend", "Last 7 days", <span style={{fontSize:11.5, fontWeight:500, color:"var(--ink-mute)"}}>vs the week before</span>)}
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
            {pulse.map(([l, v, d])=>(
              <div key={l} style={{background:"var(--surface-2)", borderRadius:10, padding:"10px 12px"}}>
                <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:3}}>{l}</div>
                <div style={{display:"flex", alignItems:"baseline", gap:7}}><span className="num" style={{fontSize:20, fontWeight:600}}>{v}</span>{d}</div>
              </div>
            ))}
          </div>
          {!all.length && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:8}}>No stats yet — Settings → Stats → Get latest.</div>}
        </Card>
        <Card style={card}><StickyNotes/></Card>
      </div>

      <Card style={{padding:16, marginTop:14}}>
        {h("calendar", "This week", emptyAhead>0 && <span style={{fontSize:11.5, fontWeight:600, color:"var(--amber)"}}>· {emptyAhead} empty day{emptyAhead>1?"s":""} ahead</span>)}
        <div className="cf-dash-week">
          {days.map(d=>{
            const list = byDay[dayKey(d)] || [];
            const past = d < new Date(new Date().setHours(0,0,0,0));
            const isToday = dayKey(d)===todayKey;
            const plats = [...new Set(list.map(x=>x.v.platform))];
            const empty = !list.length;
            return (
              <button key={d.toISOString()} onClick={()=> empty && !past ? go("create", {createPrefill:{scheduledAt: localDateTime(d, "12:00")}}) : go("calendar", {calendarPreset:{view:"week"}})}
                style={{minWidth:0, padding:"10px 6px", borderRadius:10, cursor:"pointer", textAlign:"center", display:"flex", flexDirection:"column", alignItems:"center", gap:6,
                  border:"1px solid "+(isToday? "var(--accent)" : empty && !past ? "var(--amber)" : "var(--border)"), background: empty && !past ? "var(--amber-soft)" : "var(--surface-2)", opacity: past && empty ? .55 : 1}}>
                <span style={{fontSize:11.5, fontWeight:700, color: isToday? "var(--accent)" : "var(--ink-soft)", lineHeight:1.2}}>{d.toLocaleDateString("en-GB", {weekday:"short"})}<br className="cf-wk-br"/> {d.getDate()}</span>
                {empty ? <span style={{fontSize:12, fontWeight:600, color: past? "var(--ink-mute)" : "var(--amber)"}}>{past? "—" : <>+<span className="cf-wk-n"> add</span></>}</span>
                  : <span style={{display:"flex", gap:3, flexWrap:"wrap", justifyContent:"center"}}>{plats.map(p=><PlatformIcon key={p} platform={p} size={12}/>)}</span>}
                {!empty && <span style={{fontSize:11, color:"var(--ink-mute)"}}>{list.length}<span className="cf-wk-n"> post{list.length>1?"s":""}</span></span>}
              </button>
            );
          })}
        </div>
      </Card>
      </>}

      <div className="cf-dash-slim">
        {best && !perms.only ? (
          <button onClick={likeThis} title="Start a Workspace project to make another one like it" className="cf-dash-chip">
            <span style={{width:26, height:34, borderRadius:5, overflow:"hidden", flexShrink:0}}><PostThumb post={best}/></span>
            <span style={{minWidth:0, textAlign:"left"}}>
              <span style={{display:"block", fontSize:11, color:"var(--ink-mute)", fontWeight:600}}>{cur.length ? "Best this week" : "Best this month"}</span>
              <span style={{display:"block", fontSize:12.5, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{fmtNum(best.views)} views{times && times>=1.2 ? " · "+times.toFixed(1).replace(/\.0$/,"")+"× usual" : ""} · <span style={{color:"var(--accent)"}}>make another</span></span>
            </span>
          </button>
        ) : null}
        <button onClick={()=>go("workspace")} className="cf-dash-chip">
          <Icon name="workspace" size={18} style={{color:"var(--accent)", flexShrink:0}}/>
          <span style={{minWidth:0, textAlign:"left"}}>
            <span style={{display:"block", fontSize:11, color:"var(--ink-mute)", fontWeight:600}}>Workspace</span>
            <span style={{display:"block", fontSize:12.5, fontWeight:600}}>{ws===null ? "…" : [stageCount("ideas")+" planning", stageCount("review")+" in edit", stageCount("waiting")+" waiting"].join(" · ")}</span>
          </span>
        </button>
        {ready.length>0 && !perms.only && (
          <button onClick={()=> ready.length===1 && perms.create ? wsCreatePost(dispatch, ready[0]) : go("workspace")} className="cf-dash-chip">
            <Icon name="film" size={18} style={{color:"var(--green)", flexShrink:0}}/>
            <span style={{minWidth:0, textAlign:"left"}}>
              <span style={{display:"block", fontSize:11, color:"var(--ink-mute)", fontWeight:600}}>Finished, not posted</span>
              <span style={{display:"block", fontSize:12.5, fontWeight:600}}>{ready.length} video{ready.length>1?"s":""} · <span style={{color:"var(--accent)"}}>post {ready.length>1? "one" : "it"}</span></span>
            </span>
          </button>
        )}
      </div>
      <style>{`
        .cf-dash-top{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:14px;}
        .cf-todo-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}

        .cf-dash-week{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; align-items:stretch;}
        .cf-wk-br{display:none;} @media (max-width:600px){ .cf-wk-br{display:inline;} }
        .cf-dash-todo{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap:8px; max-height:340px; overflow-y:auto;}
        .cf-dash-slim{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
        .cf-dash-chip{flex:1 1 220px; min-width:0; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--ink);}
        .cf-dash-chip:hover{border-color:var(--accent);}
        @media (max-width:900px){ .cf-dash-top{grid-template-columns:1fr;} }
        @media (max-width:600px){
          .cf-dash-todo{grid-template-columns:1fr; max-height:none;}
          .cf-todo-row{display:grid !important; grid-template-columns:minmax(0,1fr) auto; row-gap:4px; column-gap:10px !important; padding:9px 10px !important;}
          .cf-todo-row > span:first-child{grid-column:1 / -1; justify-self:start;}
          .cf-todo-btns{gap:6px !important;}
          .cf-dash-week{gap:4px !important;}
          .cf-dash-week > button{padding:8px 2px !important; gap:4px !important;}
          .cf-dash-week .cf-wk-n{display:none;}
        }

      `}</style>
    </div>
  );
}

// Private sticky notes — only you see yours. Saved a moment after you stop typing.
const NOTE_COLORS = {yellow:["#FEF3C7","#92400E"], pink:["#FCE7F3","#9D174D"], blue:["#DBEAFE","#1E40AF"], green:["#DCFCE7","#166534"]};
function StickyNotes(){
  const {state} = useApp();
  const uid = state.currentUserId;
  const [notes, setNotes] = useState(null);
  const timer = useRef(null);
  useEffect(()=>{ setNotes(null); fetch("/api/notes?userId="+encodeURIComponent(uid), {cache:"no-store"}).then(r=>r.ok? r.json() : {notes:[]}).then(d=>setNotes(d.notes||[])).catch(()=>setNotes([])); }, [uid]);
  function save(next){
    setNotes(next);
    clearTimeout(timer.current);
    timer.current = setTimeout(()=>{ fetch("/api/notes", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({userId:uid, notes:next})}).catch(()=>{}); }, 600);
  }
  const add = ()=>save([{id:"n_"+Math.random().toString(36).slice(2,9), text:"", color:"yellow", updatedAt:new Date().toISOString()}, ...(notes||[])]);
  const edit = (id, patch)=>save(notes.map(n=>n.id===id ? {...n, ...patch, updatedAt:new Date().toISOString()} : n));
  const cycle = c=>{ const k = Object.keys(NOTE_COLORS); return k[(k.indexOf(c)+1)%k.length]; };
  return (
    <div>
      <div style={{display:"flex", alignItems:"center", gap:7, fontWeight:600, fontSize:14, marginBottom:12}}>
        <Icon name="edit" size={16} style={{color:"var(--accent)"}}/>My notes<span style={{fontSize:11.5, fontWeight:500, color:"var(--ink-mute)"}}>only you see these</span>
        <span style={{flex:1}}/><Button size="sm" icon="plus" onClick={add} disabled={!notes}>Note</Button>
      </div>
      {notes===null ? <Skeleton h={80}/> : !notes.length ? (
        <button onClick={add} style={{width:"100%", padding:"18px 12px", borderRadius:10, border:"1px dashed var(--border)", background:"none", color:"var(--ink-mute)", fontSize:12.5, cursor:"pointer"}}>Jot down an idea before telling anyone</button>
      ) : (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(150px, 1fr))", gap:8, maxHeight:230, overflowY:"auto"}}>
          {notes.map(n=>{ const [bg, ink] = NOTE_COLORS[n.color] || NOTE_COLORS.yellow; return (
            <div key={n.id} style={{background:bg, borderRadius:10, padding:"8px 10px 6px", display:"flex", flexDirection:"column", minHeight:110, boxShadow:"0 1px 2px rgba(0,0,0,.08)"}}>
              <textarea value={n.text} onChange={e=>edit(n.id, {text:e.target.value})} placeholder="Write something…" autoFocus={!n.text}
                style={{flex:1, minHeight:70, border:"none", outline:"none", resize:"none", background:"transparent", color:ink, fontSize:13, lineHeight:1.45, fontFamily:"inherit", padding:0}}/>
              <div style={{display:"flex", alignItems:"center", gap:6, fontSize:10.5, color:ink, opacity:.75}}>
                <span style={{flex:1}}>{fmtDate(n.updatedAt, {day:"numeric", month:"short"})}</span>
                <button title="Change colour" onClick={()=>edit(n.id, {color:cycle(n.color)})} style={{width:12, height:12, borderRadius:99, border:"1px solid "+ink, background:"transparent", cursor:"pointer", padding:0}}/>
                <button title="Delete note" onClick={()=>{ if(!n.text || confirm("Delete this note?")) save(notes.filter(x=>x.id!==n.id)); }} style={{border:"none", background:"none", cursor:"pointer", color:ink, padding:0}}><Icon name="trash" size={12}/></button>
              </div>
            </div>
          ); })}
        </div>
      )}
    </div>
  );
}

/* ============================== CONTENT CALENDAR ============================== */
/* ============================== RECURRING CALENDAR TEMPLATE + AUTO-FILL ============================== */
const WEEKDAY_LABELS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CONTENT_TYPE_OPTIONS = ["reel","short","post","story","carousel","update"];
const DEFAULT_CALENDAR_TEMPLATE = [
  {id:"tpl_mon", weekday:1, time:"12:00", platform:"instagram", type:"reel", brand:"sanjugo"},
  {id:"tpl_wed", weekday:3, time:"12:00", platform:"instagram", type:"reel", brand:"sanjugo"},
  {id:"tpl_fri", weekday:5, time:"18:00", platform:"instagram", type:"reel", brand:"sanjugo"},
];
function mediaTypeMatchesTemplate(item, ruleType){
  // Best-effort match between the wizard's free-text pillar/notes and a template row's content "type" label.
  const hay = (item.pillar+" "+item.title+" "+(item.notes||"")).toLowerCase();
  return ruleType==="reel" ? (item.media.aspectRatio==="9:16") : true;
}
/** Finds the next empty recurring-template slot (within 60 days) that matches this item's platform,
 *  and isn't already occupied by another item's variant. Returns {date, time, ruleId} or null — the
 *  content stays "approved but waiting for an empty slot" until one frees up. */
function findTemplateSlot(item, platform, allItems, template){
  const rules = (template||[]).filter(r=> r.platform===platform && (!r.brand || r.brand===item.brand));
  if(rules.length===0) return null;
  const occupied = new Set();
  allItems.forEach(it=>{
    Object.entries(it.variants||{}).forEach(([p,v])=>{
      if(p===platform && v.scheduledAt){
        const d = new Date(v.scheduledAt);
        occupied.add(d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+p);
      }
    });
  });
  for(let dayOff=1; dayOff<=60; dayOff++){
    const d = new Date(TODAY); d.setDate(d.getDate()+dayOff);
    const rule = rules.find(r=>r.weekday===d.getDay());
    if(!rule) continue;
    const key = d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+platform;
    if(occupied.has(key)) continue;
    const [hh,mm] = (rule.time||"09:00").split(":").map(Number);
    d.setHours(hh||9, mm||0, 0, 0);
    return {date:d.toISOString(), ruleId:rule.id};
  }
  return null;
}

function calendarEntries(items, filters){
  let flat = [];
  items.forEach(it=>{
    Object.values(it.variants).forEach(v=>{
      if(!v.scheduledAt) return;
      flat.push({item:it, v});
    });
  });
  if(filters.brand) flat = flat.filter(x=>x.item.brand===filters.brand);
  if(filters.platform) flat = flat.filter(x=>x.v.platform===filters.platform);
  if(filters.campaign) flat = flat.filter(x=>matchCampaign(filters.campaign, x.item.campaign));
  if(filters.creator) flat = flat.filter(x=>x.item.creator===filters.creator);
  if(filters.status) flat = flat.filter(x=>x.item.status===filters.status);
  return flat;
}

// Where one platform's version of a post stands, for the calendar: published, failed, approved, waiting (and for whom),
// changes requested, rejected or draft.
function calendarStatus(item, v){
  if(v.publishStatus==="published") return ["Published", "var(--emerald)", "var(--emerald-soft)"];
  if(v.publishStatus==="failed" || item.status==="failed") return ["Failed", "var(--red)", "var(--red-soft)"];
  if(v.publishStatus==="publishing") return ["Publishing", "var(--cyan)", "var(--cyan-soft)"];
  const st = v.status || item.status;
  if(st==="approved") return ["Approved", "var(--green)", "var(--green-soft)"];
  if(st==="changes_requested") return ["Changes needed", "var(--amber)", "var(--amber-soft)"];
  if(st==="rejected") return ["Rejected", "var(--red)", "var(--red-soft)"];
  if(st==="submitted"){
    const left = requiredApprovers(item).filter(id=>!(v.approvals||{})[id]).map(id=>(USERS.find(u=>u.id===id)||{}).name).filter(Boolean);
    return ["Waiting"+(left.length? " · "+left.join(isEither(item)? " or " : " & ") : ""), "var(--blue)", "var(--blue-soft)"];
  }
  return ["Draft", "#64748B", "var(--surface-2)"];
}

function localDateTime(date, time){
  const pad = n=>String(n).padStart(2,"0");
  return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate())+"T"+(time||"12:00")+":00";
}

/* ============================== OCCASIONS ============================== */
/* Dates worth posting for: official UK bank holidays (from gov.uk via /api/occasions) plus food, culture and retail
   moments a Japanese restaurant group in London plans around. Big ones get a two-week heads-up on the Dashboard;
   the rest three days before. The team marks each one "Done" (planned) or "Not for us", shared by everyone. */
const LUNAR_NEW_YEAR = {2025:"01-29", 2026:"02-17", 2027:"02-06", 2028:"01-26", 2029:"02-13", 2030:"02-03"};
const DIWALI = {2025:"10-20", 2026:"11-08", 2027:"10-29", 2028:"10-17", 2029:"11-05", 2030:"10-26"};
function easterSunday(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451), month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(y, month-1, day);
}
const ymd = d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (d, n)=>{ const x = new Date(d); x.setDate(x.getDate()+n); return x; };
function nthWeekday(y, month, weekday, n){ const d = new Date(y, month, 1); while(d.getDay()!==weekday) d.setDate(d.getDate()+1); d.setDate(d.getDate()+7*(n-1)); return d; }
function occasionsForYear(y){
  const easter = easterSunday(y);
  const list = [
    ["new-year", y+"-01-01", "New Year's Day", "🎆", true],
    ["veganuary", y+"-01-01", "Veganuary starts", "🥬"],
    ["setsubun", y+"-02-03", "Setsubun (Japan)", "👹"],
    ["valentines", y+"-02-14", "Valentine's Day", "❤️", true],
    ["pancake-day", ymd(addDays(easter, -47)), "Pancake Day", "🥞"],
    ["mothers-day", ymd(addDays(easter, -21)), "Mother's Day (UK)", "💐", true],
    ["easter", ymd(easter), "Easter Sunday", "🐣"],
    ["sushi-day", y+"-06-18", "International Sushi Day", "🍣", true],
    ["fathers-day", ymd(nthWeekday(y, 5, 0, 3)), "Father's Day", "👔"],
    ["tanabata", y+"-07-07", "Tanabata (Japan)", "🎋"],
    ["world-food-day", y+"-10-16", "World Food Day", "🍽️"],
    ["halloween", y+"-10-31", "Halloween", "🎃", true],
    ["bonfire-night", y+"-11-05", "Bonfire Night", "🎇"],
    ["black-friday", ymd(addDays(nthWeekday(y, 10, 4, 4), 1)), "Black Friday", "🛍️"],
    ["christmas-eve", y+"-12-24", "Christmas Eve", "🎄"],
    ["christmas", y+"-12-25", "Christmas Day", "🎄", true],
    ["boxing-day", y+"-12-26", "Boxing Day", "🎁"],
    ["nye", y+"-12-31", "New Year's Eve", "🥂", true],
  ];
  if(LUNAR_NEW_YEAR[y]) list.push(["lunar-new-year", y+"-"+LUNAR_NEW_YEAR[y], "Lunar New Year", "🧧", true]);
  if(DIWALI[y]) list.push(["diwali", y+"-"+DIWALI[y], "Diwali", "🪔"]);
  return list.map(([k, date, name, emoji, big])=>({id:k+"-"+y, date, name, emoji, big:!!big, kind:"occasion"}));
}
let OCCASION_CACHE = null;
const occasionListeners = new Set();
function loadOccasions(force){
  if(OCCASION_CACHE && !force) return OCCASION_CACHE;
  OCCASION_CACHE = fetch("/api/occasions", {cache:"no-store"}).then(r=>r.ok? r.json() : {bank:[], status:{}}).catch(()=>({bank:[], status:{}}));
  OCCASION_CACHE.then(()=>occasionListeners.forEach(f=>f()));
  return OCCASION_CACHE;
}
// Every occasion from last year to two years ahead, bank holidays merged in (no duplicates for Christmas etc.).
function useOccasions(){
  const [data, setData] = useState({bank:[], status:{}});
  useEffect(()=>{
    let alive = true;
    const f = ()=>loadOccasions().then(d=>{ if(alive) setData(d); });
    occasionListeners.add(f); f();
    return ()=>{ alive = false; occasionListeners.delete(f); };
  }, []);
  return useMemo(()=>{
    const y = new Date().getFullYear();
    const list = [y-1, y, y+1, y+2].flatMap(occasionsForYear);
    const dates = new Set(list.map(o=>o.date));
    (data.bank||[]).forEach(b=>{
      if(dates.has(b.date)) return;
      const slug = b.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      // e.g. Boxing Day on a Saturday: the day itself is already listed, so the Monday is "(bank holiday)".
      const twin = list.find(o=>o.kind==="occasion" && o.date.slice(0,4)===b.date.slice(0,4) && o.name.replace(/’/g,"'")===b.title.replace(/’/g,"'"));
      list.push({id:slug+(twin? "-bank" : "")+"-"+b.date.slice(0,4), date:b.date, name: twin? b.title+" (bank holiday)" : b.title, emoji: twin? twin.emoji : "🏦", big:false, kind:"bank"});
    });
    (data.bank||[]).forEach(b=>{ const o = list.find(x=>x.date===b.date && x.kind==="occasion"); if(o) o.bankHoliday = true; });
    list.sort((a,b)=>a.date.localeCompare(b.date));
    const byDate = {};
    list.forEach(o=>{ (byDate[o.date] = byDate[o.date]||[]).push(o); });
    return {list, byDate, status:data.status||{}, setStatus: async (id, status, userId)=>{
      setData(d=>({...d, status:{...d.status, ...(status? {[id]:{status, by:userId, at:new Date().toISOString()}} : {})}, ...(status? {} : {status:Object.fromEntries(Object.entries(d.status).filter(([k])=>k!==id))})}));
      await fetch("/api/occasions/status", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, status, userId})}).catch(()=>{});
      loadOccasions(true);
    }};
  }, [data]);
}
const daysUntil = date=>Math.round((new Date(date+"T00:00:00") - new Date(new Date().toDateString()))/86400e3);

/* ============================== CONTENT LIBRARY (Google Drive) ============================== */
/* The "Sanjugo Marketing Contents Final" Drive folder. Every file is named with the SANJUGO filing system —
   date_platform_category_[dish]_stage_version_BARCODE — so the name alone tells us what the asset is. */
const LIB_SOCIAL = {IS:"Instagram Stories", TK:"TikTok", YT:"YouTube", IV:"Instagram Video", AL:"All platforms"};
const LIB_CATEGORY = {FC:"Food and Craft", AV:"Atmosphere and Vibes", CH:"Culture and History", CM:"Community", PO:"Promos and Offers"};
const LIB_STAGE = {RAW:"Raw", EDT:"Edit in progress", FIN:"Finished", USD:"Used"};
const LIB_DISH_GROUPS = [
  ["Starters", {YK:"Chicken Yakitori", ED:"Edamame", FD:"Fried Dumplings", MS:"Miso Soup", PP:"Padron Pepper", SE:"Spicy Edamame", TS:"Tofu Steak"}],
  ["Salad", {HS:"Hiramasa Salad", ST:"Salmon Tataki", SW:"Seaweed Salad", TT:"Tuna Tataki"}],
  ["Wagyu Beef", {WG:"Wagyu Beef Gunkan", WN:"Wagyu Beef Nigiri", WR:"Wagyu Beef Roll", WT:"Wagyu Beef Tataki"}],
  ["Tempura & Snack", {CK:"Chicken Karaage", EF:"Ebi Fry", CT:"Homemade Chicken Tender", IK:"Iidako Karaage", OT:"Oyster Tempura", PT:"Prawn Tempura", SC:"Soft Shell Crab Tempura", TY:"Tako Yaki", YS:"Yasai Kakiage"}],
  ["Sushi", {S3:"3 Sashimi Omakase (9pc)", S5:"5 Sashimi Omakase (15pc)", N6:"6 Nigiri Set", S7:"7 Sashimi Omakase (21pc)"}],
  ["Maki Roll", {CR:"California Roll", GV:"Green Vege Roll", MP:"Miso Prawn Roll", RB:"Rainbow Roll", SA:"Salmon & Avocado Roll", SJ:"SANJUGO Roll", SS:"Soft Shell Crab Roll", SP:"Spicy Tuna Roll", UR:"Unagi Roll"}],
  ["Grilled & Fish", {HK:"Grilled Hamachi Kama", GK:"Grilled Sake Kama", GT:"Grilled Sake Teriyaki, Hijiki Rice", SB:"Grilled Shioyaki Saba", MN:"Misoni Saba", ND:"Nasu Dengaku"}],
  ["Bao", {PB:"Panko Prawn Bao", CB:"Spicy Chicken Bao", TB:"Teriyaki Bao", VB:"Vegetable Bao"}],
  ["Donburi", {KC:"Chicken Katsu Curry Don", PC:"Prawn Katsu Curry Don", CD:"Chilli Chicken Don", TN:"Tonkatsu Don", GB:"Genki Beef Don", UD:"Unagi Don", SD:"Salmon Don", BC:"Bara Chirashi Don"}],
  ["Sides", {GH:"Gohan (Plain Rice)", HR:"Hijiki Rice", MC:"Marinated Chilli Chicken", VC:"Vegetable Croquette"}],
];
const LIB_DISH = Object.assign({}, ...LIB_DISH_GROUPS.map(g=>g[1]));
// How library codes map onto Creator Studio's own fields when a file is turned into a post.
const LIB_PILLAR = {FC:"Product", AV:"Behind the Scenes", CH:"Education", CM:"UGC", PO:"Promotion"};
const LIB_PLATFORMS = {IS:["instagram"], IV:["instagram"], TK:["tiktok"], YT:["youtube"], AL:["instagram","tiktok","facebook"]};
const LIB_NAME_RE = /^(\d{8})_([A-Z]{2})_([A-Z]{2})(?:_([A-Z0-9]{2}))?_([A-Z]{3})_v[\w]+?_([A-Z]\d{3})/;
const RAW_EXT = /\.(arw|cr2|cr3|nef|dng|raf|orf|rw2)$/i;

function parseLibraryName(name){
  const m = LIB_NAME_RE.exec(name||"");
  if(!m) return null;
  return {date:m[1], social:m[2], category:m[3], dish:m[4]||null, stage:m[5], barcode:m[6]};
}
function enrichLibrary(files){
  return files.map(f=>{
    const meta = parseLibraryName(f.name);
    const kind = (f.mime||"").startsWith("video/") ? "video" : (RAW_EXT.test(f.name) || /x-raw/.test(f.mime||"")) ? "raw" : (f.mime||"").startsWith("image/") ? "photo" : "doc";
    const date = meta ? meta.date.slice(0,4)+"-"+meta.date.slice(4,6)+"-"+meta.date.slice(6,8) : (f.modified||"").slice(0,10);
    const label = meta ? (LIB_DISH[meta.dish] || LIB_CATEGORY[meta.category] || f.name) : f.name.replace(/\.[^.]+$/,"");
    const searchText = [f.name, meta&&meta.barcode, meta&&LIB_DISH[meta.dish], meta&&LIB_CATEGORY[meta.category], meta&&LIB_SOCIAL[meta.social], meta&&LIB_STAGE[meta.stage], f.branch, (f.path||[]).join(" "), f.note||"", kind].filter(Boolean).join(" ").toLowerCase();
    return {...f, meta, barcode: meta? meta.barcode : null, kind, date, label, searchText};
  });
}
function searchLibrary(files, query){
  const q = (query||"").trim().toLowerCase();
  if(!q) return [...files].sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  const code = /^[a-z]\d{1,3}$/i.test(q) ? q.toUpperCase() : null;
  const terms = q.split(/\s+/);
  const out = [];
  for(const f of files){
    let score = 0;
    if(code && f.barcode){ if(f.barcode===code) score = 1000; else if(f.barcode.startsWith(code)) score = 500; }
    if(!score && terms.every(t=>f.searchText.includes(t))) score = 10 + (f.label.toLowerCase().includes(q)? 5:0);
    if(score) out.push([score, f]);
  }
  return out.sort((a,b)=> b[0]-a[0] || (b[1].date||"").localeCompare(a[1].date||"")).map(x=>x[1]);
}
function libraryRefOf(f){
  return {id:f.id, barcode:f.barcode, name:f.name, branch:f.branch, path:f.path||[], kind:f.kind, dish:f.meta&&f.meta.dish, category:f.meta&&f.meta.category, social:f.meta&&f.meta.social, stage:f.meta&&f.meta.stage};
}
function suggestedTitle(f){
  const m = f.meta;
  if(!m) return f.label;
  const dish = LIB_DISH[m.dish], cat = LIB_CATEGORY[m.category];
  return (dish || cat || f.label) + (f.kind==="video" ? " — Reel" : "") + (f.barcode ? " ("+f.barcode+")" : "");
}
/* Where a library file has been used: every Creator Studio post that links to it, with each platform's post type
   and publish date — so the team can see "G730 went out as an Instagram Reel on 20 Sept" before reusing it. */
function libraryUsageMap(items){
  const m = {};
  items.forEach(i=>{ const id = i.libraryRef && i.libraryRef.id; if(id) (m[id] = m[id]||[]).push(i); });
  Object.values(m).forEach(list=>list.sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0)));
  return m;
}
function usageSummary(posts){
  if(!posts || !posts.length) return null;
  const variants = posts.flatMap(p=>Object.values(p.variants||{}));
  if(variants.some(v=>v.publishStatus==="published")) return {label:"Published", color:"var(--green)"};
  if(variants.some(v=>v.publishStatus==="scheduled")) return {label:"Scheduled", color:"var(--violet)"};
  return {label:"In a post", color:"var(--blue)"};
}
function variantUseLine(v){
  const type = v.postType || "Post";
  const when = v.publishStatus==="published" ? "published "+fmtDate(v.scheduledAt,{day:"numeric",month:"short",year:"numeric"})
    : v.scheduledAt ? (v.publishStatus==="scheduled"? "scheduled " : "planned ")+fmtDate(v.scheduledAt,{day:"numeric",month:"short"})
    : "not scheduled";
  return PLATFORM_META[v.platform].label+" "+type+" · "+when;
}
function UsageList({posts, onOpen, compact}){
  return posts.map(it=>(
    <button key={it.id} onClick={()=>onOpen(it)} style={{width:"100%", display:"block", padding: compact? "7px 9px" : "9px 11px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface)", cursor:"pointer", marginBottom:6, textAlign:"left", color:"var(--ink)"}}>
      <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:5}}>
        <span style={{flex:1, minWidth:0, fontSize:13, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{it.title}</span>
        <StatusBadge status={it.status}/>

    </button>

}
const driveFileUrl = id => "https://drive.google.com/file/d/"+id+"/view";
const driveFolderUrl = id => "https://drive.google.com/drive/folders/"+id;
const libThumbUrl = (f, connected) => connected ? "/api/library/thumb/"+f.id : "https://drive.google.com/thumbnail?id="+f.id+"&sz=w400";
function fmtBytes(n){ if(!n) return "—"; if(n>=1e9) return (n/1e9).toFixed(1)+" GB"; if(n>=1e6) return (n/1e6).toFixed(n>=1e8?0:1)+" MB"; return Math.max(1,Math.round(n/1e3))+" KB"; }

// One shared load per page view: the live index from the server if Drive is connected, else the bundled snapshot.
let LIBRARY_CACHE = null;
function loadLibrary(force){
  if(LIBRARY_CACHE && !force) return LIBRARY_CACHE;
  LIBRARY_CACHE = (async ()=>{
    let data = null;
    try{ const r = await fetch("/api/library", {cache:"no-store"}); if(r.ok) data = await r.json(); }catch(e){}
    if(!data || !Array.isArray(data.files)){
      const r = await fetch("/library.json");
      if(!r.ok) throw new Error("Couldn't load the content library");
      data = await r.json();
    }
    let status = {connected:false};
    try{ const r = await fetch("/api/library/status", {cache:"no-store"}); status = r.ok ? await r.json() : {connected:false, offline:true}; }catch(e){ status = {connected:false, offline:true}; }
    return {...data, files: enrichLibrary(data.files), status};
  })();
  LIBRARY_CACHE.catch(()=>{ LIBRARY_CACHE = null; });
  return LIBRARY_CACHE;
}
function useLibrary(){
  const [lib, setLib] = useState(null);
  const [error, setError] = useState(null);
  const load = useCallback(force=>{
    setError(null);
    loadLibrary(force).then(setLib).catch(e=>setError(e.message||"Couldn't load the content library"));
  }, []);
  useEffect(()=>{ load(false); }, [load]);
  return {lib, error, reload: ()=>load(true)};
}

// Library files marked "already used" by hand (posted outside Creator Studio). One shared copy per page view.
const usedMarkStore = {marks:null, loading:null, listeners:new Set()};
function loadUsedMarks(force){
  if(usedMarkStore.loading && !force) return usedMarkStore.loading;
  usedMarkStore.loading = fetch("/api/library/used", {cache:"no-store"}).then(r=>r.ok? r.json() : {marks:{}}).catch(()=>({marks:{}})).then(d=>{
    usedMarkStore.marks = d.marks || {}; usedMarkStore.listeners.forEach(f=>f()); return usedMarkStore.marks;
  });
  return usedMarkStore.loading;
}
function useUsedMarks(){
  const [, force] = useState(0);
  useEffect(()=>{ const f = ()=>force(x=>x+1); usedMarkStore.listeners.add(f); if(!usedMarkStore.marks) loadUsedMarks(); return ()=>{ usedMarkStore.listeners.delete(f); }; }, []);
  return usedMarkStore.marks || {};
}
async function saveUsedMark(body, userId){
  const r = await fetch("/api/library/used", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...body, userId})});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "Couldn't save that");
  usedMarkStore.marks = d.marks || {}; usedMarkStore.listeners.forEach(f=>f());
}

/* Thumbnail with graceful fallbacks: our cached copy (needs Drive connected) → Drive's own thumbnail
   (works when this browser is signed in to a Google account with access) → a plain placeholder. */
function LibThumb({file, connected, size=400, radius=0, fit="cover"}){
  const sources = connected ? ["/api/library/thumb/"+file.id+(size>400? "?s=1200" : ""), "https://drive.google.com/thumbnail?id="+file.id+"&sz=w"+size] : ["https://drive.google.com/thumbnail?id="+file.id+"&sz=w"+size];

      {stage<sources.length

            <span style={{fontSize:10.5, fontWeight:700, letterSpacing:".6px"}}>{(file.name.split(".").pop()||"").toUpperCase().slice(0,5)}</span>

    </div>
  );
}

          <Select value={f.stage} onChange={v=>setF(s=>({...s, stage:v}))} placeholder="Any stage" options={Object.entries(LIB_STAGE).map(([k,v])=>({value:k,label:v}))} style={{width:140}}/>
          <Select value={f.social} onChange={v=>setF(s=>({...s, social:v}))} placeholder="Any platform" options={Object.entries(LIB_SOCIAL).map(([k,v])=>({value:k,label:v}))} style={{width:150}}/>
          <Select value={f.usage} onChange={v=>setF(s=>({...s, usage:v}))} placeholder="Used or not" options={[{value:"unused",label:"Not used yet"},{value:"used",label:"Already used"}]} style={{width:170}}/>
          {activeFilters>0 && <Button variant="text" size="sm" onClick={()=>setF({branch:"", kind:"", category:"", dish:"", stage:"", social:"", usage:""})}>Clear filters</Button>}

      <div style={{fontSize:12.5, color:"var(--ink-mute)", margin:"0 2px 10px"}}>
        {exact ? <>Barcode <strong style={{color:"var(--ink)"}}>{exact.barcode}</strong> found{results.length>1? " · plus "+(results.length-1)+" more matches":""}</> : <>{results.length.toLocaleString()} {results.length===1? "file":"files"}</>}
      </div>

      {results.length===0 ? <Card><EmptyState icon="search" title="Nothing matches" subtitle="Check the barcode, or clear some filters."/></Card> :
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:12}}>
        {results.slice(0, limit).map(x=>{
          const used = usedBy[x.id];
          return (
            <button key={x.id} onClick={()=>setOpenFile(x)} className="cf-libcard" style={{textAlign:"left", padding:0, borderRadius:10, border:"1px solid "+(exact && exact.id===x.id? "var(--accent)":"var(--border)"), boxShadow: exact && exact.id===x.id? "0 0 0 2px var(--accent)":"var(--shadow-sm)", background:"var(--surface)", cursor:"pointer", overflow:"hidden", color:"var(--ink)", display:"flex", flexDirection:"column"}}>
              <div style={{position:"relative", width:"100%", aspectRatio:"1/1"}}>
                <LibThumb file={x} connected={connected}/>
                <span style={{position:"absolute", left:6, top:6}}><BarcodeChip code={x.barcode}/></span>
                {used && (()=>{ const u = usageSummary(used); const plats = [...new Set(used.flatMap(p=>p.platforms||[]))]; return <>
                  <span title={used.length+" post"+(used.length>1?"s":"")} style={{position:"absolute", right:6, top:6, fontSize:10, fontWeight:600, padding:"2px 6px", borderRadius:5, background:u.color, color:"#fff"}}>{u.label}{used.length>1? " ×"+used.length : ""}</span>
                  <span style={{position:"absolute", left:6, bottom:6, display:"flex", gap:3}}>{plats.slice(0,4).map(pl=><PlatformIcon key={pl} platform={pl} size={10}/>)}</span>

                {!used && marks[x.id] && <>
                  <span title="Marked as used outside Creator Studio" style={{position:"absolute", right:6, top:6, fontSize:10, fontWeight:600, padding:"2px 6px", borderRadius:5, background:"var(--ink-soft)", color:"#fff"}}>Used</span>
                  <span style={{position:"absolute", left:6, bottom:6, display:"flex", gap:3}}>{(marks[x.id].platforms||[]).filter(pl=>PLATFORM_META[pl]).slice(0,4).map(pl=><PlatformIcon key={pl} platform={pl} size={10}/>)}</span>
                </>}
              </div>
              <div style={{padding:"8px 10px 10px"}}>
                <div style={{fontSize:12.5, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{x.label}</div>
                {used ? <div style={{fontSize:11, color:"var(--ink-soft)", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>Used: {used[0].title}</div>
                  : marks[x.id] && <div style={{fontSize:11, color:"var(--ink-soft)", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>Used {fmtDate(marks[x.id].at, {day:"numeric", month:"short"})}{marks[x.id].note? " · "+marks[x.id].note : ""}</div>}
                <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{x.branch}{x.meta? " · "+LIB_STAGE[x.meta.stage] : ""} · {x.date? fmtDate(x.date+"T12:00:00",{day:"numeric", month:"short", year:"2-digit"}) : fmtBytes(x.size)}</div>
              </div>
            </button>
          );
        })}
      </div>}
      {results.length>limit && <div style={{textAlign:"center", marginTop:16}}><Button variant="ghost" onClick={()=>setLimit(n=>n+60)}>Show more ({(results.length-limit).toLocaleString()} left)</Button></div>}

      <LibraryFileDrawer file={openFile} connected={connected} usedBy={openFile? usedBy[openFile.id] : null} canCreate={perms.create} onCreate={createFrom} onClose={()=>setOpenFile(null)}/>
      <style>{`.cf-libcard{transition:border-color .12s, transform .12s;} .cf-libcard:hover{border-color:var(--ink-mute) !important;} @media (max-width:900px){ .cf-lib-filters{ display:grid !important; grid-template-columns:1fr 1fr; } .cf-lib-filters > *{ width:auto !important; min-width:0; } .cf-lib-filters > label{ grid-column:1 / -1; } }`}</style>
    </div>
  );
}

/* Watch/see a library file in place. Connected: our server streams the video from Drive (seekable) and serves
   a large thumbnail. Not connected: fall back to Google's own Drive player, which only loads when this browser
   is signed in to a Google account with access (and allows Google's cookies — Safari/iPhone usually don't). */
function LibraryViewer({file, connected}){
  const [failed, setFailed] = useState(false);
  useEffect(()=>{ setFailed(false); }, [file.id]);
  const box = {width:"100%", borderRadius:10, overflow:"hidden", background:"#000", marginBottom:8, position:"relative"};
  const note = t => <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:14, lineHeight:1.5}}>{t}</div>;
  if(file.kind==="video"){
    if(connected && !failed) return <>
      <div style={{...box, height:"min(62vh, 560px)"}}>
        <video key={file.id} src={"/api/library/stream/"+file.id} poster={"/api/library/thumb/"+file.id+"?s=1200"} controls playsInline autoPlay muted
          onError={()=>setFailed(true)} style={{width:"100%", height:"100%", objectFit:"contain", background:"#000"}}/>
      </div>
      {note("Streaming from Google Drive · "+fmtBytes(file.size))}
    </>;
    return <>
      <div style={{...box, height:"min(62vh, 560px)"}}>
        <iframe key={file.id} src={"https://drive.google.com/file/d/"+file.id+"/preview"} title={file.name} allow="autoplay; fullscreen" allowFullScreen style={{width:"100%", height:"100%", border:0}}/>
      </div>
      {note(connected
        ? "This browser couldn't play the file directly (often an iPhone HEVC .MOV on Chrome/Windows), so it's playing in Google's Drive player."
        : "Playing in Google's Drive player — shows only if this browser is signed in to Google with access to the library. Connect Google Drive in Settings so videos play for everyone, on every device.")}
    </>;
  }
  // Photos (including RAW): our large cached preview when Drive is connected; otherwise — or if that fails —
  // Google's own Drive viewer, the same way videos fall back, since Google blocks its image links on other sites.
  if(connected && !failed) return <>
    <div style={{...box, height:"min(62vh, 560px)"}}>
      <img key={file.id} src={"/api/library/thumb/"+file.id+"?s=1200"} alt={file.name} onError={()=>setFailed(true)} style={{width:"100%", height:"100%", objectFit:"contain", display:"block"}}/>
    </div>
    {note("Preview from Google Drive — open in Drive for the full-resolution original.")}
  </>;
  return <>
    <div style={{...box, height:"min(62vh, 560px)", background:"#1f1f1f"}}>
      <iframe key={file.id} src={"https://drive.google.com/file/d/"+file.id+"/preview"} title={file.name} allowFullScreen style={{width:"100%", height:"100%", border:0}}/>
    </div>
    {note(connected
      ? "Showing in Google's Drive viewer."
      : "Showing in Google's Drive viewer — works when this browser is signed in to Google with access to the library. Connect Google Drive in Settings so photos show for everyone, on every device.")}
  </>;
}

function LibraryFileDrawer({file, connected, usedBy, canCreate, onCreate, onClose}){
  const {dispatch, openDetails} = useApp();
  const marks = useUsedMarks();
  if(!file) return null;
  const m = file.meta;
  const rows = [
    ["Barcode", file.barcode ? <BarcodeChip code={file.barcode} big/> : "—"],
    ["Dish", m && m.dish ? LIB_DISH[m.dish] || m.dish : "—"],
    ["Category", m ? LIB_CATEGORY[m.category] || m.category : "—"],
    ["Made for", m ? LIB_SOCIAL[m.social] || m.social : "—"],
    ["Stage", m ? LIB_STAGE[m.stage] || m.stage : "—"],
    ["Date", file.date ? fmtDate(file.date+"T12:00:00") : "—"],
    ["Branch", file.branch],
    ["Folder", [file.branch, ...(file.path||[])].join(" / ")],
    ["Type", file.kind==="raw" ? "RAW photo" : file.kind==="video" ? "Video" : file.kind==="photo" ? "Photo" : "Document"],
    ["Size", fmtBytes(file.size)],
  ];

  return (
    <Drawer open={!!file} onClose={onClose} width={480}>

        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:16, fontWeight:600}}>{file.label}</div>
          <div style={{fontSize:11.5, color:"var(--ink-mute)", fontFamily:'ui-monospace, Menlo, monospace', marginTop:3, wordBreak:"break-all"}}>{file.name}</div>
        </div>
        <IconButton icon="x" title="Close" onClick={onClose}/>
      </div>
      <div style={{padding:18}}>
        <LibraryViewer file={file} connected={connected}/>
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:18}}>
          {canCreate && <Button variant="primary" icon="plus" onClick={()=>{ onClose(); onCreate(file); }}>Create post from this</Button>}
          <a href={driveFileUrl(file.id)} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}><Button variant="ghost" icon="external">Open in Google Drive</Button></a>
          <Button variant="ghost" onClick={copy}>Copy {file.barcode? "barcode":"name"}</Button>
        </div>
        {usedBy && usedBy.length>0 && <div style={{padding:"10px 12px", borderRadius:8, background:"var(--amber-soft)", color:"var(--ink)", fontSize:12.5, marginBottom:14, lineHeight:1.5}}>
          <strong>Already used</strong> — {variantUseLine(Object.values(usedBy[0].variants||{})[0]||{platform:"instagram"})} in "{usedBy[0].title}"{usedBy.length>1? " and "+(usedBy.length-1)+" more":""}. See usage history below.
        </div>}
        {file.kind==="raw" && <div style={{fontSize:12, color:"var(--ink-soft)", background:"var(--surface-2)", borderRadius:8, padding:"8px 10px", marginBottom:14, lineHeight:1.5}}>This is a camera RAW file. When you use it in a post, Creator Studio brings in Drive's full-size JPEG version, since browsers and social apps can't show RAW.</div>}
        <div style={{display:"grid", gridTemplateColumns:"auto 1fr", gap:"9px 16px", fontSize:13, marginBottom:18}}>
          {rows.map(([k,v])=><React.Fragment key={k}><span style={{color:"var(--ink-mute)"}}>{k}</span><span style={{fontWeight:500, wordBreak:"break-word"}}>{v}</span></React.Fragment>)}
          {file.note && <><span style={{color:"var(--ink-mute)"}}>Note</span><span>{file.note}</span></>}
        </div>
        <div style={{display:"flex", alignItems:"center", gap:8, fontSize:12, fontWeight:600, color:"var(--ink-mute)", marginBottom:8}}>

        </div>

    </Drawer>
  );
}

// Posted it outside Creator Studio (downloaded, edited, uploaded by hand)? Mark the file as used — shared with the team.
const USED_WHERE = [["instagram","Instagram"],["facebook","Facebook"],["tiktok","TikTok"],["youtube","YouTube"],["gbp","Google"],["other","Other"]];
function UsedMarkBox({file, mark}){
  const {state, dispatch} = useApp();
  const [open, setOpen] = useState(false);
  const [where, setWhere] = useState([]);
  const [at, setAt] = useState(()=>new Date().toISOString().slice(0,10));
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  async function save(body, msg){
    setBusy(true);
    try{ await saveUsedMark({id:file.id, ...body}, state.currentUserId); dispatch({type:"ADD_TOAST", message:msg}); setOpen(false); }
    catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  if(mark) return (
    <div style={{marginTop:12, padding:"10px 12px", borderRadius:8, background:"var(--surface-2)", fontSize:12.5, lineHeight:1.5, display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
      <span style={{flex:1, minWidth:200}}><strong>Used outside Creator Studio</strong> · {fmtDate(mark.at)}{(mark.platforms||[]).length? " · "+mark.platforms.map(p=>(USED_WHERE.find(w=>w[0]===p)||[p,p])[1]).join(", ") : ""}{mark.note? " · "+mark.note : ""}
        <span style={{display:"block", fontSize:11, color:"var(--ink-mute)"}}>Marked by {(USERS.find(u=>u.id===mark.by)||{}).name||"someone"}</span></span>
      <Button size="sm" disabled={busy} onClick={()=>save({used:false}, "Marked as not used")}>Undo</Button>
    </div>
  );
  if(!open) return <div style={{marginTop:12}}><Button size="sm" icon="check" onClick={()=>setOpen(true)}>Mark as already used</Button></div>;
  return (
    <div style={{marginTop:12, padding:12, borderRadius:10, border:"1px solid var(--border)"}}>
      <div style={{fontSize:13, fontWeight:600, marginBottom:8}}>Where was it used?</div>
      <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
        {USED_WHERE.map(([k, l])=>{ const on = where.includes(k); return <button key={k} onClick={()=>setWhere(w=>on? w.filter(x=>x!==k) : [...w, k])} style={{padding:"4px 10px", borderRadius:99, fontSize:12, fontWeight:600, cursor:"pointer", border:"1px solid "+(on? "var(--accent)":"var(--border)"), background: on? "var(--accent-soft)":"var(--surface)", color: on? "var(--accent-dark)":"var(--ink-soft)"}}>{l}</button>; })}
      </div>
      <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:10}}>
        <input type="date" value={at} onChange={e=>setAt(e.target.value)} style={{borderRadius:8, border:"1px solid var(--border)", padding:"6px 8px", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"}}/>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Note (optional), e.g. edited into the Angel reel" style={{flex:1, minWidth:160, borderRadius:8, border:"1px solid var(--border)", padding:"6px 8px", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"}}/>
      </div>
      <div style={{display:"flex", gap:8, justifyContent:"flex-end"}}>
        <Button size="sm" onClick={()=>setOpen(false)}>Cancel</Button>
        <Button size="sm" variant="primary" disabled={busy} onClick={()=>save({used:true, platforms:where, at:at+"T12:00:00", note}, "Marked as used")}>Save</Button>
      </div>
    </div>
  );
}

/* Barcode / search box used inside Create Content to pull a library file into the post. */
function LibraryPicker({onPick}){
  const {lib} = useLibrary();
  const {state} = useApp();
  const usedBy = useMemo(()=>libraryUsageMap(state.contentItems), [state.contentItems]);
  const marks = useUsedMarks();
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const results = lib && q.trim() ? searchLibrary(lib.files, q).slice(0, 8) : [];
  function choose(file){ onPick(file, !!(lib && lib.status.connected)); setQ(""); setOpen(false); }
  return (
    <div style={{position:"relative"}}>
      <div style={{position:"relative"}}>
        <Icon name="search" size={15} style={{position:"absolute", left:11, top:11, color:"var(--ink-mute)"}}/>
        <input value={q} placeholder={lib? "Type a barcode (e.g. G219) or search the library…" : "Loading library…"} disabled={!lib}
          onChange={e=>{ setQ(e.target.value); setOpen(true); setHi(0); }} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false), 150)}
          onKeyDown={e=>{
            if(!results.length) return;
            if(e.key==="ArrowDown"){ e.preventDefault(); setHi(i=>(i+1)%results.length); }
            else if(e.key==="ArrowUp"){ e.preventDefault(); setHi(i=>(i-1+results.length)%results.length); }
            else if(e.key==="Enter"){ e.preventDefault(); choose(results[hi]); }
          }}
          style={{width:"100%", padding:"9px 12px 9px 34px", borderRadius:8, border:"1px solid var(--border)", fontSize:13.5, background:"var(--surface)", color:"var(--ink)"}}/>
      </div>
      {open && q.trim() && lib && (
        <div style={{position:"absolute", left:0, right:0, top:"100%", marginTop:6, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, boxShadow:"var(--shadow-lg)", zIndex:20, overflow:"hidden", maxHeight:380, overflowY:"auto"}}>
          {results.length===0 ? <div style={{padding:14, fontSize:12.5, color:"var(--ink-mute)"}}>No file with that barcode or name.</div> : results.map((x,i)=>(
            <button key={x.id} onMouseDown={e=>{ e.preventDefault(); choose(x); }} onMouseEnter={()=>setHi(i)}
              style={{width:"100%", display:"flex", alignItems:"center", gap:10, padding:"7px 10px", border:"none", borderBottom:"1px solid var(--border)", background: i===hi? "var(--surface-2)":"var(--surface)", cursor:"pointer", textAlign:"left", color:"var(--ink)"}}>
              <span style={{width:40, height:40, borderRadius:6, overflow:"hidden", flexShrink:0}}><LibThumb file={x} connected={lib.status.connected} size={120}/></span>
              <span style={{flex:1, minWidth:0}}>
                <span style={{display:"flex", alignItems:"center", gap:6}}><BarcodeChip code={x.barcode}/><span style={{fontSize:13, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{x.label}</span>
                  {usedBy[x.id] ? <span style={{fontSize:10, fontWeight:600, padding:"1px 6px", borderRadius:5, background:usageSummary(usedBy[x.id]).color, color:"#fff", flexShrink:0}}>{usageSummary(usedBy[x.id]).label}</span>
                    : marks[x.id] && <span title="Marked as used outside Creator Studio" style={{fontSize:10, fontWeight:600, padding:"1px 6px", borderRadius:5, background:"var(--ink-soft)", color:"#fff", flexShrink:0}}>Used</span>}</span>
                <span style={{display:"block", fontSize:11, color:"var(--ink-mute)", marginTop:2}}>{x.kind==="video"? "Video" : x.kind==="raw"? "RAW photo" : "Photo"} · {x.branch}{x.meta? " · "+LIB_STAGE[x.meta.stage] : ""} · {fmtBytes(x.size)}</span>
              </span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function DriveSettings({canManage=true}){
  const {state, dispatch} = useApp();
  const [st, setSt] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = ()=> fetch("/api/library/status", {cache:"no-store"}).then(r=>r.ok? r.json() : {connected:false, offline:true}).catch(()=>({connected:false, offline:true})).then(setSt);
  useEffect(()=>{ load(); }, []);
  async function refresh(){
    setBusy(true);
    try{
      const r = await fetch("/api/library/refresh", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Refresh failed ("+r.status+")");
      LIBRARY_CACHE = null;
      dispatch({type:"ADD_TOAST", message:"Library loaded from Google Drive — "+d.count+" files"});
      load();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  // Back from Google's sign-in page (#/settings?drive=connected|error): report it, then load the live library.
  useEffect(()=>{
    const r = state.driveReturn;
    if(!r) return;
    dispatch({type:"CLEAR_DRIVE_RETURN"});
    if(r.drive==="connected"){ dispatch({type:"ADD_TOAST", message:"Google Drive connected"}); refresh(); }
    else if(r.drive==="error") dispatch({type:"ADD_TOAST", message:r.msg || "Couldn't connect Google Drive", variant:"danger"});
  }, [state.driveReturn]);
  async function disconnect(){
    setBusy(true);
    await fetch("/api/google/disconnect", {method:"POST"}).catch(()=>{});
    LIBRARY_CACHE = null;
    dispatch({type:"ADD_TOAST", message:"Google Drive disconnected"});
    setBusy(false); load();
  }
  if(!st) return <Skeleton h={44}/>;
  const code = {fontFamily:'ui-monospace, Menlo, monospace', fontSize:12, background:"var(--surface-2)", border:"1px solid var(--border)", borderRadius:5, padding:"1px 5px"};
  if(st.connected) return (
    <SettingRow first on label="Google Drive" hint={(st.serviceEmail || "Connected")+(st.lastRefresh ? " · refreshed "+fmtDateTime(st.lastRefresh) : "")}>
      <Button size="sm" icon="refresh" onClick={()=>refresh()} disabled={busy}>{busy? "Refreshing…" : "Refresh"}</Button>
      {st.rootFolderId && <a href={driveFolderUrl(st.rootFolderId)} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}><Button size="sm" icon="external">Open</Button></a>}
      {canManage && st.method==="google_signin" && <a href="/api/google/connect" style={{textDecoration:"none"}}><Button size="sm" variant={st.canArchive? "subtle" : "primary"}>Reconnect</Button></a>}
      {canManage && st.method==="google_signin" && <ConfirmButton disabled={busy} confirmLabel="Disconnect?" onConfirm={disconnect}>Disconnect</ConfirmButton>}
    </SettingRow>
  );
  if(!canManage) return <SettingRow first on={false} label="Google Drive" hint="Not connected — ask an admin"/>;
  if(st.signInConfigured) return (
    <SettingRow first on={false} label="Google Drive" hint="Not connected">
      <a href="/api/google/connect" style={{textDecoration:"none"}}><Button size="sm" variant="primary">Connect</Button></a>
    </SettingRow>
  );
  return (
    <div>
      <SettingRow first on={false} label="Google Drive" hint={"Not set up"+(st.offline? " (server not reachable)":"")}><Button size="sm" icon="refresh" onClick={()=>window.location.reload()}>Check again</Button></SettingRow>
      <MoreInfo>
        <ol style={{margin:0, paddingLeft:20}}>
          <li>Google Cloud (project Creator Studio): enable the Google Drive API.</li>
          <li>Google Auth Platform: consent screen, audience Internal.</li>
          <li>Clients → Web application, redirect URI <span style={code}>{window.location.origin}/api/google/callback</span></li>
          <li>Terminal: <span style={code}>wrangler secret put GOOGLE_CLIENT_ID</span> and <span style={code}>GOOGLE_CLIENT_SECRET</span>, then reload.</li>
        </ol>
      </MoreInfo>
    </div>
  );
}

function StorageSettings(){
  const {dispatch} = useApp();
  const [rep, setRep] = useState(null);
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState(false);
  const load = ()=> fetch("/api/storage", {cache:"no-store"}).then(async r=>{ const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"Storage report unavailable"); return d; }).then(setRep).catch(e=>setRep({error:e.message}));
  useEffect(()=>{ load(); }, []);
  async function clean(){
    setBusy(true);
    try{
      const r = await fetch("/api/storage/cleanup", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Clean-up failed");
      dispatch({type:"ADD_TOAST", message: d.freedBytes ? "Freed "+fmtBytes(d.freedBytes)+" — "+d.archived+" archived to Drive, "+d.deleted+" removed" : "Nothing to clean up right now", variant: d.errors && d.errors.length ? "warn" : "ok"});
      load();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  // Older files in "Creator Studio Archive" get their SANJUGO filing-system name (the nightly run does 15 at a time).
  async function nameArchive(){
    setBusy(true);
    try{
      const r = await fetch("/api/storage/rename-archive", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't rename the archive files");
      if(d.needsReconnect) throw new Error("Reconnect Google Drive first (Content library → Reconnect)");
      LIBRARY_CACHE = null;
      dispatch({type:"ADD_TOAST", message: d.renamed ? "Named "+d.renamed+" archive file"+(d.renamed>1?"s":"")+(d.left? " · "+d.left+" left — tap again" : " · all done") : "Nothing to rename"});
      load();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  if(!rep) return <Skeleton h={90}/>;
  if(rep.error) return <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>{rep.error} — storage details are available on the live site.</div>;
  const pct = Math.min(100, rep.totalBytes/rep.limitBytes*100);
  const cats = [["uploads","Post uploads","var(--accent)"],["library","Library files in posts","var(--blue)"],["workspace","Workspace cuts","var(--green)"],["thumbnails","Thumbnails","var(--violet)"],["system","System","var(--ink-mute)"]];
  const row = (a)=>(
    <div key={a.key} style={{display:"flex", alignItems:"center", gap:10, padding:"7px 0", borderTop:"1px solid var(--border)", fontSize:12.5}}>
      <span style={{flex:1, minWidth:0, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{(a.titles && a.titles[0]) || a.key}</span>
      <span style={{color:"var(--ink-mute)", whiteSpace:"nowrap"}}>{a.action==="archive"? "→ Drive archive" : a.category==="library"? "→ Drive library" : "delete (unused)"}</span>
      {a.dueAt && a.ready===false && <span style={{color:"var(--ink-mute)", whiteSpace:"nowrap"}}>{fmtDate(a.dueAt,{day:"numeric",month:"short"})}</span>}
      <span className="num" style={{width:64, textAlign:"right"}}>{fmtBytes(a.size)}</span>
    </div>
  );
  return (
    <div>
      <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:10, flexWrap:"wrap", marginBottom:8}}>
        <div><span className="num" style={{fontSize:22, fontWeight:600}}>{fmtBytes(rep.totalBytes)}</span> <span style={{color:"var(--ink-mute)", fontSize:13}}>of {fmtBytes(rep.limitBytes)} used · {rep.objectCount} files</span></div>
        <span style={{fontSize:12.5, color: pct>80? "var(--red)" : pct>50? "var(--amber)" : "var(--green)", fontWeight:600}}>{(100-pct).toFixed(1)}% free</span>
      </div>
      <div style={{display:"flex", height:10, borderRadius:6, overflow:"hidden", background:"var(--surface-2)", marginBottom:10}}>
        {cats.map(([k,,c])=> rep.byCategory[k] && rep.byCategory[k].bytes>0 && <div key={k} title={k} style={{width:Math.max(0.6, rep.byCategory[k].bytes/rep.limitBytes*100)+"%", background:c}}/>)}
      </div>
      <div style={{display:"flex", gap:16, flexWrap:"wrap", fontSize:12, color:"var(--ink-soft)", marginBottom:14}}>
        {cats.map(([k,l,c])=><span key={k} style={{display:"flex", alignItems:"center", gap:6}}><span style={{width:8, height:8, borderRadius:2, background:c}}/>{l}: <strong className="num">{fmtBytes(rep.byCategory[k].bytes)}</strong> ({rep.byCategory[k].count})</span>)}
      </div>
      <div style={{marginBottom:12}}><MoreInfo label="How storage is kept free">a post's video/photo stays here while it's being reviewed, scheduled or if it's rejected. <strong>{rep.policy.publishedGraceDays} days after it's published</strong> on every platform, it leaves Creator Studio storage — library files point back to the Drive library, and uploads are moved to the <strong>Creator Studio Archive</strong> folder in Drive. Uploads never used in a post are removed after {rep.policy.orphanGraceHours} hours. Links keep working either way. This runs automatically every night.</MoreInfo></div>
      <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", fontSize:12.5, marginBottom:6}}>
        <span><strong className="num">{rep.readyNow.count}</strong> file{rep.readyNow.count===1?"":"s"} ready to clear now ({fmtBytes(rep.readyNow.bytes)})</span>
        <span style={{color:"var(--ink-mute)"}}>· {rep.upcoming.count} waiting out the {rep.policy.publishedGraceDays}-day window ({fmtBytes(rep.upcoming.bytes)})</span>
        <span style={{color:"var(--ink-mute)"}}>· {rep.archivedToDrive.count} archived to Drive so far</span>
        {rep.archivedToDrive.unnamed>0 && <Button size="sm" icon="file" disabled={busy} onClick={nameArchive}>Name {rep.archivedToDrive.unnamed} archive file{rep.archivedToDrive.unnamed>1?"s":""} properly</Button>}
      </div>
      {!rep.canArchive && rep.readyNow.items.concat(rep.upcoming.items).some(a=>a.action==="archive") && <div style={{fontSize:12, color:"var(--amber)", fontWeight:600, marginBottom:8}}>Reconnect Google Drive (above) so uploads can be moved to the Drive archive.</div>}
      <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center"}}>
        <Button variant="primary" icon="refresh" onClick={clean} disabled={busy || rep.readyNow.count===0}>{busy? "Cleaning up…" : "Clean up now"}</Button>
        {(rep.readyNow.count+rep.upcoming.count)>0 && <Button variant="ghost" size="sm" onClick={()=>setOpen(v=>!v)}>{open? "Hide details" : "Show what will be cleared"}</Button>}
        {rep.lastCleanup && <span style={{fontSize:12, color:"var(--ink-mute)"}}>Last run {fmtDateTime(rep.lastCleanup.at)} ({rep.lastCleanup.trigger}) · freed {fmtBytes(rep.lastCleanup.freedBytes)}{rep.lastCleanup.errors && rep.lastCleanup.errors.length? " · "+rep.lastCleanup.errors.length+" error(s)" : ""}</span>}
      </div>
      {open && <div style={{marginTop:12}}>
        {rep.readyNow.items.length>0 && <><div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", margin:"6px 0"}}>Ready now</div>{rep.readyNow.items.map(row)}</>}
        {rep.upcoming.items.length>0 && <><div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", margin:"12px 0 6px"}}>Coming up (date it clears)</div>{rep.upcoming.items.map(row)}</>}
      </div>}
    </div>
  );
}

/* Two-step button: first tap arms it ("Confirm remove?"), second tap does it; resets after a few seconds.
   Used instead of window.confirm(), which some browsers and iPhone home-screen apps silently block. */
function ConfirmButton({children, confirmLabel, onConfirm, disabled, size="sm", style}){
  const [armed, setArmed] = useState(false);
  useEffect(()=>{ if(!armed) return; const t = setTimeout(()=>setArmed(false), 4000); return ()=>clearTimeout(t); }, [armed]);
  return armed
    ? <Button variant="danger" size={size} disabled={disabled} onClick={()=>{ setArmed(false); onConfirm(); }} style={style}>{confirmLabel || "Confirm"}</Button>
    : <Button variant="ghost" size={size} disabled={disabled} onClick={()=>setArmed(true)} style={{color:"var(--red)", ...style}}>{children}</Button>;
}

/* Settings → Team & access: add a new hire by email, change roles, remove people. With sign-in on, the list is
   the guest list — only these emails get past the one-time-code sign-in. */
/* Admin sets or resets someone's sign-in password. It's shown once so it can be passed on; they can change it in Settings. */
function PasswordButton({member, onSave, disabled}){
  const [open, setOpen] = useState(false);
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(true);
  const suggest = ()=>{ const w = ["sushi","maki","wasabi","nori","ramen","matcha","tempura","sake","yuzu","miso"]; const a = crypto.getRandomValues(new Uint32Array(3)); return w[a[0]%w.length]+"-"+w[a[1]%w.length]+"-"+(1000+a[2]%9000); };
  return <>
    <Button variant="ghost" size="sm" disabled={disabled || !member.email} title={!member.email? "Add their email first" : ""} onClick={()=>{ setPw(suggest()); setOpen(true); }}>{member.hasPassword? "Reset password" : "Set password"}</Button>
    <Modal open={open} onClose={()=>setOpen(false)} width={400}>
      <div style={{padding:20}}>
        <div style={{fontSize:16, fontWeight:600, marginBottom:4}}>{member.hasPassword? "Reset" : "Set"} {member.name}'s password</div>
        <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.5, marginBottom:12}}>They sign in with <strong>{member.email}</strong> and this password, and can change it in Settings. {member.hasPassword? "Resetting signs them out on every device." : ""}</div>
        <div style={{display:"flex", gap:6}}>
          <input value={pw} onChange={e=>setPw(e.target.value)} type={show? "text" : "password"} autoComplete="new-password" style={{flex:1, padding:"9px 11px", borderRadius:8, border:"1px solid var(--border)", fontSize:14, background:"var(--surface)", color:"var(--ink)", fontFamily:"ui-monospace, Menlo, monospace"}}/>
          <Button variant="ghost" size="sm" onClick={()=>setShow(v=>!v)}>{show? "Hide" : "Show"}</Button>
        </div>
        <div style={{fontSize:11.5, color: pw.length<8? "var(--red)" : "var(--ink-mute)", marginTop:6}}>{pw.length<8? "At least 8 characters." : "Copy it before saving — it won't be shown again."}</div>
        <div style={{display:"flex", gap:8, justifyContent:"flex-end", marginTop:16}}>
          <Button variant="ghost" onClick={()=>{ try{ navigator.clipboard.writeText(pw); }catch(e){} }}>Copy</Button>
          <Button variant="primary" disabled={pw.length<8} onClick={async()=>{ const ok = await onSave(pw); if(ok) setOpen(false); }}>Save password</Button>
        </div>
      </div>
    </Modal>
  </>;
}
