// ---------- Push alerts (lock screen / desktop notifications) ----------
// Each device opts in once; the server then sends approval requests, decisions and @mentions to it even when
// Creator Studio is closed. iPhone/iPad only allow this for the Home Screen app (iOS 16.4+).
const pushEnv = ()=>{
  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  return {ios, standalone, supported};
};
function pushDeviceName(){
  const ua = navigator.userAgent || "";
  const os = /iPhone/.test(ua)? "iPhone" : /iPad/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)? "iPad" : /Android/.test(ua)? "Android" : /Mac/.test(ua)? "Mac" : /Windows/.test(ua)? "Windows" : "Computer";
  const br = /Edg\//.test(ua)? "Edge" : /Firefox\//.test(ua)? "Firefox" : /Chrome\//.test(ua)? "Chrome" : /Safari\//.test(ua)? "Safari" : "";
  return os + (br && !pushEnv().standalone ? " · "+br : " · app");
}
async function pushRegistration(){
  if(!("serviceWorker" in navigator)) return null;
  return (await navigator.serviceWorker.getRegistration()) || await navigator.serviceWorker.register("/sw.js");
}
async function currentPushSub(){
  // Some phones never answer this (service worker still starting, push service unreachable) — don't leave
  // Settings on a loading bar forever: after 4 seconds treat it as "not turned on yet".
  const look = (async ()=>{ const reg = await pushRegistration(); return reg && reg.pushManager ? await reg.pushManager.getSubscription() : null; })();
  return Promise.race([look, new Promise(res=>setTimeout(()=>res(null), 4000))]);
}
async function savePushSub(sub, userId){
  const r = await fetch("/api/push/subscribe", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({subscription: sub.toJSON(), userId, device: pushDeviceName()})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Couldn't save this device");
  // Remembered so the service worker can re-register if the browser rotates the subscription.
  try{ const c = await caches.open("contentflow-push"); await c.put("/push-owner", new Response(userId)); }catch(e){}
}
async function enablePush(userId){
  // Must run straight from a tap — browsers only show the permission prompt for a user gesture.
  const perm = await Notification.requestPermission();
  if(perm!=="granted") throw new Error(perm==="denied" ? "Alerts are blocked for this site — allow notifications in your browser or phone settings, then try again." : "Alerts weren't allowed.");
  const reg = await pushRegistration();
  await navigator.serviceWorker.ready;
  const kr = await fetch("/api/push/key", {cache:"no-store"});
  const {publicKey} = await kr.json().catch(()=>({}));
  if(!kr.ok || !publicKey) throw new Error("Alerts need the live site — the server isn't reachable.");
  const raw = atob(publicKey.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((publicKey.length+3)%4));
  const key = Uint8Array.from(raw, c=>c.charCodeAt(0));
  let sub = await reg.pushManager.getSubscription();
  if(sub){
    // A subscription made with a different server key can't receive our pushes — replace it.
    const old = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
    if(old && (old.length!==key.length || old.some((b,i)=>b!==key[i]))){ await sub.unsubscribe(); sub = null; }
  }
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
  await savePushSub(sub, userId);
  return sub;
}

function PushSettings(){
  const {state, dispatch} = useApp();
  const env = useMemo(pushEnv, []);
  const [sub, setSub] = useState(undefined); // undefined = checking
  const [busy, setBusy] = useState(false);
  const [perm, setPerm] = useState(()=> ("Notification" in window) ? Notification.permission : "default");
  useEffect(()=>{ if(env.supported) currentPushSub().then(setSub).catch(()=>setSub(null)); else setSub(null); }, []);
  const toast = (message, variant)=>dispatch({type:"ADD_TOAST", message, variant});

  async function turnOn(){
    setBusy(true);
    try{ const s = await enablePush(state.currentUserId); setSub(s); toast("Alerts are on for this device"); }
    catch(e){ toast(e.message || "Couldn't turn on alerts", "danger"); }
    setPerm(Notification.permission); setBusy(false);
  }
  async function turnOff(){
    setBusy(true);
    try{
      const s = await currentPushSub();
      if(s){ await fetch("/api/push/unsubscribe", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({endpoint:s.endpoint})}).catch(()=>{}); await s.unsubscribe(); }
      setSub(null); toast("Alerts are off for this device");
    }catch(e){ toast(e.message || "Couldn't turn off alerts", "danger"); }
    setBusy(false);
  }
  async function test(){
    setBusy(true);
    try{
      const r = await fetch("/api/push/test", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({endpoint: sub.endpoint})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Test failed");
      toast("Test sent — it should pop up in a few seconds");
    }catch(e){ toast(e.message, "danger"); }
    setBusy(false);
  }

  const name = (USERS.find(u=>u.id===state.currentUserId)||{}).name || "you";
  let hint = "On this device", right;
  if(env.ios && !env.standalone){ hint = "iPhone: Share → Add to Home Screen, then open it from the icon"; right = <Badge label="Home Screen only" color="var(--ink-mute)" soft="var(--surface-2)"/>; }
  else if(!env.supported){ hint = "This browser can't show alerts"; right = <Badge label="Not supported" color="var(--ink-mute)" soft="var(--surface-2)"/>; }
  else if(sub===undefined) right = <Skeleton h={30} w={120}/>;
  else if(sub){ hint = "On this device, for "+name; right = <><Button size="sm" icon="send" onClick={test} disabled={busy}>Test</Button><Button size="sm" variant="subtle" onClick={turnOff} disabled={busy}>Turn off</Button></>; }
  else if(perm==="denied"){ hint = "Blocked — allow notifications in the browser's site settings"; right = <Badge label="Blocked" color="var(--red)" soft="var(--red-soft)"/>; }
  else right = <Button variant="primary" size="sm" icon="bell" onClick={turnOn} disabled={busy}>{busy? "Turning on…" : "Turn on"}</Button>;
  return <>
    <SettingRow label="Phone & desktop alerts" hint={hint} on={!!sub}>{right}</SettingRow>
    <div style={{fontSize:12, color:"var(--ink-mute)", margin:"-4px 0 10px", lineHeight:1.5}}>☀️ Every morning at 10am and 🌙 every night at 9pm you get a reminder of what's waiting on you (or just "good morning" / "have a good night" when nothing is).</div>
  </>;
}

function App(){
  const [state, dispatch] = useReducer(reducer, null, initState);
  const [detailItem, setDetailItem] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const caps = useCaps();
  const chat = useChat(state.currentUserId, dispatch);

  // Who's signed in (when Cloudflare Access sign-in is on) and the live team list.
  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      try{
        const r = await fetch("/api/me", {cache:"no-store"});
        const d = await r.json().catch(()=>({}));
        if(cancelled) return;
        if(r.status===401 || r.status===403) { dispatch({type:"SET_ME", me:null, lock:{code:d.code, message:d.error, signin:d.signin}}); dispatch({type:"BOOT_DONE"}); return; }
        if(r.ok){ SIGNED_IN = !!(d && d.member); if(d && d.member) addSignedInUser(d.member); dispatch({type:"SET_ME", me:d}); }
        const t = await fetch("/api/team", {cache:"no-store"});
        if(t.ok && !cancelled){ const td = await t.json(); if(Array.isArray(td.members) && td.members.length) dispatch({type:"TEAM_LOADED", members:td.members}); }
      }catch(e){ /* offline or no server: keep the built-in team */ }
      if(!cancelled) dispatch({type:"BOOT_DONE"});
    })();
    const fallback = setTimeout(()=>dispatch({type:"BOOT_DONE"}), 3000); // never wait forever on a slow network
    return ()=>{ cancelled = true; clearTimeout(fallback); };
  }, []);

  // Deep links from outside the app (e.g. the Drive content library page, push alerts): #/library?q=G219, #/create?barcode=G219, #/chat, #/queue?tab=changes
  useEffect(()=>{
    const openFromHash = ()=>{
      const m = /^#\/(library|create|settings|chat|queue|workspace)(?:\?(.*))?$/.exec(window.location.hash || "");
      if(!m) return;
      const params = new URLSearchParams(m[2] || "");
      if(m[1]==="chat") dispatch({type:"SET_ROUTE", route:"chat"});
      else if(m[1]==="queue") dispatch({type:"SET_ROUTE", route:"queue", queueTab: params.get("tab") || null});
      else if(m[1]==="settings") dispatch({type:"SET_ROUTE", route:"settings", driveReturn: params.get("drive") ? {drive: params.get("drive"), msg: params.get("msg")} : null});
      else if(m[1]==="library") dispatch({type:"SET_ROUTE", route:"library", libraryQuery: params.get("q") || ""});
      else if(m[1]==="workspace") dispatch({type:"SET_ROUTE", route:"workspace", workspaceProject: params.get("p") || null});
      else dispatch({type:"SET_ROUTE", route:"create", createPrefill: params.get("barcode") ? {libraryBarcode: params.get("barcode")} : null});
      try{ history.replaceState(null, "", window.location.pathname + window.location.search); }catch(e){}
    };
    openFromHash();
    window.addEventListener("hashchange", openFromHash);
    const onSwMessage = e=>{ if(e.data && e.data.type==="open"){ try{ window.location.hash = new URL(e.data.url).hash; }catch(err){} } };
    if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", onSwMessage);
    return ()=>{ window.removeEventListener("hashchange", openFromHash); if("serviceWorker" in navigator) navigator.serviceWorker.removeEventListener("message", onSwMessage); };
  }, []);

  useMakeSync(state, dispatch);

  // If this device has alerts on, make sure they go to whoever is using it now (e.g. after switching name).
  useEffect(()=>{
    if(!state.bootDone || !("Notification" in window) || Notification.permission!=="granted") return;
    currentPushSub().then(sub=>{ if(sub) return savePushSub(sub, state.currentUserId); }).catch(()=>{});
  }, [state.currentUserId, state.bootDone]);

  useEffect(()=>{ savePersisted(state); }, [state.contentItems, state.activityLog, state.currentUserId, state.currentBrandId, state.decisionHistory, state.theme, state.campaigns]);

  // Pull the shared server copy once on load — this is what makes content visible across every
  // device/teammate instead of being stuck in one browser's localStorage.
  useEffect(()=>{
    let cancelled = false;
    fetchServerState().then(data=>{
      if(data){ try{ sessionStorage.removeItem("cf_reset_reload"); }catch(e){} }
      if(!cancelled && data) dispatch({type:"LOAD_STATE", data});
    });
    return ()=>{ cancelled = true; };
  }, []);

  // Keep this device current: pull the shared copy every 45 seconds and whenever the app comes back to the
  // screen, merging post by post (newest change wins) — so nobody keeps working on, and saving, an old copy.
  useEffect(()=>{
    if(!state.serverLoaded) return;
    const pull = ()=>{ if(document.visibilityState==="visible") fetchServerState().then(d=>{ if(d) dispatch({type:"MERGE_SERVER", data:d}); }); };
    const t = setInterval(pull, 45000);
    document.addEventListener("visibilitychange", pull);
    window.addEventListener("focus", pull);
    return ()=>{ clearInterval(t); document.removeEventListener("visibilitychange", pull); window.removeEventListener("focus", pull); };
  }, [state.serverLoaded]);

  // Push changes back up, debounced so a burst of edits (typing, dragging) doesn't fire a request per keystroke.
  const pushTimer = useRef(null);
  useEffect(()=>{
    if(!state.serverLoaded) return; // don't push the seed data over a real server copy before we've loaded it
    if(pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(()=> pushServerState(state), 700);
    return ()=>clearTimeout(pushTimer.current);
  }, [state.contentItems, state.activityLog, state.decisionHistory, state.calendarTemplate, state.adminEmails, state.theme, state.campaigns, state.chatUpdates, state.serverLoaded]);

  useEffect(()=>{
    if(state.toasts.length===0) return;
    const t = setTimeout(()=> dispatch({type:"REMOVE_TOAST", id: state.toasts[0].id}), 3400);
    return ()=>clearTimeout(t);
  }, [state.toasts]);

  // Long-term settings (admin allowlist + the recurring calendar template) live in the artifact's
  // shared `db`, so they persist across sessions/devices rather than one browser's localStorage.
  useEffect(()=>{
    if(!caps.ready || !caps.db) return;
    const ref = caps.db.doc("settings/config");
    let cancelled = false;
    ref.get().then(snap=>{
      if(cancelled) return;
      if(!snap.exists){
        ref.set({adminEmails:[DEFAULT_ADMIN_EMAIL], calendarTemplate:DEFAULT_CALENDAR_TEMPLATE, updatedAt:new Date().toISOString()}).catch(()=>{});
      }
    }).catch(()=>{});
    const unsub = ref.onSnapshot(snap=>{
      if(!snap.exists) return;
      const d = snap.data();
      if(Array.isArray(d.adminEmails)) dispatch({type:"SET_ADMIN_EMAILS", emails:d.adminEmails});
      if(Array.isArray(d.calendarTemplate)) dispatch({type:"SET_TEMPLATE", template:d.calendarTemplate});
    }, ()=>{});
    return ()=>{ cancelled=true; unsub(); };
  }, [caps.ready, caps.db]);

  // Never crash on someone missing from the list: fall back to the signed-in member, then to the most limited role.
  const user = USERS.find(u=>u.id===state.currentUserId) || (state.me && state.me.member && state.me.member.id===state.currentUserId ? {...state.me.member, brands:["sanjugo"], avatarColor:"#7A5AF8", title:(ROLE_META[state.me.member.role]||{}).label} : null) || {id:state.currentUserId, name:"", role:"video", brands:["sanjugo"], avatarColor:"#7A5AF8"};
  const perms = PERMS[user.role] || PERMS.video;
  const viewerIsRealAdmin = !!(caps.viewerEmail && state.adminEmails.includes(caps.viewerEmail));
  const ctx = useMemo(()=>({state, dispatch, openDetails: setDetailItem, caps, viewerIsRealAdmin, chat}), [state, caps, viewerIsRealAdmin, chat]);

  useEffect(()=>{
    if((state.route==="create" && !perms.create) || !canGo(perms, state.route==="team" ? "settings" : state.route)) dispatch({type:"SET_ROUTE", route:"dashboard"});
  }, [state.route, user.role]);

  const pages = {
    dashboard: <DashboardPage/>, calendar: <ContentCalendarPage/>, queue: <ApprovalQueuePage key={state.queueTab||""}/>,
    create: <CreateContentPage key={JSON.stringify(state.createPrefill||{})}/>, published: <PublishedContentPage/>, analytics: <AnalyticsPage/>,
    team: <SettingsPage/>, settings: <SettingsPage/>, chat: <ChatPage/>, library: <LibraryPage key={state.libraryQuery||""}/>,
    workspace: <WorkspacePage key={state.workspaceProject||""}/>,
  };
  const titles = {dashboard:"Sanjugo Dashboard", calendar:"Calendar", queue:"Approval Queue", create:"Create Content", published:"Published", analytics:"Analytics", team:"Team", settings:"Settings", chat:"Team Chat", library:"Content Library", workspace:"Workspace"};

  if(state.lock) return <LockScreen lock={state.lock}/>;
  const accessOn = !!(state.me && state.me.accessEnabled);
  const chosen = state.signedInAs && USERS.find(u=>u.id===state.signedInAs && u.active!==false);
  if(!state.bootDone && !chosen) return <div style={{minHeight:"100vh", background:"var(--bg)"}}/>;
  if(!accessOn && !chosen) return <WelcomeScreen dispatch={dispatch} teamRev={state.teamRev}/>;

  return (
    <AppCtx.Provider value={ctx}>
      <div style={{display:"flex", height:"100%", minHeight:"100vh"}}>
        <Sidebar open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
        <div style={{flex:1, minWidth:0, display:"flex", flexDirection:"column"}}>
          <MobileTopBar onMenu={()=>setSidebarOpen(true)} title={titles[state.route]}/>
          <main style={{flex:1, padding:"26px 28px 60px", maxWidth:1280, width:"100%", margin:"0 auto"}} className="cf-main">
            {pages[state.route] || <DashboardPage/>}
          </main>
        </div>
      </div>
      <div className="cf-statusbar-bg" style={{position:"fixed", top:0, left:0, right:0, height:"env(safe-area-inset-top, 0px)", background:"var(--surface)", zIndex:30, pointerEvents:"none"}}/>
      {/* Always the live copy of the post, so changes made while it's open (dates, Make results, approvals) show straight away. */}
      <ContentDetailDrawer item={detailItem && (state.contentItems.find(i=>i.id===detailItem.id) || null)} onClose={()=>setDetailItem(null)}/>
      <ToastHost toasts={state.toasts} remove={id=>dispatch({type:"REMOVE_TOAST", id})}/>
      <style>{`@media (max-width:600px){ .cf-main{ padding:18px 16px 50px !important; } .cf-search{ width:100% !important; } }`}</style>
    </AppCtx.Provider>
  );
}

      <div style={{maxWidth:400, width:"100%", textAlign:"center"}}>

        <div style={{fontSize:13, fontWeight:600, letterSpacing:".8px", textTransform:"uppercase", color:"var(--accent)", marginBottom:6}}>Sanjugo</div>
        <h1 style={{fontSize:28, margin:"0 0 8px", fontWeight:600}}>Welcome to Creator Studio</h1>
        <div style={{fontSize:14.5, color:"var(--ink-soft)", lineHeight:1.55, marginBottom:28}}>Plan, approve and publish Sanjugo's content — all in one place.</div>
        <div style={{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:14, padding:20, textAlign:"left", boxShadow:"var(--shadow-sm)"}}>

              <option value="">Select your name</option>

            </select>

      </div>
    </div>
  );
}

/* Email + password sign-in (built-in sign-in). On success the server sets a 60-day cookie and the app reloads. */
function SignInScreen({notice}){
  const [email, setEmail] = useState(()=>{ try{ return localStorage.getItem("cs_last_email") || ""; }catch(e){ return ""; } });
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  async function submit(e){
    e.preventDefault(); if(busy) return;
    setBusy(true); setError("");
    try{
      const r = await fetch("/api/auth/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email, password})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't sign in ("+r.status+")");
      try{ localStorage.setItem("cs_last_email", email.trim().toLowerCase()); localStorage.removeItem(LS_KEY); }catch(err){}
      window.location.reload();
    }catch(err){ setError(err.message); setBusy(false); }
  }
  const input = {width:"100%", padding:"12px 14px", borderRadius:10, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--ink)", fontSize:15, boxSizing:"border-box"};
  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:"calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px))", background:"var(--bg)"}}>
      <form onSubmit={submit} style={{maxWidth:400, width:"100%", textAlign:"center"}}>
        <img src={LOGO_SANJUGO} alt="Sanjugo" style={{width:84, height:84, borderRadius:99, marginBottom:18, boxShadow:"0 0 0 6px var(--surface), var(--shadow-md)"}}/>
        <div style={{fontSize:13, fontWeight:600, letterSpacing:".8px", textTransform:"uppercase", color:"var(--accent)", marginBottom:6}}>Sanjugo</div>
        <h1 style={{fontSize:28, margin:"0 0 8px", fontWeight:600}}>Sign in to Creator Studio</h1>
        <div style={{fontSize:14.5, color:"var(--ink-soft)", lineHeight:1.55, marginBottom:24}}>For the Sanjugo content team only.</div>
        {notice && notice!=="Please sign in." && <div style={{fontSize:13, color:"var(--ink)", background:"var(--amber-soft)", borderRadius:10, padding:"10px 12px", marginBottom:14, lineHeight:1.5, textAlign:"left"}}>{notice}</div>}
        <div style={{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:14, padding:20, textAlign:"left", boxShadow:"var(--shadow-sm)"}}>
          <label htmlFor="cs-email" style={{display:"block", fontSize:13, fontWeight:600, marginBottom:6}}>Email</label>
          <input id="cs-email" type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} required style={{...input, marginBottom:14}}/>
          <label htmlFor="cs-pw" style={{display:"block", fontSize:13, fontWeight:600, marginBottom:6}}>Password</label>
          <input id="cs-pw" type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} required style={{...input, marginBottom:14}}/>
          {error && <div role="alert" style={{fontSize:13, color:"var(--red)", background:"var(--red-soft)", borderRadius:8, padding:"8px 10px", marginBottom:12, lineHeight:1.45}}>{error}</div>}
          <Button type="submit" variant="primary" size="lg" disabled={busy || !email || !password} style={{width:"100%", justifyContent:"center"}}>{busy? "Signing in…" : "Sign in"}</Button>
        </div>
        <div style={{fontSize:12, color:"var(--ink-mute)", marginTop:16, lineHeight:1.5}}>Forgot your password? Ask an admin (Cyrus or Yan Yan) to reset it in Settings → Team &amp; access.</div>
      </form>
    </div>
  );
}
async function signOutNow(){
  try{ await fetch("/api/auth/logout", {method:"POST"}); }catch(e){}
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  window.location.reload();
}

function LockScreen({lock}){
  if(lock.signin==="password" && lock.code==="signed_out") return <SignInScreen notice={lock.message}/>;
  const signedOut = lock.code==="signed_out";
  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:24, background:"var(--bg)"}}>
      <div style={{maxWidth:420, width:"100%", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:12, padding:28, textAlign:"center", boxShadow:"var(--shadow-md)"}}>
        <img src={LOGO_SANJUGO} alt="Sanjugo" style={{width:48, height:48, borderRadius:99, marginBottom:14}}/>
        <div style={{fontSize:18, fontWeight:600, marginBottom:8}}>{signedOut ? "Please sign in again" : "You don't have access yet"}</div>
        <div style={{fontSize:13.5, color:"var(--ink-soft)", lineHeight:1.6, marginBottom:20}}>{lock.message || "Ask a Creator Studio admin to add your email in Settings → Team & access."}</div>
        <div style={{display:"flex", gap:8, justifyContent:"center", flexWrap:"wrap"}}>
          <Button variant="primary" onClick={()=>window.location.reload()}>Try again</Button>
          <a href="/cdn-cgi/access/logout" style={{textDecoration:"none"}}><Button variant="ghost">Use a different email</Button></a>
        </div>
      </div>
    </div>
  );
}

root.render(<App/>);

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("/sw.js").catch(()=>{ /* not fatal — app still works as a normal page */ });
    });
  }
