const CAPS = {db:null, user:null, sample:null, viewerEmail:null, viewerName:"", canEdit:false, ready:false};

(async function initCaps(){
  try{
    if(typeof claude !== "undefined" && claude.use){
      const [db, user, sample] = await Promise.all([
        claude.use("db").catch(()=>null),
        claude.use("user").catch(()=>null),
        claude.use("sample").catch(()=>null),
      ]);
      CAPS.db = db; CAPS.user = user; CAPS.sample = sample;
      if(user){
        try{ const me = await user.me(); CAPS.viewerEmail = me.email; CAPS.viewerName = me.name; CAPS.canEdit = me.canEdit; }catch(e){}
      }
    }
  }catch(e){ /* capabilities unavailable — app falls back to local demo state */ }
  CAPS.ready = true;
  capsListeners.forEach(fn=>{ try{ fn(); }catch(e){} });

function grad(seed){
  const pairs = [["#6D6FF2","#4548C9"],["#F472B6","#DB2777"],["#38BDF8","#0891B2"],["#FBBF24","#D97706"],["#34D399","#059669"],["#A78BFA","#7C3AED"],["#FB923C","#EA580C"]];
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))%pairs.length;
  return pairs[h];
}

/* Turn an uploaded image into a resized JPEG data URL, so real content previews render
   instead of a placeholder gradient, without bloating localStorage with a full-res photo. */
function imageFileToPreview(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxDim/Math.max(img.naturalWidth||maxDim, img.naturalHeight||maxDim));
      const w = Math.max(1, Math.round((img.naturalWidth||maxDim)*scale));
      const h = Math.max(1, Math.round((img.naturalHeight||maxDim)*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ resolve(canvas.toDataURL("image/jpeg", quality)); }catch(e){ reject(e); }
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
/* Grab a real frame from an uploaded video as a poster-image preview (we don't store the
   whole video — just a still from partway through it, so the card shows the actual clip). */
function videoFileToPoster(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.muted = true; video.playsInline = true; video.preload = "metadata"; video.src = url;
    const cleanup = ()=>URL.revokeObjectURL(url);
    video.addEventListener("loadeddata", ()=>{
      try{ video.currentTime = Math.min(Math.max((video.duration||2)*0.3, 0.1), 3); }
      catch(e){ /* some codecs reject seeks before enough data; grabFrame below still runs on 'seeked' or falls back */ }
    });
    video.addEventListener("seeked", grabFrame);
    video.addEventListener("loadedmetadata", ()=>{ if(video.readyState>=2) grabFrame(); });
    let grabbed = false;
    function grabFrame(){
      if(grabbed) return; grabbed = true;
      const scale = Math.min(1, maxDim/Math.max(video.videoWidth||maxDim, video.videoHeight||maxDim));
      const w = Math.max(1, Math.round((video.videoWidth||maxDim)*scale));
      const h = Math.max(1, Math.round((video.videoHeight||maxDim)*scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      try{
        canvas.getContext("2d").drawImage(video, 0, 0, w, h);
        cleanup();
        resolve(canvas.toDataURL("image/jpeg", quality));
      }catch(e){ cleanup(); reject(e); }
    }
    video.addEventListener("error", (e)=>{ cleanup(); reject(e); });
    setTimeout(()=>{ if(!grabbed) reject(new Error("timeout")); }, 6000);
  });
}

function buildContentItems(){
  return RAW_ITEMS.filter(r=>r.brand==="sanjugo").map(r=>{
    const createdAt = dayOffset(r.createdOffset);
    const versions = [];
    for(let v=1; v<=r.currentVersion; v++){
      versions.push({
        version:v, editor: v===r.currentVersion? USERS.find(u=>u.id===r.creator).name : USERS.find(u=>u.id===r.creator).name,
        date: dayOffset(r.createdOffset + (v-1)*1.5),
        changes: v===1? "Initial draft created." : (r.lastFeedback && v===r.currentVersion ? "Revised per manager feedback: "+r.lastFeedback.tags.join(", ")+"." : "Copy and asset refresh."),
        decision: v===r.currentVersion && r.lastFeedback ? "Changes Requested" : (v<r.currentVersion? "Superseded":"—"),
        feedback: v===r.currentVersion && r.lastFeedback ? r.lastFeedback.text : null,
      });
    }
    return {...r, createdAt, versions, gradient: grad(r.id)};
  });
}

function buildActivity(items){
  const log = [];
  items.forEach(it=>{
    log.push({id:uid("act"), at:it.createdAt, type:"created", contentId:it.id, contentTitle:it.title, user:it.creator, detail:"Content created"});
    if(["submitted","changes_requested","rejected","approved","scheduled","publishing","published","failed"].includes(it.status) || it.currentVersion>1){
      log.push({id:uid("act"), at: dayOffset(new Date(it.createdAt).getDate()-TODAY.getDate()+0.5), type:"submitted", contentId:it.id, contentTitle:it.title, user:it.creator, detail:"Submitted for approval", version:1});
    }
    if(it.lastFeedback){
      log.push({id:uid("act"), at:it.lastFeedback.at, type: it.status==="rejected"?"rejected":"changes_requested", contentId:it.id, contentTitle:it.title, user:it.lastFeedback.by, detail: (it.status==="rejected"?"Rejected — ":"Requested changes — ")+it.lastFeedback.tags.join(", "), comment:it.lastFeedback.text, version:it.currentVersion-1});
    }
    if(["approved","scheduled","publishing","published"].includes(it.status)){
      log.push({id:uid("act"), at: dayOffset(new Date(it.due).getDate()-TODAY.getDate()-1), type:"approved", contentId:it.id, contentTitle:it.title, user:it.approver, detail:"Approved for publishing", version:it.currentVersion});
    }
    if(["scheduled","publishing","published"].includes(it.status)){
      log.push({id:uid("act"), at:it.due, type:"scheduled", contentId:it.id, contentTitle:it.title, user:it.approver, detail:"Scheduled for publishing"});
    }
    if(it.status==="published"){
      log.push({id:uid("act"), at:it.due, type:"published", contentId:it.id, contentTitle:it.title, user:"system", detail:"Published successfully"});
    }
    if(it.status==="failed"){
      log.push({id:uid("act"), at:it.due, type:"failed", contentId:it.id, contentTitle:it.title, user:"system", detail:"Publication failed"});
    }
  });
  return log.sort((a,b)=> new Date(b.at)-new Date(a.at));
}

function buildPublishedPosts(items){
  const posts = [];
  items.filter(it=>it.status==="published").forEach(it=>{
    Object.values(it.variants).forEach(v=>{
      if(v.publishStatus!=="published") return;
      let seed=0; for(const c of it.id+v.platform) seed=(seed*31+c.charCodeAt(0))%97;
      const views = 2200 + seed*143 + (v.platform==="tiktok"?4000:0);
      const likes = Math.round(views*(0.04+ (seed%10)/300));
      const comments = Math.round(views*(0.004+(seed%5)/1500));
      const shares = Math.round(views*(0.006+(seed%7)/1400));
      const saves = Math.round(views*(0.01+(seed%9)/1200));
      const reach = Math.round(views*1.35);
      const engagementRate = (likes+comments+shares+saves)/views*100;
      const snapshots = [2,6,24,72,168].map((hrs,i)=>{
        const decay = [0.18,0.4,0.68,0.9,1][i];
        return {
          label: hrs<24? hrs+"h" : (hrs/24)+"d",
          hours: hrs,
          views: Math.round(views*decay), likes: Math.round(likes*decay), comments: Math.round(comments*decay),
          shares: Math.round(shares*decay), saves: Math.round(saves*decay),
        };
      });
      posts.push({
        id: uid("post"), contentId: it.id, contentTitle: it.title, brand: it.brand, campaign:it.campaign,
        platform: v.platform, account: BRANDS.find(b=>b.id===it.brand).accounts[v.platform],
        publishedAt: v.scheduledAt, postUrl: v.postUrl, gradient: it.gradient,
        views, reach, likes, comments, shares, saves, engagementRate,
        analyticsUpdatedAt: dayOffset(0,7,45), snapshots,
      });
    });
  });
  return posts.sort((a,b)=> new Date(b.publishedAt)-new Date(a.publishedAt));
}

function LineChart({series, height=220, xLabels}){
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const W = 640, H = height, padL=36, padR=12, padT=14, padB=26;
  const allVals = series.flatMap(s=>s.points);
  const max = Math.max(...allVals)*1.12 || 1;
  const min = Math.min(0, Math.min(...allVals));
  const n = series[0].points.length;
  const x = i => padL + (i/(n-1))*(W-padL-padR);
  const y = v => padT + (1-( (v-min)/(max-min || 1) ))*(H-padT-padB);
  const ticks = 4;
  function handleMove(e){
    const rect = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX-rect.left)/rect.width)*W;
    let idx = Math.round(((px-padL)/(W-padL-padR))*(n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    setHoverIdx(idx);
  }
  return (
    <div style={{position:"relative"}}>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height:"auto", display:"block", overflow:"visible"}}
        onMouseMove={handleMove} onMouseLeave={()=>setHoverIdx(null)}>
        {Array.from({length:ticks+1}).map((_,i)=>{
          const v = min + (max-min)*(i/ticks);
          return <g key={i}>
            <line x1={padL} x2={W-padR} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1"/>
            <text x={padL-8} y={y(v)+3} fontSize="10.5" textAnchor="end" fill={CHART_INK}>{fmtNum(Math.round(v))}</text>
          </g>;
        })}
        {series.map((s,si)=>{
          const d = s.points.map((v,i)=> (i===0?"M":"L")+x(i)+","+y(v)).join(" ");
          const area = d + ` L ${x(n-1)},${y(min)} L ${x(0)},${y(min)} Z`;
          return <g key={si}>
            <path d={area} fill={s.color} opacity="0.08"/>
            <path d={d} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            {s.points.map((v,i)=> (i===n-1) && <circle key={i} cx={x(i)} cy={y(v)} r="4" fill={s.color} stroke="var(--surface)" strokeWidth="1.5"/>)}
          </g>;
        })}
        {hoverIdx!=null && <line x1={x(hoverIdx)} x2={x(hoverIdx)} y1={padT} y2={H-padB} stroke="var(--ink-mute)" strokeWidth="1" strokeDasharray="3,3"/>}
        {hoverIdx!=null && series.map((s,si)=> <circle key={si} cx={x(hoverIdx)} cy={y(s.points[hoverIdx])} r="4.5" fill={s.color} stroke="var(--surface)" strokeWidth="2"/>)}
        {xLabels.map((l,i)=> (i%Math.ceil(n/6)===0 || i===n-1) && <text key={i} x={x(i)} y={H-8} fontSize="10.5" textAnchor="middle" fill={CHART_INK}>{l}</text>)}
      </svg>
      {hoverIdx!=null && (
        <div style={{position:"absolute", left:`${(x(hoverIdx)/W)*100}%`, top:8, transform:"translateX(-50%)", background:"var(--ink)", color:"var(--surface)", borderRadius:8, padding:"7px 10px", fontSize:11.5, fontWeight:600, pointerEvents:"none", whiteSpace:"nowrap", boxShadow:"var(--shadow-md)"}}>
          <div style={{opacity:.7, marginBottom:2}}>{xLabels[hoverIdx]}</div>
          {series.map((s,si)=><div key={si} style={{display:"flex", gap:6, alignItems:"center"}}><span style={{width:7,height:7,borderRadius:99,background:s.color}}/>{s.name}: {fmtNum(s.points[hoverIdx])}</div>)}
        </div>
      )}
      {series.length>1 && <div style={{display:"flex", gap:16, marginTop:8, flexWrap:"wrap"}}>
        {series.map((s,i)=><div key={i} style={{display:"flex", alignItems:"center", gap:6, fontSize:12, fontWeight:600, color:"var(--ink-soft)"}}><span style={{width:9,height:9,borderRadius:3,background:s.color}}/>{s.name}</div>)}
      </div>}
    </div>
  );
}

function FunnelChart({stages}){
  const max = Math.max(...stages.map(s=>s.value),1);
  return (
    <div style={{display:"flex", flexDirection:"column", gap:9}}>
      {stages.map((s,i)=>(
        <div key={i} style={{display:"flex", alignItems:"center", gap:10}}>
          <div style={{width:118, fontSize:12.5, fontWeight:600, color:"var(--ink-soft)", flexShrink:0}}>{s.label}</div>
          <div style={{flex:1, background:"var(--surface-2)", borderRadius:8, height:22, position:"relative", overflow:"hidden"}}>
            <div style={{width:`${Math.max((s.value/max)*100,3)}%`, height:"100%", borderRadius:8, background:s.color, transition:"width .4s ease"}}/>
          </div>
          <div className="num" style={{width:34, fontSize:12.5, fontWeight:700, textAlign:"right"}}>{s.value}</div>
        </div>
      ))}
    </div>
  );
}

            <Icon name={t.variant==="danger"?"x":"check"} size={12} strokeWidth={3} style={{color:"#fff"}}/>

<script type="text/babel" data-presets="react">
/* ============================== STATE ============================== */
const LS_KEY = "contentflow_state_v1";
function loadPersisted(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function savePersisted(state){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      contentItems: state.contentItems, activityLog: state.activityLog, currentUserId: state.currentUserId,
      currentBrandId: state.currentBrandId, decisionHistory: state.decisionHistory, theme: state.theme,
    }));
  }catch(e){ /* storage unavailable — ignore */ }
}

/* ============================== SERVER SYNC (Cloudflare D1 via Pages Functions) ==============================
   localStorage above is just an instant-paint cache for one browser. The real shared record — the one
   every device and every teammate sees — lives in /api/state, backed by D1. We fetch it once on load and
   push the whole content-relevant slice back up (debounced) whenever it changes. */
async function fetchServerState(){
  try{
    const res = await fetch("/api/state");
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; /* offline, or running somewhere /api isn't wired up yet */ }
}
function pushServerState(state){
  const payload = {
    contentItems: state.contentItems, activityLog: state.activityLog, decisionHistory: state.decisionHistory,
    calendarTemplate: state.calendarTemplate, adminEmails: state.adminEmails, theme: state.theme,
  };
  fetch("/api/state", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)}).catch(()=>{
    /* offline or /api not available — localStorage cache above still has this device covered */
  });
}
async function uploadMediaFile(file, onProgress){
  const fd = new FormData();
  fd.append("file", file, file.name);
  const res = await fetch("/api/upload", {method:"POST", body: fd});
  if(!res.ok) throw new Error("Upload failed ("+res.status+")");
  return await res.json(); // { url, key }
}

function initState(){
  const persisted = loadPersisted();
  // Guard against localStorage saved by an earlier version of this app (with the old demo brands/users) —
  // if any persisted content references a brand or user that no longer exists, start fresh instead of crashing.
  const brandIds = new Set(BRANDS.map(b=>b.id));
  const userIds = new Set(USERS.map(u=>u.id));
  const persistedItemsValid = persisted && Array.isArray(persisted.contentItems) && persisted.contentItems.every(i=> brandIds.has(i.brand) && userIds.has(i.creator));
  return {
    contentItems: persistedItemsValid ? persisted.contentItems : CONTENT_ITEMS,
    activityLog: persistedItemsValid && Array.isArray(persisted.activityLog) ? persisted.activityLog : ACTIVITY_LOG,
    publishedPosts: PUBLISHED_POSTS,
    currentUserId: (persisted && userIds.has(persisted.currentUserId) && persisted.currentUserId) || "u_cyrus",
    currentBrandId: "sanjugo",
    decisionHistory: persistedItemsValid && Array.isArray(persisted.decisionHistory) ? persisted.decisionHistory : [],
    theme: (persisted && persisted.theme) || "system",
    calendarTemplate: DEFAULT_CALENDAR_TEMPLATE,
    adminEmails: [DEFAULT_ADMIN_EMAIL],
    toasts: [],
    route: "dashboard",
  };
}

function reducer(state, action){
  switch(action.type){
    case "LOAD_STATE": {
      // Replaces locally-derived data with what the shared server actually has, once it answers.
      // toasts/route stay local — those are per-tab UI state, not shared content.
      const s = action.data || {};
      return {
        ...state,
        contentItems: Array.isArray(s.contentItems) ? s.contentItems : state.contentItems,
        activityLog: Array.isArray(s.activityLog) ? s.activityLog : state.activityLog,
        decisionHistory: Array.isArray(s.decisionHistory) ? s.decisionHistory : state.decisionHistory,
        calendarTemplate: Array.isArray(s.calendarTemplate) ? s.calendarTemplate : state.calendarTemplate,
        adminEmails: Array.isArray(s.adminEmails) ? s.adminEmails : state.adminEmails,
        theme: s.theme || state.theme,
        serverLoaded: true,
      };
    }
    case "SET_USER": return {...state, currentUserId: action.id};
    case "SET_BRAND": return {...state, currentBrandId: action.id};
    case "SET_ROUTE": return {...state, route: action.route};
    case "SET_THEME": return {...state, theme: action.theme};
    case "ADD_TOAST": return {...state, toasts:[...state.toasts, {id:uid("toast"), message:action.message, variant:action.variant||"ok"}]};
    case "REMOVE_TOAST": return {...state, toasts: state.toasts.filter(t=>t.id!==action.id)};

    case "CREATE_CONTENT": {
      const log = {id:uid("act"), at:new Date().toISOString(), type:"created", contentId:action.item.id, contentTitle:action.item.title, user:state.currentUserId, detail: action.item.status==="submitted"?"Content created and submitted for approval":"Draft created"};
      return {...state, contentItems:[action.item, ...state.contentItems], activityLog:[log, ...state.activityLog]};
    }
    case "UPDATE_CONTENT": {
      return {...state, contentItems: state.contentItems.map(it=> it.id===action.id? {...it, ...action.patch} : it)};
    }
    case "RETRY_PUBLISH": {
      const items = state.contentItems.map(it=>{
        if(it.id!==action.contentId) return it;
        const variants = {...it.variants};
        Object.keys(variants).forEach(p=>{
          if(!action.platform || p===action.platform){
            if(variants[p].publishStatus==="failed") variants[p] = {...variants[p], publishStatus:"publishing", errorMessage:null};
          }
        });
        const stillFailed = Object.values(variants).some(v=>v.publishStatus==="failed");
        return {...it, variants, status: stillFailed? "failed":"publishing"};
      });
      const log = {id:uid("act"), at:new Date().toISOString(), type:"scheduled", contentId:action.contentId, contentTitle:(state.contentItems.find(i=>i.id===action.contentId)||{}).title, user:state.currentUserId, detail:"Publish retried"};
      return {...state, contentItems:items, activityLog:[log,...state.activityLog], toasts:[...state.toasts,{id:uid("toast"),message:"Retrying publish…",variant:"ok"}]};
    }

    case "SUBMIT_DECISION": {
      const {contentId, platform, decision, feedback, tags, dueDate} = action;
      const item = state.contentItems.find(i=>i.id===contentId);
      if(!item) return state;
      const prevItemStatus = item.status;
      const prevVariants = JSON.parse(JSON.stringify(item.variants));
      const statusMap = {approved:"approved", rejected:"rejected", changes_requested:"changes_requested"};
      const newStatus = statusMap[decision];
      const variants = {...item.variants};
      let autoFilled = [];
      Object.keys(variants).forEach(p=>{
        if(!platform || p===platform){
          variants[p] = {...variants[p], status:newStatus};
          if(decision==="approved"){
            if(!variants[p].scheduledAt){
              const slot = findTemplateSlot(item, p, state.contentItems, state.calendarTemplate);
              if(slot){ variants[p] = {...variants[p], scheduledAt:slot.date, templateRuleId:slot.ruleId}; autoFilled.push(PLATFORM_META[p].label); }
            }
            variants[p].publishStatus = variants[p].scheduledAt? "scheduled" : "not_scheduled";
          }
        }
      });
      const nextVersion = item.currentVersion + (decision!=="approved"?0:0);
      const versionEntry = {
        version: item.currentVersion, editor: USERS.find(u=>u.id===item.creator).name, date: new Date().toISOString(),
        changes: platform? `Reviewed ${PLATFORM_META[platform].label} variant` : "Reviewed full package",
        decision: decision==="approved"?"Approved": decision==="rejected"?"Rejected":"Changes Requested",
        feedback: feedback||null,
      };
      const versions = [...item.versions.slice(0,-1), versionEntry];
      const patch = {
        status: platform? item.status : newStatus,
        variants,
        versions,
        lastFeedback: (decision!=="approved")? {by: state.currentUserId, at:new Date().toISOString(), tags: tags||[], text: feedback||""} : item.lastFeedback,
      };
      const items = state.contentItems.map(i=> i.id===contentId? {...i, ...patch} : i);
      const log = {
        id:uid("act"), at:new Date().toISOString(), contentId, contentTitle:item.title, user: state.currentUserId,
        type: decision, version:item.currentVersion,
        detail: (decision==="approved"?"Approved":decision==="rejected"?"Rejected":"Requested changes") + (platform? " — "+PLATFORM_META[platform].label : " — full package") + (dueDate? ` (due ${fmtDate(dueDate)})` : ""),
        comment: feedback||null,
      };
      const historyEntry = {id: log.id, contentId, platform, prevItemStatus, prevVariants, decision};
      const approvedMsg = "Approved — "+item.title + (autoFilled.length? " · auto-scheduled into next "+autoFilled.join("/")+" slot" : (decision==="approved"? " · waiting for an empty calendar slot" : ""));
      return {...state, contentItems: items, activityLog:[log, ...state.activityLog], decisionHistory:[...state.decisionHistory, historyEntry],
        toasts:[...state.toasts, {id:uid("toast"), message: decision==="approved"? approvedMsg : decision==="rejected"? "Rejected — "+item.title : "Changes requested — "+item.title, variant: decision==="approved"?"ok": decision==="rejected"?"danger":"warn"}]};
    }
    case "SET_TEMPLATE": return {...state, calendarTemplate: action.template};
    case "SET_ADMIN_EMAILS": return {...state, adminEmails: action.emails};
    case "RESCHEDULE": {
      const {contentId, platform, scheduledAt} = action;
      const item = state.contentItems.find(i=>i.id===contentId);
      if(!item || !item.variants[platform]) return state;
      const variants = {...item.variants, [platform]: {...item.variants[platform], scheduledAt, templateRuleId:null,
        publishStatus: scheduledAt? (item.variants[platform].publishStatus==="published"?"published":"scheduled") : "not_scheduled"}};
      const items = state.contentItems.map(i=> i.id===contentId? {...i, variants} : i);
      const log = {id:uid("act"), at:new Date().toISOString(), contentId, contentTitle:item.title, user: state.currentUserId,
        type:"scheduled", detail: (scheduledAt? "Rescheduled — "+PLATFORM_META[platform].label+" set to "+fmtDateTime(scheduledAt) : "Removed publish time — "+PLATFORM_META[platform].label), comment:null};
      return {...state, contentItems: items, activityLog:[log, ...state.activityLog],
        toasts:[...state.toasts, {id:uid("toast"), message: scheduledAt? "Scheduled for "+fmtDateTime(scheduledAt) : "Publish time cleared", variant:"ok"}]};
    }
    case "UNDO_DECISION": {
      if(state.decisionHistory.length===0) return state;
      const last = state.decisionHistory[state.decisionHistory.length-1];
      const items = state.contentItems.map(i=> i.id===last.contentId? {...i, status:last.prevItemStatus, variants:last.prevVariants} : i);
      const activityLog = state.activityLog.filter(a=>a.id!==last.id);
      return {...state, contentItems: items, activityLog, decisionHistory: state.decisionHistory.slice(0,-1),
        toasts:[...state.toasts, {id:uid("toast"), message:"Last decision undone", variant:"ok"}]};
    }
    default: return state;
  }
}

function isoToLocalInput(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
}
function ScheduleEditor({item, platform, scheduledAt}){
  const {state, dispatch} = useApp();
  const user = USERS.find(u=>u.id===state.currentUserId);
  const perms = PERMS[user.role];
  const [value, setValue] = useState(scheduledAt? isoToLocalInput(scheduledAt) : "");
  useEffect(()=>{ setValue(scheduledAt? isoToLocalInput(scheduledAt) : ""); }, [scheduledAt]);

  if(!perms.schedule){
    return scheduledAt ? <FieldRow label="Scheduled" value={fmtDateTime(scheduledAt)}/> : <div style={{color:"var(--ink-mute)"}}>Not scheduled yet</div>;
  }
  function save(){ dispatch({type:"RESCHEDULE", contentId:item.id, platform, scheduledAt: value? value+":00" : null}); }
  return (
    <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", paddingTop:2}}>
      <span style={{fontWeight:700, color:"var(--ink-mute)", flexShrink:0}}>Scheduled</span>

    </div>
  );

function DecisionModal({pending, onCancel, onConfirm}){
  const [stage, setStage] = useState(pending && pending.type==="approve" ? "confirm" : "feedback");
  const [tags, setTags] = useState([]);
  const [text, setText] = useState("");
  const [dueDate, setDueDate] = useState("");
  useEffect(()=>{ if(pending){ setStage(pending.type==="approve"?"confirm":"feedback"); setTags([]); setText(""); setDueDate(""); } }, [pending && pending.contentId, pending && pending.platform, pending && pending.type]);
  if(!pending) return null;
  const decisionWord = pending.type==="approve"?"Approve": pending.type==="reject"?"Reject":"Request Edits";
  const decisionColor = pending.type==="approve"?"var(--green)": pending.type==="reject"?"var(--red)":"var(--amber)";
  const scopeLabel = pending.platform? PLATFORM_META[pending.platform].label+" variant" : "entire content package";

  function toggleTag(t){ setTags(ts=> ts.includes(t)? ts.filter(x=>x!==t) : [...ts, t]); }

  return (
    <Modal open={!!pending} onClose={onCancel} width={460}>
      {stage==="feedback" && (
        <div style={{padding:22}}>
          <h3 style={{margin:"0 0 4px"}}>{decisionWord} — {pending.itemTitle}</h3>
          <div style={{fontSize:12.5, color:"var(--ink-mute)", marginBottom:16}}>Applies to: {scopeLabel}</div>
          <div style={{fontSize:12.5, fontWeight:700, marginBottom:8}}>Common feedback</div>
          <div style={{display:"flex", flexWrap:"wrap", gap:7, marginBottom:16}}>
            {FEEDBACK_TAGS.map(t=>(
              <button key={t} onClick={()=>toggleTag(t)} style={{padding:"6px 11px", borderRadius:99, border:"1px solid "+(tags.includes(t)?decisionColor:"var(--border)"), background: tags.includes(t)? `color-mix(in srgb, ${decisionColor} 12%, transparent)`:"var(--surface)", color: tags.includes(t)?decisionColor:"var(--ink-soft)", fontSize:12, fontWeight:600, cursor:"pointer"}}>{t}</button>
            ))}
          </div>
          <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Feedback for the creator</label>
          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Explain what needs to change…" rows={4}
            style={{width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:10, fontSize:13, fontFamily:"inherit", resize:"vertical", marginBottom:14, background:"var(--surface)", color:"var(--ink)"}}/>
          <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Due date for revision (optional)</label>
          <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} style={{width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:9, fontSize:13, marginBottom:18, background:"var(--surface)", color:"var(--ink)"}}/>
          <div style={{display:"flex", gap:10, justifyContent:"flex-end"}}>
            <Button variant="ghost" onClick={onCancel}>Cancel</Button>
            <Button variant={pending.type==="reject"?"danger":"amber"} icon="chevronRight" onClick={()=>setStage("confirm")}>Continue</Button>
          </div>
        </div>
      )}
      {stage==="confirm" && (
        <div style={{padding:22}}>
          <div style={{width:44,height:44,borderRadius:99,background:`color-mix(in srgb, ${decisionColor} 14%, transparent)`,color:decisionColor,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:14}}>
            <Icon name={pending.type==="approve"?"check":pending.type==="reject"?"x":"edit"} size={20}/>
          </div>
          <h3 style={{margin:"0 0 6px"}}>Confirm: {decisionWord.toLowerCase()}</h3>
          <p style={{fontSize:13.5, color:"var(--ink-soft)", lineHeight:1.5, margin:"0 0 16px"}}>
            You're about to <strong>{decisionWord.toLowerCase()}</strong> the {scopeLabel} for <strong>{pending.itemTitle}</strong>.
            {pending.type!=="approve" && tags.length>0 && <> Feedback tags: {tags.join(", ")}.</>}
            {" "}This action is recorded to the content's version history.
          </p>
          <div style={{display:"flex", gap:10, justifyContent:"flex-end"}}>
            <Button variant="ghost" onClick={()=> pending.type==="approve" ? onCancel() : setStage("feedback")}>{pending.type==="approve"?"Cancel":"Back"}</Button>
            <Button variant={pending.type==="approve"?"success":pending.type==="reject"?"danger":"amber"} icon="check" onClick={()=>onConfirm({tags, text, dueDate})}>Confirm {decisionWord}</Button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ============================== APPROVAL QUEUE ============================== */
function buildQueue(items, mode, filters){
  let pool = items.filter(i=>i.status==="submitted");
  if(filters.brand) pool = pool.filter(i=>i.brand===filters.brand);
  if(filters.creator) pool = pool.filter(i=>i.creator===filters.creator);
  if(filters.campaign) pool = pool.filter(i=>i.campaign===filters.campaign);
  if(filters.priority) pool = pool.filter(i=>i.priority===filters.priority);
  if(filters.platform) pool = pool.filter(i=>i.platforms.includes(filters.platform));
  if(mode==="package") return pool.map(it=>({key:it.id, contentId:it.id, item:it, platform:null}));
  const flat = [];
  pool.forEach(it=> it.platforms.forEach(p=> filters.platform && filters.platform!==p ? null : flat.push({key:it.id+"_"+p, contentId:it.id, item:it, platform:p})));
  return flat;
}

function seedNum(str, min, max){
  let h=0; for(const c of str) h=(h*131+c.charCodeAt(0))>>>0;
  return min + (h%(max-min));
}
function initials(str){ return (str||"").replace(/[@.]/g,"").split(/[\s_]+/).map(s=>s[0]).slice(0,2).join("").toUpperCase(); }

function BrandGlyph({brand, size=32, radius=99}){

  const [c1,c2] = grad(brand.id);
  return <span style={{width:size, height:size, borderRadius:radius, flexShrink:0, background:`linear-gradient(135deg, ${c1}, ${c2})`, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:size*0.36}}>{initials(brand.name)}</span>;

function SwipeCard({entry, onDecision, onOpenDetails, isTop}){
  const ref = useRef(null);
  const [drag, setDrag] = useState({x:0, y:0, active:false});
  const startRef = useRef({x:0,y:0});
  const item = entry.item;
  const brand = BRANDS.find(b=>b.id===item.brand);
  const campaign = CAMPAIGNS.find(c=>c.id===item.campaign);
  const creator = USERS.find(u=>u.id===item.creator);
  const platformList = entry.platform? [entry.platform] : item.platforms;
  const [activePlatform, setActivePlatform] = useState(entry.platform || item.platforms[0]);
  const variant = item.variants[activePlatform];
  const caption = entry.platform? variant.caption||variant.description||variant.title : Object.values(item.variants).map(v=>v.caption||v.title||v.description).find(Boolean);
  const scheduledAt = entry.platform? variant.scheduledAt : (Object.values(item.variants).find(v=>v.scheduledAt)||{}).scheduledAt;

  function onPointerDown(e){
    if(!isTop) return;
    ref.current.setPointerCapture && ref.current.setPointerCapture(e.pointerId);
    startRef.current = {x:e.clientX, y:e.clientY};
    setDrag(d=>({...d, active:true}));
  }
  function onPointerMove(e){
    if(!drag.active) return;
    setDrag(d=>({...d, x:e.clientX-startRef.current.x, y:e.clientY-startRef.current.y}));
  }
  function onPointerUp(){
    if(!drag.active) return;
    const {x,y} = drag;
    const TH = 110;
    if(Math.abs(x) > TH && Math.abs(x) > Math.abs(y)){
      onDecision(x>0? "approve":"reject");
      setDrag({x:0,y:0,active:false});
    } else if(y < -TH && Math.abs(y) > Math.abs(x)){
      onDecision("edits");
      setDrag({x:0,y:0,active:false});
    } else {
      setDrag({x:0,y:0,active:false});
    }
  }
  const rotate = drag.x/22;
  const rightOp = Math.max(0, Math.min(1, drag.x/110));
  const leftOp = Math.max(0, Math.min(1, -drag.x/110));
  const upOp = Math.max(0, Math.min(1, -drag.y/110));

  return (
    <div ref={ref}
      onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
      style={{
        position:"absolute", inset:0, borderRadius:20, background:"var(--surface)", border:"1px solid var(--border)", boxShadow:"var(--shadow-lg)",
        transform: `translate(${drag.x}px, ${drag.y}px) rotate(${rotate}deg)`,
        transition: drag.active? "none":"transform .35s cubic-bezier(.2,.8,.2,1)",
        touchAction:"none", cursor: isTop?"grab":"default", overflow:"hidden", display:"flex", flexDirection:"column",
      }}>
      <div style={{display:"flex", alignItems:"center", gap:9, padding:"11px 14px 9px", flexShrink:0, borderBottom:"1px solid var(--border)"}} onClick={()=>!drag.active && onOpenDetails(item)}>
        <span style={{width:8,height:8,borderRadius:99,background:brand.color, flexShrink:0}}/>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:13, fontWeight:700, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{item.title}</div>
          <div style={{fontSize:11, color:"var(--ink-mute)"}}>{brand.name} · {campaign.name}</div>
        </div>
        <Badge label={PRIORITY_META[item.priority].label} color={PRIORITY_META[item.priority].color} soft="var(--surface-2)"/>
      </div>

      {!entry.platform && item.platforms.length>1 && (
        <div style={{display:"flex", gap:6, padding:"8px 14px", flexShrink:0, overflowX:"auto"}} onPointerDown={e=>e.stopPropagation()}>
          {item.platforms.map(p=>(
            <button key={p} onClick={(e)=>{ e.stopPropagation(); setActivePlatform(p); }}
              style={{display:"flex", alignItems:"center", gap:6, padding:"5px 10px 5px 6px", borderRadius:99, border:"1px solid "+(activePlatform===p?PLATFORM_HEX[p]:"var(--border)"), background: activePlatform===p? PLATFORM_HEX[p]+"18":"var(--surface)", color: activePlatform===p? PLATFORM_HEX[p]:"var(--ink-soft)", fontSize:11.5, fontWeight:700, cursor:"pointer", flexShrink:0}}>
              <PlatformIcon platform={p} size={12}/>{PLATFORM_META[p].label}
            </button>
          ))}
        </div>
      )}

      <div style={{position:"relative", flex:1, minHeight:0, padding: (activePlatform==="instagram"&&item.media.aspectRatio!=="9:16")||activePlatform==="facebook"||activePlatform==="gbp" ? "12px 14px" : "10px 10px 0", overflowY:"auto"}} onClick={()=>!drag.active && onOpenDetails(item)}>
        <PlatformPostPreview platform={activePlatform} item={item} variant={item.variants[activePlatform]} brand={brand}/>
      </div>

      <div style={{padding:"10px 14px 12px", flexShrink:0, borderTop:"1px solid var(--border)"}} onClick={()=>!drag.active && onOpenDetails(item)}>
        <div style={{display:"flex", flexWrap:"wrap", gap:12, fontSize:11.5, color:"var(--ink-soft)", marginBottom:6}}>
          <span style={{display:"flex", alignItems:"center", gap:5}}><Avatar user={creator} size={16}/>{creator.name}</span>
          <span style={{display:"flex", alignItems:"center", gap:5}}><Icon name="clock" size={13}/>{scheduledAt? fmtDateTime(scheduledAt): "Not scheduled"}</span>
          <span style={{display:"flex", alignItems:"center", gap:5}}><Icon name="file" size={13}/>v{item.currentVersion}</span>
        </div>
        {(() => {
          const warnings = [];
          if(!caption) warnings.push("Missing caption/title");
          if(item.media.duration && item.media.duration>60 && platformList.includes("tiktok")) warnings.push("Video exceeds TikTok's recommended length");
          if(!scheduledAt) warnings.push("No publish time set");
          return warnings.length>0 && (
            <div style={{display:"flex", flexDirection:"column", gap:4}}>
              {warnings.map((w,i)=><div key={i} style={{display:"flex", gap:6, alignItems:"center", fontSize:11.5, color:"var(--amber)", fontWeight:600}}><Icon name="warn" size={12}/>{w}</div>)}
            </div>
          );
        })()}
      </div>

      <div style={{position:"absolute", inset:0, background:"rgba(91,95,239,.94)", opacity:rightOp, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}><span style={{color:"#fff", fontWeight:800, fontSize:26, border:"3px solid #fff", borderRadius:12, padding:"6px 22px", transform:"rotate(-8deg)"}}>APPROVE</span></div>
      <div style={{position:"absolute", inset:0, background:"rgba(220,38,38,.9)", opacity:leftOp, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}><span style={{color:"#fff", fontWeight:800, fontSize:26, border:"3px solid #fff", borderRadius:12, padding:"6px 22px", transform:"rotate(8deg)"}}>REJECT</span></div>
      <div style={{position:"absolute", inset:0, background:"rgba(217,119,6,.92)", opacity:upOp, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}><span style={{color:"#fff", fontWeight:800, fontSize:24, border:"3px solid #fff", borderRadius:12, padding:"6px 22px"}}>EDITS</span></div>
    </div>
  );
}

function ApprovalQueuePage(){
  const {state, dispatch, openDetails} = useApp();
  const [mode, setMode] = useState("package");
  const [filters, setFilters] = useState({brand:"", creator:"", campaign:"", priority:"", platform:""});
  const [index, setIndex] = useState(0);
  const [pending, setPending] = useState(null);

  const queue = useMemo(()=>buildQueue(state.contentItems, mode, filters), [state.contentItems, mode, filters]);
  useEffect(()=>{ setIndex(0); }, [mode, JSON.stringify(filters)]);
  const total = queue.length;
  const current = queue[index];
  const reviewed = Math.min(index, total);

  function requestDecision(type){
    if(!current) return;
    setPending({contentId:current.contentId, platform:current.platform, itemTitle:current.item.title, type});
  }
  function confirmDecision(extra){
    const decision = pending.type==="approve"?"approved": pending.type==="reject"?"rejected":"changes_requested";
    dispatch({type:"SUBMIT_DECISION", contentId:pending.contentId, platform:pending.platform, decision, feedback:extra.text, tags:extra.tags, dueDate:extra.dueDate});
    setPending(null);
    setIndex(i=>i+1);
  }
  function undo(){
    dispatch({type:"UNDO_DECISION"});
    setIndex(i=>Math.max(0,i-1));
  }

  const creators = [...new Set(state.contentItems.map(i=>i.creator))].map(id=>USERS.find(u=>u.id===id));

  return (
    <div>
      <PageHeader title="Approval Queue" subtitle="Swipe right to approve, left to reject, up to request edits." action={
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          <Button variant="ghost" size="sm" icon="undo" onClick={undo} disabled={state.decisionHistory.length===0}>Undo Last Decision</Button>
        </div>
      }/>

      <Card style={{padding:14, marginBottom:18, display:"flex", flexWrap:"wrap", gap:10, alignItems:"center"}}>
        <div style={{display:"flex", background:"var(--surface-2)", borderRadius:9, padding:3, gap:2}}>
          <button onClick={()=>setMode("package")} style={{padding:"6px 12px", borderRadius:7, border:"none", fontWeight:700, fontSize:12.5, cursor:"pointer", background:mode==="package"?"var(--surface)":"transparent", boxShadow:mode==="package"?"var(--shadow-sm)":"none"}}>Full package</button>
          <button onClick={()=>setMode("variant")} style={{padding:"6px 12px", borderRadius:7, border:"none", fontWeight:700, fontSize:12.5, cursor:"pointer", background:mode==="variant"?"var(--surface)":"transparent", boxShadow:mode==="variant"?"var(--shadow-sm)":"none"}}>Per platform</button>
        </div>
        <div style={{width:1, height:24, background:"var(--border)"}}/>
        <Select value={filters.brand} onChange={v=>setFilters(f=>({...f,brand:v}))} placeholder="All brands" options={BRANDS.map(b=>({value:b.id,label:b.name}))} style={{width:150}}/>
        <Select value={filters.platform} onChange={v=>setFilters(f=>({...f,platform:v}))} placeholder="All platforms" options={Object.entries(PLATFORM_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:150}}/>
        <Select value={filters.creator} onChange={v=>setFilters(f=>({...f,creator:v}))} placeholder="All creators" options={creators.map(c=>({value:c.id,label:c.name}))} style={{width:150}}/>
        <Select value={filters.campaign} onChange={v=>setFilters(f=>({...f,campaign:v}))} placeholder="All campaigns" options={CAMPAIGNS.map(c=>({value:c.id,label:c.name}))} style={{width:170}}/>
        <Select value={filters.priority} onChange={v=>setFilters(f=>({...f,priority:v}))} placeholder="All priorities" options={Object.entries(PRIORITY_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:140}}/>
      </Card>

      {total===0 ? (
        <Card style={{padding:0}}><EmptyState icon="check" title="Nothing waiting on you" subtitle="All submitted content matching these filters has been reviewed. Nice work."/></Card>
      ) : reviewed>=total ? (
        <Card style={{padding:0}}><EmptyState icon="check" title={"Queue clear — "+total+" of "+total+" reviewed"} subtitle="You've reviewed everything in this queue. Adjust filters to see more, or check back later." action={<Button variant="primary" onClick={()=>setIndex(0)} style={{marginTop:6}}>Review again</Button>}/></Card>
      ) : (
        <div>
          <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14}}>
            <div style={{fontSize:13, fontWeight:700, color:"var(--ink-soft)"}}>{reviewed} of {total} reviewed</div>
            <div style={{flex:1, height:6, borderRadius:99, background:"var(--surface-2)", overflow:"hidden"}}><div style={{width:(reviewed/total*100)+"%", height:"100%", background:"var(--accent)", borderRadius:99, transition:"width .3s ease"}}/></div>
          </div>
          <div style={{position:"relative", height:520, maxWidth:460, margin:"0 auto"}}>
            {queue.slice(index, index+3).reverse().map((entry, ri, arr)=>{
              const depth = arr.length-1-ri;
              return (
                <div key={entry.key} style={{position:"absolute", inset:0, transform: depth>0? `translateY(${depth*8}px) scale(${1-depth*0.035})`:"none", opacity: depth>2?0:1, zIndex:10-depth}}>
                  <SwipeCard entry={entry} isTop={depth===0} onOpenDetails={openDetails} onDecision={requestDecision}/>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex", justifyContent:"center", gap:14, marginTop:22}}>
            <Button variant="danger" size="lg" icon="x" onClick={()=>requestDecision("reject")} style={{borderRadius:99, width:56, height:56, padding:0, justifyContent:"center"}}/>
            <Button variant="amber" size="lg" icon="edit" onClick={()=>requestDecision("edits")} style={{borderRadius:99}}>Request Edits</Button>
            <Button variant="success" size="lg" icon="check" onClick={()=>requestDecision("approve")} style={{borderRadius:99, width:56, height:56, padding:0, justifyContent:"center"}}/>
          </div>
        </div>
      )}
      <DecisionModal pending={pending} onCancel={()=>setPending(null)} onConfirm={confirmDecision}/>
    </div>
  );
}

function SmartInsightsPanel({stats}){
  const {caps} = useApp();
  const [insight, setInsight] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(()=>{
    if(!caps.db) return;
    const ref = caps.db.doc("insights/latest");
    const unsub = ref.onSnapshot(snap=>{ if(snap.exists) setInsight(snap.data()); }, ()=>{});
    return unsub;
  }, [caps.db]);

  async function generate(){
    if(!caps.sample){ setError("AI insights need this artifact's `sample` capability, which isn't available in this view."); return; }
    setLoading(true); setError(null);
    const prompt = `You are the marketing analyst for Sanjugo, a sushi restaurant brand, looking at its ContentFlow dashboard.
Here is this week's snapshot (some figures are demo data pending real analytics being connected):
- Awaiting approval: ${stats.awaiting}
- Changes requested: ${stats.changes}
- Scheduled this week: ${stats.scheduledWeek}
- Published (all time, demo): ${stats.published}
- Failed publications: ${stats.failed}
- Total views (demo): ${stats.totalViews}
- Engagement rate (demo): ${stats.engRate.toFixed(1)}%
- Follower growth 30d (demo): +${stats.followerGrowth}

In under 90 words: (1) summarize how content is trending, (2) flag the single biggest risk or bottleneck right now, (3) suggest one concrete next post idea or scheduling change for next week. Plain text, no headers, no markdown.`;
    try{
      const {text} = await caps.sample(prompt, {modelTier:"quick"});
      const payload = {text, generatedAt:new Date().toISOString()};
      setInsight(payload);
      if(caps.db) caps.db.doc("insights/latest").set(payload).catch(()=>{});
    }catch(e){
      setError(e && e.code==="not_granted" ? "AI insights need your permission — try again and allow the request." : "Couldn't generate insights right now — try again shortly.");
    }finally{ setLoading(false); }
  }

  return (
    <Card style={{padding:18, marginBottom:18, background:"var(--accent-soft)", border:"1px solid var(--accent)"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12, marginBottom:10}}>
        <div style={{display:"flex", alignItems:"center", gap:8, color:"var(--accent-dark)", fontWeight:700, fontSize:13.5}}><Icon name="zap" size={16}/>Smart insights</div>
        <Button size="sm" variant="primary" icon="refresh" onClick={generate} disabled={loading}>{loading?"Thinking…":insight?"Refresh":"Generate"}</Button>
      </div>
      {error && <div style={{fontSize:12.5, color:"var(--red)"}}>{error}</div>}
      {!error && insight && <div style={{fontSize:13.5, lineHeight:1.6, color:"var(--ink)"}}>{insight.text}<div style={{fontSize:11, color:"var(--ink-mute)", marginTop:8}}>Generated {fmtDateTime(insight.generatedAt)} · uses your own Claude usage each time</div></div>}
      {!error && !insight && !loading && <div style={{fontSize:12.5, color:"var(--ink-soft)"}}>Ask Claude to read this week's numbers and suggest what to do next.</div>}
    </Card>
  );
}

function DashboardPage(){
  const {state, openDetails, dispatch} = useApp();
  const [loading, setLoading] = useState(true);
  useEffect(()=>{ const t=setTimeout(()=>setLoading(false), 550); return ()=>clearTimeout(t); }, []);
  const items = useMemo(()=> state.currentBrandId==="all"? state.contentItems : state.contentItems.filter(i=>i.brand===state.currentBrandId), [state.contentItems, state.currentBrandId]);
  const posts = useMemo(()=> state.currentBrandId==="all"? state.publishedPosts : state.publishedPosts.filter(p=>p.brand===state.currentBrandId), [state.publishedPosts, state.currentBrandId]);

  const awaiting = items.filter(i=>i.status==="submitted").length;
  const changes = items.filter(i=>i.status==="changes_requested").length;
  const scheduledWeek = items.filter(i=> i.status==="scheduled" && (new Date(i.due)-TODAY)/86400000 <= 7 && (new Date(i.due)-TODAY) >= -1).length;
  const published = items.filter(i=>i.status==="published").length;
  const failed = items.filter(i=>i.status==="failed").length;
  const totalViews = posts.reduce((s,p)=>s+p.views,0);
  const totalEng = posts.reduce((s,p)=>s+p.likes+p.comments+p.shares+p.saves,0);

const WEEKDAY_LABELS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CONTENT_TYPE_OPTIONS = ["reel","short","post","story","carousel","update"];
const DEFAULT_CALENDAR_TEMPLATE = [
  {id:"tpl_mon", weekday:1, time:"12:00", platform:"instagram", type:"reel", brand:"sanjugo"},
  {id:"tpl_wed", weekday:3, time:"12:00", platform:"instagram", type:"reel", brand:"sanjugo"},
  {id:"tpl_fri", weekday:5, time:"18:00", platform:"instagram", type:"reel", brand:"sanjugo"},
];
function mediaTypeMatchesTemplate(item, ruleType){
  // Best-effort match between the wizard's free-text pillar/notes and a template row's content "type" label.
  const hay = (item.pillar+" "+item.title+" "+(item.notes||"")).toLowerCase();
  return ruleType==="reel" ? (item.media.aspectRatio==="9:16") : true;
}
/** Finds the next empty recurring-template slot (within 60 days) that matches this item's platform,
 *  and isn't already occupied by another item's variant. Returns {date, time, ruleId} or null — the
 *  content stays "approved but waiting for an empty slot" until one frees up. */
function findTemplateSlot(item, platform, allItems, template){
  const rules = (template||[]).filter(r=> r.platform===platform && (!r.brand || r.brand===item.brand));
  if(rules.length===0) return null;
  const occupied = new Set();
  allItems.forEach(it=>{
    Object.entries(it.variants||{}).forEach(([p,v])=>{
      if(p===platform && v.scheduledAt){
        const d = new Date(v.scheduledAt);
        occupied.add(d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+p);
      }
    });
  });
  for(let dayOff=1; dayOff<=60; dayOff++){
    const d = new Date(TODAY); d.setDate(d.getDate()+dayOff);
    const rule = rules.find(r=>r.weekday===d.getDay());
    if(!rule) continue;
    const key = d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+platform;
    if(occupied.has(key)) continue;
    const [hh,mm] = (rule.time||"09:00").split(":").map(Number);
    d.setHours(hh||9, mm||0, 0, 0);
    return {date:d.toISOString(), ruleId:rule.id};
  }
  return null;
}

function calendarEntries(items, filters){
  let flat = [];
  items.forEach(it=>{
    Object.values(it.variants).forEach(v=>{
      if(!v.scheduledAt) return;
      flat.push({item:it, v});
    });
  });
  if(filters.brand) flat = flat.filter(x=>x.item.brand===filters.brand);
  if(filters.platform) flat = flat.filter(x=>x.v.platform===filters.platform);
  if(filters.campaign) flat = flat.filter(x=>x.item.campaign===filters.campaign);
  if(filters.creator) flat = flat.filter(x=>x.item.creator===filters.creator);
  if(filters.status) flat = flat.filter(x=>x.item.status===filters.status);
  return flat;
}

function CreateContentPage(){
  const {state, dispatch} = useApp();
  const user = USERS.find(u=>u.id===state.currentUserId);
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    title:"", campaign: CAMPAIGNS[0].id, brand: BRANDS[0].id, pillar: PILLARS[0], creator: user.id, approver: (USERS.find(u=>u.role==="approver"||u.role==="admin")||USERS[0]).id, priority:"normal", notes:"",
    mediaType:"video", aspectRatio:"9:16", duration:20, fileName:"",
    platforms:["instagram"], scheduledAt:"", variants:{},
  });
  function set(patch){ setForm(f=>({...f, ...patch})); }
  function setVariant(p, patch){ setForm(f=>({...f, variants:{...f.variants, [p]:{...(f.variants[p]||{}), ...patch}}})); }
  function togglePlatform(p){ set({platforms: form.platforms.includes(p)? form.platforms.filter(x=>x!==p) : [...form.platforms, p]}); }

  const warnings = useMemo(()=>{
    const w = [];
    form.platforms.forEach(p=>{
      const v = form.variants[p]||{};
      if(p==="youtube" && !v.title) w.push("YouTube Shorts is missing a title.");
      if((p==="instagram"||p==="facebook"||p==="gbp") && !v.caption && !v.postDescription) w.push(PLATFORM_META[p].label+" is missing a caption.");
      if(p==="tiktok" && !v.caption) w.push("TikTok is missing a caption.");
    });
    if((form.platforms.includes("tiktok")||form.platforms.includes("youtube")) && form.aspectRatio!=="9:16") w.push("TikTok / YouTube Shorts expect a 9:16 aspect ratio — current media is "+form.aspectRatio+".");
    if(form.duration>60 && form.platforms.includes("tiktok")) w.push("Video is over 60s — long-form for TikTok may reduce reach.");
    if(form.platforms.length===0) w.push("Select at least one platform.");
    if(!form.scheduledAt && step===4) w.push("No publishing date/time set — content will be saved as approved-but-unscheduled.");
    if(form.uploadStatus==="uploading") w.push("Still uploading the original file — wait for it to finish before submitting.");
    if(form.uploadStatus==="failed") w.push("The file upload failed — re-upload it, or continue and add it later.");
    const conflict = state.contentItems.some(it=> it.brand===form.brand && it.platforms.some(p=>form.platforms.includes(p)) && Object.values(it.variants).some(v=> v.scheduledAt && form.scheduledAt && Math.abs(new Date(v.scheduledAt)-new Date(form.scheduledAt))<30*60000));
    if(conflict) w.push("Another post from this brand is scheduled within 30 minutes of this time.");
    return w;
  }, [form, step, state.contentItems]);

  function buildItem(status){
    const variants = {};
    form.platforms.forEach(p=>{
      variants[p] = makeVariant(p, {status: status==="draft"?"draft":"submitted", scheduledAt: form.variants[p]?.overrideTime || form.scheduledAt || null, ...form.variants[p]});
    });
    return {
      id: uid("ct"), title: form.title||"Untitled content", brand: form.brand, campaign: form.campaign, pillar: form.pillar,
      creator: form.creator, approver: form.approver, priority: form.priority, notes: form.notes, status,
      createdAt: new Date().toISOString(), platforms: form.platforms, currentVersion: 1,
      media:{type:form.mediaType, duration: form.mediaType==="video"?Number(form.duration):null, aspectRatio: form.aspectRatio, previewUrl: form.previewUrl || null, fileUrl: form.fileUrl || null},
      due: form.scheduledAt || new Date().toISOString(),
      versions:[{version:1, editor:USERS.find(u=>u.id===form.creator).name, date:new Date().toISOString(), changes: status==="draft"?"Initial draft created.":"Initial draft created and submitted for approval.", decision:"—", feedback:null}],
      variants, gradient: grad(form.title||"x"+Math.random()),
    };
  }

  function submit(status){
    const item = buildItem(status);
    dispatch({type:"CREATE_CONTENT", item});
    dispatch({type:"ADD_TOAST", message: status==="draft"? "Saved as draft" : "Submitted for approval"});
    dispatch({type:"SET_ROUTE", route: status==="draft"?"calendar":"queue"});
  }

  return (
    <div>
      <PageHeader title="Create Content" subtitle="Build one creative concept and tailor it per platform."/>
      <div style={{display:"flex", gap:0, marginBottom:22, overflowX:"auto"}}>
        {WIZARD_STEPS.map((s,i)=>(
          <div key={s} style={{display:"flex", alignItems:"center", flex:1, minWidth:120}}>
            <div onClick={()=>i<=step && setStep(i)} style={{display:"flex", alignItems:"center", gap:8, cursor:i<=step?"pointer":"default"}}>
              <div style={{width:26,height:26,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700, flexShrink:0, background: i<step?"var(--green)": i===step?"var(--accent)":"var(--surface-2)", color: i<=step?"#fff":"var(--ink-mute)"}}>{i<step? <Icon name="check" size={13}/> : i+1}</div>
              <span style={{fontSize:12.5, fontWeight:700, color:i===step?"var(--ink)":"var(--ink-mute)", whiteSpace:"nowrap"}}>{s}</span>
            </div>
            {i<WIZARD_STEPS.length-1 && <div style={{flex:1, height:2, background:"var(--border)", margin:"0 8px"}}/>}
          </div>
        ))}
      </div>

      <div className="cf-wiz-grid" style={{display:"grid", gridTemplateColumns:"1fr 280px", gap:18, alignItems:"start"}}>
        <Card style={{padding:22}}>
          {step===0 && (
            <div>
              <TextField label="Content title" value={form.title} onChange={v=>set({title:v})} placeholder="e.g. Autumn Roast — Hero Reel"/>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Brand</label>
                  <Select value={form.brand} onChange={v=>set({brand:v})} options={BRANDS.map(b=>({value:b.id,label:b.name}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Campaign</label>
                  <Select value={form.campaign} onChange={v=>set({campaign:v})} options={CAMPAIGNS.filter(c=>c.brand===form.brand).map(c=>({value:c.id,label:c.name}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Content pillar</label>
                  <Select value={form.pillar} onChange={v=>set({pillar:v})} options={PILLARS.map(p=>({value:p,label:p}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Priority</label>
                  <Select value={form.priority} onChange={v=>set({priority:v})} options={Object.entries(PRIORITY_META).map(([k,v])=>({value:k,label:v.label}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Assigned creator</label>
                  <Select value={form.creator} onChange={v=>set({creator:v})} options={USERS.map(u=>({value:u.id,label:u.name}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Assigned approver</label>
                  <Select value={form.approver} onChange={v=>set({approver:v})} options={USERS.filter(u=>u.role==="approver"||u.role==="admin").map(u=>({value:u.id,label:u.name}))}/>
                </div>
              </div>
              <TextField label="Internal notes" value={form.notes} onChange={v=>set({notes:v})} placeholder="Anything the approver should know…" textarea/>
            </div>
          )}
          {step===1 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:8}}>Master media</label>
              <label htmlFor="cf-upload" style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8, border:"2px dashed var(--border)", borderRadius:14, padding:"32px 16px", cursor:"pointer", background:"var(--surface-2)", marginBottom:16}}>
                <Icon name="upload" size={26} style={{color:"var(--ink-mute)"}}/>
                <div style={{fontSize:13, fontWeight:700}}>Drag & drop, or click to upload</div>
                <div style={{fontSize:11.5, color:"var(--ink-mute)"}}>MP4, MOV, JPG or PNG up to 500MB</div>
                <input id="cf-upload" type="file" accept="image/*,video/*" style={{display:"none"}} onChange={e=>{
                  const f=e.target.files[0]; if(!f) return;
                  const isVideo = f.type.startsWith("video/");
                  set({fileName:f.name, mediaType: isVideo?"video":"image", previewLoading:true, uploadStatus:"uploading", fileUrl:null});
                  // Small poster/thumbnail for instant feedback in the UI...
                  const task = isVideo ? videoFileToPoster(f, 480, 0.72) : imageFileToPreview(f, 480, 0.78);
                  task.then(dataUrl=>{ set({previewUrl:dataUrl, previewLoading:false}); })
                       .catch(()=>{ set({previewLoading:false}); });
                  // ...and the actual file, uploaded for real so it can be rewatched/reopened later by anyone.
                  uploadMediaFile(f).then(({url})=>{
                    set({fileUrl:url, uploadStatus:"done"});
                  }).catch(()=>{
                    set({uploadStatus:"failed"});
                    dispatch({type:"ADD_TOAST", message:"Upload failed — check your connection and try again.", variant:"danger"});
                  });
                }}/>
              </label>
              {form.fileName && (
                <div style={{display:"flex", gap:12, alignItems:"center", padding:12, borderRadius:12, background:"var(--surface-2)", marginBottom:16}}>
                  <div style={{width:52,height:52,borderRadius:10,overflow:"hidden",flexShrink:0, position:"relative"}}>
                    <Thumb item={{gradient:grad(form.fileName), media:{type:form.mediaType, duration:form.duration, previewUrl:form.previewUrl}}} radius={10} iconSize={18}/>
                    {form.previewLoading && <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,.25)"}}><Icon name="clock" size={16} style={{color:"#fff"}}/></div>}
                  </div>
                  <div style={{flex:1, overflow:"hidden"}}>
                    <div style={{fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{form.fileName}</div>
                    <div style={{fontSize:11, fontWeight:600, marginTop:2, color: form.uploadStatus==="failed"?"var(--red)": form.uploadStatus==="done"?"var(--green)":"var(--ink-mute)"}}>
                      {form.uploadStatus==="uploading"?"Uploading original file…": form.uploadStatus==="done"?"Uploaded — will be rewatchable by the whole team": form.uploadStatus==="failed"?"Upload failed": ""}
                    </div>
                  </div>
                </div>
              )}
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Media type</label>
                  <Select value={form.mediaType} onChange={v=>set({mediaType:v})} options={[{value:"video",label:"Video"},{value:"image",label:"Image"}]}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Aspect ratio</label>
                  <Select value={form.aspectRatio} onChange={v=>set({aspectRatio:v})} options={["9:16","1:1","4:5","16:9"].map(a=>({value:a,label:a}))}/>
                </div>
                {form.mediaType==="video" && <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Duration (sec)</label>
                  <input type="number" value={form.duration} onChange={e=>set({duration:e.target.value})} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>}
              </div>
            </div>
          )}
          {step===2 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:10}}>Select platforms</label>
              <div style={{display:"flex", flexDirection:"column", gap:8}}>
                {Object.entries(PLATFORM_META).map(([k,v])=>(
                  <label key={k} style={{display:"flex", alignItems:"center", gap:10, padding:"11px 13px", borderRadius:11, border:"1px solid "+(form.platforms.includes(k)?"var(--accent)":"var(--border)"), background: form.platforms.includes(k)?"var(--accent-soft)":"var(--surface)", cursor:"pointer"}}>
                    <input type="checkbox" checked={form.platforms.includes(k)} onChange={()=>togglePlatform(k)} style={{width:16,height:16}}/>
                    <PlatformIcon platform={k}/>
                    <span style={{fontWeight:700, fontSize:13.5}}>{v.label}</span>
                  </label>
                ))}
              </div>
            </div>
          )}
          {step===3 && (
            <div style={{display:"flex", flexDirection:"column", gap:16}}>
              {form.platforms.length===0 && <EmptyState icon="grid" title="No platforms selected" subtitle="Go back and select at least one platform to continue."/>}
              {form.platforms.map(p=>{
                const v = form.variants[p]||{};
                return (
                  <Card key={p} style={{padding:16}}>
                    <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:12}}><PlatformIcon platform={p}/><span style={{fontWeight:700, fontSize:14}}>{PLATFORM_META[p].label}</span></div>
                    {(p==="instagram"||p==="facebook") && <>
                      <TextField label="Caption" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="Write a caption…"/>
                      <TextField label="Hashtags" value={v.hashtagsText||""} onChange={val=>setVariant(p,{hashtagsText:val})} placeholder="#brand #campaign"/>
                      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <TextField label="Location tag" value={v.location||""} onChange={val=>setVariant(p,{location:val})} placeholder="Optional"/>
                        <TextField label="First comment" value={v.firstComment||""} onChange={val=>setVariant(p,{firstComment:val})} placeholder="Optional"/>
                      </div>
                    </>}
                    {p==="tiktok" && <>
                      <TextField label="Caption" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="Write a caption…"/>
                      <TextField label="Hashtags" value={v.hashtagsText||""} onChange={val=>setVariant(p,{hashtagsText:val})} placeholder="#brand #campaign"/>
                      <div style={{display:"flex", gap:16, flexWrap:"wrap", marginBottom:6}}>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.commentsEnabled} onChange={e=>setVariant(p,{commentsEnabled:e.target.checked})}/>Comments enabled</label>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.duetEnabled} onChange={e=>setVariant(p,{duetEnabled:e.target.checked})}/>Duet enabled</label>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.stitchEnabled} onChange={e=>setVariant(p,{stitchEnabled:e.target.checked})}/>Stitch enabled</label>
                      </div>
                    </>}
                    {p==="youtube" && <>
                      <TextField label="Title" value={v.title||""} onChange={val=>setVariant(p,{title:val})} placeholder="Video title"/>
                      <TextField label="Description" value={v.description||""} onChange={val=>setVariant(p,{description:val})} textarea placeholder="Video description"/>
                      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <div><label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>Visibility</label><Select value={v.visibility||"Public"} onChange={val=>setVariant(p,{visibility:val})} options={["Public","Unlisted","Private"].map(x=>({value:x,label:x}))}/></div>
                        <TextField label="Playlist" value={v.playlist||""} onChange={val=>setVariant(p,{playlist:val})} placeholder="Optional"/>
                      </div>
                    </>}
                    {p==="gbp" && <>
                      <TextField label="Post description" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="What's the update?"/>
                      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <div><label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>CTA type</label><Select value={v.cta||"Learn More"} onChange={val=>setVariant(p,{cta:val})} options={["Learn More","Order Online","Book","Call Now"].map(x=>({value:x,label:x}))}/></div>
                        <TextField label="CTA URL" value={v.url||""} onChange={val=>setVariant(p,{url:val})} placeholder="https://…"/>
                      </div>
                    </>}
                  </Card>
                );
              })}
            </div>
          )}
          {step===4 && (
            <div>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:6}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Publishing date</label>
                  <input type="date" onChange={e=>{ const t=form.scheduledAt? form.scheduledAt.slice(11,16):"09:00"; set({scheduledAt: e.target.value+"T"+t+":00"}); }} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Publishing time</label>
                  <input type="time" onChange={e=>{ const d=form.scheduledAt? form.scheduledAt.slice(0,10) : new Date().toISOString().slice(0,10); set({scheduledAt: d+"T"+e.target.value+":00"}); }} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>
              </div>
              <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:16}}>Applies to all selected platforms unless overridden below.</div>
              {form.platforms.map(p=>(
                <div key={p} style={{display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderTop:"1px solid var(--border)"}}>
                  <PlatformIcon platform={p} size={14}/>
                  <span style={{fontSize:12.5, fontWeight:700, width:130}}>{PLATFORM_META[p].label}</span>
                  <input type="datetime-local" onChange={e=>setVariant(p,{overrideTime: e.target.value? e.target.value+":00":null})} style={{borderRadius:8, border:"1px solid var(--border)", padding:"6px 9px", fontSize:12.5}}/>
                </div>
              ))}
            </div>
          )}
          <div style={{display:"flex", justifyContent:"space-between", marginTop:24, paddingTop:18, borderTop:"1px solid var(--border)"}}>
            <Button variant="ghost" icon="chevronLeft" onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}>Back</Button>
            <div style={{display:"flex", gap:10}}>
              <Button variant="ghost" onClick={()=>submit("draft")}>Save as Draft</Button>
              {step<4 ? <Button variant="primary" onClick={()=>setStep(s=>Math.min(4,s+1))}>Continue</Button>
                : <Button variant="success" icon="check" onClick={()=>submit("submitted")}>Submit for Approval</Button>}
            </div>
          </div>
        </Card>

        <Card style={{padding:16, position:"sticky", top:16}}>
          <SectionTitle>Preview</SectionTitle>
          <div style={{height:150, borderRadius:12, overflow:"hidden", marginBottom:12}}>
            <Thumb item={{gradient:grad(form.title||"preview"), media:{type:form.mediaType, duration:form.duration, previewUrl:form.previewUrl}}} radius={12} iconSize={26}/>
          </div>
          <div style={{fontWeight:700, fontSize:14, marginBottom:4}}>{form.title || "Untitled content"}</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:12}}>{BRANDS.find(b=>b.id===form.brand).name} · {CAMPAIGNS.find(c=>c.id===form.campaign)?.name}</div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:14}}>{form.platforms.map(p=><PlatformIcon key={p} platform={p} size={14}/>)}</div>
          <div style={{fontSize:11.5, fontWeight:700, color:"var(--ink-mute)", textTransform:"uppercase", letterSpacing:".4px", marginBottom:8}}>Validation</div>
          {warnings.length===0 ? (
            <div style={{display:"flex", gap:6, alignItems:"center", fontSize:12.5, color:"var(--green)", fontWeight:600}}><Icon name="check" size={14}/>Looks good</div>
          ):(
            <div style={{display:"flex", flexDirection:"column", gap:7}}>
              {warnings.map((w,i)=><div key={i} style={{display:"flex", gap:6, fontSize:12, color:"var(--amber)"}}><Icon name="warn" size={13} style={{marginTop:1, flexShrink:0}}/>{w}</div>)}
            </div>
          )}
        </Card>
      </div>
      <style>{`@media (max-width:900px){ .cf-wiz-grid{ grid-template-columns:1fr !important; } }`}</style>
    </div>
  );
}

function PostAnalyticsDrawer({post, onClose}){
  if(!post) return null;
  const metrics = [
    {label:"Views", value:post.views, icon:"trend"}, {label:"Reach", value:post.reach, icon:"share"},
    {label:"Likes", value:post.likes, icon:"heart"}, {label:"Comments", value:post.comments, icon:"comment"},
    {label:"Shares", value:post.shares, icon:"share"}, {label:"Saves", value:post.saves, icon:"save"},
  ];
  return (
    <Drawer open={!!post} onClose={onClose} width={520}>
      <div style={{padding:20, borderBottom:"1px solid var(--border)"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11.5, color:"var(--ink-mute)", fontWeight:600, marginBottom:3, display:"flex", alignItems:"center", gap:6}}><PlatformIcon platform={post.platform} size={12}/>{post.account}</div>
            <h2 style={{fontSize:17, margin:0}}>{post.contentTitle}</h2>
          </div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:9,border:"1px solid var(--border)",background:"var(--surface)",cursor:"pointer"}}><Icon name="x" size={16}/></button>
        </div>
        <div style={{fontSize:12, color:"var(--ink-mute)", marginTop:6}}>Published {fmtDateTime(post.publishedAt)} · Analytics last updated {fmtDateTime(post.analyticsUpdatedAt)}</div>
      </div>
      <div style={{padding:20}}>
        <div style={{height:170, borderRadius:14, overflow:"hidden", marginBottom:18}}><Thumb item={{gradient:post.gradient, media:{type:"video"}}} radius={14} iconSize={30}/></div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:18}}>
          {metrics.map(m=>(
            <div key={m.label} style={{background:"var(--surface-2)", borderRadius:11, padding:"12px 10px"}}>
              <div style={{fontSize:10.5, fontWeight:700, color:"var(--ink-mute)", textTransform:"uppercase", marginBottom:4}}>{m.label}</div>
              <div className="num" style={{fontSize:17, fontWeight:800}}>{fmtNum(m.value)}</div>
            </div>
          ))}
        </div>
        <Card style={{padding:14, marginBottom:18, background:"var(--emerald-soft)", border:"1px solid #A7DFC5"}}>
          <div style={{fontSize:12, color:"var(--ink-mute)", fontWeight:700, marginBottom:3}}>ENGAGEMENT RATE</div>
          <div className="num" style={{fontSize:22, fontWeight:800, color:"var(--emerald)"}}>{fmtPct(post.engagementRate)}</div>
          <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:2}}>(Likes + Comments + Shares + Saves) ÷ Views × 100 — demonstration data</div>
        </Card>
        <SectionTitle>Performance over time</SectionTitle>
        <LineChart height={190} xLabels={post.snapshots.map(s=>s.label)} series={[
          {name:"Views", color:"var(--accent)", points:post.snapshots.map(s=>s.views)},
          {name:"Likes", color:"var(--emerald)", points:post.snapshots.map(s=>s.likes)},
        ]}/>
        {post.postUrl && <a href={post.postUrl} target="_blank" rel="noreferrer" style={{display:"inline-flex", alignItems:"center", gap:6, marginTop:16, fontSize:12.5, fontWeight:700, color:"var(--accent)", textDecoration:"none"}}>View live post <Icon name="external" size={13}/></a>}
      </div>
    </Drawer>
  );
}

function PublishedContentPage(){

  const [view, setView] = useState("grid");
  const [q, setQ] = useState("");
  const [selected, setSelected] = useState(null);
  const posts = state.publishedPosts.filter(p=> !q || p.contentTitle.toLowerCase().includes(q.toLowerCase()) || p.account.toLowerCase().includes(q.toLowerCase()));

  return (
    <div>
      <PageHeader title="Published Content" subtitle={posts.length+" live posts across all connected accounts."}/>
      <Card style={{padding:14, marginBottom:16, display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
        <div style={{position:"relative", flex:1, minWidth:200}}>
          <Icon name="search" size={15} style={{position:"absolute", left:10, top:9, color:"var(--ink-mute)"}}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search published posts…" style={{width:"100%", padding:"8px 10px 8px 32px", borderRadius:9, border:"1px solid var(--border)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        </div>

      view==="grid" ? (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(230px,1fr))", gap:14}}>
          {posts.map(p=>(
            <Card key={p.id} onClick={()=>setSelected(p)} style={{padding:0, cursor:"pointer", overflow:"hidden"}}>

                <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:6}}><PlatformIcon platform={p.platform} size={12}/><span style={{fontSize:11, color:"var(--ink-mute)", fontWeight:600}}>{fmtDate(p.publishedAt)}</span></div>
                <div style={{fontSize:13, fontWeight:700, marginBottom:8, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.contentTitle}</div>
                <div style={{display:"flex", justifyContent:"space-between", fontSize:11.5, color:"var(--ink-soft)", fontWeight:600}}>
                  <span>{fmtNum(p.views)} views</span><span>{fmtPct(p.engagementRate)} eng.</span>
                </div>
              </div>
            </Card>
          ))}
        </div>
      ):(
        <Card style={{padding:0, overflow:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse", fontSize:13, minWidth:820}}>
            <thead><tr style={{textAlign:"left", borderBottom:"1px solid var(--border)"}}>
              {["","Post","Platform","Account","Published","Views","Reach","Likes","Eng. rate","Updated"].map(h=><th key={h} style={{padding:"10px 12px", fontSize:11.5, color:"var(--ink-mute)", fontWeight:700, textTransform:"uppercase"}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {posts.map(p=>(
