name = "sanjugo-content-engine"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Nightly storage clean-up (03:30 UTC) — see "Storage lifecycle" in src/worker.js.
[triggers]
crons = ["30 3 * * *", "*/5 * * * *"]

# The Google Drive folder that holds the content library ("Sanjugo Marketing Contents Final").
[vars]
LIBRARY_FOLDER_ID = "11YpaH0QMfCekJEH3oiqEAvO3Cc-wTaqO"
# Public address Make downloads media from when auto-publishing on a schedule.
PUBLIC_URL = "https://sanjugo-content-engine.rapid-dust-8baf.workers.dev"
# Sign-in (Cloudflare Access). Leave ACCESS_* empty to keep the site open; fill both to require sign-in.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# These emails always get in as admins, so the team can never be locked out.
BOOTSTRAP_ADMINS = "admin@sanjugo.co.uk"

[assets]
directory = "./public"
binding = "ASSETS"

# Filled in automatically by the setup commands in README.md — you shouldn't need to touch this.
[[d1_databases]]
binding = "DB"
database_name = "contentflow-db"
database_id = "32fd6952-121c-4f8f-8676-aaaa76c6dc55"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "contentflow-media"
