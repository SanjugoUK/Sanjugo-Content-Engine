/* Published Content is a study room, not just a history: every live post (plus influencer posts added by hand)
   gets tags — collab, promotion, content type, branch, dish — guessed from the caption and editable; you compare
   any tag by average views or engagement, see which day and time work, read each caption broken down, ask AI why
   a post worked, keep team notes, and start a new project from a winner. */
const OUR_HANDLES = ["sanjugo", "sanjugo_restaurant", "sanjugouk", "sanjugo_london", "sanjugolondon"];
const STUDY_DIMS = [["collab","Influencer"], ["promo","Promotion"], ["type","Content type"], ["branch","Branch"], ["dish","Dish"], ["platform","Platform"], ["weekday","Day"], ["slot","Time of day"]];
// What each "Compare by" answers, in plain words.
const STUDY_DIM_HELP = {
  collab:"Each influencer's posts against our own. Views, how they compare with our usual, cost per 1,000 views, and whether to book them again.",
  promo:"Average result of posts for each promotion or campaign. Did the offer pull people in?",
  type:"Which kind of content (food close-up, behind the scenes, offer…) gets the most.",
  branch:"Posts about Shoreditch vs Angel vs Victoria.",
  dish:"Which dishes people watch and react to most.",
  platform:"Instagram vs Facebook vs TikTok… for the same period.",
  weekday:"Average for posts published on each day of the week. Tells you the best day to post.",
  slot:"Average for posts published at each time of day (morning, lunch, evening…).",
};
const collabList = v=> String(v||"").split(/[\s,;]+|(?=@)/).map(x=>x.trim()).filter(x=>x.length>1).map(x=>x.startsWith("@")? x.toLowerCase() : "@"+x.toLowerCase());
const STUDY_SLOTS = [["Morning",5,11], ["Lunch",11,14], ["Afternoon",14,17], ["Evening",17,21], ["Late",21,29]];
const STUDY_DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const STUDY_CTA = ["see you", "save you a seat", "come by", "come in", "book", "link in bio", "visit", "order", "tag a friend", "dm", "join us", "swipe"];
const studySlot = d=>{ const h = d.getHours() < 5 ? d.getHours()+24 : d.getHours(); return (STUDY_SLOTS.find(([, a, b])=>h>=a && h<b)||STUDY_SLOTS[0])[0]; };
const studyDay = d=>STUDY_DAYS[(d.getDay()+6)%7];

function studyCaption(c){
  const text = String(c||"");
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const hook = (lines[0]||"").replace(/#\S+/g,"").trim();
  const tags = text.match(/#[\wÀ-￿]+/g) || [];
  const mentions = (text.match(/@[\w.]+/g) || []).map(m=>m.replace(/\.+$/,"")).filter(m=>m.length>1 && !OUR_HANDLES.includes(m.slice(1).toLowerCase()));
  const emojis = text.match(/\p{Extended_Pictographic}/gu) || [];
  const words = text.replace(/#\S+|@\S+/g,"").split(/\s+/).filter(w=>/[a-z0-9]/i.test(w)).length;
  const low = text.toLowerCase();
  const cta = STUDY_CTA.filter(k=>low.includes(k));
  return {hook, tags, mentions, emojis:emojis.length, words, cta};
}
// Best guesses from what we already know; anything saved by the team wins ("-" means cleared on purpose).
function studyAutoTags(post, item, campaigns){
  const low = String(post.caption||"").toLowerCase();
  const out = {};
  const m = studyCaption(post.caption).mentions[0];
  if(post.manual && post.account) out.collab = post.account; else if(m) out.collab = m.toLowerCase();
  const camp = item && item.campaign ? campaigns.find(c=>c.id===item.campaign || c.name===item.campaign) : null;
  if(camp) out.promo = camp.name;
  else {
    const hit = campaigns.find(c=>{ const keys = (c.name.toLowerCase().match(/£?\d+(\.\d+)?|giveaway|lottery|delivery|lunch|creation|reopening/g)||[]); return keys.length && keys.every(k=>low.includes(k)); });
    if(hit) out.promo = hit.name;
  }
  const cat = item && item.libraryRef && item.libraryRef.category;
  if(cat && LIB_CATEGORY[cat]) out.type = LIB_CATEGORY[cat];
  else if(/\b(offer|free|£|% off|giveaway|deal)\b/.test(low)) out.type = LIB_CATEGORY.PO;
  const branches = ["shoreditch","angel","victoria"].filter(b=>low.includes(b));
  if(branches.length===1) out.branch = branches[0][0].toUpperCase()+branches[0].slice(1); else if(branches.length>1) out.branch = "All branches";
  const dish = Object.values(LIB_DISH).find(d=>low.includes(d.toLowerCase().replace(/ \(.*\)$/,"")));
  if(dish) out.dish = dish;
  return out;
}

function useStudy(){
  const [entries, setEntries] = useState(null);
  const load = useCallback(()=> fetch("/api/study", {cache:"no-store"}).then(r=>r.ok? r.json() : {entries:[]}).then(d=>setEntries(d.entries||[])).catch(()=>setEntries([])), []);
  useEffect(()=>{ load(); }, [load]);
  return [entries, load];
}
function useStudyPost(){
  const {state} = useApp();
  return useCallback(async (path, body)=>{
    const r = await fetch("/api/study/"+path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...body, userId: state.currentUserId})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || "Something went wrong");
    return d;
  }, [state.currentUserId]);
}

function PublishedContentPage(){
  const {state} = useApp();
  const realData = useRealAnalytics();
  const [entries, reload] = useStudy();
  const [q, setQ] = useState("");
  const [period, setPeriod] = useState(90);
  const [platform, setPlatform] = useState("");
  const [collabOnly, setCollabOnly] = useState(false);
  const [showHidden, setShowHidden] = useState(false);
  const [dim, setDim] = useState("collab");
  const [metric, setMetric] = useState("views");
  const [pick, setPick] = useState(null); // {dim, value} from tapping a bar
  const [sort, setSort] = useState("newest");
  const [openKey, setOpenKey] = useState(null);
  const [adding, setAdding] = useState(null);
  const campaigns = state.campaigns || [];
  const byKey = useMemo(()=>Object.fromEntries((entries||[]).map(e=>[e.key, e])), [entries]);

  // Every post — pulled from Make, and added by hand — with its tags worked out.
  const all = useMemo(()=>{
    const items = new Map(state.contentItems.map(i=>[i.id, i]));
    const real = realAnalyticsPosts(realData, state.contentItems).map(p=>({...p, key:p.platform+":"+p.postId}));
    const manual = (entries||[]).filter(e=>e.manual).map(e=>{
      const m = e.manual; const title = (m.caption||"").split("\n")[0].slice(0,70) || (m.account+" collab");
      const eng = m.likes+m.comments+m.shares+m.saves;
      return {id:"m_"+e.key, key:e.key, manual:true, account:m.account, platform:m.platform, contentTitle:title, caption:m.caption, publishedAt:m.publishedAt, permalink:m.url,
        views:m.views, reach:m.views, likes:m.likes, comments:m.comments, shares:m.shares, saves:m.saves, engagementRate: m.views? eng/m.views*100 : (m.likes+m.comments ? null : 0), gradient:grad(title), thumb:m.thumb||null, snapshots:[], fetch:m.fetch||null};
    });
    return [...real, ...manual].map(p=>{
      const item = p.contentId && items.get(p.contentId);
      const auto = studyAutoTags(p, item, campaigns);
      const saved = (byKey[p.key]||{}).tags || {};
      const tags = {}, isAuto = {};
      for(const [k] of STUDY_DIMS.slice(0,5)){
        if(saved[k]==="-") continue;
        if(saved[k]) tags[k] = saved[k]; else if(auto[k]){ tags[k] = auto[k]; isAuto[k] = true; }
      }
      if(saved.cost && saved.cost!=="-" && tags.collab) tags.cost = saved.cost;
      const d = new Date(p.publishedAt);
      return {...p, item, tags, isAuto, weekday:studyDay(d), slot:studySlot(d), study:byKey[p.key]||null};
    });
  }, [realData, state.contentItems, entries, campaigns]);

  // "Usual" = the median views / engagement of our own posts on that platform in the period.
  const cutoff = period ? Date.now() - period*86400e3 : 0;
  const hiddenCount = all.filter(p=>p.study && p.study.hidden).length;
  useEffect(()=>{ if(showHidden && !hiddenCount) setShowHidden(false); }, [showHidden, hiddenCount]);
  const inPeriod = all.filter(p=> new Date(p.publishedAt).getTime() >= cutoff && (showHidden ? (p.study && p.study.hidden) : !(p.study && p.study.hidden)));
  const usual = useMemo(()=>{
    const out = {};
    for(const pl of Object.keys(PLATFORM_META)){
      const own = inPeriod.filter(p=>p.platform===pl && !p.manual);
      const med = arr=>{ const a = [...arr].sort((x,y)=>x-y); return a.length ? a[Math.floor(a.length/2)] : 0; };
      out[pl] = {views:med(own.map(p=>p.views)), eng:med(own.map(p=>p.engagementRate))};
    }
    return out;
  }, [inPeriod]);
  const timesUsual = p=>{ const u = (usual[p.platform]||{}).views; return u ? p.views/u : null; };
  const valueOf = (p, k)=> k==="platform" ? PLATFORM_META[p.platform].label : k==="weekday" ? p.weekday : k==="slot" ? p.slot : (p.tags[k] || null);
  // A collab with two accounts counts for each of them.
  const valuesOf = (p, k)=>{ const v = valueOf(p, k); return !v ? [] : k==="collab" ? collabList(v) : [v]; };

  const ql = q.trim().toLowerCase();
  const shown = inPeriod.filter(p=>
    (!platform || p.platform===platform) && (!collabOnly || p.tags.collab) && (!pick || (pick.value==="Our own posts" ? !p.tags.collab : valuesOf(p, pick.dim).includes(pick.value))) &&
    (!ql || [p.contentTitle, p.caption, ...Object.values(p.tags)].join(" ").toLowerCase().includes(ql)));
  const sorted = [...shown].sort((a,b)=> sort==="views" ? b.views-a.views : sort==="eng" ? (b.engagementRate||0)-(a.engagementRate||0) : sort==="usual" ? (timesUsual(b)||0)-(timesUsual(a)||0) : new Date(b.publishedAt)-new Date(a.publishedAt));

  // Compare: average per tag value (for Influencer, posts without one count as "Our own posts").
  const base = inPeriod.filter(p=>(!platform || p.platform===platform) && (!collabOnly || p.tags.collab));
  const groups = {};
  base.forEach(p=>{ const vs = valuesOf(p, dim); (vs.length ? vs : dim==="collab" ? ["Our own posts"] : []).forEach(v=>{ (groups[v] = groups[v]||[]).push(p); }); });
  const engOf = ps=>{ const a = ps.filter(p=>p.engagementRate!=null); return a.length ? a.reduce((s,p)=>s+p.engagementRate,0)/a.length : 0; };
  const bars = Object.entries(groups).map(([v, ps])=>({v, n:ps.length, val: metric==="views" ? ps.reduce((s,p)=>s+p.views,0)/ps.length : engOf(ps)}))
    .sort((a,b)=>b.val-a.val).slice(0, dim==="collab" ? 30 : 10);
  // Influencer scorecard: one row per account, our own posts as the baseline.
  const score = dim==="collab" ? Object.entries(groups).map(([v, ps])=>{
    const views = ps.reduce((s,p)=>s+p.views,0);
    const xs = ps.map(timesUsual).filter(x=>x!=null);
    const cost = ps.reduce((s,p)=>s+(Number(p.tags.cost)||0),0);
    const last = ps.reduce((m,p)=>p.publishedAt>m? p.publishedAt : m, "");
    const x = xs.length ? xs.reduce((s,a)=>s+a,0)/xs.length : null;
    return {v, own: v==="Our own posts", n:ps.length, avg: views/ps.length, x, eng: engOf(ps), cost, per1k: cost && views ? cost/views*1000 : null, last};
  }).sort((a,b)=> a.own? 1 : b.own? -1 : b.avg-a.avg) : [];
  const verdict = r=> r.own || r.x==null ? null : r.x>=1.3 ? ["Book again", "var(--green)", "var(--green-soft)"] : r.x>=0.8 ? ["Okay", "var(--amber)", "var(--amber-soft)"] : ["Skip", "var(--red)", "var(--red-soft)"];
  const dimLabel = STUDY_DIMS.find(d=>d[0]===dim)[1];
  const maxBar = Math.max(1, ...bars.map(b=>b.val));
  const untagged = base.filter(p=>!valuesOf(p, dim).length).length;

  // When it works: average engagement per day × time of day.
  const heat = {};
  base.forEach(p=>{ const k = p.weekday+"|"+p.slot; (heat[k] = heat[k]||[]).push(p.engagementRate); });
  const avg = a=>a.reduce((s,x)=>s+x,0)/a.length;
  const cells = Object.entries(heat).map(([k, a])=>({k, v:avg(a), n:a.length}));
  const maxHeat = Math.max(0.01, ...cells.map(c=>c.v));
  const bestCell = cells.filter(c=>c.n>=1).sort((a,b)=>b.v-a.v)[0];
  const worstCell = cells.filter(c=>c.n>=1).sort((a,b)=>a.v-b.v)[0];

  const open = all.find(p=>p.key===openKey) || null;
  const chip = (on, label, onClick)=> <button onClick={onClick} style={{padding:"6px 12px", borderRadius:99, fontSize:12.5, fontWeight:600, cursor:"pointer", border:"1px solid "+(on? "var(--accent)":"var(--border)"), background: on? "var(--accent-soft)":"var(--surface)", color: on? "var(--accent-dark)":"var(--ink-soft)", whiteSpace:"nowrap"}}>{label}</button>;
  return (
    <div>
      <PageHeader title="Published Content" subtitle={inPeriod.length+" posts · study what worked"+(realData && realData.lastPull? " · stats "+fmtDateTime(realData.lastPull.at) : "")}
        action={<Button variant="primary" icon="plus" onClick={()=>setAdding({})}>Add collab post</Button>}/>

      <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center", marginBottom:14}}>
        {[[30,"30 days"],[90,"90 days"],[365,"1 year"],[0,"All time"]].map(([d,l])=><React.Fragment key={d}>{chip(period===d, l, ()=>setPeriod(d))}</React.Fragment>)}
        <span style={{width:6}}/>
        <Select value={platform} onChange={setPlatform} options={[{value:"", label:"All platforms"}, ...Object.entries(PLATFORM_META).map(([k,m])=>({value:k, label:m.label}))]} style={{minWidth:150}}/>
        {chip(collabOnly, "Collabs only", ()=>setCollabOnly(v=>!v))}
        {(hiddenCount>0 || showHidden) && chip(showHidden, showHidden ? "← Back to all posts" : "Hidden ("+hiddenCount+")", ()=>setShowHidden(v=>!v))}
        <span style={{flex:1}}/>
        <div className="cf-search" style={{position:"relative", width:"min(100%, 240px)"}}>
          <Icon name="search" size={15} style={{position:"absolute", left:10, top:9, color:"var(--ink-mute)"}}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search captions, tags…" style={{width:"100%", padding:"8px 10px 8px 32px", borderRadius:9, border:"1px solid var(--border)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        </div>
      </div>

      <div className={"cf-study-top"+(dim==="collab" ? " cf-study-wide" : "")}>
        <Card style={{padding:16}}>
          <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:6}}>
            <span style={{fontWeight:600, fontSize:14}}>Compare by</span>
            <Select value={dim} onChange={v=>{ setDim(v); setPick(null); }} options={STUDY_DIMS.map(([k,l])=>({value:k, label:l}))} style={{minWidth:140}}/>
            <span style={{flex:1}}/>
            {dim!=="collab" && <>{chip(metric==="views", "Avg views", ()=>setMetric("views"))}{chip(metric==="eng", "Avg engagement", ()=>setMetric("eng"))}</>}
          </div>
          <div style={{fontSize:12, color:"var(--ink-mute)", lineHeight:1.45, marginBottom:12}}>{STUDY_DIM_HELP[dim]} <b style={{color:"var(--ink-soft)"}}>Tap a row to see only those posts.</b></div>
          {!bars.length ? <div style={{fontSize:12.5, color:"var(--ink-mute)", padding:"10px 0"}}>Nothing tagged with {dimLabel.toLowerCase()} yet. Open a post and add it.</div>
          : dim==="collab" ? (
            <div style={{overflowX:"auto", margin:"0 -4px"}}>
              <table className="cf-score" style={{width:"100%", borderCollapse:"collapse", fontSize:12.5, minWidth:520}}>
                <thead><tr>{["Influencer","Posts","Avg views","vs our usual","Eng.","Cost","£ / 1k views","Last",""].map((h,i)=><th key={i} style={{textAlign: i===0? "left":"right"}}>{h}</th>)}</tr></thead>
                <tbody>{score.map(r=>{ const vd = verdict(r); const on = pick && pick.value===r.v; return (
                  <tr key={r.v} onClick={()=>setPick(on ? null : {dim, value:r.v})} title="Show only these posts" style={{cursor:"pointer", background: on? "var(--accent-soft)" : undefined, color: r.own? "var(--ink-mute)" : undefined}}>
                    <td style={{fontWeight:700, maxWidth:150, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{r.v}</td>
                    <td className="num">{r.n}</td>
                    <td className="num"><b>{fmtNum(Math.round(r.avg))}</b></td>
                    <td className="num" style={{color: r.x==null? undefined : r.x>=1.3? "var(--green)" : r.x<0.8? "var(--red)" : undefined, fontWeight:600}}>{r.own? "baseline" : r.x==null? "—" : r.x.toFixed(1).replace(/\.0$/,"")+"×"}</td>
                    <td className="num">{r.eng ? fmtPct(r.eng) : "—"}</td>
                    <td className="num">{r.cost ? "£"+Math.round(r.cost) : "—"}</td>
                    <td className="num">{r.per1k!=null ? "£"+r.per1k.toFixed(2) : "—"}</td>
                    <td className="num" style={{whiteSpace:"nowrap"}}>{r.last ? fmtDate(r.last, {day:"numeric", month:"short"}) : ""}</td>
                    <td style={{textAlign:"right"}}>{vd && <span style={{fontSize:10.5, fontWeight:700, padding:"2px 7px", borderRadius:99, background:vd[2], color:vd[1], whiteSpace:"nowrap"}}>{vd[0]}</span>}</td>
                  </tr>); })}</tbody>
              </table>
              <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:8}}>"vs our usual" = their views ÷ our usual views on that platform. Book again ≥ 1.3×, Skip &lt; 0.8×. Add a cost on each collab post to see £ per 1,000 views.</div>
            </div>
          ) : bars.map(b=>(
            <button key={b.v} onClick={()=>setPick(pick && pick.value===b.v ? null : {dim, value:b.v})} title="Show only these posts"
              style={{width:"100%", display:"grid", gridTemplateColumns:"minmax(90px, 140px) 1fr auto", gap:10, alignItems:"center", padding:"5px 6px", margin:"0 -6px", borderRadius:8, border:"none", background: pick && pick.value===b.v ? "var(--accent-soft)" : "none", cursor:"pointer", color:"var(--ink)", textAlign:"left"}}>
              <span style={{fontSize:12.5, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{b.v}</span>
              <span style={{height:9, borderRadius:5, background:"var(--surface-2)"}}><span style={{display:"block", height:9, borderRadius:5, width:Math.max(3, b.val/maxBar*100)+"%", background: pick && pick.value===b.v ? "var(--accent-dark)" : "var(--accent)"}}/></span>
              <span className="num" style={{fontSize:12, color:"var(--ink-soft)", whiteSpace:"nowrap"}}><b style={{color:"var(--ink)"}}>{metric==="views"? fmtNum(Math.round(b.val)) : fmtPct(b.val)}</b> · {b.n} post{b.n>1?"s":""}</span>
            </button>
          ))}
          {untagged>0 && dim!=="collab" && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:6}}>{untagged} post{untagged>1?"s":""} without a {dimLabel.toLowerCase()} tag</div>}
        </Card>
        <Card style={{padding:16}}>
          <div style={{fontWeight:600, fontSize:14, marginBottom:12}}>When it works <span style={{fontSize:11.5, fontWeight:500, color:"var(--ink-mute)"}}>avg engagement</span></div>
          <div style={{display:"grid", gridTemplateColumns:"64px repeat(7, 1fr)", gap:3, fontSize:10.5, color:"var(--ink-mute)"}}>
            <span/>{STUDY_DAYS.map(d=><span key={d} style={{textAlign:"center"}}>{d}</span>)}
            {STUDY_SLOTS.map(([s])=><React.Fragment key={s}>
              <span style={{alignSelf:"center"}}>{s}</span>
              {STUDY_DAYS.map(d=>{ const c = cells.find(x=>x.k===d+"|"+s); return (
                <button key={d} onClick={()=>c && setPick({dim:"weekday", value:d})} title={c? d+" "+s.toLowerCase()+": "+fmtPct(c.v)+" · "+c.n+" post"+(c.n>1?"s":"") : "No posts"}
                  style={{height:22, borderRadius:4, border:"none", cursor: c? "pointer":"default", background: c ? "color-mix(in srgb, var(--accent) "+Math.round(15+c.v/maxHeat*85)+"%, transparent)" : "var(--surface-2)"}}/>
              ); })}
            </React.Fragment>)}
          </div>
          {bestCell && <div style={{fontSize:12, color:"var(--ink-soft)", marginTop:10}}>Best: <b>{bestCell.k.replace("|"," ")}</b>{worstCell && worstCell.k!==bestCell.k && <> · Weakest: {worstCell.k.replace("|"," ")}</>}</div>}
        </Card>
      </div>

      <div style={{display:"flex", alignItems:"center", gap:8, margin:"18px 0 10px"}}>
        <span style={{fontWeight:600, fontSize:14}}>{sorted.length} post{sorted.length===1?"":"s"}</span>
        {pick && <span style={{display:"inline-flex", alignItems:"center", gap:6, fontSize:12.5, padding:"4px 6px 4px 10px", borderRadius:99, background:"var(--accent-soft)", color:"var(--accent-dark)", fontWeight:600}}>
          {(STUDY_DIMS.find(d=>d[0]===pick.dim)||[,""])[1]}: {pick.value}
          <button onClick={()=>setPick(null)} aria-label="Show all posts" style={{border:"none", background:"none", cursor:"pointer", color:"inherit", display:"flex", padding:2}}><Icon name="x" size={13}/></button></span>}
        <span style={{flex:1}}/>
        <Select value={sort} onChange={setSort} options={[{value:"newest", label:"Newest"}, {value:"views", label:"Most views"}, {value:"eng", label:"Best engagement"}, {value:"usual", label:"Most above usual"}]} style={{minWidth:170}}/>
      </div>
      {entries===null ? <Skeleton h={200}/> : !sorted.length ? <Card><EmptyState icon="published" title="No posts here" subtitle={all.length? "Try another period or filter." : "Pull stats in Settings, or add an influencer post."}/></Card> : (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(240px, 1fr))", gap:14}}>
          {sorted.map(p=>{ const x = timesUsual(p); const hook = studyCaption(p.caption).hook || p.contentTitle; return (
            <Card key={p.key} onClick={()=>setOpenKey(p.key)} style={{padding:0, overflow:"hidden", cursor:"pointer"}}>
              <div style={{height:120, position:"relative"}}>
                <PostThumb post={p} radius={0} iconSize={24}/>
                {x!=null && (x>=1.5 || x<=0.6) && <span style={{position:"absolute", top:8, right:8, fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:99, background: x>=1.5? "var(--green)":"var(--red)", color:"#fff"}}>{x>=1.5? x.toFixed(1).replace(/\.0$/,"")+"× usual" : "below usual"}</span>}
                <StudyRemove post={p} reload={reload}/>
                {p.manual && <span style={{position:"absolute", top:8, left:8, right:8, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", width:"fit-content", maxWidth:"calc(100% - 16px)", fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:99, background:"rgba(0,0,0,.6)", color:"#fff"}}>{p.account}</span>}
              </div>
              <div style={{padding:12}}>
                <div style={{display:"flex", alignItems:"center", gap:6, fontSize:11, color:"var(--ink-mute)", fontWeight:600, marginBottom:5}}><PlatformIcon platform={p.platform} size={11}/>{p.weekday} {fmtDate(p.publishedAt, {day:"numeric", month:"short"})} · {new Date(p.publishedAt).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"})}</div>
                <div style={{fontSize:13, fontWeight:600, lineHeight:1.35, marginBottom:8, overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical"}}>{hook}</div>
                <div style={{display:"flex", gap:12, fontSize:12, color:"var(--ink-soft)", marginBottom:8}}><span><b className="num" style={{color:"var(--ink)"}}>{fmtNum(p.views)}</b> views</span>{p.engagementRate!=null ? <span><b className="num" style={{color:"var(--ink)"}}>{fmtPct(p.engagementRate)}</b> eng.</span> : <span><b className="num" style={{color:"var(--ink)"}}>{fmtNum(p.likes)}</b> likes</span>}
                  {p.fetch && p.fetch.status==="pending" && <span style={{color:"var(--blue)"}}>fetching…</span>}</div>
                <div style={{display:"flex", gap:4, flexWrap:"wrap"}}>
                  {Object.entries(p.tags).filter(([k])=>k!=="cost").map(([k, v])=><span key={k} style={{fontSize:10.5, fontWeight:600, padding:"2px 7px", borderRadius:99, background: k==="collab"? "var(--violet-soft)" : "var(--surface-2)", color: k==="collab"? "var(--violet)" : "var(--ink-soft)", whiteSpace:"nowrap"}}>{v}</span>)}
                  {(p.study && p.study.notes && p.study.notes.length>0) && <span style={{fontSize:10.5, color:"var(--ink-mute)"}}>💬 {p.study.notes.length}</span>}
                </div>
              </div>
            </Card>
          ); })}
        </div>
      )}
      {open && <StudyDrawer post={open} usual={usual[open.platform]||{}} onClose={()=>setOpenKey(null)} reload={reload} onEdit={()=>{ setAdding(open); setOpenKey(null); }} campaigns={campaigns} known={[...new Set(all.map(p=>p.tags.collab).filter(Boolean))]}/>}
      {adding && <AddInfluencerPost post={adding.key ? adding : null} onClose={()=>setAdding(null)} onSaved={()=>{ setAdding(null); reload(); }}/>}
      <style>{`.cf-score th{font-size:11px; font-weight:700; color:var(--ink-mute); padding:6px 6px; border-bottom:1px solid var(--border); white-space:nowrap;} .cf-score td{padding:7px 6px; border-bottom:1px solid var(--border); text-align:right;} .cf-score td:first-child{text-align:left;} .cf-score tbody tr:hover{background:var(--surface-2);} .cf-study-top{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px;} .cf-study-top.cf-study-wide{grid-template-columns:minmax(0,1fr);} @media (max-width:900px){ .cf-study-top{grid-template-columns:minmax(0,1fr);} }`}</style>
    </div>
  );
}

function StudyDrawer({post, usual, onClose, reload, onEdit, campaigns, known}){
  const {state, dispatch} = useApp();
  const send = useStudyPost();
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const [timeline, setTimeline] = useState(false);
  const [watch, setWatch] = useState(false);
  const c = studyCaption(post.caption);
  const st = post.study || {};
  const x = usual.views ? post.views/usual.views : null;
  const toast = (message, variant)=>dispatch({type:"ADD_TOAST", message, variant});
  async function setTag(k, v){ try{ await send("tags", {key:post.key, tags:{[k]: v}}); await reload(); }catch(e){ toast(e.message, "danger"); } }
  async function why(){
    setBusy(true);
    try{
      await send("why", {key:post.key, post:{platform:PLATFORM_META[post.platform].label, type:post.type, when:post.weekday+" "+fmtDateTime(post.publishedAt), views:post.views, likes:post.likes, comments:post.comments, shares:post.shares, saves:post.saves,
        engagement:post.engagementRate, usualViews:usual.views, usualEngagement:usual.eng, caption:post.caption, tags:Object.entries(post.tags).map(([k,v])=>k+": "+v).join(", ")}});
      await reload();
    }catch(e){ toast(e.message, "danger"); }
    setBusy(false);
  }
  async function addNote(){ const t = note.trim(); if(!t) return; try{ await send("note", {key:post.key, text:t}); setNote(""); await reload(); }catch(e){ toast(e.message, "danger"); } }
  async function template(){
    try{
      const r = await fetch("/api/workspace/project", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({userId:state.currentUserId, title:"Like: "+(c.hook || post.contentTitle).slice(0,80), branch:"all", category:"FC", creatorId:"",
        brief:"Make another like this post ("+fmtNum(post.views)+" views"+(x? ", "+x.toFixed(1)+"× usual" : "")+").\nHook: "+(c.hook||"—")+(post.tags.collab? "\nCollab: "+post.tags.collab : "")+(post.tags.promo? "\nPromotion: "+post.tags.promo : "")+"\nPosted: "+post.weekday+" "+post.slot.toLowerCase()})});
      const d = await r.json(); if(!r.ok) throw new Error(d.error || "Couldn't start the project");
      if(post.permalink && /^https:\/\//.test(post.permalink)) await fetch("/api/workspace/item", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({userId:state.currentUserId, projectId:d.project.id, kind:"link", url:post.permalink, text:"The original — "+fmtNum(post.views)+" views"})});
      dispatch({type:"SET_ROUTE", route:"workspace", workspaceProject:d.project.id});
    }catch(e){ toast(e.message, "danger"); }
  }
  const tagRow = (k, label, el)=>(
    <div key={k} style={{display:"grid", gridTemplateColumns:"110px 1fr", gap:10, alignItems:"center", padding:"5px 0"}}>
      <span style={{fontSize:12.5, color:"var(--ink-mute)", fontWeight:600}}>{label}{post.isAuto[k] && <span title="Guessed from the caption — change it if it's wrong" style={{marginLeft:5, fontSize:10, fontWeight:700, color:"var(--blue)"}}>auto</span>}</span>{el}
    </div>
  );
  const input = {width:"100%", borderRadius:8, border:"1px solid var(--border)", padding:"7px 9px", fontSize:13, background:"var(--surface)", color:"var(--ink)"};
  const TagInput = ({k, placeholder, list, numeric})=><StudyTagField key={k} value={post.tags[k]||""} onSave={v=>setTag(k, v)} placeholder={placeholder} list={list} listId={"dl_"+k} numeric={numeric}/>;
  async function refetch(){ setBusy(true); try{ await send("fetch", {key:post.key}); toast("Asking Instagram for the latest numbers…"); await pollStudy(reload, post.key); }catch(e){ toast(e.message, "danger"); } setBusy(false); }
  const f = post.fetch;
  const metrics = post.manual
    ? [["Views", post.views], ["Likes", post.likes], ["Comments", post.comments], ...(post.shares||post.saves ? [["Shares", post.shares], ["Saves", post.saves]] : []), ["Engagement", post.engagementRate!=null ? fmtPct(post.engagementRate) : "—"]]
    : [["Views", post.views], ["Likes", post.likes], ["Comments", post.comments], ["Shares", post.shares], ["Saves", post.saves], ["Engagement", fmtPct(post.engagementRate)]];
  return (
    <Drawer open onClose={onClose} width={640}>
      <div style={{padding:20}}>
        <div style={{display:"flex", gap:14, alignItems:"flex-start", marginBottom:14}}>
          <div style={{width:72, height:96, borderRadius:10, overflow:"hidden", flexShrink:0}}><PostThumb post={post} radius={10}/></div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--ink-mute)", fontWeight:600}}><PlatformIcon platform={post.platform} size={12}/>{PLATFORM_META[post.platform].label}{post.type? " "+post.type.toLowerCase() : ""} · {post.weekday} {fmtDateTime(post.publishedAt)}</div>
            <div style={{fontSize:16, fontWeight:700, margin:"4px 0 6px", lineHeight:1.3}}>{c.hook || post.contentTitle}</div>
            {x!=null && <span style={{fontSize:12, fontWeight:700, color: x>=1.2? "var(--green)" : x<=0.8? "var(--red)" : "var(--ink-soft)"}}>{x.toFixed(1).replace(/\.0$/,"")}× our usual {PLATFORM_META[post.platform].label} views</span>}
            {post.manual && <div style={{fontSize:12, color:"var(--ink-mute)"}}>Posted by {post.account} · {f && f.status==="ok" ? "numbers from Instagram, "+fmtDateTime(f.at)+" (refreshed nightly)" : f && f.status==="pending" ? "fetching numbers from Instagram…" : "numbers entered by hand"}</div>}
            {post.manual && f && (f.status==="notfound" || f.status==="error") && <div style={{fontSize:12, color:"var(--amber)", marginTop:4, lineHeight:1.4}}>{f.error}</div>}
          </div>
          <IconButton icon="x" title="Close" onClick={onClose}/>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:8, marginBottom:16}}>
          {metrics.map(([l, v])=><div key={l} style={{background:"var(--surface-2)", borderRadius:10, padding:"8px 10px"}}><div style={{fontSize:11, color:"var(--ink-mute)"}}>{l}</div><div className="num" style={{fontSize:16, fontWeight:600}}>{typeof v==="number"? fmtNum(v) : v}</div></div>)}
        </div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:18}}>
          <Button size="sm" variant="primary" icon="workspace" onClick={template}>Make another like it</Button>
          {post.permalink && <Button size="sm" icon="external" onClick={()=>window.open(post.permalink, "_blank", "noopener")}>Open post</Button>}
          {!post.manual && post.snapshots && post.snapshots.length>1 && <Button size="sm" icon="trend" onClick={()=>setTimeline(true)}>Growth over time</Button>}
          {post.manual && post.platform==="instagram" && <Button size="sm" icon="refresh" onClick={refetch} disabled={busy}>{busy? "Fetching…" : "Refresh numbers"}</Button>}
          {post.manual && <Button size="sm" icon="edit" onClick={onEdit}>Edit</Button>}
          {post.manual && <ConfirmButton confirmLabel="Delete this collab?" onConfirm={async()=>{ try{ await send("delete", {key:post.key}); onClose(); reload(); }catch(e){ toast(e.message, "danger"); } }}>Delete</ConfirmButton>}
          {!post.manual && <ConfirmButton confirmLabel={st.hidden ? "Show it again?" : "Hide from this page?"} onConfirm={async()=>{ try{ await send("hide", {key:post.key, hidden:!st.hidden}); onClose(); reload(); }catch(e){ toast(e.message, "danger"); } }}>{st.hidden ? "Show again" : "Hide"}</ConfirmButton>}
        </div>
        {post.manual && wsEmbed(post.permalink).src && <div style={{marginBottom:18}}>
          {watch ? <div style={{height:560, maxWidth:360, borderRadius:12, overflow:"hidden", background:"#fff", border:"1px solid var(--border)"}}><iframe src={wsEmbed(post.permalink).src} title="Collab post" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" allowFullScreen style={{width:"100%", height:"100%", border:0}}/></div>
            : <Button size="sm" icon="play" onClick={()=>setWatch(true)}>Watch it here</Button>}
        </div>}

        <SectionTitle>Caption</SectionTitle>
        <div style={{fontSize:13, lineHeight:1.55, whiteSpace:"pre-wrap", background:"var(--surface-2)", borderRadius:10, padding:12, marginBottom:8, maxHeight:180, overflowY:"auto"}}>{post.caption || <span style={{color:"var(--ink-mute)"}}>No caption</span>}</div>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:18}}>
          {[[c.words+" words"], [c.emojis+" emoji"+(c.emojis===1?"":"s")], [c.tags.length+" hashtag"+(c.tags.length===1?"":"s")], [c.mentions.length? "mentions "+c.mentions.join(" ") : "no mentions"], [c.cta.length? "CTA: "+c.cta.join(", ") : "no call to action", !c.cta.length]].map(([t, warn])=>(
            <span key={t} style={{fontSize:11.5, fontWeight:600, padding:"3px 9px", borderRadius:99, background: warn? "var(--amber-soft)" : "var(--surface-2)", color: warn? "var(--amber)" : "var(--ink-soft)"}}>{t}</span>
          ))}
        </div>

        <SectionTitle>Tags</SectionTitle>
        <div style={{marginBottom:18}}>
          {tagRow("collab", "Influencer", TagInput({k:"collab", placeholder:"@handle (two? @one @two) — empty = our own", list:known}))}
          {post.tags.collab && tagRow("cost", "Cost (£)", TagInput({k:"cost", placeholder:"Fee + free food, e.g. 150", numeric:true}))}
          {tagRow("promo", "Promotion", TagInput({k:"promo", placeholder:"Campaign or offer", list:campaigns.map(x=>x.name)}))}
          {tagRow("type", "Content type", <Select value={post.tags.type||""} onChange={v=>setTag("type", v)} options={[{value:"", label:"—"}, ...Object.values(LIB_CATEGORY).map(v=>({value:v, label:v}))]}/>)}
          {tagRow("branch", "Branch", <Select value={post.tags.branch||""} onChange={v=>setTag("branch", v)} options={[{value:"", label:"—"}, ...["Shoreditch","Angel","Victoria","All branches"].map(v=>({value:v, label:v}))]}/>)}
          {tagRow("dish", "Dish", TagInput({k:"dish", placeholder:"e.g. Wagyu Beef Roll", list:Object.values(LIB_DISH)}))}
        </div>

        <SectionTitle action={<Button size="sm" icon="zap" onClick={why} disabled={busy}>{busy? "Thinking…" : st.why? "Ask again" : "Explain"}</Button>}>Why it worked</SectionTitle>
        <div style={{fontSize:13, lineHeight:1.6, whiteSpace:"pre-wrap", marginBottom:18, color: st.why? "var(--ink)" : "var(--ink-mute)"}}>{st.why ? st.why.text : "AI reads the caption, timing and numbers against your usual and says what made the difference."}</div>

        <SectionTitle>Team notes</SectionTitle>
        <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:10}}>
          {(st.notes||[]).map(n=>(
            <div key={n.id} style={{display:"flex", gap:9}}><Avatar user={USERS.find(u=>u.id===n.by)||{name:"?"}} size={24}/>
              <div style={{fontSize:13, lineHeight:1.45}}><b>{(USERS.find(u=>u.id===n.by)||{}).name||"Someone"}</b> <span style={{fontSize:11, color:"var(--ink-mute)"}}>{fmtDate(n.at, {day:"numeric", month:"short"})}</span><div style={{whiteSpace:"pre-wrap"}}>{n.text}</div></div></div>
          ))}
          {!(st.notes||[]).length && <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>What do you think made this one work, or not?</div>}
        </div>
        <div style={{display:"flex", gap:8}}>
          <input value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addNote(); }} placeholder="e.g. the cheese pull at 0:03 did it" style={input}/>
          <Button variant="primary" icon="send" onClick={addNote} disabled={!note.trim()}>Add</Button>
        </div>
      </div>
      {timeline && <PostAnalyticsDrawer post={post} onClose={()=>setTimeline(false)}/>}
    </Drawer>
  );
}

// Small ✕ on each Published Content card: a collab added by hand is deleted; our own posts are only hidden from
// this page (they're still live on Instagram) and come back from "Hidden (n)".
function StudyRemove({post, reload}){
  const {dispatch} = useApp();
  const send = useStudyPost();
  const [armed, setArmed] = useState(false);
  useEffect(()=>{ if(!armed) return; const t = setTimeout(()=>setArmed(false), 4000); return ()=>clearTimeout(t); }, [armed]);
  const hidden = post.study && post.study.hidden;
  const label = post.manual ? "Delete" : hidden ? "Show again" : "Hide";
  async function go(){
    try{
      if(post.manual) await send("delete", {key:post.key});
      else await send("hide", {key:post.key, hidden: !hidden});
      dispatch({type:"ADD_TOAST", message: post.manual ? "Collab removed" : hidden ? "Back on the page" : "Hidden from this page — find it under Hidden"});
      reload();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
  }
  return (
    <button onClick={e=>{ e.stopPropagation(); if(armed || hidden) go(); else setArmed(true); }} title={post.manual ? "Delete this collab" : hidden ? "Show on the page again" : "Hide from this page (stays on Instagram)"}
      style={{position:"absolute", bottom:8, right:8, zIndex:3, height:28, minWidth:28, padding: armed? "0 10px" : 0, borderRadius:99, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:5,

// One tag box: saves when you leave it, press Enter, pick a suggestion or tap ✕ — and also if the panel closes mid-edit.
function StudyTagField({value, onSave, placeholder, list, listId, numeric}){
  const [v, setV] = useState(value);
  const [saved, setSaved] = useState(false);
  const live = useRef({v:value, value, onSave});
  live.current = {v, value, onSave};
  useEffect(()=>{ setV(value); }, [value]);
  useEffect(()=>()=>{ const c = live.current; if(c.v!==c.value) c.onSave(c.v); }, []);
  const commit = next=>{ const x = next===undefined ? v : next; if(x!==value){ onSave(x); setSaved(true); setTimeout(()=>setSaved(false), 1500); } };

}
// After asking Make for a collab's numbers: check back every few seconds until they arrive (or ~1 minute).
async function pollStudy(reload, key, tries=20){
  for(let i=0; i<tries; i++){
    await new Promise(r=>setTimeout(r, 3000));
    const d = await fetch("/api/study", {cache:"no-store"}).then(r=>r.json()).catch(()=>null);
    const e = d && (d.entries||[]).find(x=>x.key===key);
    const st = e && e.manual && e.manual.fetch && e.manual.fetch.status;
    if(st && st!=="pending"){ await reload(); return e; }
  }
  await reload();
  return null;
}

/* Sample history so the analytics screens and the forecaster have something realistic to work with before real
   platform stats are connected. Every post built here is flagged `sample:true` and the page labels it clearly. */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const SAMPLE_TITLES = ["Salmon Nigiri Close-Up","Red Dragon Roll — Hands-On","Chef's Knife Skills","Bento Lunch Box Build","Matcha Cheesecake Slice","Sake Pairing Night","Weekend Set Menu","Behind the Counter","Tempura Crunch ASMR","Omakase Experience","Rainbow Roll Assembly","Gyoza Fold Tutorial","Katsu Curry Pour","Miso Soup from Scratch","Friday Night Rush","Meet the Chef","Shoreditch Lunch Queue","Dragon Roll Reveal","Sashimi Platter Build","Yuzu Mocktail","Tuna Tataki Sear","Staff Picks","Customer Reactions","Wasabi Myths","Sushi Rice Secrets"];
const PLATFORM_BASE = {
  instagram:{min:2500, max:16000, conv:4.5}, tiktok:{min:4000, max:42000, conv:3.2}, facebook:{min:900, max:6500, conv:2.4},
  youtube:{min:1200, max:14000, conv:3.8}, gbp:{min:150, max:900, conv:0.8},
};
function buildSampleHistory(){
  const rnd = mulberry32(20260922);
  const posts = [];
  for(let dayBack=118; dayBack>=1; dayBack--){
    const d = new Date(TODAY); d.setDate(d.getDate()-dayBack);
    const chance = [0.35,0.45,0.45,0.55,0.7,0.75,0.6][d.getDay()];
    if(rnd() > chance) continue;
    const hour = [8,10,12,13,15,16,17,18,19,20,21,22][Math.floor(rnd()*12)];
    d.setHours(hour, Math.floor(rnd()*4)*15, 0, 0);
    const title = SAMPLE_TITLES[Math.floor(rnd()*SAMPLE_TITLES.length)];
    const pillar = PILLARS[Math.floor(rnd()*PILLARS.length)];
    const campaign = dayBack < 45 ? (rnd()<0.6? "c_augshoot" : rnd()<0.5? "c_evergreen" : "") : (rnd()<0.6? "c_evergreen" : "");
    const quality = 0.55 + rnd()*0.9;
    const plats = ["instagram"];
    if(rnd()<0.75) plats.push("tiktok");
    if(rnd()<0.55) plats.push("facebook");
    if(rnd()<0.4) plats.push("youtube");
    if(rnd()<0.18) plats.push("gbp");
    const trend = 1 + (118-dayBack)/118*0.45;
    const pillarBoost = {"Behind the Scenes":1.15, "Education":1.1, "UGC":1.2, "Promotion":0.85, "Product":1, "Seasonal":1.05}[pillar]||1;
    plats.forEach(platform=>{
      const b = PLATFORM_BASE[platform];
      const views = Math.round((b.min + rnd()*(b.max-b.min)) * quality * trend * pillarBoost * (hour>=17? 1.12 : 1));
      const likes = Math.round(views*(0.035+rnd()*0.05)), comments = Math.round(views*(0.003+rnd()*0.01));
      const shares = Math.round(views*(0.003+rnd()*0.018)), saves = Math.round(views*(0.004+rnd()*0.025));
      const engagementRate = (likes+comments+shares+saves)/views*100;
      posts.push({
        id:"sp_"+dayBack+"_"+platform, sample:true, contentId:"sample_"+dayBack, contentTitle:title, brand:"sanjugo", campaign, pillar, platform,
        account: BRANDS[0].accounts[platform], publishedAt:d.toISOString(), gradient:grad(title),
        views, reach: Math.round(views*(0.68+rnd()*0.2)), likes, comments, shares, saves, engagementRate,
        followsGained: Math.round(views/1000 * b.conv * (engagementRate/8) * (0.6+rnd()*0.8)),
        analyticsUpdatedAt: dayOffset(0,7,45),
        snapshots:[2,6,24,72,168].map((hrs,i)=>{ const k=[0.18,0.4,0.68,0.9,1][i]; return {label: hrs<24? hrs+"h" : (hrs/24)+"d", hours:hrs, views:Math.round(views*k), likes:Math.round(likes*k), comments:Math.round(comments*k), shares:Math.round(shares*k), saves:Math.round(saves*k)}; }),
      });
    });
  }
  return posts;
}
const SAMPLE_HISTORY = buildSampleHistory();

const METRICS = [
  {key:"views", label:"Views"}, {key:"reach", label:"Reach"}, {key:"engagements", label:"Engagements"},
  {key:"engagementRate", label:"Engagement rate", pct:true}, {key:"likes", label:"Likes"}, {key:"comments", label:"Comments"},
  {key:"shares", label:"Shares"}, {key:"saves", label:"Saves"}, {key:"followsGained", label:"Followers gained"},
];
const SUM_KEYS = ["views","reach","likes","comments","shares","saves","followsGained"];
function metricTotals(posts){
  const t = {posts:posts.length}; SUM_KEYS.forEach(k=>t[k]=0);
  posts.forEach(p=>SUM_KEYS.forEach(k=>{ t[k] += p[k]||0; }));
  t.engagements = t.likes+t.comments+t.shares+t.saves;
  t.engagementRate = t.views ? t.engagements/t.views*100 : 0;
  return t;
}
function postMetric(p, key){ return key==="engagements" ? p.likes+p.comments+p.shares+p.saves : key==="engagementRate" ? p.engagementRate : (p[key]||0); }
function fmtMetric(key, v){ return key==="engagementRate" ? fmtPct(v) : fmtNum(Math.round(v)); }
function quantile(arr, q){ if(!arr.length) return 0; const a=[...arr].sort((x,y)=>x-y); const i=(a.length-1)*q; const lo=Math.floor(i), hi=Math.ceil(i); return a[lo]+(a[hi]-a[lo])*(i-lo); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
/* How a post's numbers arrive over its first week — used to turn per-post totals into a daily timeline. */
const DAY_SPREAD = [0.68, 0.14, 0.08, 0.03, 0.03, 0.02, 0.02];
function dailySeries(posts, key, start, days){
  const out = Array(days).fill(0), views = Array(days).fill(0);
  const s0 = startOfDay(start).getTime();
  posts.forEach(p=>{
    const d0 = Math.round((startOfDay(p.publishedAt).getTime()-s0)/86400000);
    DAY_SPREAD.forEach((f,k)=>{
      const i = d0+k; if(i<0 || i>=days) return;
      if(key==="engagementRate"){ out[i] += (p.likes+p.comments+p.shares+p.saves)*f; views[i] += p.views*f; }
      else out[i] += postMetric(p,key)*f;
    });
  });
  return key==="engagementRate" ? out.map((v,i)=> views[i]? v/views[i]*100 : 0) : out.map(Math.round);
}

function Delta({cur, prev, pct}){
  if(!prev) return <span style={{fontSize:11.5, color:"var(--ink-mute)"}}>no prior data</span>;
  const diff = pct ? cur-prev : (cur-prev)/prev*100;
  const up = diff >= 0;
  return <span className="num" style={{fontSize:11.5, fontWeight:600, color: up? "var(--green)":"var(--red)"}}>{up? "▲":"▼"} {Math.abs(diff).toFixed(1)}{pct? " pts":"%"} <span style={{color:"var(--ink-mute)", fontWeight:500}}>vs prev.</span></span>;
}

}

  const metricMeta = METRICS.find(m=>m.key===metric);

  const maxPlatViews = Math.max(1, ...platformRows.map(r=>r.t.views));

  const mix = [["Likes","likes","#4F6BED"],["Comments","comments","#0EA5A4"],["Shares","shares","#E0A43A"],["Saves","saves","#9B5DE5"]];
  const pillarRows = PILLARS.map(pl=>{ const ps=posts.filter(p=>p.pillar===pl); const t=metricTotals(ps); return {pl, n:ps.length, avgViews: ps.length? t.views/ps.length : 0, er:t.engagementRate}; }).filter(r=>r.n>0).sort((a,b)=>b.avgViews-a.avgViews);
  const maxPillar = Math.max(1, ...pillarRows.map(r=>r.avgViews));

  // Best time to post: average engagement rate by weekday × time of day
  const BUCKETS = [["Morning",5,11],["Lunch",11,14],["Afternoon",14,17],["Evening",17,21],["Late",21,29]];
  const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const heat = WEEKDAYS.map((_,wd)=>BUCKETS.map(([,a,b])=>{
    const ps = scoped.filter(p=>{ const d=new Date(p.publishedAt); const h=d.getHours(); return (d.getDay()+6)%7===wd && ((h>=a && h<b) || (h+24>=a && h+24<b)); });
    return ps.length ? {n:ps.length, v: metricTotals(ps).engagementRate} : null;
  }));
  const heatVals = heat.flat().filter(Boolean).map(c=>c.v);
  const heatMin = Math.min(...heatVals, 0), heatMax = Math.max(...heatVals, 1);
  const bestCell = (()=>{ let best=null; heat.forEach((row,wd)=>row.forEach((c,b)=>{ if(c && c.n>=2 && (!best || c.v>best.v)) best={wd,b,v:c.v}; })); return best; })();

  const q = search.trim().toLowerCase();
  const rows = posts.filter(p=> !q || p.contentTitle.toLowerCase().includes(q) || PLATFORM_META[p.platform].label.toLowerCase().includes(q))
    .sort((a,b)=> sort.key==="publishedAt" ? (new Date(a.publishedAt)-new Date(b.publishedAt))*sort.dir : sort.key==="title" ? a.contentTitle.localeCompare(b.contentTitle)*sort.dir : (postMetric(a,sort.key)-postMetric(b,sort.key))*sort.dir);
  const cols = [["views","Views"],["reach","Reach"],["likes","Likes"],["comments","Comments"],["shares","Shares"],["saves","Saves"],["engagementRate","Eng. rate"],["followsGained","Followers"]];
  const th = {padding:"9px 12px", fontSize:11.5, fontWeight:600, color:"var(--ink-mute)", textAlign:"right", whiteSpace:"nowrap", cursor:"pointer", userSelect:"none", borderBottom:"1px solid var(--border)", background:"var(--surface-2)"};
  const td = {padding:"9px 12px", fontSize:13, textAlign:"right", whiteSpace:"nowrap", borderBottom:"1px solid var(--border)"};
  const sortBy = key => setSort(s=> s.key===key ? {key, dir:-s.dir} : {key, dir:-1});
  const arrow = key => sort.key===key ? (sort.dir<0? " ↓":" ↑") : "";
  const activeFilterCount = filters.platforms.length + (filters.campaign?1:0) + (filters.pillar?1:0) + (filters.contentId?1:0);
  const rangeText = rangeStart.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+rangeEnd.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const inputStyle = {padding:"7px 10px", borderRadius:8, border:"1px solid var(--border)", fontSize:12.5, background:"var(--surface)", color:"var(--ink)"};

  return (
    <div>
      <PageHeader title="Analytics" subtitle={"Performance across every platform · "+rangeText}/>
      <div style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap", padding:"10px 14px", borderRadius:10, border:"1px solid var(--border)", background:"var(--surface)", marginBottom:14, fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.5}}>
        <div style={{display:"inline-flex", border:"1px solid var(--border)", borderRadius:8, overflow:"hidden", flexShrink:0}}>
          {[["real","Real data"],["sample","Sample data"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSource(k)} disabled={k==="real" && !realPosts.length} style={{padding:"5px 10px", fontSize:12, fontWeight:600, border:"none", background: src===k? (k==="real"? "var(--green)" : "var(--amber)") : "var(--surface)", color: src===k? "#fff" : "var(--ink-soft)", cursor: k==="real" && !realPosts.length? "not-allowed" : "pointer", opacity: k==="real" && !realPosts.length? .5 : 1}}>{l}</button>

        </div>
        <span style={{flex:"1 1 260px"}}>{src==="real"
          ? <>Real results from Make for {realPosts.length} post{realPosts.length===1?"":"s"} ({[...new Set(realPosts.map(p=>p.platform))].map(p=>PLATFORM_META[p].label).join(", ")}){realData && realData.lastPull? " · updated "+fmtDateTime(realData.lastPull.at) : ""}.{realPosts.some(p=>p.platform==="facebook")? " Facebook only reports reactions, so its views and engagement rate show as 0." : ""}</>

      </div>

      {/* Filters */}

          {range==="custom" && <>
            <input type="date" value={filters.customFrom} max={filters.customTo} onChange={e=>setF({customFrom:e.target.value})} style={inputStyle}/>

            {name:metricMeta.label, color:"var(--accent)", points:curSeries},

      </Card>

      <div className="cf-an-grid" style={{display:"grid", gridTemplateColumns:"1.5fr 1fr", gap:16, marginBottom:16}}>
        {/* Platform breakdown */}
        <Card style={{padding:0, overflow:"hidden"}}>
          <div style={{padding:"14px 18px 10px", fontSize:14.5, fontWeight:700}}>By platform</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%", borderCollapse:"collapse", minWidth:620}}>
              <thead><tr>
                <th style={{...th, textAlign:"left", cursor:"default"}}>Platform</th>
                {[["Posts"],["Views"],["Likes"],["Comments"],["Shares"],["Saves"],["Eng. rate"],["Followers"]].map(([h])=><th key={h} style={{...th, cursor:"default"}}>{h}</th>)}
              </tr></thead>
              <tbody>
                {platformRows.length===0 && <tr><td colSpan={9} style={{...td, textAlign:"center", color:"var(--ink-mute)"}}>No posts in this range</td></tr>}
                {platformRows.map(({pl,t})=>(
                  <tr key={pl}>
                    <td style={{...td, textAlign:"left"}}>
                      <div style={{display:"flex", alignItems:"center", gap:8, fontWeight:600}}><PlatformIcon platform={pl} size={12}/>{PLATFORM_META[pl].label}</div>
                      <div style={{height:3, borderRadius:9, background:"var(--surface-2)", marginTop:6, width:120}}><div style={{height:"100%", width:(t.views/maxPlatViews*100)+"%", background:PLATFORM_HEX[pl], borderRadius:9}}/></div>
                    </td>
                    <td className="num" style={td}>{t.posts}</td>
                    <td className="num" style={td}>{fmtNum(t.views)}</td>
                    <td className="num" style={td}>{fmtNum(t.likes)}</td>
                    <td className="num" style={td}>{fmtNum(t.comments)}</td>
                    <td className="num" style={td}>{fmtNum(t.shares)}</td>
                    <td className="num" style={td}>{fmtNum(t.saves)}</td>
                    <td className="num" style={{...td, fontWeight:600}}>{fmtPct(t.engagementRate)}</td>
                    <td className="num" style={td}>+{fmtNum(t.followsGained)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>

        {/* Engagement mix */}
        <Card style={{padding:18}}>
          <div style={{fontSize:14.5, fontWeight:700, marginBottom:2}}>Engagement mix</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>{fmtNum(cur.engagements)} engagements · {fmtPct(cur.engagementRate)} of views</div>
          <div style={{display:"flex", height:12, borderRadius:6, overflow:"hidden", marginBottom:14, background:"var(--surface-2)"}}>
            {mix.map(([l,k,c])=> cur.engagements>0 && <div key={k} title={l} style={{width:(cur[k]/cur.engagements*100)+"%", background:c}}/>)}
          </div>
          {mix.map(([l,k,c])=>(
            <div key={k} style={{display:"flex", alignItems:"center", gap:10, padding:"7px 0", borderTop:"1px solid var(--border)", fontSize:13}}>
              <span style={{width:9, height:9, borderRadius:2, background:c}}/>
              <span style={{flex:1, fontWeight:600}}>{l}</span>
              <span className="num">{fmtNum(cur[k])}</span>
              <span className="num" style={{width:48, textAlign:"right", color:"var(--ink-mute)"}}>{cur.engagements? (cur[k]/cur.engagements*100).toFixed(0)+"%" : "—"}</span>
              <span style={{width:92, textAlign:"right"}}>{compare && <Delta cur={cur[k]} prev={prev[k]}/>}</span>
            </div>
          ))}
        </Card>
      </div>

      <div className="cf-an-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16}}>
        {/* Best time to post */}
        <Card style={{padding:18}}>
          <div style={{fontSize:14.5, fontWeight:700, marginBottom:2}}>Best time to post</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>
            Average engagement rate by day and time (all dates, current filters){bestCell && <> · best: <strong style={{color:"var(--ink)"}}>{WEEKDAYS[bestCell.wd]} {BUCKETS[bestCell.b][0].toLowerCase()}</strong></>}
          </div>
          <div style={{display:"grid", gridTemplateColumns:"40px repeat(5, 1fr)", gap:4, fontSize:11}}>
            <span/>{BUCKETS.map(([l])=><span key={l} style={{textAlign:"center", color:"var(--ink-mute)", fontWeight:600, overflow:"hidden", textOverflow:"ellipsis"}}>{l}</span>)}
            {heat.map((row,wd)=>(
              <React.Fragment key={wd}>
                <span style={{color:"var(--ink-mute)", fontWeight:600, alignSelf:"center"}}>{WEEKDAYS[wd]}</span>
                {row.map((c,b)=>{
                  const k = c ? (c.v-heatMin)/((heatMax-heatMin)||1) : 0;
                  return <div key={b} title={c? WEEKDAYS[wd]+" "+BUCKETS[b][0]+": "+fmtPct(c.v)+" avg ("+c.n+" posts)" : "No posts"} style={{height:28, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:600,
                    background: c ? `color-mix(in srgb, var(--accent) ${Math.round(12+k*78)}%, var(--surface))` : "var(--surface-2)", color: c && k>0.55 ? "#fff" : "var(--ink-soft)", outline: bestCell && bestCell.wd===wd && bestCell.b===b ? "2px solid var(--ink)" : "none"}}>
                    {c ? c.v.toFixed(1) : ""}
                  </div>;
                })}
              </React.Fragment>
            ))}
          </div>
        </Card>

        {/* Content type performance */}
        <Card style={{padding:18}}>
          <div style={{fontSize:14.5, fontWeight:700, marginBottom:2}}>Content type performance</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>Average views per post · engagement rate</div>
          {pillarRows.length===0 ? <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>No posts in this range.</div> : pillarRows.map(r=>(
            <div key={r.pl} style={{marginBottom:11}}>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:12.5, marginBottom:4}}>
                <span style={{fontWeight:600}}>{r.pl} <span style={{color:"var(--ink-mute)", fontWeight:500}}>· {r.n} posts</span></span>
                <span className="num"><strong>{fmtNum(Math.round(r.avgViews))}</strong> <span style={{color:"var(--ink-mute)"}}>· {fmtPct(r.er)}</span></span>
              </div>
              <div style={{height:6, borderRadius:9, background:"var(--surface-2)"}}><div style={{height:"100%", width:(r.avgViews/maxPillar*100)+"%", borderRadius:9, background:"var(--accent)"}}/></div>
            </div>
          ))}
        </Card>
      </div>

      {/* Every post, sortable */}
      <Card style={{padding:0, overflow:"hidden", marginBottom:16}}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap", padding:"14px 18px 12px"}}>
          <div>
            <div style={{fontSize:14.5, fontWeight:700}}>Post performance</div>
            <div style={{fontSize:12, color:"var(--ink-mute)"}}>{rows.length} posts · tap a column to sort, tap a post for its detail</div>
          </div>
          <div style={{position:"relative"}}>
            <Icon name="search" size={14} style={{position:"absolute", left:10, top:9, color:"var(--ink-mute)"}}/>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search posts" style={{...inputStyle, paddingLeft:30, width:200}}/>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse", minWidth:900}}>
            <thead><tr>
              <th onClick={()=>sortBy("title")} style={{...th, textAlign:"left", position:"sticky", left:0, zIndex:1}}>Post{arrow("title")}</th>
              <th onClick={()=>sortBy("publishedAt")} style={th}>Published{arrow("publishedAt")}</th>
              {cols.map(([k,l])=><th key={k} onClick={()=>sortBy(k)} style={{...th, color: sort.key===k? "var(--ink)":th.color}}>{l}{arrow(k)}</th>)}
            </tr></thead>
            <tbody>
              {rows.length===0 && <tr><td colSpan={cols.length+2} style={{...td, textAlign:"center", color:"var(--ink-mute)", padding:24}}>No posts match.</td></tr>}
              {rows.slice(0, showRows).map(p=>(
                <tr key={p.id} className="cf-row" onClick={()=>setOpenPost(p)} style={{cursor:"pointer"}}>
                  <td style={{...td, textAlign:"left", position:"sticky", left:0, background:"var(--surface)", maxWidth:260}}>
                    <div style={{display:"flex", alignItems:"center", gap:9}}>
                      <span style={{width:30, height:30, borderRadius:6, overflow:"hidden", flexShrink:0}}><Thumb item={{gradient:p.gradient, media:{type:"video"}}} radius={6} iconSize={11} bare/></span>
                      <span style={{minWidth:0}}>
                        <span style={{display:"block", fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:190}}>{p.contentTitle}</span>
                        <span style={{display:"flex", alignItems:"center", gap:5, fontSize:11.5, color:"var(--ink-mute)"}}><PlatformIcon platform={p.platform} size={10}/>{PLATFORM_META[p.platform].label}</span>
                      </span>

                  </td>
                  <td style={{...td, color:"var(--ink-soft)"}}>{fmtDate(p.publishedAt,{day:"numeric",month:"short"})}</td>
                  {cols.map(([k])=><td key={k} className="num" style={{...td, fontWeight: sort.key===k? 700:400}}>{k==="followsGained"? "+":""}{fmtMetric(k, postMetric(p,k))}</td>)}

      </Card>

      <GrowthForecaster allPosts={allPosts} defaultPlatform={filters.platforms[0]||"instagram"}/>

      <PostAnalyticsDrawer post={openPost} onClose={()=>setOpenPost(null)}/>
      <style>{`@media (max-width:900px){ .cf-an-grid{ grid-template-columns:1fr !important; } .cf-kpis{ grid-template-columns:repeat(2, 1fr) !important; }
        .cf-an-filters{ display:grid !important; grid-template-columns:1fr 1fr; } .cf-an-filters > *{ width:auto !important; min-width:0; } .cf-an-compare{ grid-column:1 / -1; margin-left:0 !important; } } .cf-row:hover td{ background:var(--surface-2) !important; }`}</style>
    </div>
  );
}

/* "If we post N more at this level, what happens?" — a simple, explainable model built from past posts:
   followers ≈ posts × views × (followers per 1k views, from history) × (engagement vs. usual)^0.8.
   The range uses the 25th–75th percentile of past conversion, so it's honest about uncertainty. */
function GrowthForecaster({allPosts, defaultPlatform}){
  const narrow = useIsNarrow(900);
  const [platform, setPlatform] = useState(defaultPlatform);
  useEffect(()=>{ setPlatform(defaultPlatform); }, [defaultPlatform]);
  const since = new Date(TODAY); since.setDate(since.getDate()-90);
  const hist = allPosts.filter(p=>p.platform===platform && new Date(p.publishedAt)>=since && p.views>0);
  const convs = hist.map(p=>(p.followsGained||0)/p.views*1000);
  const medViews = Math.round(quantile(hist.map(p=>p.views), 0.5));
  const histER = hist.length ? metricTotals(hist).engagementRate : 0;
  const reachRatio = hist.length ? metricTotals(hist).reach/metricTotals(hist).views : 0.8;
  const [count, setCount] = useState(4);
  const [views, setViews] = useState(medViews);
  const [er, setEr] = useState(Number(histER.toFixed(1)));
  const [target, setTarget] = useState(100);
  const followersKey = "contentflow_followers_"+platform;
  const [followers, setFollowers] = useState(()=>{ try{ return localStorage.getItem(followersKey)||""; }catch(e){ return ""; } });
  useEffect(()=>{
    setViews(medViews); setEr(Number(histER.toFixed(1)));
    try{ setFollowers(localStorage.getItem(followersKey)||""); }catch(e){ setFollowers(""); }
  }, [platform, hist.length]);
  function saveFollowers(v){ setFollowers(v); try{ localStorage.setItem(followersKey, v); }catch(e){} }

  const erFactor = histER>0 ? Math.pow(Math.max(er,0.1)/histER, 0.8) : 1;
  const perPost = c => views/1000 * c * erFactor;
  const mid = count * perPost(quantile(convs, 0.5));
  const low = count * perPost(quantile(convs, 0.25));
  const high = count * perPost(quantile(convs, 0.75));
  const totalViews = count*views;
  const engagements = totalViews*er/100;
  const t = metricTotals(hist);
  const split = ["likes","comments","shares","saves"].map(k=>[k, t.engagements? engagements*t[k]/t.engagements : 0]);
  const cur = Number(followers)||0;
  const postsForTarget = perPost(quantile(convs,0.5))>0 ? Math.ceil(target/perPost(quantile(convs,0.5))) : null;
  const confidence = hist.length>=15 ? ["Good", "var(--green)"] : hist.length>=5 ? ["Fair", "var(--amber)"] : ["Low", "var(--red)"];
  const maxViews = Math.max(1000, Math.round(quantile(hist.map(p=>p.views), 0.95)*2/100)*100);

  const perPlatform = Object.keys(PLATFORM_META).map(pl=>{
    const h = allPosts.filter(p=>p.platform===pl && new Date(p.publishedAt)>=since && p.views>0);
    if(h.length<3) return null;
    const v = quantile(h.map(p=>p.views),0.5), c = quantile(h.map(p=>(p.followsGained||0)/p.views*1000),0.5);
    return {pl, n:h.length, followers: count*v/1000*c};
  }).filter(Boolean).sort((a,b)=>b.followers-a.followers);
  const maxPl = Math.max(1, ...perPlatform.map(r=>r.followers));

  const label = {fontSize:12, fontWeight:600, color:"var(--ink-soft)", display:"flex", justifyContent:"space-between", marginBottom:6};
  const numIn = {width:90, padding:"5px 8px", borderRadius:7, border:"1px solid var(--border)", fontSize:12.5, textAlign:"right", background:"var(--surface)", color:"var(--ink)"};
  return (
    <Card style={{padding:0, overflow:"hidden", marginBottom:16}}>
      <div style={{padding:"16px 18px", borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap"}}>
        <div>

/* ============================== TEAM CHAT ============================== */
/* Messages live in their own server table (/api/chat) and are polled every few seconds while the app is open.
   If the API isn't reachable (e.g. opened as a plain file), chat falls back to this device only and says so. */
const CHAT_LOCAL_KEY = "contentflow_chat_local_v1";
function readSeen(userId){ try{ return Number(localStorage.getItem("contentflow_chat_seen_"+userId)||0); }catch(e){ return 0; } }
function writeSeen(userId, id){ try{ localStorage.setItem("contentflow_chat_seen_"+userId, String(id)); }catch(e){} }
function readLocalChat(){ try{ return JSON.parse(localStorage.getItem(CHAT_LOCAL_KEY)||"[]"); }catch(e){ return []; } }
const EVERYONE_RE = /(^|\s)@(everyone|all|team)\b/i;
// "AI Dev +" — the Team Chat AI assistant (answers on the server). Its tag is kept apart from the real "AI Dev".
const BOT_ID = "ai_bot", BOT_NAME = "AI Dev +";
const BOT_RE = /@ai\s?dev\s?\+/i;
function findMentions(text){
  text = text.replace(new RegExp(BOT_RE.source, "gi"), " ");
  if(EVERYONE_RE.test(text)) return activeUsers().map(u=>u.id);
  const t = text.toLowerCase();
  return USERS.filter(u=> t.includes("@"+u.name.toLowerCase())).map(u=>u.id);
}

function useChat(currentUserId, dispatch){
  const [messages, setMessages] = useState([]);
  const [mode, setMode] = useState("loading"); // loading | server | local
  const [seen, setSeen] = useState(()=>readSeen(currentUserId));
  const [botPending, setBotPending] = useState([]); // ids of my questions AI Dev + is still answering
  const lastId = useRef(0);
  const loadedOnce = useRef(false);
  const modeRef = useRef("loading");
  const userRef = useRef(currentUserId);
  userRef.current = currentUserId;
  useEffect(()=>{ setSeen(readSeen(currentUserId)); }, [currentUserId]);

  const lastSync = useRef("");
  const merge = useCallback(incoming=>{
    if(!incoming || !incoming.length) return;
    const fresh = incoming.filter(m=>m.id > lastId.current);
    // New messages are added; ones already here are replaced (reactions and pins change them).
    setMessages(prev=>{
      const byId = new Map(prev.map(m=>[m.id, m]));
      let changed = false;
      incoming.forEach(m=>{ const old = byId.get(m.id); if(!old || old.updatedAt!==m.updatedAt || old.pinnedAt!==m.pinnedAt){ byId.set(m.id, m); changed = true; } });
      return changed ? [...byId.values()].sort((a,b)=>a.id-b.id) : prev;
    });
    lastId.current = Math.max(lastId.current, ...incoming.map(m=>m.id));
    incoming = fresh;
    if(loadedOnce.current){
      incoming.filter(m=>m.author!==userRef.current && (m.mentions||[]).includes(userRef.current)).forEach(m=>{
        const who = USERS.find(u=>u.id===m.author);
        const short = m.text.replace(/\s@[^\n]*$/, "").split("\n")[0];
        dispatch({type:"ADD_TOAST", message: m.author==="system" ? short.slice(0,110) : m.author===BOT_ID ? BOT_NAME+" replied: “"+m.text.slice(0,70)+(m.text.length>70?"…":"")+"”" : (who? who.name : "Someone")+" mentioned you in Team Chat: “"+m.text.slice(0,60)+(m.text.length>60?"…":"")+"”"});
      });
    }
  }, [dispatch]);

  const poll = useCallback(async ()=>{
    try{
      const res = await fetch("/api/chat"+(lastId.current? "?since="+lastId.current+"&changed="+encodeURIComponent(lastSync.current) : ""), {cache:"no-store"});
      if(!res.ok) throw new Error("chat "+res.status);
      const data = await res.json();
      modeRef.current = "server"; setMode("server");
      merge(data.messages||[]);
      if(data.serverTime) lastSync.current = data.serverTime;
    }catch(e){
      if(modeRef.current!=="server"){ modeRef.current = "local"; setMode("local"); merge(readLocalChat()); }
    }
    loadedOnce.current = true;
  }, [merge]);

  useEffect(()=>{
    let cancelled = false, timer = null;
    const tick = async ()=>{
      await poll();
      if(!cancelled) timer = setTimeout(tick, document.hidden? 30000 : 4000);
    };
    tick();
    const onVisible = ()=>{ if(!document.hidden && !cancelled){ clearTimeout(timer); tick(); } };
    document.addEventListener("visibilitychange", onVisible);
    return ()=>{ cancelled = true; clearTimeout(timer); document.removeEventListener("visibilitychange", onVisible); };
  }, [poll]);

  const send = useCallback(async (text, contentId, extra)=>{
    const body = {author: userRef.current, text: text.trim(), mentions: findMentions(text), contentId: contentId||null, ...(extra||{})};
    if(!body.text) return false;
    if(modeRef.current==="server"){
      try{
        const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
        if(!res.ok) throw new Error("send "+res.status);
        const data = await res.json();
        merge([data.message]);
        writeSeen(userRef.current, data.message.id); setSeen(data.message.id);
        if(BOT_RE.test(body.text)) askBot(data.message.id);
        return true;
      }catch(e){
        dispatch({type:"ADD_TOAST", message:"Message not sent — check your connection and try again.", variant:"danger"});
        return false;
      }
    }
    const msg = {...body, id: Date.now(), createdAt: new Date().toISOString()};
    try{ localStorage.setItem(CHAT_LOCAL_KEY, JSON.stringify([...readLocalChat(), msg].slice(-500))); }catch(e){}
    merge([msg]); writeSeen(userRef.current, msg.id); setSeen(msg.id);
    return true;
  }, [merge, dispatch]);

  async function askBot(messageId){
    setBotPending(p=>[...p, messageId]);
    try{
      const res = await fetch("/api/chat/bot", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({messageId})});
      const data = await res.json().catch(()=>({}));
      if(data.message){ merge([data.message]); setBotPending(p=>p.filter(x=>x!==messageId)); return; }
      if(!res.ok && res.status!==202) dispatch({type:"ADD_TOAST", message: data.error || "AI Dev + couldn't answer — try again.", variant:"danger"});
    }catch(e){ /* the answer still arrives through the normal chat refresh */ }
    setTimeout(()=>setBotPending(p=>p.filter(x=>x!==messageId)), 1500);
  }

  const newestId = messages.length ? messages[messages.length-1].id : 0;
  const markSeen = useCallback(()=>{
    if(newestId > readSeen(userRef.current)){ writeSeen(userRef.current, newestId); setSeen(newestId); }
  }, [newestId]);
  const unreadList = messages.filter(m=> m.id>seen && m.author!==currentUserId);
  const unread = unreadList.length;
  const mentionUnread = unreadList.filter(m=>(m.mentions||[]).includes(currentUserId)).length;
  // Reactions and pins: the server returns the updated message, which replaces ours straight away.
  const update = useCallback(async (kind, body)=>{
    try{
      const res = await fetch("/api/chat/"+kind, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({author:userRef.current, ...body})});
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || "Couldn't do that");
      setMessages(prev=>prev.map(m=>m.id===data.message.id ? data.message : m));
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
  }, [dispatch]);
  const react = useCallback((id, emoji)=>update("react", {id, emoji}), [update]);
  const pin = useCallback((id, pinned)=>update("pin", {id, pinned}), [update]);
  return useMemo(()=>({messages, mode, send, markSeen, unread, mentionUnread, seen, botPending, react, pin}), [messages, mode, send, markSeen, unread, mentionUnread, seen, botPending, react, pin]);
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
const mentionRe = () => new RegExp("(@ai\\s?dev\\s?\\+|@(?:"+[...USERS.map(u=>u.name)].sort((a,b)=>b.length-a.length).map(escapeRe).join("|")+"|everyone|all|team)\\b)", "i");
/* ============================== WORKSPACE ============================== */
/* One project per video, in tabs: Ideas (reference reels and ideas, Yes/No votes), Plan (the idea and a shot list),
   Draft review (the creator's cuts with notes pinned to a moment in the video) and Comments. Ideas and the plan are
   optional — a project can go straight to a cut. "Send for approval" here is CONTENT approval — once any teammate other than
   the uploader approves, the creator confirms the SANJUGO file name and the video goes to Google Drive and the Content
   Library. Publishing is separate: "Create post from this" starts a normal post that goes through the Approval Queue. */
const WS_BRANCH_OPTS = [{value:"shoreditch", label:"Shoreditch"}, {value:"angel", label:"Angel"}, {value:"victoria", label:"Victoria"}, {value:"all", label:"All branches"}];
const WS_BRANCH_LETTER = {shoreditch:"S", angel:"A", victoria:"V", all:"G"};
const WS_STATUS = {
  ideas:{label:"Ideas", color:"var(--ink-soft)", soft:"var(--surface-2)"},
  review:{label:"Draft review", color:"var(--amber)", soft:"var(--amber-soft)"},
  waiting:{label:"Waiting for approval", color:"var(--blue)", soft:"var(--blue-soft)"},
  approved:{label:"Approved · name the file", color:"var(--violet)", soft:"var(--violet-soft)"},
  filed:{label:"In Library", color:"var(--green)", soft:"var(--green-soft)"},
};
const WS_PREVIEW_PLATFORMS = ["instagram","tiktok","facebook"];
const WS_SOCIAL_OPTS = Object.entries(LIB_SOCIAL).map(([v,l])=>({value:v, label:v+" · "+l}));
const WS_CATEGORY_OPTS = Object.entries(LIB_CATEGORY).map(([v,l])=>({value:v, label:v+" · "+l}));
const WS_DISH_OPTS = [{value:"", label:"No dish"}, ...Object.entries(LIB_DISH).map(([v,l])=>({value:v, label:v+" · "+l}))];
const WS_STAGE_OPTS = [{value:"FIN", label:"FIN · Finished"}, {value:"EDT", label:"EDT · Edit in progress"}, {value:"RAW", label:"RAW · Raw footage"}];

function wsFmtT(t){ t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); }
function wsAgo(iso){
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60)+"m ago"; if(s < 86400) return Math.floor(s/3600)+"h ago";
  if(s < 7*86400) return Math.floor(s/86400)+"d ago"; return fmtDate(iso, {day:"numeric", month:"short"});
}
const wsUser = id => USERS.find(u=>u.id===id) || {id, name:"Someone", avatarColor:"#98A2B3"};
const wsCreatorName = p => p.creatorId ? wsUser(p.creatorId).name : "not assigned yet";
const wsDishLabel = p => (p.dishes||[]).map(d=>LIB_DISH[d]||d).join(", ");

// Reference links play inside the card where the app allows it; anything else gets an "Open" button.
function wsEmbed(url){
  const u = String(url||"");
  let m = /instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/i.exec(u);
  if(m) return {platform:"instagram", src:"https://www.instagram.com/"+(m[1].startsWith("reel")?"reel":m[1])+"/"+m[2]+"/embed/"};
  m = /tiktok\.com\/@[\w.-]+\/(?:video|photo)\/(\d+)/i.exec(u);
  if(m) return {platform:"tiktok", src:"https://www.tiktok.com/embed/v2/"+m[1]};
  m = /youtube\.com\/shorts\/([\w-]{11})|youtu\.be\/([\w-]{11})|youtube\.com\/watch\?[^#]*v=([\w-]{11})/i.exec(u);
  if(m) return {platform:"youtube", src:"https://www.youtube-nocookie.com/embed/"+(m[1]||m[2]||m[3])};
  const platform = /tiktok/i.test(u) ? "tiktok" : /instagram/i.test(u) ? "instagram" : /youtu/i.test(u) ? "youtube" : /facebook|fb\.watch/i.test(u) ? "facebook" : null;
  return {platform, src:null};
}

    if(!r.ok) throw new Error(d.error || "Something went wrong ("+r.status+")");
    return d;
  }, [state.currentUserId]);
}
async function wsGet(path){
  const r = await fetch("/api/workspace"+path, {cache:"no-store"});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "Couldn't load the Workspace ("+r.status+")");
  return d;
}
// Videos go up with a progress bar (drafts are often hundreds of MB) into the workspace/ folder of storage.
function wsUpload(file, onProgress){
  return new Promise((resolve, reject)=>{
    const fd = new FormData(); fd.append("folder", "workspace"); fd.append("file", file, file.name);
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload");
    x.upload.onprogress = e=>{ if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    x.onload = ()=>{ let d = {}; try{ d = JSON.parse(x.responseText); }catch(e){} x.status<300 && d.url ? resolve(d) : reject(new Error(d.error || "Upload failed ("+x.status+")")); };
    x.onerror = ()=>reject(new Error("Upload failed — check your connection"));
    x.send(fd);
  });
}

        : !list.length ? <Card><EmptyState icon="workspace" title={projects && projects.length? "No projects here" : "Start your first project"}
            subtitle={projects && projects.length? "Try another tab or search." : "A project holds everything for one video: reference reels, ideas, the creator's cuts and everyone's notes."}
            action={!(projects && projects.length) && <Button variant="primary" icon="plus" onClick={()=>setCreating(true)}>Create project</Button>}/></Card>

    </div>
  );
}

// The song travels with "Create post from this": already mixed into the approved video (credit goes in the caption),
// picked in the plan but not mixed in yet (step 4 opens ready to fit it), or an Instagram song added from the phone.
function wsMusicPrefill(p){
  const mixed = p.filed && p.filed.music;
  if(mixed) return {music:{title: mixed.title+" — "+mixed.artist, url: mixed.page, baked:true, credit: mixed.needsCredit ? mixed.credit : ""}};
  if(p.music && p.music.track) return {plannedTrack: p.music.track};
  if(cleanMusic(p.music)) return {music: cleanMusic(p.music)};
  return {};
}
function wsCreatePost(dispatch, p){
  LIBRARY_CACHE = null;
  dispatch({type:"SET_ROUTE", route:"create", createPrefill:{libraryBarcode: p.filed.barcode, wsFresh:true, title: p.title, ...wsMusicPrefill(p)}});
}
// "31 Oct" (and the year when it isn't this year).
function wsDay(iso){ const d = new Date(iso); return fmtDate(iso, d.getFullYear()===new Date().getFullYear() ? {day:"numeric", month:"short"} : {day:"numeric", month:"short", year:"numeric"}); }
function wsDays(from, to){ const n = Math.max(0, Math.round((new Date(to||Date.now()) - new Date(from))/86400e3)); return n===0 ? "same day" : n===1 ? "1 day" : n+" days"; }
// Ideas everyone except the project's creator votes on. Enough No's (3, or everyone if fewer vote) and it's dropped.
function wsIsRemoved(it, voters){ return (it.no||[]).filter(v=>voters.includes(v)).length >= Math.max(1, Math.min(3, voters.length)); }
// "Picked" = someone marked it ⭐ Priority, or a majority of the voters (2 of 3) said Yes. Only picked ideas reach the creator.
const wsNeed = voters=> Math.floor(voters.length/2)+1;
const wsYes = (it, voters)=> (it.yes||[]).filter(v=>voters.includes(v)).length;
function wsPicked(it, voters){ return !!it.priority || (voters.length>0 && wsYes(it, voters) >= wsNeed(voters)); }
// The project's creator and Video Creators only see the picked ideas.
function wsOnlyPicked(p, userId){ const u = USERS.find(x=>x.id===userId); return !!p && (p.creatorId===userId || (u && u.role==="video")); }
function wsRank(list, voters){
  const n = it=>(it.no||[]).filter(v=>voters.includes(v)).length, y = it=>(it.yes||[]).filter(v=>voters.includes(v)).length;
  return [...list].sort((a,b)=> (b.priority?1:0)-(a.priority?1:0) || n(a)-n(b) || y(b)-y(a) || b.createdAt.localeCompare(a.createdAt));
}
