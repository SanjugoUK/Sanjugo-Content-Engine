/* ============================== DECISION MODAL ============================== */
/* "Needs changes": say what to fix and it goes back to the creator. Rejecting outright (don't post it at all) is the
   rare case, so it lives at the bottom of this same dialog rather than as a third button. Approve needs no dialog. */
function DecisionModal({pending, onCancel, onConfirm}){
  const [mode, setMode] = useState("edits");
  const [tags, setTags] = useState([]);
  const [text, setText] = useState("");
  const [dueDate, setDueDate] = useState("");
  useEffect(()=>{ if(pending){ setMode(pending.type==="reject" ? "reject" : "edits"); setTags([]); setText(""); setDueDate(""); } }, [pending && pending.contentId, pending && pending.platform, pending && pending.type]);
  if(!pending) return null;
  const reject = mode==="reject";
  const scope = pending.platform ? " (only "+PLATFORM_META[pending.platform].label+")" : "";
  const ready = reject || text.trim() || tags.length;
  const toggleTag = t=>setTags(ts=> ts.includes(t)? ts.filter(x=>x!==t) : [...ts, t]);
  const input = {width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:10, fontSize:13, fontFamily:"inherit", background:"var(--surface)", color:"var(--ink)"};
  return (
    <Modal open={!!pending} onClose={onCancel} width={460}>
      <div style={{padding:22}}>
        <h3 style={{margin:"0 0 4px", color: reject? "var(--red)" : "var(--ink)"}}>{reject ? "Reject — don't post this" : "What needs to change?"}</h3>
        <div style={{fontSize:12.5, color:"var(--ink-mute)", marginBottom:16}}>{pending.itemTitle}{scope}{reject ? " · the creator sees it under Rejected" : " · goes back to "+(pending.creatorName||"the creator")+" to fix"}</div>
        {!reject && <div style={{display:"flex", flexWrap:"wrap", gap:7, marginBottom:14}}>
          {FEEDBACK_TAGS.map(t=><button key={t} onClick={()=>toggleTag(t)} style={{padding:"6px 11px", borderRadius:99, fontSize:12.5, fontWeight:600, cursor:"pointer", border:"1px solid "+(tags.includes(t)?"var(--amber)":"var(--border)"), background: tags.includes(t)?"var(--amber-soft)":"var(--surface)", color: tags.includes(t)?"var(--amber)":"var(--ink-soft)"}}>{t}</button>)}
        </div>}
        <textarea value={text} onChange={e=>setText(e.target.value)} rows={4} autoFocus placeholder={reject ? "Why? (optional)" : "e.g. Cut the first 2 seconds and use the Shoreditch hashtags"} style={{...input, resize:"vertical", marginBottom:12}}/>
        {!reject && <label style={{display:"flex", alignItems:"center", gap:8, fontSize:12.5, color:"var(--ink-soft)", marginBottom:18}}>Fix by (optional)
          <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} style={{...input, width:"auto", padding:"6px 9px"}}/></label>}
        <div style={{display:"flex", gap:10, justifyContent:"flex-end", alignItems:"center"}}>
          <Button variant="ghost" onClick={()=> reject ? setMode("edits") : onCancel()}>{reject ? "Back" : "Cancel"}</Button>
          <Button variant={reject? "danger" : "amber"} icon={reject? "x" : "send"} disabled={!ready} onClick={()=>onConfirm({type: reject? "reject" : "edits", tags, text, dueDate})}>{reject ? "Reject" : "Send back"}</Button>
        </div>
        {!reject && <div style={{borderTop:"1px solid var(--border)", marginTop:16, paddingTop:12, fontSize:12, color:"var(--ink-mute)"}}>
          Shouldn't be posted at all? <button onClick={()=>setMode("reject")} style={{border:"none", background:"none", padding:0, color:"var(--red)", fontWeight:600, fontSize:12, cursor:"pointer"}}>Reject it instead</button>
        </div>}
      </div>
    </Modal>
  );
}

/* ============================== APPROVAL QUEUE ============================== */
function buildQueue(items, mode, filters, me){
  let pool = items.filter(i=>i.status==="submitted");
  const pendingVs = it => Object.entries(it.variants||{}).filter(([p,v])=> v && (v.status==="submitted" || !v.status));
  // An approver's queue leaves out what they've already approved (it's waiting for the other approver).
  if(me) pool = pool.filter(it=> requiredApprovers(it).includes(me) && pendingVs(it).some(([p,v])=> !(v.approvals||{})[me]));
  if(filters.brand) pool = pool.filter(i=>i.brand===filters.brand);
  if(filters.creator) pool = pool.filter(i=>i.creator===filters.creator);
  if(filters.campaign) pool = pool.filter(i=>matchCampaign(filters.campaign, i.campaign));
  if(filters.priority) pool = pool.filter(i=>i.priority===filters.priority);
  if(filters.platform) pool = pool.filter(i=>i.platforms.includes(filters.platform));
  // Soonest publish date first (overdue at the top); posts without a date after, oldest submission first.
  const when = v => { const t = v && v.scheduledAt ? new Date(v.scheduledAt).getTime() : NaN; return isNaN(t) ? Infinity : t; };
  const submittedAt = it => { const last = (it.versions||[]).slice(-1)[0]; return new Date((last && last.date) || it.createdAt || 0).getTime() || 0; };
  const byDate = (a, b) => (a.t - b.t) || (a.s - b.s);
  if(mode==="package") return pool
    .map(it=>({key:it.id, contentId:it.id, item:it, platform:null, t: Math.min(...it.platforms.map(p=>when((it.variants||{})[p]))), s: submittedAt(it)}))
    .sort(byDate);
  const flat = [];
  pool.forEach(it=> it.platforms.forEach(p=> (filters.platform && filters.platform!==p) || !pendingVs(it).some(([q])=>q===p) || (me && ((it.variants[p]||{}).approvals||{})[me]) ? null : flat.push({key:it.id+"_"+p, contentId:it.id, item:it, platform:p, t: when((it.variants||{})[p]), s: submittedAt(it)})));
  return flat.sort(byDate);
}

function seedNum(str, min, max){
  let h=0; for(const c of str) h=(h*131+c.charCodeAt(0))>>>0;
  return min + (h%(max-min));
}

function useIsNarrow(maxWidth=900){
  const q = "(max-width:"+maxWidth+"px)";
  const [narrow, setNarrow] = useState(()=> !!(window.matchMedia && window.matchMedia(q).matches));
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia(q);
    const on = ()=>setNarrow(mq.matches);
    on();
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return ()=>{ mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, [q]);
  return narrow;
}

function parseTags(text){ return String(text||"").split(/[\s,]+/).filter(Boolean).map(t=> t.startsWith("#")? t : "#"+t); }
// Posts created before the fix kept typed hashtags in hashtagsText only; move them into hashtags.
function withTagsFixed(items){
  let changed = false;
  const out = (items||[]).map(it=>{
    let vChanged = false; const variants = {...(it.variants||{})};
    Object.entries(variants).forEach(([p,v])=>{
      if(v && v.hashtagsText !== undefined){
        const {hashtagsText, ...rest} = v;
        variants[p] = {...rest, hashtags: (v.hashtags||[]).length ? v.hashtags : parseTags(hashtagsText)}; vChanged = true;
      }
    });
    if(!vChanged) return it; changed = true; return {...it, variants};
  });
  return changed ? out : items;
}

  return (text||"").split(/(#[\p{L}\p{N}_]+)/u).map((part,i)=> part.startsWith("#") ? <span key={i} style={tagStyle}>{part}</span> : part);
}

/* Shared by everything inside one phone screen: playback state, real progress, and whether we draw
   the fake iPhone chrome (status bar etc. — hidden in full-screen mode, where the real phone has its own). */
const PhoneCtx = React.createContext({chrome:true, playing:false, muted:true, paused:false, progress:null, setProgress:()=>{}, togglePause:()=>{}, onAutoMuted:()=>{}, canTap:()=>true});

function ScreenBox({children, bg="#000", chrome=true, playing, muted, onAutoMuted, canTap, style}){
  const [paused, setPaused] = useState(false);
  const [progress, setProgress] = useState(null);
  const ctx = {chrome, playing: !!playing, muted: !!muted, paused, progress, setProgress,
    togglePause: ()=>setPaused(p=>!p), onAutoMuted: onAutoMuted||(()=>{}), canTap: canTap||(()=>true)};
  return (
    <PhoneCtx.Provider value={ctx}>
      <div style={{position:"relative", overflow:"hidden", background:bg, containerType:"size", fontFamily:PHONE_FONT, WebkitFontSmoothing:"antialiased", lineHeight:1.3, userSelect:"none", ...style}}>
        {children}
        {chrome && <div style={{position:"absolute", top:pt(11), left:"50%", transform:"translateX(-50%)", width:pt(122), height:pt(35), borderRadius:99, background:"#000", zIndex:9, pointerEvents:"none"}}/>}
      </div>
    </PhoneCtx.Provider>
  );
}

function PhoneStatusBar({dark}){

/* The actual uploaded file when we have it (so approvers watch the real video), otherwise the poster / placeholder.
   Tapping a real video pauses/plays it, like the apps do. */
function ScreenMedia({item, fit="cover", single}){
  const m = item.media || {};
  const gallery = single ? null : galleryOf(item);
  const [idx, setIdx] = useState(0);
  const ctx = React.useContext(PhoneCtx);
  const ref = useRef(null);
  const [failed, setFailed] = useState(false);
  const [imgFailed, setImgFailed] = useState(false);
  const isVideo = !!(m.fileUrl && m.type==="video") && !failed;
  const shouldPlay = ctx.playing && !ctx.paused;
  useEffect(()=>{
    const v = ref.current; if(!v) return;
    v.muted = ctx.muted;
    if(!shouldPlay){ v.pause(); return; }
    const p = v.play();
    if(p && p.catch) p.catch(()=>{
      // Browsers can refuse to autoplay with sound — fall back to muted playback rather than a frozen frame.
      if(!v.muted){ v.muted = true; ctx.onAutoMuted(); const p2 = v.play(); if(p2 && p2.catch) p2.catch(()=>{}); }
    });
  }, [shouldPlay, ctx.muted, m.fileUrl, isVideo]);
  const fill = {width:"100%", height:"100%", objectFit:fit, background:"#000", display:"block"};
  if(isVideo){
    return (
      <div style={{position:"absolute", inset:0, cursor:"pointer"}}
        onClick={e=>{ e.stopPropagation(); if(ctx.canTap()) ctx.togglePause(); }}>
        <video ref={ref} src={m.fileUrl} poster={m.previewUrl||undefined} muted loop playsInline preload={ctx.playing? "auto" : "metadata"} style={{...fill, pointerEvents:"none"}}
          onTimeUpdate={e=>{ const v=e.currentTarget; if(v.duration) ctx.setProgress(v.currentTime/v.duration); }}
          onError={()=>setFailed(true)}/>
        {ctx.paused && <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}>
          <svg viewBox="0 0 24 24" style={{width:pt(64), height:pt(64), opacity:.8, filter:"drop-shadow(0 2px 6px rgba(0,0,0,.4))"}}><path d="M7 4.5v15l12.5-7.5z" fill="#fff"/></svg>
        </div>}
      </div>
    );
  }
  if(gallery){
    const i = Math.min(idx, gallery.length-1);
    const go = d => e=>{ e.stopPropagation(); setIdx((i + d + gallery.length) % gallery.length); };
    const arrow = (d, side) => <button onPointerDown={e=>e.stopPropagation()} onClick={go(d)} aria-label={d<0?"Previous photo":"Next photo"}
      style={{position:"absolute", top:"50%", [side]:pt(8), transform:"translateY(-50%)", width:pt(30), height:pt(30), borderRadius:99, border:"none", background:"rgba(255,255,255,.85)", color:"#111", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", boxShadow:"0 1px 4px rgba(0,0,0,.3)", padding:0}}>
      <svg viewBox="0 0 24 24" width={pt(16)} height={pt(16)} fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"><path d={d<0? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}/></svg></button>;
    return (
      <div style={{position:"absolute", inset:0}}>
        <img src={gallery[i].fileUrl || gallery[i].previewUrl} alt="" draggable={false} style={{width:"100%", height:"100%", objectFit:fit, background:"#000", display:"block", pointerEvents:"none"}}/>
        <span style={{position:"absolute", top:pt(10), right:pt(10), background:"rgba(0,0,0,.6)", color:"#fff", borderRadius:99, padding:`${pt(2)} ${pt(8)}`, fontSize:pt(12), fontWeight:600, pointerEvents:"none"}}>{i+1}/{gallery.length}</span>
        {i>0 && arrow(-1, "left")}
        {i<gallery.length-1 && arrow(1, "right")}
        <div style={{position:"absolute", left:0, right:0, bottom:pt(8), display:"flex", justifyContent:"center", gap:pt(4), pointerEvents:"none"}}>
          {gallery.map((_, j)=><span key={j} style={{width:pt(6), height:pt(6), borderRadius:99, background: j===i? "#0095F6" : "rgba(255,255,255,.7)", boxShadow:"0 0 2px rgba(0,0,0,.4)"}}/>)}
        </div>
      </div>
    );
  }
  const src = (m.type!=="video" && m.fileUrl) || m.previewUrl;
  return (
    <div style={{position:"absolute", inset:0, pointerEvents:"none"}}>
      {src && !imgFailed ? <img src={src} alt="" draggable={false} onError={()=>setImgFailed(true)} style={fill}/> : <Thumb item={item} radius={0} iconSize={38} bare/>}
      {failed && <div style={{position:"absolute", left:pt(24), right:pt(24), top:"38%", background:"rgba(0,0,0,.72)", color:"#fff", borderRadius:pt(12), padding:pt(14), fontSize:pt(13.5), lineHeight:1.4, textAlign:"center"}}>
        This browser can't play this video format (usually an iPhone HEVC .MOV). It plays on iPhone/Safari and Chrome on Mac — or export it as MP4 (H.264) to play everywhere.
      </div>}
    </div>
  );
}

function PhoneCaption({children, lines=1, style}){
  const [open, setOpen] = useState(false);

  return <div onPointerDown={e=>e.stopPropagation()} onClick={e=>{ e.stopPropagation(); setOpen(o=>!o); }} style={{cursor:"pointer", wordBreak:"break-word", ...clamp, ...style}}>{children}</div>;
}

  const {progress, chrome} = React.useContext(PhoneCtx);
  // Stories are 9:16. On a phone taller than that (the preview iPhone is 9:19.5) Instagram shows the story at full
  // width below the status bar with the reply bar underneath — it never crops the sides. Full screen is already 9:16.
  const frameTop = chrome ? pt(58) : "0px";
  const frame = chrome ? {position:"absolute", left:0, right:0, top:frameTop, height:"calc(100cqw * 16 / 9)", borderRadius:pt(10), overflow:"hidden", background:"#111"}
    : {position:"absolute", inset:0, overflow:"hidden"};
  const below = (n) => `calc(${frameTop} + ${pt(n)})`;
  const account = platform==="facebook" ? (brand.accounts.facebook || brand.name) : (handleOf(brand.accounts[platform]) || handleOf(brand.name));
  const link = variant && variant.url;

        <AppGlyph name="dotsH" size={pt(22)}/>

        <svg viewBox="0 0 24 24" width={pt(16)} height={pt(16)} fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>

/* Full-screen review: the post fills the approver's screen exactly like opening the app, with the decision
   buttons underneath. Stays open and moves on to the next post after each decision. */
function ImmersiveViewer({entry, platform, onPlatform, onDecision, onClose, busy, browse}){
  const item = entry.item;
  const brand = BRANDS.find(b=>b.id===item.brand);
  const platforms = entry.platform ? [entry.platform] : item.platforms;
  const [muted, setMuted] = useState(false);
  const hasVideo = item.media.type==="video" && !!item.media.fileUrl;
  const [screen, bg] = platformScreen(platform, item, item.variants[platform], brand);
  useEffect(()=>{
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.body.classList.add("cf-immersive");
    return ()=>{ document.body.style.overflow = prev; document.body.classList.remove("cf-immersive"); };
  }, []);
  useEffect(()=>{
    if(busy) return;
    const onKey = e=>{
      if(e.key==="Escape") onClose();
    };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  }, [busy, onClose, onDecision]);
  return ReactDOM.createPortal(
    <div onPointerDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}
      style={{position:"fixed", inset:0, zIndex:90, background:"#000", display:"flex", flexDirection:"column", paddingTop:"env(safe-area-inset-top, 0px)", animation:"cf-fade-in .18s ease"}}>
      <div style={{flex:1, minHeight:0, containerType:"size", display:"flex", justifyContent:"center"}}>

/* ---- Music: a song from Instagram's library ----
   Instagram (Meta) doesn't let any outside app add its library songs, so a post with a song is posted from the phone:
   Download → post in the app with the song → Mark as published. Auto-posting skips those platforms. */
const MUSIC_PLATFORMS = ["instagram", "facebook", "tiktok"];
const songOf = item => item && item.music && item.music.title ? item.music : null;
const musicByPhone = (item, p) => !!songOf(item) && !item.music.baked && MUSIC_PLATFORMS.includes(p);
function cleanMusic(m){ const title = String((m && m.title) || "").trim().slice(0, 120); const url = String((m && m.url) || "").trim().slice(0, 300); return title ? {title, url: /^https:\/\//i.test(url) ? url : "", ...(m.baked? {baked:true, credit:String(m.credit||"").slice(0,200)} : {})} : null; }

/* ---- Music library: royalty-free songs mixed into the video before posting ----
   Search: /api/music/search (Openverse, business-safe licences only). The mix runs in the browser with ffmpeg.wasm
   (public/vendor; the 32 MB engine is split in two because hosted files are capped at 25 MB). The video picture is
   copied as is (no quality loss); only the sound is rebuilt: the song (from the chosen start, with a fade-out) plus
   the original sound at the chosen volume. The result is uploaded as the post's new video. */
let FF_LOADING = null;
function loadFFmpeg(onStatus){
  if(!FF_LOADING) FF_LOADING = (async ()=>{
    const mod = await (new Function("u", "return import(u)"))(location.origin+"/vendor/ffmpeg/index.js");
    onStatus && onStatus("Getting the editor ready (one-time download, about 30 MB)…");
    const parts = await Promise.all(["/vendor/ffmpeg-core/core-1.bin", "/vendor/ffmpeg-core/core-2.bin"].map(u=>fetch(u).then(r=>{ if(!r.ok) throw new Error("Couldn't load the editor ("+r.status+")"); return r.arrayBuffer(); })));
    const ff = new mod.FFmpeg();
    await ff.load({coreURL: location.origin+"/vendor/ffmpeg-core/ffmpeg-core.js", wasmURL: URL.createObjectURL(new Blob(parts, {type:"application/wasm"}))});
    return ff;
  })().catch(e=>{ FF_LOADING = null; throw e; });
  return FF_LOADING;
}
async function mixMusicIntoVideo({videoUrl, track, start, musicVol, origVol, fade, duration, onStatus}){
  const ff = await loadFFmpeg(onStatus);
  onStatus && onStatus("Loading the video and the song…");
  const [vid, aud] = await Promise.all([
    fetch(videoUrl).then(r=>{ if(!r.ok) throw new Error("Couldn't load the video ("+r.status+")"); return r.arrayBuffer(); }),
    fetch("/api/music/audio/"+track.id).then(r=>{ if(!r.ok) throw new Error("Couldn't load the song ("+r.status+")"); return r.arrayBuffer(); })]);
  await ff.writeFile("in.mp4", new Uint8Array(vid)); await ff.writeFile("song.mp3", new Uint8Array(aud));
  const D = Math.max(1, Number(duration) || 30);
  const song = `[1:a]atrim=start=${Number(start)||0},asetpts=PTS-STARTPTS,volume=${musicVol.toFixed(2)}${fade? `,afade=t=out:st=${Math.max(0, D-1.5).toFixed(2)}:d=1.5` : ""}`;
  const out = ["-map", "0:v:0", "-map", "[a]", "-c:v", "copy", "-c:a", "aac", "-b:a", "192k", "-t", D.toFixed(2), "-movflags", "+faststart", "out.mp4"];
  const tries = origVol > 0.001 ? [
    song+`[m];[0:a]volume=${origVol.toFixed(2)}[o];[o][m]amix=inputs=2:duration=first:dropout_transition=0:normalize=0[a]`,
    song+`[m];[0:a]volume=${origVol.toFixed(2)}[o];[o][m]amix=inputs=2:duration=first:dropout_transition=0,volume=2[a]`,
    song+"[a]"] : [song+"[a]"]; // a video without its own sound falls back to the song alone
  const onProg = ({progress})=> onStatus && progress>0 && progress<=1 && onStatus("Mixing the music in… "+Math.round(progress*100)+"%");
  ff.on("progress", onProg);
  let code = -1;
  try{
    for(const fc of tries){ try{ await ff.deleteFile("out.mp4"); }catch(e){} code = await ff.exec(["-i", "in.mp4", "-i", "song.mp3", "-filter_complex", fc, ...out]); if(code===0) break; }
    if(code!==0) throw new Error("The music couldn't be mixed into this video. Try exporting it as MP4 first.");
    const data = await ff.readFile("out.mp4");
    return new Blob([data.buffer], {type:"video/mp4"});
  } finally {
    ff.off("progress", onProg);
    for(const f of ["in.mp4", "song.mp3", "out.mp4"]){ try{ await ff.deleteFile(f); }catch(e){} }
  }
}
const MUSIC_MOODS = ["Upbeat", "Chill", "Happy", "Jazz", "Acoustic", "Lofi", "Piano", "Cinematic", "Electronic", "Funk", "Latin", "Summer"];

// Fit a song to a video: where the song starts, volumes, fade-out, a synced preview, then mix it in.
// onApply(blob, settings, setBusy) saves the mixed video (as the post's video, or as a new Workspace draft).
function MusicFitter({videoUrl, duration, track, init, applyLabel="Add to video", onApply, onBack}){
  const {dispatch} = useApp();
  const [start, setStart] = useState((init && init.start) || 0);
  const [musicVol, setMusicVol] = useState(init && init.musicVol!=null ? init.musicVol : 80);
  const [origVol, setOrigVol] = useState(init && init.origVol!=null ? init.origVol : 20);
  const [fade, setFade] = useState(init && init.fade!=null ? init.fade : true);
  const [busy, setBusy] = useState("");
  const [previewing, setPreviewing] = useState(false);
  const [vidDur, setVidDur] = useState(Number(duration) || 0);
  const vref = useRef(null), aref = useRef(null);
  useEffect(()=>()=>{ aref.current && aref.current.pause(); }, []);
  const maxStart = track.duration ? Math.max(0, track.duration - Math.max(1, vidDur)) : 0;
  function stopPreview(){ setPreviewing(false); aref.current && aref.current.pause(); }
  function togglePreview(){
    const v = vref.current; if(!v) return;
    if(previewing){ v.pause(); stopPreview(); return; }
    stopMusicPreview();
    if(!aref.current){ aref.current = new Audio("/api/music/audio/"+track.id); }
    const a = aref.current;
    v.currentTime = 0; v.muted = origVol===0; v.volume = Math.min(1, origVol/100);
    a.currentTime = start; a.volume = Math.min(1, musicVol/100);
    v.play().catch(()=>{}); a.play().catch(()=>{}); setPreviewing(true);
  }
  function onTime(){
    const v = vref.current, a = aref.current; if(!v || !a || !previewing) return;
    if(Math.abs((a.currentTime - start) - v.currentTime) > 0.3) a.currentTime = start + v.currentTime;
    const left = (v.duration || vidDur) - v.currentTime;
    a.volume = Math.min(1, musicVol/100) * (fade && left < 1.5 ? Math.max(0, left/1.5) : 1);
  }
  async function apply(){
    stopPreview(); vref.current && vref.current.pause();
    setBusy("Starting…");
    try{
      const settings = {start, musicVol, origVol, fade};
      const blob = await mixMusicIntoVideo({videoUrl, track, start, musicVol:musicVol/100, origVol:origVol/100, fade, duration: vidDur || duration, onStatus:setBusy});
      await onApply(blob, settings, setBusy);
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message || "Couldn't add the music", variant:"danger"}); }
    setBusy("");
  }
  const slider = (label, val, setVal, min, max, step, fmt)=>(
    <label style={{display:"grid", gridTemplateColumns:"110px 1fr 52px", alignItems:"center", gap:8, fontSize:12.5}}>
      <span style={{color:"var(--ink-soft)", fontWeight:600}}>{label}</span>
      <input type="range" min={min} max={max} step={step} value={val} onChange={e=>{ setVal(Number(e.target.value)); stopPreview(); vref.current && vref.current.pause(); }}/>
      <span style={{textAlign:"right", fontVariantNumeric:"tabular-nums"}}>{fmt(val)}</span>
    </label>);
  return (
    <div style={{display:"flex", flexWrap:"wrap", gap:14, alignItems:"flex-start"}}>
      <div style={{flex:"0 0 140px", maxWidth:"100%"}}>
        <video ref={vref} src={videoUrl+"#t=0.5"} playsInline preload="metadata" onLoadedMetadata={e=>setVidDur(e.target.duration||vidDur)} onTimeUpdate={onTime} onEnded={stopPreview}
          style={{width:"100%", aspectRatio:"9/16", objectFit:"cover", borderRadius:10, background:"#000"}}/>
      </div>
      <div style={{display:"flex", flexDirection:"column", gap:10, minWidth:0, flex:"1 1 250px"}}>
        <div style={{fontSize:13.5}}><b>{track.title}</b> — {track.artist}<div style={{fontSize:11.5, color:"var(--ink-mute)"}}>{track.duration? fmtSecs(track.duration)+" song · " : ""}video {fmtSecs(vidDur)} · {track.licenseLabel}</div></div>
        {slider("Song starts at", start, setStart, 0, Math.max(0.5, maxStart), 0.5, fmtSecs)}
        {slider("Music volume", musicVol, setMusicVol, 0, 100, 5, v=>v+"%")}
        {slider("Original sound", origVol, setOrigVol, 0, 100, 5, v=> v? v+"%" : "Off")}
        <label style={{display:"flex", alignItems:"center", gap:8, fontSize:12.5}}><input type="checkbox" checked={fade} onChange={e=>setFade(e.target.checked)}/> Fade the music out at the end</label>
        {track.needsCredit && <div style={{fontSize:11.5, color:"var(--ink-mute)", lineHeight:1.45}}>This song's licence asks for a credit, so this line goes in the caption when it's posted: <i>{track.credit}</i></div>}
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
          <Button icon={previewing? undefined : "play"} onClick={togglePreview} disabled={!!busy}>{previewing? "Stop" : "Preview together"}</Button>
          <Button variant="primary" onClick={apply} disabled={!!busy}>{busy? "Working…" : applyLabel}</Button>
          {onBack && <Button variant="subtle" onClick={()=>{ stopPreview(); onBack(); }} disabled={!!busy}>Back</Button>}
        </div>
        {busy && <div style={{fontSize:12, color:"var(--violet)", fontWeight:600}}>{busy}</div>}
      </div>
    </div>
  );
}

// Add (or take out) the "🎵 Music: …" credit line at the end of each platform's caption.
function withMusicCredit(vars, credit, add, platforms){
  const out = {...vars};
  [...new Set([...(platforms||[]), ...Object.keys(out)])].forEach(p=>{
    if(p==="gbp") return;
    const v = {...(out[p]||{})}; const key = p==="youtube" ? "description" : "caption";
    let txt = String(v[key]||"").split("\n").filter(l=>!/^🎵 Music: /.test(l.trim())).join("\n").replace(/\n+$/, "");
    if(add && credit) txt = (txt ? txt+"\n\n" : "")+credit;
    v[key] = txt; out[p] = v;
  });
  return out;
}

function variantFields(platform, v){
  if(!v) return [];
  if(v.postType==="Story") return [["Link sticker", v.url || "None"], ["Posting notes", v.storyNotes]];
  if(platform==="youtube") return [["Title", v.title], ["Description", v.description]];
  if(platform==="gbp" && isGbpPhoto(v)) return [["Listing", gbpListingLabel(v)], ["Gallery photo", gbpCategoryLabel(v)], ["Description", v.caption]];
  if(platform==="gbp") return [["Listing", gbpListingLabel(v)], ["Update text", v.caption], ["Button", v.cta || "Learn more"]];
  return [["Caption", v.caption], ["Hashtags", (v.hashtags||[]).join(" ")]];
}

// The creator's note (and what changed on a resubmit), shown on the approval card itself so approvers can't miss it.
function ApproverNote({item, creator, compact, stop}){
  const [open, setOpen] = useState(false);
  const note = String(item.notes||"").trim();
  const last = (item.versions||[]).slice(-1)[0];
  const changed = item.currentVersion>1 && last && last.changes && last.changes!=="Revised after feedback" ? String(last.changes).trim() : "";
  if(!note && !changed) return null;
  const clamp = compact && !open ? {display:"-webkit-box", WebkitLineClamp:3, WebkitBoxOrient:"vertical", overflow:"hidden"} : {};
  const long = (note.length + changed.length) > 140;
  return (
    <div onPointerDown={stop} onClick={e=>{ e.stopPropagation(); if(compact && long) setOpen(o=>!o); }}
      style={{background:"#FFF8DB", border:"1px solid #F5D565", borderRadius:10, padding: compact? "7px 10px" : "10px 12px", color:"#5C4500", fontSize: compact? 12.5 : 13.5, lineHeight:1.45, cursor: compact && long ? "pointer" : "default", userSelect:"text"}}>
      {note && <div style={clamp}><b>📝 Note from {creator.name}:</b> <span style={{whiteSpace:"pre-wrap"}}>{note}</span></div>}
      {changed && <div style={{marginTop: note? 4 : 0, ...clamp}}><b>✏️ Changed in v{item.currentVersion}:</b> <span style={{whiteSpace:"pre-wrap"}}>{changed}</span></div>}
      {compact && long && <div style={{fontSize:11, fontWeight:700, marginTop:2, opacity:.75}}>{open? "Show less" : "Tap to read all"}</div>}
    </div>
  );
}

/* Approval Queue has three tabs: To review (approvers), Needs changes and Rejected (where creators fix and resubmit). */
function QueueTabs({tab, setTab, canReview}){
  const {state} = useApp();
  const count = (st, k) => k==="review" ? buildQueue(state.contentItems, "package", {}, state.currentUserId).length
    : state.contentItems.filter(i=>i.status===st && (k!=="waiting" || i.creator===state.currentUserId)).length;
  const tabs = [...(canReview? [["review","To review","submitted"]] : [["waiting","Waiting for approval","submitted"]]), ["changes","Needs changes","changes_requested"], ["rejected","Rejected","rejected"]];
  return (
    <div className="cf-noscrollbar" style={{display:"flex", gap:4, borderBottom:"1px solid var(--border)", marginBottom:16, overflowX:"auto"}}>
      <style>{`@media (max-width:600px){ .cf-qtab{ padding:9px 8px !important; font-size:12.5px !important; gap:5px !important; } }`}</style>
      {tabs.map(([k,l,st])=>{
        const n = count(st, k), active = tab===k;
        return <button key={k} onClick={()=>setTab(k)} className="cf-qtab" style={{padding:"9px 14px", border:"none", borderBottom:"2px solid "+(active? "var(--accent)":"transparent"), marginBottom:-1, background:"transparent", color: active? "var(--ink)":"var(--ink-soft)", fontWeight: active? 600:500, fontSize:13.5, cursor:"pointer", display:"flex", alignItems:"center", gap:7, whiteSpace:"nowrap"}}>
          {l}<span className="num" style={{fontSize:11, fontWeight:600, padding:"1px 7px", borderRadius:99, background: n? (k==="review"||k==="waiting"? "var(--blue-soft)" : k==="changes"? "var(--amber-soft)" : "var(--red-soft)") : "var(--surface-2)", color: n? (k==="review"? "var(--blue)" : k==="changes"? "var(--amber)" : "var(--red)") : "var(--ink-mute)"}}>{n}</span>
        </button>;
      })}
    </div>
  );
}

  useEffect(()=>{
    if(!item){ setF(null); return; }
    const variants = {};
    Object.entries(item.variants||{}).forEach(([p,v])=>{ variants[p] = {caption:v.caption||"", hashtags:(v.hashtags||[]).join(" "), title:v.title||"", description:v.description||"", cta:v.cta||"", url:v.url||"", listing:gbpListing(v), gbpType: isGbpPhoto(v)? "photo" : "update", category:gbpCategory(v), storyNotes:v.storyNotes||"", scheduledAt: v.scheduledAt ? isoToLocalInput(v.scheduledAt) : ""}; });
    setF({title:item.title, approver:item.approver||ANY_APPROVER, variants, media:null, libraryRef:undefined, note:"", notes:item.notes||"", music:item.music||{title:"", url:""}, mediaStatus:""});
    setTab(item.platforms[0]);
    setNotify(true);
    // Always start with one date for every platform — creators expect changing it to move the whole post.
    setPerPlatform(false);
  }, [item && item.id]);
  if(!item || !f) return null;
  const toTell = approversOf(item).filter(u=>u.id!==state.currentUserId);
  const setV = (p, patch) => setF(x=>({...x, variants:{...x.variants, [p]:{...x.variants[p], ...patch}}}));
  // One publish time for every platform unless the creator asks for different ones — editing it in one platform's tab left the others on the old date.
  const setAllTimes = (t) => setF(x=>({...x, variants:Object.fromEntries(Object.entries(x.variants).map(([p,vv])=>[p, {...vv, scheduledAt:t}]))}));
  const input = {width:"100%", padding:"9px 11px", borderRadius:8, border:"1px solid var(--border)", fontSize:13.5, background:"var(--surface)", color:"var(--ink)", fontFamily:"inherit"};
  const label = {display:"block", fontSize:12.5, fontWeight:600, marginBottom:6, marginTop:14};

  async function pickFromLibrary(file, connected){
    setF(x=>({...x, mediaStatus:"Copying "+(file.barcode||"file")+" from Google Drive…", libraryRef: libraryRefOf(file)}));
    if(!connected){ setF(x=>({...x, mediaStatus:"Linked to "+(file.barcode||"the library file")+" — Google Drive isn't connected, so the file wasn't copied."})); return; }
    try{
      const r = await fetch("/api/library/import", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:file.id})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't copy the file");
      const isVideo = (d.mime||"").startsWith("video/");
      const info = await readMediaInfo(d.url, isVideo);
      setF(x=>({...x, mediaStatus:"New file ready — "+(file.barcode||file.name), media:{type:isVideo?"video":"image", gallery:null, fileUrl:d.url, previewUrl: isVideo? libThumbUrl(file, true) : d.url,
        ...(info? {aspectRatio: nearestAspect(info.w, info.h) || item.media.aspectRatio, duration: isVideo && isFinite(info.duration)? Math.round(info.duration) : null} : {})}}));
    }catch(e){ setF(x=>({...x, mediaStatus:e.message})); }
  }
  async function upload(file){
    const isVideo = file.type.startsWith("video/");
    setF(x=>({...x, mediaStatus:"Uploading "+file.name+"…", libraryRef:null}));
    try{
      const [up, preview, info] = await Promise.all([uploadMediaFile(file), (isVideo? videoFileToPoster(file, 480, 0.72) : imageFileToPreview(file, 480, 0.78)).catch(()=>null), readMediaInfo(file, isVideo)]);
      setF(x=>({...x, mediaStatus:"New file ready — "+file.name, media:{type:isVideo?"video":"image", gallery:null, fileUrl:up.url, previewUrl:preview, ...(info? {aspectRatio: nearestAspect(info.w, info.h) || item.media.aspectRatio, duration: isVideo && isFinite(info.duration)? Math.round(info.duration) : null} : {})}}));
    }catch(e){ setF(x=>({...x, mediaStatus:"Upload failed — "+e.message})); }
  }
  async function uploadPhotos(files){
    const list = files.slice(0, MAX_PHOTOS);
    setF(x=>({...x, mediaStatus:"Uploading "+list.length+" photos…", libraryRef:null}));
    try{
      const g = [];
      for(const file of list){ g.push(await carouselReadyPhoto(file, file.name)); setF(x=>({...x, mediaStatus:"Uploading photos… "+g.length+"/"+list.length})); }
      setF(x=>({...x, mediaStatus:"New photos ready — "+g.length+" photos"+(g.some(p=>p.trimmed)? " (some trimmed to Instagram's 4:5 shape)" : ""), media: galleryMedia(g)}));
    }catch(e){ setF(x=>({...x, mediaStatus:"Upload failed — "+e.message})); }
  }
  function patchFromForm(){
    const variants = {};
    Object.entries(f.variants).forEach(([p,v])=>{
      variants[p] = {caption:v.caption, hashtags: v.hashtags.split(/[\s,]+/).filter(Boolean).map(t=> t.startsWith("#")? t : "#"+t), title:v.title, description:v.description, cta:v.cta, url:v.url.trim(), storyNotes:v.storyNotes, ...(p==="gbp"? {listing:v.listing, gbpType:v.gbpType, ...(v.gbpType==="photo"? {category:v.category} : {})} : {}),
        scheduledAt: v.scheduledAt ? new Date(v.scheduledAt).toISOString() : null};
    });
    return {title:f.title.trim() || item.title, variants, ...(f.media? {media:f.media} : {}), ...(f.libraryRef!==undefined? {libraryRef:f.libraryRef} : {}),
      ...(f.approver !== (item.approver||ANY_APPROVER) ? {approver:f.approver} : {}),
      ...(JSON.stringify(cleanMusic(f.music)) !== JSON.stringify(cleanMusic(item.music)) ? {music:cleanMusic(f.music)} : {}),
      ...((f.notes||"") !== (item.notes||"") ? {notes:f.notes} : {})};
  }
  async function save(resubmit){
    setBusy(true);
    dispatch({type:"REVISE_CONTENT", contentId:item.id, patch:patchFromForm(), resubmit, note:f.note.trim()});
    if(resubmit && notify && toTell.length){
      await chat.send(toTell.map(u=>"@"+u.name).join(" ")+" I've made the changes to \""+(f.title.trim()||item.title)+"\" and resubmitted it for approval."+(f.note.trim()? "\n"+f.note.trim() : ""), item.id);
    }
    setBusy(false);
    onClose();
  }
  const uploading = /Uploading|Copying/.test(f.mediaStatus);
  const v = f.variants[tab] || {};
  return (
    <Drawer open={!!item} onClose={onClose} width={640}>
      <div style={{position:"sticky", top:0, zIndex:3, background:"var(--surface)", borderBottom:"1px solid var(--border)", padding:"14px 18px", display:"flex", gap:10, alignItems:"flex-start"}}>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:11.5, color:"var(--ink-mute)", fontWeight:600}}>{item.status==="rejected"? "Rework & resubmit" : item.status==="changes_requested"? "Edit & resubmit" : "Edit post"} · currently v{item.currentVersion}</div>
          <div style={{fontSize:16.5, fontWeight:600}}>{item.title}</div>
        </div>
        <IconButton icon="x" title="Close" onClick={onClose}/>
      </div>
      <div style={{padding:18}}>
        {(item.status==="changes_requested" || item.status==="rejected") && <FeedbackBox item={item}/>}
        <label style={label}>Title</label>
        <input value={f.title} onChange={e=>setF(x=>({...x, title:e.target.value}))} style={input}/>

        <label style={label}>Approver</label>
        {(()=>{ const me = USERS.find(u=>u.id===state.currentUserId)||{}; const can = (PERMS[me.role]||{}).approve || ["draft","changes_requested","rejected"].includes(item.status);
          return <>
            <select aria-label="Approver" value={f.approver} disabled={!can} onChange={e=>setF(x=>({...x, approver:e.target.value}))} style={{...input, opacity: can? 1 : .6}}>
              {approverOptions().map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
            {!can && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:-6, marginBottom:10}}>While it's waiting for approval, only Cyrus or Yan Yan can change this.</div>}
          </>; })()}

        <label style={label}>Photo / video</label>
        <div style={{display:"flex", gap:12, alignItems:"center", marginBottom:8}}>
          <div style={{width:64, height:64, borderRadius:8, overflow:"hidden", flexShrink:0}}><Thumb item={{...item, media:{...item.media, ...(f.media||{})}}} radius={8} iconSize={16}/></div>
          <div style={{fontSize:12.5, color: /failed|isn't|Couldn't/.test(f.mediaStatus)? "var(--red)" : "var(--ink-soft)"}}>{f.mediaStatus || (f.media? "" : (galleryOf(item)? "Keeping the current "+galleryOf(item).length+" photos. To replace them, upload several photos at once." : "Keeping the current file. Replace it below if the feedback was about the visual — pick several photos at once for a multi-photo post."))}</div>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"1fr auto", gap:8, alignItems:"center"}}>
          <LibraryPicker onPick={pickFromLibrary}/>
          <label style={{display:"inline-flex", alignItems:"center", gap:6, padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", fontSize:13, fontWeight:500, cursor:"pointer", whiteSpace:"nowrap"}}>
            <Icon name="upload" size={14}/>Upload
            <input type="file" accept="image/*,video/*" multiple={!isStoryItem(item)} style={{display:"none"}} onChange={e=>{ const fs=[...e.target.files]; e.target.value=""; const photos=fs.filter(x=>x.type.startsWith("image/")); if(photos.length>1) uploadPhotos(photos); else if(fs[0]) upload(fs[0]); }}/>
          </label>
        </div>

        <label style={label}>Publish date &amp; time</label>
        {!perPlatform ? <div style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
          <input type="datetime-local" value={(f.variants[item.platforms[0]]||{}).scheduledAt||""} onChange={e=>setAllTimes(e.target.value)} style={{...input, width:"auto"}}/>
          <span style={{fontSize:12, color:"var(--ink-mute)"}}>{item.platforms.length>1? "All "+item.platforms.length+" platforms" : PLATFORM_META[item.platforms[0]].label}</span>
          {item.platforms.length>1 && <Button variant="text" size="sm" onClick={()=>setPerPlatform(true)}>Different time per platform</Button>}
          {item.platforms.length>1 && new Set(item.platforms.map(p=>(f.variants[p]||{}).scheduledAt||"")).size>1 && <div style={{flexBasis:"100%", fontSize:12, color:"var(--amber)", background:"var(--amber-soft)", borderRadius:8, padding:"7px 10px", lineHeight:1.5}}>
            These platforms are on different dates right now ({item.platforms.map(p=>PLATFORM_META[p].label+" "+((f.variants[p]||{}).scheduledAt? fmtDateTime((f.variants[p]||{}).scheduledAt) : "not set")).join(" · ")}). Pick a date above to put them all on it.
          </div>}
        </div> : <div style={{display:"grid", gap:8}}>
          {item.platforms.map(p=>(
            <div key={p} style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
              <span style={{display:"inline-flex", alignItems:"center", gap:6, width:130, fontSize:12.5, fontWeight:600}}><PlatformIcon platform={p} size={11}/>{PLATFORM_META[p].label}</span>
              <input type="datetime-local" value={(f.variants[p]||{}).scheduledAt||""} onChange={e=>setV(p,{scheduledAt:e.target.value})} style={{...input, width:"auto"}}/>
            </div>
          ))}
          <div><Button variant="text" size="sm" onClick={()=>{ setAllTimes((f.variants[item.platforms[0]]||{}).scheduledAt||""); setPerPlatform(false); }}>Use {PLATFORM_META[item.platforms[0]].label}'s time for all</Button></div>
        </div>}

        {item.music && item.music.baked ? <>
          <label style={label}>Music</label>
          <MusicChip item={item}/>
        </> : item.platforms.some(p=>MUSIC_PLATFORMS.includes(p)) && <>
          <label style={label}>Music from Instagram (optional)</label>
          <MusicFields value={f.music} onChange={m=>setF(x=>({...x, music:m}))} hint={false}/>
        </>}
        <label style={label}>{isStoryItem(item)? "Story details per platform" : "Wording per platform"}</label>
        <div className="cf-noscrollbar" style={{display:"flex", gap:6, overflowX:"auto", marginBottom:10}}>
          {item.platforms.map(p=>(
            <button key={p} onClick={()=>setTab(p)} style={{display:"flex", alignItems:"center", gap:6, padding:"6px 11px 6px 6px", borderRadius:99, border:"1px solid "+(tab===p? PLATFORM_HEX[p]:"var(--border)"), background: tab===p? PLATFORM_HEX[p]+"14":"var(--surface)", fontSize:12.5, fontWeight:600, cursor:"pointer", color:"var(--ink)", flexShrink:0}}>
              <PlatformIcon platform={p} size={11}/>{PLATFORM_META[p].label}
            </button>
          ))}
        </div>
        {isStoryItem(item) ? <>
          {tab!=="tiktok" && <input value={v.url} onChange={e=>setV(tab,{url:e.target.value})} placeholder="Link sticker (optional) — https://…" style={{...input, marginBottom:8}}/>}
          <textarea value={v.storyNotes} onChange={e=>setV(tab,{storyNotes:e.target.value})} placeholder="Posting notes — stickers, @mentions, music…" rows={3} style={{...input, resize:"vertical"}}/>
        </> : tab==="youtube" ? <>
          <input value={v.title} onChange={e=>setV(tab,{title:e.target.value})} placeholder="YouTube Shorts title" style={{...input, marginBottom:8}}/>
          <textarea value={v.description} onChange={e=>setV(tab,{description:e.target.value})} placeholder="Description" rows={3} style={{...input, resize:"vertical"}}/>
        </> : <>
          <textarea value={v.caption} onChange={e=>setV(tab,{caption:e.target.value})} placeholder="Caption" rows={4} style={{...input, resize:"vertical", marginBottom:8}}/>
          {tab==="gbp"
            ? <>
              <select aria-label="Google Business post type" value={v.gbpType} onChange={e=>setV(tab,{gbpType:e.target.value})} style={{...input, marginBottom:8}}>
                {GBP_TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
              </select>
              {v.gbpType==="photo"
                ? <select aria-label="Google photo category" value={v.category} onChange={e=>setV(tab,{category:e.target.value})} style={{...input, marginBottom:8}}>
                    {GBP_PHOTO_CATEGORIES.map(c=><option key={c.value} value={c.value}>Category: {c.label}</option>)}
                  </select>
                : <input value={v.cta} onChange={e=>setV(tab,{cta:e.target.value})} placeholder="Button text, e.g. Book" style={{...input, marginBottom:8}}/>}
              <select aria-label="Google Business listing" value={v.listing} onChange={e=>setV(tab,{listing:e.target.value})} style={input}>
                {GBP_LISTINGS.map(l=><option key={l.value} value={l.value}>Post to: {l.label}</option>)}
              </select>
            </>
            : <input value={v.hashtags} onChange={e=>setV(tab,{hashtags:e.target.value})} placeholder="#Sanjugo #sushi" style={input}/>}
        </>}

        <label style={label}>Note for the approvers <span style={{fontWeight:400, color:"var(--ink-mute)"}}>(shown at the top of the approval card)</span></label>
        <textarea value={f.notes||""} onChange={e=>setF(x=>({...x, notes:e.target.value}))} rows={2} placeholder="e.g. Please check the price on the menu board at 0:04." style={{...input, resize:"vertical"}}/>
        <label style={label}>What you changed <span style={{fontWeight:400, color:"var(--ink-mute)"}}>(when resubmitting)</span></label>
        <textarea value={f.note} onChange={e=>setF(x=>({...x, note:e.target.value}))} rows={2} placeholder="e.g. Shortened the caption and swapped to the brighter shot (G731)." style={{...input, resize:"vertical"}}/>
        {toTell.length>0 && ["changes_requested","rejected","draft"].includes(item.status) && <label style={{display:"flex", alignItems:"center", gap:7, fontSize:12.5, marginTop:10, color:"var(--ink-soft)", cursor:"pointer"}}>
          <input type="checkbox" checked={notify} onChange={e=>setNotify(e.target.checked)}/> Tell {toTell.map(u=>u.name).join(" and ")} in Team Chat when I resubmit
        </label>}
      </div>
      <div style={{position:"sticky", bottom:0, background:"var(--surface)", borderTop:"1px solid var(--border)", padding:"12px 18px", display:"flex", justifyContent:"flex-end", gap:8, flexWrap:"wrap"}}>
        <Button variant="ghost" onClick={onClose}>Cancel</Button>
        <Button variant="ghost" onClick={()=>save(false)} disabled={busy||uploading}>Save changes</Button>
        {["changes_requested","rejected","draft"].includes(item.status) && <Button variant="primary" icon="check" onClick={()=>save(true)} disabled={busy||uploading}>{uploading? "Waiting for file…" : item.status==="draft"? "Submit for approval" : "Resubmit for approval"}</Button>}
      </div>
    </Drawer>
  );
}

function ApprovalQueuePage(){
  const {state, dispatch, openDetails} = useApp();
  const meQ = USERS.find(u=>u.id===state.currentUserId);
  const canReview = PERMS[meQ.role].approve;
  const [qtab, setQtab] = useState(()=>{ const t = state.queueTab; if(t==="review" && !canReview) return "waiting"; if(t==="waiting" && canReview) return "review"; return t || (canReview? "review" : "waiting"); });
  const [mode, setMode] = useState("package");
  const [filters, setFilters] = useState({brand:"", creator:"", campaign:"", priority:"", platform:""});
  // Keys reviewed this session. Approved/rejected items drop out of the "submitted" pool on their own, so
  // tracking what's been decided (rather than a position index) keeps the next post from being skipped.
  const [reviewedKeys, setReviewedKeys] = useState([]);
  const [pending, setPending] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [immersive, setImmersive] = useState(null); // preferred platform while full-screen review is open
  const narrow = useIsNarrow(900);

  const queue = useMemo(()=>buildQueue(state.contentItems, mode, filters, state.currentUserId), [state.contentItems, mode, filters, state.currentUserId]);
  useEffect(()=>{ setReviewedKeys([]); }, [mode, JSON.stringify(filters)]);
  const remaining = queue.filter(e=>!reviewedKeys.includes(e.key));
  const reviewed = reviewedKeys.length;
  const total = reviewed + remaining.length;
  const current = remaining[0];
  useEffect(()=>{ if(!current) setImmersive(null); }, [current]);
  const immersivePlatform = current && immersive ? (current.platform || (current.item.platforms.includes(immersive) ? immersive : current.item.platforms[0])) : null;

  // Approve is one tap (Undo is at the top); "Needs changes" opens a short note, with Reject tucked inside it.
  function requestDecision(type){
    if(!current) return;
    if(type==="approve"){
      dispatch({type:"SUBMIT_DECISION", contentId:current.contentId, platform:current.platform, decision:"approved"});
      setReviewedKeys(k=>[...k, current.key]);
      return;
    }
    setPending({key:current.key, contentId:current.contentId, platform:current.platform, itemTitle:current.item.title, creatorName:(USERS.find(u=>u.id===current.item.creator)||{}).name, type});
  }
  function confirmDecision(extra){
    const decision = extra.type==="reject" ? "rejected" : "changes_requested";
    dispatch({type:"SUBMIT_DECISION", contentId:pending.contentId, platform:pending.platform, decision, feedback:extra.text, tags:extra.tags, dueDate:extra.dueDate});
    setReviewedKeys(k=>[...k, pending.key]);
    setPending(null);
  }
  function undo(){
    dispatch({type:"UNDO_DECISION"});
    setReviewedKeys(k=>k.slice(0,-1));
  }

  const creators = [...new Set(state.contentItems.map(i=>i.creator))].map(id=>USERS.find(u=>u.id===id));
  const activeFilterCount = Object.values(filters).filter(Boolean).length;

  return (
    <div>
      <PageHeader title="Approval Queue" subtitle={qtab==="review" ? "Watch each post, then tap ✓ Approve — or Needs changes to send it back with a note." : qtab==="waiting" ? "See your posts exactly as the approver will — tap Next to go through them." : "Fix what the approver asked for, then resubmit."} action={qtab!=="review" ? null :
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          <Button variant="ghost" size="sm" icon="undo" onClick={undo} disabled={state.decisionHistory.length===0}>Undo</Button>
        </div>
      }/>

      <QueueTabs tab={qtab} setTab={setQtab} canReview={canReview}/>
      {qtab==="waiting" ? <WaitingBrowser/> : qtab!=="review" ? <ReworkList key={qtab} status={qtab==="changes"? "changes_requested" : "rejected"}/> : <>
      <Card style={{padding: narrow? 10:14, marginBottom: narrow? 14:18, display:"flex", flexWrap:"wrap", gap:10, alignItems:"center"}}>
        <div style={{display:"flex", background:"var(--surface-2)", borderRadius:9, padding:3, gap:2}}>
          <button onClick={()=>setMode("package")} style={{padding:"6px 12px", borderRadius:7, border:"none", fontWeight:700, fontSize:12.5, cursor:"pointer", background:mode==="package"?"var(--surface)":"transparent", boxShadow:mode==="package"?"var(--shadow-sm)":"none"}}>Full package</button>
          <button onClick={()=>setMode("variant")} style={{padding:"6px 12px", borderRadius:7, border:"none", fontWeight:700, fontSize:12.5, cursor:"pointer", background:mode==="variant"?"var(--surface)":"transparent", boxShadow:mode==="variant"?"var(--shadow-sm)":"none"}}>Per platform</button>
        </div>
        {narrow && <button onClick={()=>setShowFilters(v=>!v)} style={{marginLeft:"auto", display:"flex", alignItems:"center", gap:6, padding:"7px 12px", borderRadius:9, border:"1px solid var(--border)", background: activeFilterCount? "var(--accent-soft)":"var(--surface)", color: activeFilterCount? "var(--accent-dark)":"var(--ink-soft)", fontWeight:700, fontSize:12.5, cursor:"pointer"}}>
          <Icon name="filter" size={14}/>Filters{activeFilterCount? " ("+activeFilterCount+")":""}<Icon name="chevronDown" size={14} style={{transform: showFilters?"rotate(180deg)":"none", transition:"transform .2s"}}/>
        </button>}
        {(!narrow || showFilters) && <>
        {!narrow && <div style={{width:1, height:24, background:"var(--border)"}}/>}
        <div className="cf-queue-filters" style={{display:"contents"}}>
        <Select value={filters.brand} onChange={v=>setFilters(f=>({...f,brand:v}))} placeholder="All brands" options={BRANDS.map(b=>({value:b.id,label:b.name}))} style={{width:150}}/>
        <Select value={filters.platform} onChange={v=>setFilters(f=>({...f,platform:v}))} placeholder="All platforms" options={Object.entries(PLATFORM_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:150}}/>
        <Select value={filters.creator} onChange={v=>setFilters(f=>({...f,creator:v}))} placeholder="All creators" options={creators.map(c=>({value:c.id,label:c.name}))} style={{width:150}}/>
        <Select value={filters.campaign} onChange={v=>setFilters(f=>({...f,campaign:v}))} placeholder="All campaigns" options={campaignFilterOptions(state.campaigns)} style={{width:170}}/>
        <Select value={filters.priority} onChange={v=>setFilters(f=>({...f,priority:v}))} placeholder="All priorities" options={Object.entries(PRIORITY_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:140}}/>
        </div>
        </>}
      </Card>
      <style>{`@media (max-width:900px){ .cf-queue-filters{ display:grid !important; grid-template-columns:1fr 1fr; gap:8px; width:100%; } .cf-queue-filters > *{ width:auto !important; min-width:0; } }`}</style>

      {total===0 ? (
        <Card style={{padding:0}}><EmptyState icon="check" title="Nothing waiting on you" subtitle="All submitted content matching these filters has been reviewed. Nice work."/></Card>
      ) : reviewed>=total ? (
        <Card style={{padding:0}}><EmptyState icon="check" title={"Queue clear — "+total+" of "+total+" reviewed"} subtitle="You've reviewed everything in this queue. Adjust filters to see more, or check back later." action={<Button variant="primary" onClick={()=>setReviewedKeys([])} style={{marginTop:6}}>Review again</Button>}/></Card>
      ) : (
        <div>
          <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14}}>
            <div style={{fontSize:13, fontWeight:700, color:"var(--ink-soft)"}}>{reviewed} of {total} reviewed</div>
            <div style={{flex:1, height:6, borderRadius:99, background:"var(--surface-2)", overflow:"hidden"}}><div style={{width:(reviewed/total*100)+"%", height:"100%", background:"var(--accent)", borderRadius:99, transition:"width .3s ease"}}/></div>
          </div>
          <div style={{position:"relative", height: narrow? "max(480px, calc(100dvh - 160px))" : "clamp(540px, calc(100dvh - 250px), 860px)", maxWidth: narrow? 520 : 780, margin:"0 auto"}}>

/* ---------- Smart insights ----------
   One compact snapshot of the pipeline + performance feeds both Claude (via /api/insights) and the built-in
   rules used when no Claude API key is set, so both always talk about the same numbers. */
function insightsData(state){
  const items = state.contentItems;
  const count = st => items.filter(i=>i.status===st);
  const now = new Date(TODAY);
  const daysAgo = iso => Math.max(0, Math.round((now - new Date(iso))/86400000));
  // Real stats from Make once there are any; otherwise the labelled sample history.
  const real = realAnalyticsPosts(realAnalyticsStore.data, items);
  const all = real.length ? real : [...state.publishedPosts, ...SAMPLE_HISTORY];
  const since = d => { const x = new Date(now); x.setDate(x.getDate()-d); return x; };
  const cur = all.filter(p=> new Date(p.publishedAt) > since(30) && new Date(p.publishedAt) <= now);
  const prev = all.filter(p=> new Date(p.publishedAt) > since(60) && new Date(p.publishedAt) <= since(30));
  const tc = metricTotals(cur), tp = metricTotals(prev);
  const byPlatform = Object.keys(PLATFORM_META).map(pl=>({pl, t:metricTotals(cur.filter(p=>p.platform===pl))})).filter(r=>r.t.posts>0);
  const pillars = PILLARS.map(pl=>{ const ps=cur.filter(p=>p.pillar===pl); const t=metricTotals(ps); return {pl, n:ps.length, avgViews: ps.length? t.views/ps.length : 0, er:t.engagementRate}; }).filter(r=>r.n>=2);
  const BUCKETS = [["morning",5,11],["lunchtime",11,14],["afternoon",14,17],["evening",17,21],["late evening",21,29]];
  const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  let bestSlot = null;
  DAYS.forEach((d,wd)=>BUCKETS.forEach(([b,a1,b1])=>{
    const ps = all.filter(p=>{ const x=new Date(p.publishedAt); const h=x.getHours(); return (x.getDay()+6)%7===wd && ((h>=a1&&h<b1)||(h+24>=a1&&h+24<b1)); });
    if(ps.length>=3){ const er = metricTotals(ps).engagementRate; if(!bestSlot || er>bestSlot.er) bestSlot = {day:d, bucket:b, er, n:ps.length}; }
  }));
  const top = [...cur].sort((a,b)=>b.views-a.views).slice(0,3);
  const nextWeek = Array.from({length:7}).map((_,i)=>{ const d=new Date(now); d.setDate(d.getDate()+i); d.setHours(0,0,0,0); return d; });
  const scheduled = nextWeek.map(d=>{ const e=new Date(d); e.setDate(e.getDate()+1);
    const vs = items.flatMap(i=>Object.values(i.variants||{}).filter(v=>v.scheduledAt && v.publishStatus!=="published" && new Date(v.scheduledAt)>=d && new Date(v.scheduledAt)<e).map(v=>({title:i.title, platform:v.platform})));
    return {date:d, vs}; });
  const emptyDays = scheduled.filter(x=>x.vs.length===0).map(x=>x.date.toLocaleDateString("en-GB",{weekday:"short", day:"numeric"}));
  return {
    sample: all.some(p=>p.sample), tc, tp, byPlatform, pillars, bestSlot, top, scheduled, emptyDays,
    awaiting: count("submitted").map(i=>({title:i.title, days:daysAgo(i.createdAt||now)})),
    changes: count("changes_requested").map(i=>i.title), rejected: count("rejected").map(i=>i.title), failed: count("failed").map(i=>i.title),
    approvedUnscheduled: items.filter(i=>i.status==="approved" && !Object.values(i.variants||{}).some(v=>v.scheduledAt)).map(i=>i.title),
  };
}
function pctChange(a, b){ return b ? (a-b)/b*100 : 0; }
function insightsSnapshot(d){
  const L = [];
  L.push("Sanjugo Creator Studio snapshot, "+fmtDate(TODAY.toISOString())+".");
  if(d.sample) L.push("NOTE: performance figures below are SAMPLE data (real platform stats aren't connected yet). Pipeline figures are real.");
  L.push("", "PIPELINE (real)");
  L.push("- Awaiting approval: "+d.awaiting.length+(d.awaiting.length? " — "+d.awaiting.map(a=>`"${a.title}" (${a.days}d waiting)`).join("; ") : ""));
  L.push("- Needs changes: "+d.changes.length+(d.changes.length? " — "+d.changes.map(t=>`"${t}"`).join("; ") : ""));
  L.push("- Rejected: "+d.rejected.length+" · Failed to publish: "+d.failed.length+" · Approved but not scheduled: "+d.approvedUnscheduled.length);
  L.push("- Next 7 days: "+d.scheduled.map(x=>x.date.toLocaleDateString("en-GB",{weekday:"short"})+" "+(x.vs.length? x.vs.map(v=>PLATFORM_META[v.platform].short).join("+") : "nothing")).join(", "));
  L.push("", "PERFORMANCE, last 30 days vs previous 30");
  L.push(`- ${d.tc.posts} posts · views ${fmtNum(d.tc.views)} (${pctChange(d.tc.views,d.tp.views).toFixed(0)}%) · engagement rate ${fmtPct(d.tc.engagementRate)} (prev ${fmtPct(d.tp.engagementRate)}) · followers gained ${d.tc.followsGained} (prev ${d.tp.followsGained})`);
  L.push("- By platform: "+d.byPlatform.map(r=>`${PLATFORM_META[r.pl].label} ${r.t.posts} posts, ${fmtNum(r.t.views)} views, ${fmtPct(r.t.engagementRate)} ER, +${r.t.followsGained} followers`).join("; "));
  if(d.pillars.length) L.push("- By content type (avg views, ER): "+d.pillars.map(r=>`${r.pl} ${fmtNum(Math.round(r.avgViews))}, ${fmtPct(r.er)}`).join("; "));
  if(d.bestSlot) L.push(`- Best posting slot by engagement: ${d.bestSlot.day} ${d.bestSlot.bucket} (${fmtPct(d.bestSlot.er)} over ${d.bestSlot.n} posts)`);
  if(d.top.length) L.push("- Top posts: "+d.top.map(p=>`"${p.contentTitle}" on ${PLATFORM_META[p.platform].label} (${fmtNum(p.views)} views, ${fmtPct(p.engagementRate)} ER)`).join("; "));
  return L.join("\n");
}
function builtInInsights(d){
  const out = [];
  const byEr = [...d.byPlatform].sort((a,b)=>b.t.engagementRate-a.t.engagementRate);
  const byViews = [...d.byPlatform].sort((a,b)=>b.t.views-a.t.views);
  if(byEr.length>=2){
    const best = byEr[0], low = byEr[byEr.length-1];
    out.push({title:PLATFORM_META[best.pl].label+" engages best", detail:`${fmtPct(best.t.engagementRate)} engagement on ${PLATFORM_META[best.pl].label} vs ${fmtPct(low.t.engagementRate)} on ${PLATFORM_META[low.pl].label} over the last 30 days.`, action:`Add one extra ${PLATFORM_META[best.pl].label} post this week.`});
  }
  if(byViews.length && (!byEr.length || byViews[0].pl!==byEr[0].pl)) out.push({title:PLATFORM_META[byViews[0].pl].label+" brings the reach", detail:`${fmtNum(byViews[0].t.views)} views from ${byViews[0].t.posts} posts — the biggest audience of any platform.`, action:`Cut your strongest recent reel for ${PLATFORM_META[byViews[0].pl].label} first.`});
  if(d.bestSlot) out.push({title:"Best time: "+d.bestSlot.day+" "+d.bestSlot.bucket, detail:`Posts in that slot average ${fmtPct(d.bestSlot.er)} engagement (${d.bestSlot.n} posts).`, action:`Schedule next week's best post for ${d.bestSlot.day} ${d.bestSlot.bucket}.`});
  const pill = [...d.pillars].sort((a,b)=>b.avgViews-a.avgViews)[0];
  if(pill) out.push({title:pill.pl+" content performs best", detail:`${pill.pl} posts average ${fmtNum(Math.round(pill.avgViews))} views at ${fmtPct(pill.er)} engagement.`, action:`Plan one more ${pill.pl} post from the content library.`});
  const risks = [];
  const oldest = [...d.awaiting].sort((a,b)=>b.days-a.days)[0];
  if(d.failed.length) risks.push(`${d.failed.length} post${d.failed.length>1?"s":""} failed to publish — retry or fix before they go stale.`);
  if(oldest && oldest.days>=2) risks.push(`"${oldest.title}" has waited ${oldest.days} days for approval.`);
  if(d.changes.length) risks.push(`${d.changes.length} post${d.changes.length>1?"s":""} still need changes from the creator.`);
  if(d.emptyDays.length>=3) risks.push(`Nothing is scheduled on ${d.emptyDays.slice(0,4).join(", ")}${d.emptyDays.length>4?"…":""}.`);
  if(d.approvedUnscheduled.length) risks.push(`${d.approvedUnscheduled.length} approved post${d.approvedUnscheduled.length>1?"s have":" has"} no publish date yet.`);
  const change = pctChange(d.tc.views, d.tp.views);
  return {
    headline: `Views ${change>=0? "up":"down"} ${Math.abs(change).toFixed(0)}% on the previous 30 days, at ${fmtPct(d.tc.engagementRate)} engagement${d.sample? " (sample figures)" : ""}.`,
    insights: out.slice(0,4), risk: risks[0] || "No bottlenecks right now — the pipeline is moving.", generatedAt:new Date().toISOString(), source:"built-in",
  };
}

function SmartInsightsPanel(){
  const {state} = useApp();
  const [result, setResult] = useState(null);
  const [configured, setConfigured] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  useEffect(()=>{
    fetch("/api/insights", {cache:"no-store"}).then(r=>r.ok? r.json() : null).then(d=>{
      if(!d) { setConfigured(false); return; }
      setConfigured(!!d.configured);
      if(d.latest) setResult(d.latest);
    }).catch(()=>setConfigured(false));
  }, []);
  async function generate(){
    setLoading(true); setError(null);
    const data = insightsData(state);
    if(configured){
      try{
        const r = await fetch("/api/insights", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({snapshot: insightsSnapshot(data)})});
        const d = await r.json().catch(()=>({}));

        setError((d.error && d.error!=="not_configured"? d.error : "Claude isn't set up yet")+" — showing built-in insights instead.");

          {result && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:3}}>{fromClaude? "By Claude" : "Built-in analysis"} · {fmtDateTime(result.generatedAt)}</div>}
