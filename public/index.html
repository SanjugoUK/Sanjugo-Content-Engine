function SwipeCard({entry, onDecision, onOpenDetails, isTop, narrow, paused, onImmersive}){
  // Decisions are made with the buttons only (no swiping), each confirmed in a dialog.
  const ref = useRef(null);
  const item = entry.item;
  const brand = BRANDS.find(b=>b.id===item.brand);
  const campaign = {name: campaignLabel(useApp().state.campaigns, item.campaign)};
  const creator = USERS.find(u=>u.id===item.creator);
  const platformList = entry.platform? [entry.platform] : item.platforms;
  const [activePlatform, setActivePlatform] = useState(entry.platform || item.platforms[0]);
  const [muted, setMuted] = useState(true);
  const variant = item.variants[activePlatform];
  const caption = entry.platform? variant.caption||variant.description||variant.title : Object.values(item.variants).map(v=>v.caption||v.title||v.description).find(Boolean);
  const scheduledAt = entry.platform? variant.scheduledAt : (Object.values(item.variants).find(v=>v.scheduledAt)||{}).scheduledAt;
  const hasVideo = item.media.type==="video" && !!item.media.fileUrl;
  const warnings = [];
  if(!caption) warnings.push("Missing caption/title");
  if(item.media.duration && item.media.duration>60 && platformList.includes("tiktok")) warnings.push("Video exceeds TikTok's recommended length");
  if(!scheduledAt) warnings.push("No publish time set");

  const openDetails = ()=> onOpenDetails(item);
  const stop = e=>e.stopPropagation();

  const tabs = !entry.platform && item.platforms.length>1 && item.platforms.map(p=>(
    <button key={p} onPointerDown={stop} onClick={e=>{ stop(e); setActivePlatform(p); e.currentTarget.scrollIntoView && e.currentTarget.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"}); }}
      style={{display:"flex", alignItems:"center", gap:6, padding:"6px 11px 6px 6px", borderRadius:99, border:"1px solid "+(activePlatform===p?PLATFORM_HEX[p]:"var(--border)"), background: activePlatform===p? PLATFORM_HEX[p]+"18":"var(--surface)", color: activePlatform===p? PLATFORM_HEX[p]:"var(--ink-soft)", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0}}>
      <PlatformIcon platform={p} size={12}/>{PLATFORM_META[p].label}
    </button>
  ));
  const singlePlatform = (entry.platform || item.platforms.length===1) && (
    <span style={{display:"flex", alignItems:"center", gap:6, fontSize:12, fontWeight:700, color:PLATFORM_HEX[activePlatform]}}><PlatformIcon platform={activePlatform} size={12}/>{PLATFORM_META[activePlatform].label}</span>
  );
  const soundBtn = hasVideo && (
    <button onPointerDown={stop} onClick={e=>{ stop(e); setMuted(m=>!m); }} title={muted?"Turn sound on":"Mute"}
      style={{display:"flex", alignItems:"center", gap:5, padding:"6px 10px", borderRadius:99, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--ink-soft)", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0}}>
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>{muted ? <path d="m16 9.5 5 5M21 9.5l-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/> : <path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/>}</svg>
      {muted? "Sound off":"Sound on"}
    </button>
  );
  const phone = <PhonePreview platform={activePlatform} item={item} variant={variant} brand={brand} playing={isTop && !paused} muted={muted || !isTop} onAutoMuted={()=>setMuted(true)}/>;
  const fullBtn = (
    <button onPointerDown={stop} onClick={e=>{ stop(e); onImmersive(activePlatform); }} title="View full screen, exactly as it will appear"
      style={{display:"flex", alignItems:"center", gap:5, padding:"6px 11px", borderRadius:99, border:"1px solid var(--accent)", background:"var(--accent)", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0}}>
      <svg viewBox="0 0 24 24" width="13" height="13"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
      Full screen
    </button>
  );
  const warningList = warnings.length>0 && (
    <div style={{display:"flex", flexDirection:"column", gap:4}}>
      {warnings.map((w,i)=><div key={i} style={{display:"flex", gap:6, alignItems:"center", fontSize:11.5, color:"var(--amber)", fontWeight:600}}><Icon name="warn" size={12}/>{w}</div>)}
    </div>
  );
  const rootStyle = {
    position:"absolute", inset:0, borderRadius:20, background:"var(--surface)", border:"1px solid var(--border)", boxShadow:"var(--shadow-lg)",
    overflow:"hidden", display:"flex", flexDirection: narrow?"column":"row",
    containerType:"size",
  };
  const handlers = {ref};

  if(narrow){
    return (
      <div {...handlers} style={rootStyle}>
        <div style={{display:"flex", alignItems:"center", gap:9, padding:"10px 12px 8px", flexShrink:0}} onClick={openDetails}>
          <span style={{width:8,height:8,borderRadius:99,background:brand.color, flexShrink:0}}/>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:13.5, fontWeight:700, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{item.title}</div>
            <div style={{fontSize:11, color:"var(--ink-mute)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{campaign.name} · {creator.name} · {scheduledAt? fmtDateTime(scheduledAt) : "Not scheduled"}</div>
          </div>
          <Badge label={PRIORITY_META[item.priority].label} color={PRIORITY_META[item.priority].color} soft="var(--surface-2)"/>
        </div>
        <div className="cf-noscrollbar" style={{display:"flex", alignItems:"center", gap:6, padding:"0 12px 8px", flexShrink:0, overflowX:"auto"}}>
          {tabs || singlePlatform}
        </div>
        <div style={{flex:1, minHeight:0, padding:"0 12px"}} onClick={openDetails}>{phone}</div>
        <div style={{display:"flex", alignItems:"center", gap:8, padding:"8px 12px 10px", flexShrink:0}}>
          <div style={{flex:1, minWidth:0}} onClick={openDetails}>
            {warningList || <div style={{fontSize:11, color:"var(--ink-mute)", lineHeight:1.35}}>{hasVideo? "Tap video to pause · ":""}tap title for details</div>}
          </div>
          {soundBtn}{fullBtn}
        </div>
      </div>
    );
  }

  return (
    <div {...handlers} style={rootStyle}>
      <div style={{width:"calc((100cqh - 36px) * 9 / 19.5 + 36px)", flexShrink:0, padding:18, background:"var(--surface-2)", borderRight:"1px solid var(--border)"}} onClick={openDetails}>{phone}</div>
      <div style={{flex:1, minWidth:0, display:"flex", flexDirection:"column", padding:"20px 22px", overflowY:"auto", gap:16}}>
        <div>
          <div style={{display:"flex", alignItems:"flex-start", gap:10}}>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontFamily:"Sora, sans-serif", fontSize:18, fontWeight:700, lineHeight:1.25}}>{item.title}</div>
              <div style={{fontSize:12.5, color:"var(--ink-mute)", marginTop:4}}>{brand.name} · {campaign.name}</div>
            </div>
            <Badge label={PRIORITY_META[item.priority].label} color={PRIORITY_META[item.priority].color} soft="var(--surface-2)"/>
          </div>
        </div>
        <div>
          <div style={{fontSize:11, fontWeight:700, color:"var(--ink-mute)", textTransform:"uppercase", letterSpacing:".5px", marginBottom:8}}>Preview as it will appear on</div>
          <div style={{display:"flex", flexWrap:"wrap", gap:6, alignItems:"center"}}>{tabs || singlePlatform}{soundBtn}{fullBtn}</div>
        </div>
        {variantFields(activePlatform, variant).map(([label, text])=>(
          <div key={label}>
            <div style={{fontSize:11, fontWeight:700, color:"var(--ink-mute)", textTransform:"uppercase", letterSpacing:".5px", marginBottom:6}}>{label}</div>
            <div style={{fontSize:13.5, lineHeight:1.55, whiteSpace:"pre-wrap", wordBreak:"break-word", background:"var(--surface-2)", border:"1px solid var(--border)", borderRadius:10, padding:"10px 12px", color: text? "var(--ink)":"var(--ink-mute)", cursor:"text", userSelect:"text"}} onPointerDown={stop}>
              {text ? withTags(text, {color:"var(--accent)", fontWeight:600}) : "—"}
            </div>
          </div>
        ))}
        <div style={{display:"grid", gridTemplateColumns:"auto 1fr", gap:"8px 14px", fontSize:12.5}}>
          <span style={{color:"var(--ink-mute)"}}>Creator</span><span style={{display:"flex", alignItems:"center", gap:6, fontWeight:600}}><Avatar user={creator} size={18}/>{creator.name}</span>
          <span style={{color:"var(--ink-mute)"}}>Publishes</span><span style={{fontWeight:600}}>{(variant && variant.scheduledAt) ? fmtDateTime(variant.scheduledAt) : scheduledAt ? fmtDateTime(scheduledAt) : "Not scheduled"}</span>
          <span style={{color:"var(--ink-mute)"}}>Media</span><span style={{fontWeight:600}}>{item.media.type==="video" ? "Video" : "Image"}{item.media.duration ? " · "+item.media.duration+"s" : ""}{item.media.aspectRatio ? " · "+item.media.aspectRatio : ""}</span>
          <span style={{color:"var(--ink-mute)"}}>Version</span><span style={{fontWeight:600}}>v{item.currentVersion}</span>
        </div>
        {warningList}
        <span style={{flex:1}}/>
        <div onPointerDown={stop}><Button variant="ghost" size="sm" icon="external" onClick={()=>onOpenDetails(item)}>Open full details</Button></div>
      </div>
    </div>
  );
}

/* Approval Queue has three tabs: To review (approvers), Needs changes and Rejected (where creators fix and resubmit). */
function QueueTabs({tab, setTab, canReview}){
  const {state} = useApp();
  const count = st => state.contentItems.filter(i=>i.status===st).length;
  const tabs = [...(canReview? [["review","To review","submitted"]] : []), ["changes","Needs changes","changes_requested"], ["rejected","Rejected","rejected"]];
  return (
    <div className="cf-noscrollbar" style={{display:"flex", gap:4, borderBottom:"1px solid var(--border)", marginBottom:16, overflowX:"auto"}}>
      {tabs.map(([k,l,st])=>{
        const n = count(st), active = tab===k;
        return <button key={k} onClick={()=>setTab(k)} style={{padding:"9px 14px", border:"none", borderBottom:"2px solid "+(active? "var(--accent)":"transparent"), marginBottom:-1, background:"transparent", color: active? "var(--ink)":"var(--ink-soft)", fontWeight: active? 600:500, fontSize:13.5, cursor:"pointer", display:"flex", alignItems:"center", gap:7, whiteSpace:"nowrap"}}>
          {l}<span className="num" style={{fontSize:11, fontWeight:600, padding:"1px 7px", borderRadius:99, background: n? (k==="review"? "var(--blue-soft)" : k==="changes"? "var(--amber-soft)" : "var(--red-soft)") : "var(--surface-2)", color: n? (k==="review"? "var(--blue)" : k==="changes"? "var(--amber)" : "var(--red)") : "var(--ink-mute)"}}>{n}</span>
        </button>;
      })}
    </div>
  );
}

function FeedbackBox({item}){
  const fb = item.lastFeedback;
  if(!fb) return <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>No written feedback was left.</div>;
  const by = USERS.find(u=>u.id===fb.by);
  const tone = item.status==="rejected" ? ["var(--red-soft)","var(--red)"] : ["var(--amber-soft)","var(--amber)"];
  return (
    <div style={{background:tone[0], borderLeft:"3px solid "+tone[1], borderRadius:8, padding:"10px 12px"}}>
      <div style={{fontSize:12, color:"var(--ink-soft)", marginBottom:6, display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
        {by && <Avatar user={by} size={18}/>}<strong style={{color:"var(--ink)"}}>{by? by.name : "Approver"}</strong>
        {item.status==="rejected"? "rejected this" : "asked for changes"}{fb.at? " · "+fmtDateTime(fb.at) : ""}
      </div>
      {fb.tags && fb.tags.length>0 && <div style={{display:"flex", gap:5, flexWrap:"wrap", marginBottom:6}}>{fb.tags.map(t=><span key={t} style={{fontSize:11, fontWeight:600, padding:"2px 7px", borderRadius:5, background:"var(--surface)", border:"1px solid var(--border)"}}>{t}</span>)}</div>}
      {fb.text ? <div style={{fontSize:13.5, lineHeight:1.5, whiteSpace:"pre-wrap"}}>{fb.text}</div> : <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>No comment added.</div>}
    </div>
  );
}

function ReworkList({status}){
  const {state, openDetails} = useApp();
  const me = USERS.find(u=>u.id===state.currentUserId);
  const perms = PERMS[me.role];
  const [mineOnly, setMineOnly] = useState(!perms.approve);
  const [editing, setEditing] = useState(null);
  let items = state.contentItems.filter(i=>i.status===status);
  if(mineOnly) items = items.filter(i=>i.creator===me.id);
  items.sort((a,b)=> new Date((b.lastFeedback||{}).at||b.createdAt||0) - new Date((a.lastFeedback||{}).at||a.createdAt||0));
  const canEdit = perms.edit || perms.approve;
  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:12}}>
        <div style={{fontSize:13, color:"var(--ink-soft)"}}>{status==="rejected" ? "Posts the approver turned down. You can rework one and send it back, or leave it." : "Posts the approver sent back. Read the feedback, make the changes, then resubmit."}</div>
        <label style={{display:"flex", alignItems:"center", gap:6, fontSize:12.5, fontWeight:600, color:"var(--ink-soft)", cursor:"pointer"}}><input type="checkbox" checked={mineOnly} onChange={e=>setMineOnly(e.target.checked)}/> Only mine</label>
      </div>
      {items.length===0 ? <Card><EmptyState icon="check" title={status==="rejected"? "Nothing rejected" : "Nothing needs changes"} subtitle={mineOnly? "None of your posts are waiting on you. Untick “Only mine” to see the whole team's." : "All clear — nothing is waiting on a fix."}/></Card> :
      <div style={{display:"flex", flexDirection:"column", gap:12}}>
        {items.map(it=>{
          const creator = USERS.find(u=>u.id===it.creator);
          return (
            <Card key={it.id} style={{padding:14}}>
              <div className="cf-rework" style={{display:"grid", gridTemplateColumns:"72px 1fr minmax(260px,1.1fr)", gap:14, alignItems:"start"}}>
                <div style={{width:72, height:72, borderRadius:8, overflow:"hidden", cursor:"pointer"}} onClick={()=>openDetails(it)}><Thumb item={it} radius={8} iconSize={18}/></div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:14.5, fontWeight:600, marginBottom:4, cursor:"pointer"}} onClick={()=>openDetails(it)}>{it.title}</div>
                  <div style={{display:"flex", gap:6, alignItems:"center", flexWrap:"wrap", fontSize:12, color:"var(--ink-mute)", marginBottom:8}}>
                    <StatusBadge status={it.status}/><span>v{it.currentVersion}</span><span>·</span>{creator && <><Avatar user={creator} size={16}/>{creator.name}</>}
                  </div>
                  <div style={{display:"flex", gap:4}}>{it.platforms.map(p=><PlatformIcon key={p} platform={p} size={11}/>)}</div>
                </div>
                <div>
                  <FeedbackBox item={it}/>
                  <div style={{display:"flex", gap:8, marginTop:10, flexWrap:"wrap"}}>
                    {canEdit && <Button variant="primary" size="sm" icon="edit" onClick={()=>setEditing(it)}>{status==="rejected"? "Rework & resubmit" : "Edit & resubmit"}</Button>}
                    <Button variant="ghost" size="sm" onClick={()=>openDetails(it)}>Open details</Button>
                  </div>
                </div>
              </div>
            </Card>
          );
        })}
      </div>}
      <RevisionEditor item={editing && state.contentItems.find(i=>i.id===editing.id)} onClose={()=>setEditing(null)}/>
      <style>{`@media (max-width:760px){ .cf-rework{ grid-template-columns:64px 1fr !important; } .cf-rework > div:last-child{ grid-column:1 / -1; } }`}</style>
    </div>
  );
}

/* Edit everything the approver may have asked about — title, captions per platform, dates, the file — then save or resubmit. */
function RevisionEditor({item, onClose}){
  const {state, dispatch, chat} = useApp();
  const [f, setF] = useState(null);
  const [tab, setTab] = useState(null);
  const [busy, setBusy] = useState(false);
  const [notify, setNotify] = useState(true);
  useEffect(()=>{
    if(!item){ setF(null); return; }
    const variants = {};
    Object.entries(item.variants||{}).forEach(([p,v])=>{ variants[p] = {caption:v.caption||"", hashtags:(v.hashtags||[]).join(" "), title:v.title||"", description:v.description||"", cta:v.cta||"", scheduledAt: v.scheduledAt ? isoToLocalInput(v.scheduledAt) : ""}; });
    setF({title:item.title, variants, media:null, libraryRef:undefined, note:"", mediaStatus:""});
    setTab(item.platforms[0]);
    setNotify(true);
  }, [item && item.id]);
  if(!item || !f) return null;
  const toTell = approversOf(item).filter(u=>u.id!==state.currentUserId);
  const setV = (p, patch) => setF(x=>({...x, variants:{...x.variants, [p]:{...x.variants[p], ...patch}}}));
  const input = {width:"100%", padding:"9px 11px", borderRadius:8, border:"1px solid var(--border)", fontSize:13.5, background:"var(--surface)", color:"var(--ink)", fontFamily:"inherit"};
  const label = {display:"block", fontSize:12.5, fontWeight:600, marginBottom:6, marginTop:14};

  async function pickFromLibrary(file, connected){
    setF(x=>({...x, mediaStatus:"Copying "+(file.barcode||"file")+" from Google Drive…", libraryRef: libraryRefOf(file)}));
    if(!connected){ setF(x=>({...x, mediaStatus:"Linked to "+(file.barcode||"the library file")+" — Google Drive isn't connected, so the file wasn't copied."})); return; }
    try{
      const r = await fetch("/api/library/import", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:file.id})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't copy the file");
      const isVideo = (d.mime||"").startsWith("video/");
      const info = await readMediaInfo(d.url, isVideo);
      setF(x=>({...x, mediaStatus:"New file ready — "+(file.barcode||file.name), media:{type:isVideo?"video":"image", fileUrl:d.url, previewUrl: isVideo? libThumbUrl(file, true) : d.url,
        ...(info? {aspectRatio: nearestAspect(info.w, info.h) || item.media.aspectRatio, duration: isVideo && isFinite(info.duration)? Math.round(info.duration) : null} : {})}}));
    }catch(e){ setF(x=>({...x, mediaStatus:e.message})); }
  }
  async function upload(file){
    const isVideo = file.type.startsWith("video/");
    setF(x=>({...x, mediaStatus:"Uploading "+file.name+"…", libraryRef:null}));
    try{
      const [up, preview, info] = await Promise.all([uploadMediaFile(file), (isVideo? videoFileToPoster(file, 480, 0.72) : imageFileToPreview(file, 480, 0.78)).catch(()=>null), readMediaInfo(file, isVideo)]);
      setF(x=>({...x, mediaStatus:"New file ready — "+file.name, media:{type:isVideo?"video":"image", fileUrl:up.url, previewUrl:preview, ...(info? {aspectRatio: nearestAspect(info.w, info.h) || item.media.aspectRatio, duration: isVideo && isFinite(info.duration)? Math.round(info.duration) : null} : {})}}));
    }catch(e){ setF(x=>({...x, mediaStatus:"Upload failed — "+e.message})); }
  }
  function patchFromForm(){
    const variants = {};
    Object.entries(f.variants).forEach(([p,v])=>{
      variants[p] = {caption:v.caption, hashtags: v.hashtags.split(/[\s,]+/).filter(Boolean).map(t=> t.startsWith("#")? t : "#"+t), title:v.title, description:v.description, cta:v.cta,
        scheduledAt: v.scheduledAt ? new Date(v.scheduledAt).toISOString() : null};
    });
    return {title:f.title.trim() || item.title, variants, ...(f.media? {media:f.media} : {}), ...(f.libraryRef!==undefined? {libraryRef:f.libraryRef} : {})};
  }
  async function save(resubmit){
    setBusy(true);
    dispatch({type:"REVISE_CONTENT", contentId:item.id, patch:patchFromForm(), resubmit, note:f.note.trim()});
    if(resubmit && notify && toTell.length){
      await chat.send(toTell.map(u=>"@"+u.name).join(" ")+" I've made the changes to \""+(f.title.trim()||item.title)+"\" and resubmitted it for approval."+(f.note.trim()? "\n"+f.note.trim() : ""), item.id);
    }
    setBusy(false);
    onClose();
  }
  const uploading = /Uploading|Copying/.test(f.mediaStatus);
  const v = f.variants[tab] || {};
  return (
    <Drawer open={!!item} onClose={onClose} width={640}>
      <div style={{position:"sticky", top:0, zIndex:3, background:"var(--surface)", borderBottom:"1px solid var(--border)", padding:"14px 18px", display:"flex", gap:10, alignItems:"flex-start"}}>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:11.5, color:"var(--ink-mute)", fontWeight:600}}>{item.status==="rejected"? "Rework & resubmit" : "Edit & resubmit"} · currently v{item.currentVersion}</div>
          <div style={{fontSize:16.5, fontWeight:600}}>{item.title}</div>
        </div>
        <IconButton icon="x" title="Close" onClick={onClose}/>
      </div>
      <div style={{padding:18}}>
        <FeedbackBox item={item}/>
        <label style={label}>Title</label>
        <input value={f.title} onChange={e=>setF(x=>({...x, title:e.target.value}))} style={input}/>

        <label style={label}>Photo / video</label>
        <div style={{display:"flex", gap:12, alignItems:"center", marginBottom:8}}>
          <div style={{width:64, height:64, borderRadius:8, overflow:"hidden", flexShrink:0}}><Thumb item={{...item, media:{...item.media, ...(f.media||{})}}} radius={8} iconSize={16}/></div>
          <div style={{fontSize:12.5, color: /failed|isn't|Couldn't/.test(f.mediaStatus)? "var(--red)" : "var(--ink-soft)"}}>{f.mediaStatus || (f.media? "" : "Keeping the current file. Replace it below if the feedback was about the visual.")}</div>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"1fr auto", gap:8, alignItems:"center"}}>
          <LibraryPicker onPick={pickFromLibrary}/>
          <label style={{display:"inline-flex", alignItems:"center", gap:6, padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", fontSize:13, fontWeight:500, cursor:"pointer", whiteSpace:"nowrap"}}>
            <Icon name="upload" size={14}/>Upload
            <input type="file" accept="image/*,video/*" style={{display:"none"}} onChange={e=>{ const file=e.target.files[0]; if(file) upload(file); e.target.value=""; }}/>
          </label>
        </div>

        <label style={label}>Wording per platform</label>
        <div className="cf-noscrollbar" style={{display:"flex", gap:6, overflowX:"auto", marginBottom:10}}>
          {item.platforms.map(p=>(
            <button key={p} onClick={()=>setTab(p)} style={{display:"flex", alignItems:"center", gap:6, padding:"6px 11px 6px 6px", borderRadius:99, border:"1px solid "+(tab===p? PLATFORM_HEX[p]:"var(--border)"), background: tab===p? PLATFORM_HEX[p]+"14":"var(--surface)", fontSize:12.5, fontWeight:600, cursor:"pointer", color:"var(--ink)", flexShrink:0}}>
              <PlatformIcon platform={p} size={11}/>{PLATFORM_META[p].label}
            </button>
          ))}
        </div>
        {tab==="youtube" ? <>
          <input value={v.title} onChange={e=>setV(tab,{title:e.target.value})} placeholder="YouTube Shorts title" style={{...input, marginBottom:8}}/>
          <textarea value={v.description} onChange={e=>setV(tab,{description:e.target.value})} placeholder="Description" rows={3} style={{...input, resize:"vertical"}}/>
        </> : <>
          <textarea value={v.caption} onChange={e=>setV(tab,{caption:e.target.value})} placeholder="Caption" rows={4} style={{...input, resize:"vertical", marginBottom:8}}/>
          {tab==="gbp"
            ? <input value={v.cta} onChange={e=>setV(tab,{cta:e.target.value})} placeholder="Button text, e.g. Book" style={input}/>
            : <input value={v.hashtags} onChange={e=>setV(tab,{hashtags:e.target.value})} placeholder="#Sanjugo #sushi" style={input}/>}
        </>}
        <div style={{display:"flex", gap:10, alignItems:"center", flexWrap:"wrap", marginTop:10}}>
          <span style={{fontSize:12.5, fontWeight:600}}>Publish at</span>
          <input type="datetime-local" value={v.scheduledAt||""} onChange={e=>setV(tab,{scheduledAt:e.target.value})} style={{...input, width:"auto"}}/>
          {item.platforms.length>1 && <Button variant="text" size="sm" onClick={()=>item.platforms.forEach(p=>setV(p,{scheduledAt:v.scheduledAt}))}>Use for all platforms</Button>}
        </div>

        <label style={label}>Note to the approver <span style={{fontWeight:400, color:"var(--ink-mute)"}}>(what you changed)</span></label>
        <textarea value={f.note} onChange={e=>setF(x=>({...x, note:e.target.value}))} rows={2} placeholder="e.g. Shortened the caption and swapped to the brighter shot (G731)." style={{...input, resize:"vertical"}}/>
        {toTell.length>0 && <label style={{display:"flex", alignItems:"center", gap:7, fontSize:12.5, marginTop:10, color:"var(--ink-soft)", cursor:"pointer"}}>
          <input type="checkbox" checked={notify} onChange={e=>setNotify(e.target.checked)}/> Tell {toTell.map(u=>u.name).join(" and ")} in Team Chat when I resubmit
        </label>}
      </div>
      <div style={{position:"sticky", bottom:0, background:"var(--surface)", borderTop:"1px solid var(--border)", padding:"12px 18px", display:"flex", justifyContent:"flex-end", gap:8, flexWrap:"wrap"}}>
        <Button variant="ghost" onClick={onClose}>Cancel</Button>
        <Button variant="ghost" onClick={()=>save(false)} disabled={busy||uploading}>Save changes</Button>
        <Button variant="primary" icon="check" onClick={()=>save(true)} disabled={busy||uploading}>{uploading? "Waiting for file…" : "Resubmit for approval"}</Button>
      </div>
    </Drawer>
  );
}

function ApprovalQueuePage(){
  const {state, dispatch, openDetails} = useApp();
  const meQ = USERS.find(u=>u.id===state.currentUserId);
  const canReview = PERMS[meQ.role].approve;
  const [qtab, setQtab] = useState(()=>{ const t = state.queueTab; if(t==="review" && !canReview) return "changes"; return t || (canReview? "review" : "changes"); });
  const [mode, setMode] = useState("package");
  const [filters, setFilters] = useState({brand:"", creator:"", campaign:"", priority:"", platform:""});
  // Keys reviewed this session. Approved/rejected items drop out of the "submitted" pool on their own, so
  // tracking what's been decided (rather than a position index) keeps the next post from being skipped.
  const [reviewedKeys, setReviewedKeys] = useState([]);
  const [pending, setPending] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [immersive, setImmersive] = useState(null); // preferred platform while full-screen review is open
  const narrow = useIsNarrow(900);

  const queue = useMemo(()=>buildQueue(state.contentItems, mode, filters), [state.contentItems, mode, filters]);
  useEffect(()=>{ setReviewedKeys([]); }, [mode, JSON.stringify(filters)]);
  const remaining = queue.filter(e=>!reviewedKeys.includes(e.key));
  const reviewed = reviewedKeys.length;
  const total = reviewed + remaining.length;
  const current = remaining[0];
  useEffect(()=>{ if(!current) setImmersive(null); }, [current]);
  const immersivePlatform = current && immersive ? (current.platform || (current.item.platforms.includes(immersive) ? immersive : current.item.platforms[0])) : null;

  function requestDecision(type){
    if(!current) return;
    setPending({key:current.key, contentId:current.contentId, platform:current.platform, itemTitle:current.item.title, type});
  }
  function confirmDecision(extra){
    const decision = pending.type==="approve"?"approved": pending.type==="reject"?"rejected":"changes_requested";
    dispatch({type:"SUBMIT_DECISION", contentId:pending.contentId, platform:pending.platform, decision, feedback:extra.text, tags:extra.tags, dueDate:extra.dueDate});
    setReviewedKeys(k=>[...k, pending.key]);
    setPending(null);
  }
  function undo(){
    dispatch({type:"UNDO_DECISION"});
    setReviewedKeys(k=>k.slice(0,-1));
  }

  const creators = [...new Set(state.contentItems.map(i=>i.creator))].map(id=>USERS.find(u=>u.id===id));
  const activeFilterCount = Object.values(filters).filter(Boolean).length;

  return (
    <div>
      <PageHeader title="Approval Queue" subtitle={qtab==="review" ? "Review each post, then tap ✕ Reject, Request Edits or ✓ Approve." : "Fix what the approver asked for, then resubmit."} action={qtab!=="review" ? null :
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          <Button variant="ghost" size="sm" icon="undo" onClick={undo} disabled={state.decisionHistory.length===0}>Undo Last Decision</Button>
        </div>
      }/>

      <QueueTabs tab={qtab} setTab={setQtab} canReview={canReview}/>
      {qtab!=="review" ? <ReworkList key={qtab} status={qtab==="changes"? "changes_requested" : "rejected"}/> : <>
      <Card style={{padding: narrow? 10:14, marginBottom: narrow? 14:18, display:"flex", flexWrap:"wrap", gap:10, alignItems:"center"}}>
        <div style={{display:"flex", background:"var(--surface-2)", borderRadius:9, padding:3, gap:2}}>
          <button onClick={()=>setMode("package")} style={{padding:"6px 12px", borderRadius:7, border:"none", fontWeight:700, fontSize:12.5, cursor:"pointer", background:mode==="package"?"var(--surface)":"transparent", boxShadow:mode==="package"?"var(--shadow-sm)":"none"}}>Full package</button>
          <button onClick={()=>setMode("variant")} style={{padding:"6px 12px", borderRadius:7, border:"none", fontWeight:700, fontSize:12.5, cursor:"pointer", background:mode==="variant"?"var(--surface)":"transparent", boxShadow:mode==="variant"?"var(--shadow-sm)":"none"}}>Per platform</button>
        </div>
        {narrow && <button onClick={()=>setShowFilters(v=>!v)} style={{marginLeft:"auto", display:"flex", alignItems:"center", gap:6, padding:"7px 12px", borderRadius:9, border:"1px solid var(--border)", background: activeFilterCount? "var(--accent-soft)":"var(--surface)", color: activeFilterCount? "var(--accent-dark)":"var(--ink-soft)", fontWeight:700, fontSize:12.5, cursor:"pointer"}}>
          <Icon name="filter" size={14}/>Filters{activeFilterCount? " ("+activeFilterCount+")":""}<Icon name="chevronDown" size={14} style={{transform: showFilters?"rotate(180deg)":"none", transition:"transform .2s"}}/>
        </button>}
        {(!narrow || showFilters) && <>
        {!narrow && <div style={{width:1, height:24, background:"var(--border)"}}/>}
        <div className="cf-queue-filters" style={{display:"contents"}}>
        <Select value={filters.brand} onChange={v=>setFilters(f=>({...f,brand:v}))} placeholder="All brands" options={BRANDS.map(b=>({value:b.id,label:b.name}))} style={{width:150}}/>
        <Select value={filters.platform} onChange={v=>setFilters(f=>({...f,platform:v}))} placeholder="All platforms" options={Object.entries(PLATFORM_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:150}}/>
        <Select value={filters.creator} onChange={v=>setFilters(f=>({...f,creator:v}))} placeholder="All creators" options={creators.map(c=>({value:c.id,label:c.name}))} style={{width:150}}/>
        <Select value={filters.campaign} onChange={v=>setFilters(f=>({...f,campaign:v}))} placeholder="All campaigns" options={campaignFilterOptions(state.campaigns)} style={{width:170}}/>
        <Select value={filters.priority} onChange={v=>setFilters(f=>({...f,priority:v}))} placeholder="All priorities" options={Object.entries(PRIORITY_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:140}}/>
        </div>
        </>}
      </Card>
      <style>{`@media (max-width:900px){ .cf-queue-filters{ display:grid !important; grid-template-columns:1fr 1fr; gap:8px; width:100%; } .cf-queue-filters > *{ width:auto !important; min-width:0; } }`}</style>

      {total===0 ? (
        <Card style={{padding:0}}><EmptyState icon="check" title="Nothing waiting on you" subtitle="All submitted content matching these filters has been reviewed. Nice work."/></Card>
      ) : reviewed>=total ? (
        <Card style={{padding:0}}><EmptyState icon="check" title={"Queue clear — "+total+" of "+total+" reviewed"} subtitle="You've reviewed everything in this queue. Adjust filters to see more, or check back later." action={<Button variant="primary" onClick={()=>setReviewedKeys([])} style={{marginTop:6}}>Review again</Button>}/></Card>
      ) : (
        <div>
          <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:14}}>
            <div style={{fontSize:13, fontWeight:700, color:"var(--ink-soft)"}}>{reviewed} of {total} reviewed</div>
            <div style={{flex:1, height:6, borderRadius:99, background:"var(--surface-2)", overflow:"hidden"}}><div style={{width:(reviewed/total*100)+"%", height:"100%", background:"var(--accent)", borderRadius:99, transition:"width .3s ease"}}/></div>
          </div>
          <div style={{position:"relative", height: narrow? "max(480px, calc(100dvh - 160px))" : "clamp(540px, calc(100dvh - 250px), 860px)", maxWidth: narrow? 520 : 780, margin:"0 auto"}}>
            {remaining.slice(0, 3).reverse().map((entry, ri, arr)=>{
              const depth = arr.length-1-ri;
              return (
                <div key={entry.key} style={{position:"absolute", inset:0, transform: depth>0? `translateY(${depth*8}px) scale(${1-depth*0.035})`:"none", opacity: depth>2?0:1, zIndex:10-depth}}>
                  <SwipeCard entry={entry} isTop={depth===0} narrow={narrow} paused={!!immersive} onImmersive={p=>setImmersive(p)} onOpenDetails={openDetails} onDecision={requestDecision}/>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex", justifyContent:"center", gap:14, marginTop: narrow? 16:22}}>
            <Button variant="danger" size="lg" icon="x" onClick={()=>requestDecision("reject")} style={{borderRadius:99, width:56, height:56, padding:0, justifyContent:"center"}}/>
            <Button variant="amber" size="lg" icon="edit" onClick={()=>requestDecision("edits")} style={{borderRadius:99}}>Request Edits</Button>
            <Button variant="success" size="lg" icon="check" onClick={()=>requestDecision("approve")} style={{borderRadius:99, width:56, height:56, padding:0, justifyContent:"center"}}/>
          </div>
        </div>
      )}
      </>}
      {immersive && current && <ImmersiveViewer key={current.key} entry={current} platform={immersivePlatform} onPlatform={setImmersive}
        onDecision={requestDecision} onClose={()=>setImmersive(null)} busy={!!pending}/>}
      <DecisionModal pending={pending} onCancel={()=>setPending(null)} onConfirm={confirmDecision}/>
    </div>
  );
}

/* ---------- Smart insights ----------
   One compact snapshot of the pipeline + performance feeds both Claude (via /api/insights) and the built-in
   rules used when no Claude API key is set, so both always talk about the same numbers. */
function insightsData(state){
  const items = state.contentItems;
  const count = st => items.filter(i=>i.status===st);
  const now = new Date(TODAY);
  const daysAgo = iso => Math.max(0, Math.round((now - new Date(iso))/86400000));
  // Real stats from Make once there are any; otherwise the labelled sample history.
  const real = realAnalyticsPosts(realAnalyticsStore.data, items);
  const all = real.length ? real : [...state.publishedPosts, ...SAMPLE_HISTORY];
  const since = d => { const x = new Date(now); x.setDate(x.getDate()-d); return x; };
  const cur = all.filter(p=> new Date(p.publishedAt) > since(30) && new Date(p.publishedAt) <= now);
  const prev = all.filter(p=> new Date(p.publishedAt) > since(60) && new Date(p.publishedAt) <= since(30));
  const tc = metricTotals(cur), tp = metricTotals(prev);
  const byPlatform = Object.keys(PLATFORM_META).map(pl=>({pl, t:metricTotals(cur.filter(p=>p.platform===pl))})).filter(r=>r.t.posts>0);
  const pillars = PILLARS.map(pl=>{ const ps=cur.filter(p=>p.pillar===pl); const t=metricTotals(ps); return {pl, n:ps.length, avgViews: ps.length? t.views/ps.length : 0, er:t.engagementRate}; }).filter(r=>r.n>=2);
  const BUCKETS = [["morning",5,11],["lunchtime",11,14],["afternoon",14,17],["evening",17,21],["late evening",21,29]];
  const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  let bestSlot = null;
  DAYS.forEach((d,wd)=>BUCKETS.forEach(([b,a1,b1])=>{
    const ps = all.filter(p=>{ const x=new Date(p.publishedAt); const h=x.getHours(); return (x.getDay()+6)%7===wd && ((h>=a1&&h<b1)||(h+24>=a1&&h+24<b1)); });
    if(ps.length>=3){ const er = metricTotals(ps).engagementRate; if(!bestSlot || er>bestSlot.er) bestSlot = {day:d, bucket:b, er, n:ps.length}; }
  }));
  const top = [...cur].sort((a,b)=>b.views-a.views).slice(0,3);
  const nextWeek = Array.from({length:7}).map((_,i)=>{ const d=new Date(now); d.setDate(d.getDate()+i); d.setHours(0,0,0,0); return d; });
  const scheduled = nextWeek.map(d=>{ const e=new Date(d); e.setDate(e.getDate()+1);
    const vs = items.flatMap(i=>Object.values(i.variants||{}).filter(v=>v.scheduledAt && v.publishStatus!=="published" && new Date(v.scheduledAt)>=d && new Date(v.scheduledAt)<e).map(v=>({title:i.title, platform:v.platform})));
    return {date:d, vs}; });
  const emptyDays = scheduled.filter(x=>x.vs.length===0).map(x=>x.date.toLocaleDateString("en-GB",{weekday:"short", day:"numeric"}));
  return {
    sample: all.some(p=>p.sample), tc, tp, byPlatform, pillars, bestSlot, top, scheduled, emptyDays,
    awaiting: count("submitted").map(i=>({title:i.title, days:daysAgo(i.createdAt||now)})),
    changes: count("changes_requested").map(i=>i.title), rejected: count("rejected").map(i=>i.title), failed: count("failed").map(i=>i.title),
    approvedUnscheduled: items.filter(i=>i.status==="approved" && !Object.values(i.variants||{}).some(v=>v.scheduledAt)).map(i=>i.title),
  };
}
function pctChange(a, b){ return b ? (a-b)/b*100 : 0; }
function insightsSnapshot(d){
  const L = [];
  L.push("Sanjugo Creator Studio snapshot, "+fmtDate(TODAY.toISOString())+".");
  if(d.sample) L.push("NOTE: performance figures below are SAMPLE data (real platform stats aren't connected yet). Pipeline figures are real.");
  L.push("", "PIPELINE (real)");
  L.push("- Awaiting approval: "+d.awaiting.length+(d.awaiting.length? " — "+d.awaiting.map(a=>`"${a.title}" (${a.days}d waiting)`).join("; ") : ""));
  L.push("- Needs changes: "+d.changes.length+(d.changes.length? " — "+d.changes.map(t=>`"${t}"`).join("; ") : ""));
  L.push("- Rejected: "+d.rejected.length+" · Failed to publish: "+d.failed.length+" · Approved but not scheduled: "+d.approvedUnscheduled.length);
  L.push("- Next 7 days: "+d.scheduled.map(x=>x.date.toLocaleDateString("en-GB",{weekday:"short"})+" "+(x.vs.length? x.vs.map(v=>PLATFORM_META[v.platform].short).join("+") : "nothing")).join(", "));
  L.push("", "PERFORMANCE, last 30 days vs previous 30");
  L.push(`- ${d.tc.posts} posts · views ${fmtNum(d.tc.views)} (${pctChange(d.tc.views,d.tp.views).toFixed(0)}%) · engagement rate ${fmtPct(d.tc.engagementRate)} (prev ${fmtPct(d.tp.engagementRate)}) · followers gained ${d.tc.followsGained} (prev ${d.tp.followsGained})`);
  L.push("- By platform: "+d.byPlatform.map(r=>`${PLATFORM_META[r.pl].label} ${r.t.posts} posts, ${fmtNum(r.t.views)} views, ${fmtPct(r.t.engagementRate)} ER, +${r.t.followsGained} followers`).join("; "));
  if(d.pillars.length) L.push("- By content type (avg views, ER): "+d.pillars.map(r=>`${r.pl} ${fmtNum(Math.round(r.avgViews))}, ${fmtPct(r.er)}`).join("; "));
  if(d.bestSlot) L.push(`- Best posting slot by engagement: ${d.bestSlot.day} ${d.bestSlot.bucket} (${fmtPct(d.bestSlot.er)} over ${d.bestSlot.n} posts)`);
  if(d.top.length) L.push("- Top posts: "+d.top.map(p=>`"${p.contentTitle}" on ${PLATFORM_META[p.platform].label} (${fmtNum(p.views)} views, ${fmtPct(p.engagementRate)} ER)`).join("; "));
  return L.join("\n");
}
function builtInInsights(d){
  const out = [];
  const byEr = [...d.byPlatform].sort((a,b)=>b.t.engagementRate-a.t.engagementRate);
  const byViews = [...d.byPlatform].sort((a,b)=>b.t.views-a.t.views);
  if(byEr.length>=2){
    const best = byEr[0], low = byEr[byEr.length-1];
    out.push({title:PLATFORM_META[best.pl].label+" engages best", detail:`${fmtPct(best.t.engagementRate)} engagement on ${PLATFORM_META[best.pl].label} vs ${fmtPct(low.t.engagementRate)} on ${PLATFORM_META[low.pl].label} over the last 30 days.`, action:`Add one extra ${PLATFORM_META[best.pl].label} post this week.`});
  }
  if(byViews.length && (!byEr.length || byViews[0].pl!==byEr[0].pl)) out.push({title:PLATFORM_META[byViews[0].pl].label+" brings the reach", detail:`${fmtNum(byViews[0].t.views)} views from ${byViews[0].t.posts} posts — the biggest audience of any platform.`, action:`Cut your strongest recent reel for ${PLATFORM_META[byViews[0].pl].label} first.`});
  if(d.bestSlot) out.push({title:"Best time: "+d.bestSlot.day+" "+d.bestSlot.bucket, detail:`Posts in that slot average ${fmtPct(d.bestSlot.er)} engagement (${d.bestSlot.n} posts).`, action:`Schedule next week's best post for ${d.bestSlot.day} ${d.bestSlot.bucket}.`});
  const pill = [...d.pillars].sort((a,b)=>b.avgViews-a.avgViews)[0];
  if(pill) out.push({title:pill.pl+" content performs best", detail:`${pill.pl} posts average ${fmtNum(Math.round(pill.avgViews))} views at ${fmtPct(pill.er)} engagement.`, action:`Plan one more ${pill.pl} post from the content library.`});
  const risks = [];
  const oldest = [...d.awaiting].sort((a,b)=>b.days-a.days)[0];
  if(d.failed.length) risks.push(`${d.failed.length} post${d.failed.length>1?"s":""} failed to publish — retry or fix before they go stale.`);
  if(oldest && oldest.days>=2) risks.push(`"${oldest.title}" has waited ${oldest.days} days for approval.`);
  if(d.changes.length) risks.push(`${d.changes.length} post${d.changes.length>1?"s":""} still need changes from the creator.`);
  if(d.emptyDays.length>=3) risks.push(`Nothing is scheduled on ${d.emptyDays.slice(0,4).join(", ")}${d.emptyDays.length>4?"…":""}.`);
  if(d.approvedUnscheduled.length) risks.push(`${d.approvedUnscheduled.length} approved post${d.approvedUnscheduled.length>1?"s have":" has"} no publish date yet.`);
  const change = pctChange(d.tc.views, d.tp.views);
  return {
    headline: `Views ${change>=0? "up":"down"} ${Math.abs(change).toFixed(0)}% on the previous 30 days, at ${fmtPct(d.tc.engagementRate)} engagement${d.sample? " (sample figures)" : ""}.`,
    insights: out.slice(0,4), risk: risks[0] || "No bottlenecks right now — the pipeline is moving.", generatedAt:new Date().toISOString(), source:"built-in",
  };
}

function SmartInsightsPanel(){
  const {state} = useApp();
  const [result, setResult] = useState(null);
  const [configured, setConfigured] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  useEffect(()=>{
    fetch("/api/insights", {cache:"no-store"}).then(r=>r.ok? r.json() : null).then(d=>{
      if(!d) { setConfigured(false); return; }
      setConfigured(!!d.configured);
      if(d.latest) setResult(d.latest);
    }).catch(()=>setConfigured(false));
  }, []);
  async function generate(){
    setLoading(true); setError(null);
    const data = insightsData(state);
    if(configured){
      try{
        const r = await fetch("/api/insights", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({snapshot: insightsSnapshot(data)})});
        const d = await r.json().catch(()=>({}));
        if(r.ok){ setResult(d); setLoading(false); return; }
        setError((d.error && d.error!=="not_configured"? d.error : "Claude isn't set up yet")+" — showing built-in insights instead.");
      }catch(e){ setError("Couldn't reach Claude — showing built-in insights instead."); }
    }
    setResult(builtInInsights(data));
    setLoading(false);
  }
  const fromClaude = result && result.source==="claude";
  return (
    <Card style={{padding:18, marginBottom:18, background:"var(--accent-soft)", border:"1px solid color-mix(in srgb, var(--accent) 45%, transparent)"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:12, marginBottom: result||error? 12:6}}>
        <div>
          <div style={{display:"flex", alignItems:"center", gap:8, color:"var(--accent-dark)", fontWeight:600, fontSize:14}}><Icon name="zap" size={16}/>Smart insights</div>
          {result && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:3}}>{fromClaude? "By Claude" : "Built-in analysis"} · {fmtDateTime(result.generatedAt)}</div>}
        </div>
        <Button size="sm" variant="primary" icon="refresh" onClick={generate} disabled={loading}>{loading? (configured? "Claude is thinking…" : "Working…") : result? "Refresh" : "Generate"}</Button>
      </div>
      {error && <div style={{fontSize:12, color:"var(--amber)", fontWeight:600, marginBottom:8}}>{error}</div>}
      {!result && !loading && <div style={{fontSize:13, color:"var(--ink-soft)"}}>{configured? "Ask Claude to read this month's numbers and the approval pipeline and suggest what to do next." : "Get a quick read on what's working, the best time to post, and what's holding things up."}</div>}
      {result && <div>
        {result.headline && <div style={{fontSize:15, fontWeight:600, lineHeight:1.4, marginBottom:12}}>{result.headline}</div>}
        {result.insights && result.insights.length>0 && <div className="cf-insights" style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))", gap:10, marginBottom:10}}>
          {result.insights.map((it,i)=>(
            <div key={i} style={{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:9, padding:"10px 12px"}}>
              <div style={{fontSize:13, fontWeight:600, marginBottom:4}}>{it.title}</div>
              <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.5, marginBottom:6}}>{it.detail}</div>
              {it.action && <div style={{fontSize:12.5, lineHeight:1.45, display:"flex", gap:6}}><Icon name="chevronRight" size={13} style={{color:"var(--accent)", marginTop:2}}/><span><strong>Do:</strong> {it.action}</span></div>}
            </div>
          ))}
        </div>}
        {result.text && !result.insights?.length && <div style={{fontSize:13.5, lineHeight:1.6, whiteSpace:"pre-wrap", marginBottom:8}}>{result.text}</div>}
        {result.risk && <div style={{display:"flex", gap:8, alignItems:"flex-start", fontSize:13, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:9, padding:"9px 12px"}}><Icon name="warn" size={15} style={{color:"var(--amber)", marginTop:1}}/><span><strong>Watch out:</strong> {result.risk}</span></div>}
        {!configured && <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:10}}>Add a Claude API key (Settings → Smart insights) for deeper, written analysis by Claude.</div>}
      </div>}
    </Card>
  );
}

function DashboardPage(){

  const realData = useRealAnalytics();
  const monthAgo = new Date(TODAY); monthAgo.setDate(monthAgo.getDate()-30);

/* ============================== RECURRING CALENDAR TEMPLATE + AUTO-FILL ============================== */
const WEEKDAY_LABELS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CONTENT_TYPE_OPTIONS = ["reel","short","post","story","carousel","update"];
const DEFAULT_CALENDAR_TEMPLATE = [
  {id:"tpl_mon", weekday:1, time:"12:00", platform:"instagram", type:"reel", brand:"sanjugo"},
  {id:"tpl_wed", weekday:3, time:"12:00", platform:"instagram", type:"reel", brand:"sanjugo"},
  {id:"tpl_fri", weekday:5, time:"18:00", platform:"instagram", type:"reel", brand:"sanjugo"},
];
function mediaTypeMatchesTemplate(item, ruleType){
  // Best-effort match between the wizard's free-text pillar/notes and a template row's content "type" label.
  const hay = (item.pillar+" "+item.title+" "+(item.notes||"")).toLowerCase();
  return ruleType==="reel" ? (item.media.aspectRatio==="9:16") : true;
}
/** Finds the next empty recurring-template slot (within 60 days) that matches this item's platform,
 *  and isn't already occupied by another item's variant. Returns {date, time, ruleId} or null — the
 *  content stays "approved but waiting for an empty slot" until one frees up. */
function findTemplateSlot(item, platform, allItems, template){
  const rules = (template||[]).filter(r=> r.platform===platform && (!r.brand || r.brand===item.brand));
  if(rules.length===0) return null;
  const occupied = new Set();
  allItems.forEach(it=>{
    Object.entries(it.variants||{}).forEach(([p,v])=>{
      if(p===platform && v.scheduledAt){
        const d = new Date(v.scheduledAt);
        occupied.add(d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+p);
      }
    });
  });
  for(let dayOff=1; dayOff<=60; dayOff++){
    const d = new Date(TODAY); d.setDate(d.getDate()+dayOff);
    const rule = rules.find(r=>r.weekday===d.getDay());
    if(!rule) continue;
    const key = d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+platform;
    if(occupied.has(key)) continue;
    const [hh,mm] = (rule.time||"09:00").split(":").map(Number);
    d.setHours(hh||9, mm||0, 0, 0);
    return {date:d.toISOString(), ruleId:rule.id};
  }
  return null;
}

function calendarEntries(items, filters){
  let flat = [];
  items.forEach(it=>{
    Object.values(it.variants).forEach(v=>{
      if(!v.scheduledAt) return;
      flat.push({item:it, v});
    });
  });
  if(filters.brand) flat = flat.filter(x=>x.item.brand===filters.brand);
  if(filters.platform) flat = flat.filter(x=>x.v.platform===filters.platform);
  if(filters.campaign) flat = flat.filter(x=>matchCampaign(filters.campaign, x.item.campaign));
  if(filters.creator) flat = flat.filter(x=>x.item.creator===filters.creator);
  if(filters.status) flat = flat.filter(x=>x.item.status===filters.status);
  return flat;
}

function localDateTime(date, time){
  const pad = n=>String(n).padStart(2,"0");
  return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate())+"T"+(time||"12:00")+":00";
}

/* ============================== CONTENT LIBRARY (Google Drive) ============================== */
/* The "Sanjugo Marketing Contents Final" Drive folder. Every file is named with the SANJUGO filing system —
   date_platform_category_[dish]_stage_version_BARCODE — so the name alone tells us what the asset is. */
const LIB_SOCIAL = {IS:"Instagram Stories", TK:"TikTok", YT:"YouTube", IV:"Instagram Video", AL:"All platforms"};
const LIB_CATEGORY = {FC:"Food and Craft", AV:"Atmosphere and Vibes", CH:"Culture and History", CM:"Community", PO:"Promos and Offers"};
const LIB_STAGE = {RAW:"Raw", EDT:"Edit in progress", FIN:"Finished", USD:"Used"};
const LIB_DISH_GROUPS = [
  ["Starters", {YK:"Chicken Yakitori", ED:"Edamame", FD:"Fried Dumplings", MS:"Miso Soup", PP:"Padron Pepper", SE:"Spicy Edamame", TS:"Tofu Steak"}],
  ["Salad", {HS:"Hiramasa Salad", ST:"Salmon Tataki", SW:"Seaweed Salad", TT:"Tuna Tataki"}],
  ["Wagyu Beef", {WG:"Wagyu Beef Gunkan", WN:"Wagyu Beef Nigiri", WR:"Wagyu Beef Roll", WT:"Wagyu Beef Tataki"}],
  ["Tempura & Snack", {CK:"Chicken Karaage", EF:"Ebi Fry", CT:"Homemade Chicken Tender", IK:"Iidako Karaage", OT:"Oyster Tempura", PT:"Prawn Tempura", SC:"Soft Shell Crab Tempura", TY:"Tako Yaki", YS:"Yasai Kakiage"}],
  ["Sushi", {S3:"3 Sashimi Omakase (9pc)", S5:"5 Sashimi Omakase (15pc)", N6:"6 Nigiri Set", S7:"7 Sashimi Omakase (21pc)"}],
  ["Maki Roll", {CR:"California Roll", GV:"Green Vege Roll", MP:"Miso Prawn Roll", RB:"Rainbow Roll", SA:"Salmon & Avocado Roll", SJ:"SANJUGO Roll", SS:"Soft Shell Crab Roll", SP:"Spicy Tuna Roll", UR:"Unagi Roll"}],
  ["Grilled & Fish", {HK:"Grilled Hamachi Kama", GK:"Grilled Sake Kama", GT:"Grilled Sake Teriyaki, Hijiki Rice", SB:"Grilled Shioyaki Saba", MN:"Misoni Saba", ND:"Nasu Dengaku"}],
  ["Bao", {PB:"Panko Prawn Bao", CB:"Spicy Chicken Bao", TB:"Teriyaki Bao", VB:"Vegetable Bao"}],
  ["Donburi", {KC:"Chicken Katsu Curry Don", PC:"Prawn Katsu Curry Don", CD:"Chilli Chicken Don", TN:"Tonkatsu Don", GB:"Genki Beef Don", UD:"Unagi Don", SD:"Salmon Don", BC:"Bara Chirashi Don"}],
  ["Sides", {GH:"Gohan (Plain Rice)", HR:"Hijiki Rice", MC:"Marinated Chilli Chicken", VC:"Vegetable Croquette"}],
];
const LIB_DISH = Object.assign({}, ...LIB_DISH_GROUPS.map(g=>g[1]));
// How library codes map onto Creator Studio's own fields when a file is turned into a post.
const LIB_PILLAR = {FC:"Product", AV:"Behind the Scenes", CH:"Education", CM:"UGC", PO:"Promotion"};
const LIB_PLATFORMS = {IS:["instagram"], IV:["instagram"], TK:["tiktok"], YT:["youtube"], AL:["instagram","tiktok","facebook"]};
const LIB_NAME_RE = /^(\d{8})_([A-Z]{2})_([A-Z]{2})(?:_([A-Z0-9]{2}))?_([A-Z]{3})_v[\w]+?_([A-Z]\d{3})/;
const RAW_EXT = /\.(arw|cr2|cr3|nef|dng|raf|orf|rw2)$/i;

function parseLibraryName(name){
  const m = LIB_NAME_RE.exec(name||"");
  if(!m) return null;
  return {date:m[1], social:m[2], category:m[3], dish:m[4]||null, stage:m[5], barcode:m[6]};
}
function enrichLibrary(files){
  return files.map(f=>{
    const meta = parseLibraryName(f.name);
    const kind = (f.mime||"").startsWith("video/") ? "video" : (RAW_EXT.test(f.name) || /x-raw/.test(f.mime||"")) ? "raw" : (f.mime||"").startsWith("image/") ? "photo" : "doc";
    const date = meta ? meta.date.slice(0,4)+"-"+meta.date.slice(4,6)+"-"+meta.date.slice(6,8) : (f.modified||"").slice(0,10);
    const label = meta ? (LIB_DISH[meta.dish] || LIB_CATEGORY[meta.category] || f.name) : f.name.replace(/\.[^.]+$/,"");
    const searchText = [f.name, meta&&meta.barcode, meta&&LIB_DISH[meta.dish], meta&&LIB_CATEGORY[meta.category], meta&&LIB_SOCIAL[meta.social], meta&&LIB_STAGE[meta.stage], f.branch, (f.path||[]).join(" "), f.note||"", kind].filter(Boolean).join(" ").toLowerCase();
    return {...f, meta, barcode: meta? meta.barcode : null, kind, date, label, searchText};
  });
}
function searchLibrary(files, query){
  const q = (query||"").trim().toLowerCase();
  if(!q) return [...files].sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  const code = /^[a-z]\d{1,3}$/i.test(q) ? q.toUpperCase() : null;
  const terms = q.split(/\s+/);
  const out = [];
  for(const f of files){
    let score = 0;
    if(code && f.barcode){ if(f.barcode===code) score = 1000; else if(f.barcode.startsWith(code)) score = 500; }
    if(!score && terms.every(t=>f.searchText.includes(t))) score = 10 + (f.label.toLowerCase().includes(q)? 5:0);
    if(score) out.push([score, f]);
  }
  return out.sort((a,b)=> b[0]-a[0] || (b[1].date||"").localeCompare(a[1].date||"")).map(x=>x[1]);
}
function libraryRefOf(f){
  return {id:f.id, barcode:f.barcode, name:f.name, branch:f.branch, path:f.path||[], kind:f.kind, dish:f.meta&&f.meta.dish, category:f.meta&&f.meta.category, social:f.meta&&f.meta.social, stage:f.meta&&f.meta.stage};
}
function suggestedTitle(f){
  const m = f.meta;
  if(!m) return f.label;
  const dish = LIB_DISH[m.dish], cat = LIB_CATEGORY[m.category];
  return (dish || cat || f.label) + (f.kind==="video" ? " — Reel" : "") + (f.barcode ? " ("+f.barcode+")" : "");
}
/* Where a library file has been used: every Creator Studio post that links to it, with each platform's post type
   and publish date — so the team can see "G730 went out as an Instagram Reel on 20 Sept" before reusing it. */
function libraryUsageMap(items){
  const m = {};
  items.forEach(i=>{ const id = i.libraryRef && i.libraryRef.id; if(id) (m[id] = m[id]||[]).push(i); });
  Object.values(m).forEach(list=>list.sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0)));
  return m;
}
function usageSummary(posts){
  if(!posts || !posts.length) return null;
  const variants = posts.flatMap(p=>Object.values(p.variants||{}));
  if(variants.some(v=>v.publishStatus==="published")) return {label:"Published", color:"var(--green)"};
  if(variants.some(v=>v.publishStatus==="scheduled")) return {label:"Scheduled", color:"var(--violet)"};
  return {label:"In a post", color:"var(--blue)"};
}
function variantUseLine(v){
  const type = v.postType || "Post";
  const when = v.publishStatus==="published" ? "published "+fmtDate(v.scheduledAt,{day:"numeric",month:"short",year:"numeric"})
    : v.scheduledAt ? (v.publishStatus==="scheduled"? "scheduled " : "planned ")+fmtDate(v.scheduledAt,{day:"numeric",month:"short"})
    : "not scheduled";
  return PLATFORM_META[v.platform].label+" "+type+" · "+when;
}
function UsageList({posts, onOpen, compact}){
  return posts.map(it=>(
    <button key={it.id} onClick={()=>onOpen(it)} style={{width:"100%", display:"block", padding: compact? "7px 9px" : "9px 11px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface)", cursor:"pointer", marginBottom:6, textAlign:"left", color:"var(--ink)"}}>
      <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:5}}>
        <span style={{flex:1, minWidth:0, fontSize:13, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{it.title}</span>
        <StatusBadge status={it.status}/>
      </div>
      {Object.values(it.variants||{}).map(v=>(
        <div key={v.platform} style={{display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--ink-soft)", marginTop:3}}>
          <PlatformIcon platform={v.platform} size={10}/>{variantUseLine(v)}

      <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:5}}>By {(USERS.find(u=>u.id===it.creator)||{}).name||"—"} · created {fmtDate(it.createdAt||new Date().toISOString())}</div>
    </button>
  ));
}
const driveFileUrl = id => "https://drive.google.com/file/d/"+id+"/view";
const driveFolderUrl = id => "https://drive.google.com/drive/folders/"+id;
const libThumbUrl = (f, connected) => connected ? "/api/library/thumb/"+f.id : "https://drive.google.com/thumbnail?id="+f.id+"&sz=w400";
function fmtBytes(n){ if(!n) return "—"; if(n>=1e9) return (n/1e9).toFixed(1)+" GB"; if(n>=1e6) return (n/1e6).toFixed(n>=1e8?0:1)+" MB"; return Math.max(1,Math.round(n/1e3))+" KB"; }

// One shared load per page view: the live index from the server if Drive is connected, else the bundled snapshot.
let LIBRARY_CACHE = null;
function loadLibrary(force){
  if(LIBRARY_CACHE && !force) return LIBRARY_CACHE;
  LIBRARY_CACHE = (async ()=>{
    let data = null;
    try{ const r = await fetch("/api/library", {cache:"no-store"}); if(r.ok) data = await r.json(); }catch(e){}
    if(!data || !Array.isArray(data.files)){
      const r = await fetch("/library.json");
      if(!r.ok) throw new Error("Couldn't load the content library");
      data = await r.json();
    }
    let status = {connected:false};
    try{ const r = await fetch("/api/library/status", {cache:"no-store"}); status = r.ok ? await r.json() : {connected:false, offline:true}; }catch(e){ status = {connected:false, offline:true}; }
    return {...data, files: enrichLibrary(data.files), status};
  })();
  LIBRARY_CACHE.catch(()=>{ LIBRARY_CACHE = null; });
  return LIBRARY_CACHE;
}
function useLibrary(){
  const [lib, setLib] = useState(null);
  const [error, setError] = useState(null);
  const load = useCallback(force=>{
    setError(null);
    loadLibrary(force).then(setLib).catch(e=>setError(e.message||"Couldn't load the content library"));
  }, []);
  useEffect(()=>{ load(false); }, [load]);
  return {lib, error, reload: ()=>load(true)};
}

/* Thumbnail with graceful fallbacks: our cached copy (needs Drive connected) → Drive's own thumbnail
   (works when this browser is signed in to a Google account with access) → a plain placeholder. */
function LibThumb({file, connected, size=400, radius=0, fit="cover"}){
  const sources = connected ? ["/api/library/thumb/"+file.id+(size>400? "?s=1200" : ""), "https://drive.google.com/thumbnail?id="+file.id+"&sz=w"+size] : ["https://drive.google.com/thumbnail?id="+file.id+"&sz=w"+size];
  const [stage, setStage] = useState(0);
  const [c1,c2] = grad(file.barcode||file.id);
  return (
    <div style={{position:"relative", width:"100%", height:"100%", borderRadius:radius, overflow:"hidden", background: stage<sources.length? "var(--surface-2)" : ({video:"linear-gradient(160deg,#E5484D,#B42318)", raw:"linear-gradient(160deg,#475467,#1D2939)", photo:"linear-gradient(160deg,#2E90FA,#1849A9)", doc:"linear-gradient(160deg,#12B76A,#05603A)"}[file.kind] || `linear-gradient(135deg, ${c1}, ${c2})`)}}>
      {stage<sources.length
        ? <img src={sources[stage]} alt="" loading="lazy" draggable={false} onError={()=>setStage(s=>s+1)} style={{position:"absolute", inset:0, width:"100%", height:"100%", objectFit:fit}}/>
        : <div style={{position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:6, color:"rgba(255,255,255,.95)"}}>
            <span style={{width:42, height:42, borderRadius:10, background:"rgba(255,255,255,.18)", display:"flex", alignItems:"center", justifyContent:"center"}}><Icon name={file.kind==="video"?"play":file.kind==="doc"?"file":"image"} size={20}/></span>
            <span style={{fontSize:10.5, fontWeight:700, letterSpacing:".6px"}}>{(file.name.split(".").pop()||"").toUpperCase().slice(0,5)}</span>
          </div>}
      {file.kind==="video" && <span style={{position:"absolute", right:6, bottom:6, width:22, height:22, borderRadius:99, background:"rgba(0,0,0,.55)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff"}}><Icon name="play" size={10}/></span>}
      {file.kind==="raw" && <span style={{position:"absolute", right:6, bottom:6, fontSize:9.5, fontWeight:700, letterSpacing:".4px", padding:"2px 5px", borderRadius:4, background:"rgba(0,0,0,.6)", color:"#fff"}}>RAW</span>}
    </div>
  );
}

                {used && <div style={{fontSize:11, color:"var(--ink-soft)", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>Used: {used[0].title}</div>}
                <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{x.branch}{x.meta? " · "+LIB_STAGE[x.meta.stage] : ""} · {x.date? fmtDate(x.date+"T12:00:00",{day:"numeric", month:"short", year:"2-digit"}) : fmtBytes(x.size)}</div>
              </div>
            </button>
          );
        })}
      </div>}
      {results.length>limit && <div style={{textAlign:"center", marginTop:16}}><Button variant="ghost" onClick={()=>setLimit(n=>n+60)}>Show more ({(results.length-limit).toLocaleString()} left)</Button></div>}

      <LibraryFileDrawer file={openFile} connected={connected} usedBy={openFile? usedBy[openFile.id] : null} canCreate={perms.create} onCreate={createFrom} onClose={()=>setOpenFile(null)}/>
      <style>{`.cf-libcard{transition:border-color .12s, transform .12s;} .cf-libcard:hover{border-color:var(--ink-mute) !important;} @media (max-width:900px){ .cf-lib-filters{ display:grid !important; grid-template-columns:1fr 1fr; } .cf-lib-filters > *{ width:auto !important; min-width:0; } .cf-lib-filters > label{ grid-column:1 / -1; } }`}</style>
    </div>
  );
}

/* Watch/see a library file in place. Connected: our server streams the video from Drive (seekable) and serves
   a large thumbnail. Not connected: fall back to Google's own Drive player, which only loads when this browser
   is signed in to a Google account with access (and allows Google's cookies — Safari/iPhone usually don't). */
function LibraryViewer({file, connected}){
  const [failed, setFailed] = useState(false);
  useEffect(()=>{ setFailed(false); }, [file.id]);
  const box = {width:"100%", borderRadius:10, overflow:"hidden", background:"#000", marginBottom:8, position:"relative"};
  const note = t => <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:14, lineHeight:1.5}}>{t}</div>;
  if(file.kind==="video"){
    if(connected && !failed) return <>
      <div style={{...box, height:"min(62vh, 560px)"}}>
        <video key={file.id} src={"/api/library/stream/"+file.id} poster={"/api/library/thumb/"+file.id+"?s=1200"} controls playsInline autoPlay muted
          onError={()=>setFailed(true)} style={{width:"100%", height:"100%", objectFit:"contain", background:"#000"}}/>
      </div>
      {note("Streaming from Google Drive · "+fmtBytes(file.size))}
    </>;
    return <>
      <div style={{...box, height:"min(62vh, 560px)"}}>
        <iframe key={file.id} src={"https://drive.google.com/file/d/"+file.id+"/preview"} title={file.name} allow="autoplay; fullscreen" allowFullScreen style={{width:"100%", height:"100%", border:0}}/>
      </div>
      {note(connected
        ? "This browser couldn't play the file directly (often an iPhone HEVC .MOV on Chrome/Windows), so it's playing in Google's Drive player."
        : "Playing in Google's Drive player — shows only if this browser is signed in to Google with access to the library. Connect Google Drive in Settings so videos play for everyone, on every device.")}
    </>;
  }
  // Photos (including RAW): our large cached preview when Drive is connected; otherwise — or if that fails —
  // Google's own Drive viewer, the same way videos fall back, since Google blocks its image links on other sites.
  if(connected && !failed) return <>
    <div style={{...box, height:"min(62vh, 560px)"}}>
      <img key={file.id} src={"/api/library/thumb/"+file.id+"?s=1200"} alt={file.name} onError={()=>setFailed(true)} style={{width:"100%", height:"100%", objectFit:"contain", display:"block"}}/>
    </div>
    {note("Preview from Google Drive — open in Drive for the full-resolution original.")}
  </>;
  return <>
    <div style={{...box, height:"min(62vh, 560px)", background:"#1f1f1f"}}>
      <iframe key={file.id} src={"https://drive.google.com/file/d/"+file.id+"/preview"} title={file.name} allowFullScreen style={{width:"100%", height:"100%", border:0}}/>
    </div>
    {note(connected
      ? "Showing in Google's Drive viewer."
      : "Showing in Google's Drive viewer — works when this browser is signed in to Google with access to the library. Connect Google Drive in Settings so photos show for everyone, on every device.")}
  </>;
}

function LibraryFileDrawer({file, connected, usedBy, canCreate, onCreate, onClose}){

    ["Barcode", file.barcode ? <BarcodeChip code={file.barcode} big/> : "—"],
    ["Dish", m && m.dish ? LIB_DISH[m.dish] || m.dish : "—"],
    ["Category", m ? LIB_CATEGORY[m.category] || m.category : "—"],
    ["Made for", m ? LIB_SOCIAL[m.social] || m.social : "—"],
    ["Stage", m ? LIB_STAGE[m.stage] || m.stage : "—"],
    ["Date", file.date ? fmtDate(file.date+"T12:00:00") : "—"],
    ["Branch", file.branch],
    ["Folder", [file.branch, ...(file.path||[])].join(" / ")],
    ["Type", file.kind==="raw" ? "RAW photo" : file.kind==="video" ? "Video" : file.kind==="photo" ? "Photo" : "Document"],

          <a href={driveFileUrl(file.id)} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}><Button variant="ghost" icon="external">Open in Google Drive</Button></a>
          <Button variant="ghost" onClick={copy}>Copy {file.barcode? "barcode":"name"}</Button>
        </div>
        {usedBy && usedBy.length>0 && <div style={{padding:"10px 12px", borderRadius:8, background:"var(--amber-soft)", color:"var(--ink)", fontSize:12.5, marginBottom:14, lineHeight:1.5}}>
          <strong>Already used</strong> — {variantUseLine(Object.values(usedBy[0].variants||{})[0]||{platform:"instagram"})} in "{usedBy[0].title}"{usedBy.length>1? " and "+(usedBy.length-1)+" more":""}. See usage history below.
        </div>}
        {file.kind==="raw" && <div style={{fontSize:12, color:"var(--ink-soft)", background:"var(--surface-2)", borderRadius:8, padding:"8px 10px", marginBottom:14, lineHeight:1.5}}>This is a camera RAW file. When you use it in a post, Creator Studio brings in Drive's full-size JPEG version, since browsers and social apps can't show RAW.</div>}
        <div style={{display:"grid", gridTemplateColumns:"auto 1fr", gap:"9px 16px", fontSize:13, marginBottom:18}}>
          {rows.map(([k,v])=><React.Fragment key={k}><span style={{color:"var(--ink-mute)"}}>{k}</span><span style={{fontWeight:500, wordBreak:"break-word"}}>{v}</span></React.Fragment>)}
          {file.note && <><span style={{color:"var(--ink-mute)"}}>Note</span><span>{file.note}</span></>}
        </div>
        <div style={{display:"flex", alignItems:"center", gap:8, fontSize:12, fontWeight:600, color:"var(--ink-mute)", marginBottom:8}}>
          Usage history {usedBy && usedBy.length>0 && <span style={{fontSize:11, fontWeight:600, padding:"1px 7px", borderRadius:5, background:usageSummary(usedBy).color, color:"#fff"}}>{usageSummary(usedBy).label}</span>}
        </div>
        {usedBy && usedBy.length ? <UsageList posts={usedBy} onOpen={it=>{ onClose(); openDetails(it); }}/> : <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>Not used in any post yet.</div>}

/* Barcode / search box used inside Create Content to pull a library file into the post. */
function LibraryPicker({onPick}){
  const {lib} = useLibrary();
  const {state} = useApp();
  const usedBy = useMemo(()=>libraryUsageMap(state.contentItems), [state.contentItems]);
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const results = lib && q.trim() ? searchLibrary(lib.files, q).slice(0, 8) : [];
  function choose(file){ onPick(file, !!(lib && lib.status.connected)); setQ(""); setOpen(false); }
  return (
    <div style={{position:"relative"}}>
      <div style={{position:"relative"}}>
        <Icon name="search" size={15} style={{position:"absolute", left:11, top:11, color:"var(--ink-mute)"}}/>
        <input value={q} placeholder={lib? "Type a barcode (e.g. G219) or search the library…" : "Loading library…"} disabled={!lib}
          onChange={e=>{ setQ(e.target.value); setOpen(true); setHi(0); }} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false), 150)}
          onKeyDown={e=>{
            if(!results.length) return;
            if(e.key==="ArrowDown"){ e.preventDefault(); setHi(i=>(i+1)%results.length); }
            else if(e.key==="ArrowUp"){ e.preventDefault(); setHi(i=>(i-1+results.length)%results.length); }
            else if(e.key==="Enter"){ e.preventDefault(); choose(results[hi]); }
          }}
          style={{width:"100%", padding:"9px 12px 9px 34px", borderRadius:8, border:"1px solid var(--border)", fontSize:13.5, background:"var(--surface)", color:"var(--ink)"}}/>
      </div>

        <div style={{position:"absolute", left:0, right:0, top:"100%", marginTop:6, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, boxShadow:"var(--shadow-lg)", zIndex:20, overflow:"hidden", maxHeight:380, overflowY:"auto"}}>
          {results.length===0 ? <div style={{padding:14, fontSize:12.5, color:"var(--ink-mute)"}}>No file with that barcode or name.</div> : results.map((x,i)=>(
            <button key={x.id} onMouseDown={e=>{ e.preventDefault(); choose(x); }} onMouseEnter={()=>setHi(i)}
              style={{width:"100%", display:"flex", alignItems:"center", gap:10, padding:"7px 10px", border:"none", borderBottom:"1px solid var(--border)", background: i===hi? "var(--surface-2)":"var(--surface)", cursor:"pointer", textAlign:"left", color:"var(--ink)"}}>
              <span style={{width:40, height:40, borderRadius:6, overflow:"hidden", flexShrink:0}}><LibThumb file={x} connected={lib.status.connected} size={120}/></span>
              <span style={{flex:1, minWidth:0}}>
                <span style={{display:"flex", alignItems:"center", gap:6}}><BarcodeChip code={x.barcode}/><span style={{fontSize:13, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{x.label}</span>
                  {usedBy[x.id] && <span style={{fontSize:10, fontWeight:600, padding:"1px 6px", borderRadius:5, background:usageSummary(usedBy[x.id]).color, color:"#fff", flexShrink:0}}>{usageSummary(usedBy[x.id]).label}</span>}</span>
                <span style={{display:"block", fontSize:11, color:"var(--ink-mute)", marginTop:2}}>{x.kind==="video"? "Video" : x.kind==="raw"? "RAW photo" : "Photo"} · {x.branch}{x.meta? " · "+LIB_STAGE[x.meta.stage] : ""} · {fmtBytes(x.size)}</span>
              </span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function DriveSettings({canManage=true}){
  const {state, dispatch} = useApp();
  const [st, setSt] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = ()=> fetch("/api/library/status", {cache:"no-store"}).then(r=>r.ok? r.json() : {connected:false, offline:true}).catch(()=>({connected:false, offline:true})).then(setSt);
  useEffect(()=>{ load(); }, []);
  async function refresh(){
    setBusy(true);
    try{
      const r = await fetch("/api/library/refresh", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Refresh failed ("+r.status+")");
      LIBRARY_CACHE = null;
      dispatch({type:"ADD_TOAST", message:"Library loaded from Google Drive — "+d.count+" files"});
      load();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  // Back from Google's sign-in page (#/settings?drive=connected|error): report it, then load the live library.
  useEffect(()=>{
    const r = state.driveReturn;
    if(!r) return;
    dispatch({type:"CLEAR_DRIVE_RETURN"});
    if(r.drive==="connected"){ dispatch({type:"ADD_TOAST", message:"Google Drive connected"}); refresh(); }
    else if(r.drive==="error") dispatch({type:"ADD_TOAST", message:r.msg || "Couldn't connect Google Drive", variant:"danger"});
  }, [state.driveReturn]);
  async function disconnect(){
    setBusy(true);
    await fetch("/api/google/disconnect", {method:"POST"}).catch(()=>{});
    LIBRARY_CACHE = null;
    dispatch({type:"ADD_TOAST", message:"Google Drive disconnected"});
    setBusy(false); load();
  }
  if(!st) return <Skeleton h={80}/>;
  const code = {fontFamily:'ui-monospace, Menlo, monospace', fontSize:12, background:"var(--surface-2)", border:"1px solid var(--border)", borderRadius:5, padding:"1px 5px"};
  const origin = window.location.origin;
  if(st.connected) return (
    <div>
      <div style={{display:"flex", alignItems:"center", gap:8, fontSize:13.5, fontWeight:600, marginBottom:6}}><span style={{width:8, height:8, borderRadius:99, background:"var(--green)"}}/>Connected</div>
      <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.6, marginBottom:12}}>
        Reading the library as <span style={code}>{st.serviceEmail || "Google account"}</span> — view-only.{st.connectedAt? " Connected "+fmtDateTime(st.connectedAt)+"." : ""}<br/>
        {st.lastRefresh ? "Library last refreshed "+fmtDateTime(st.lastRefresh)+"." : "Not refreshed yet — press Refresh to load the live file list."}
      </div>
      <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
        <Button variant="primary" icon="refresh" onClick={()=>refresh()} disabled={busy}>{busy? "Working…" : "Refresh library now"}</Button>
        {st.rootFolderId && <a href={driveFolderUrl(st.rootFolderId)} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}><Button variant="ghost" icon="external">Open library folder</Button></a>}
        {canManage && st.method==="google_signin" && <ConfirmButton size="md" disabled={busy} confirmLabel="Yes, disconnect Drive" onConfirm={disconnect}>Disconnect</ConfirmButton>}
      </div>
      {!canManage && <div style={{fontSize:12, color:"var(--ink-mute)", marginTop:10}}>Refresh after adding new files to the Drive folder so they show up in the Content Library.</div>}
      {canManage && st.method==="google_signin" && !st.canArchive && <div style={{marginTop:12, padding:"10px 12px", borderRadius:8, background:"var(--amber-soft)", fontSize:12.5, lineHeight:1.5, display:"flex", gap:10, alignItems:"center", flexWrap:"wrap"}}>
        <span style={{flex:1, minWidth:220}}><strong>One more permission needed</strong> so Creator Studio can move published uploads into a "Creator Studio Archive" folder in Drive (it can only touch files it creates).</span>
        <a href="/api/google/connect" style={{textDecoration:"none"}}><Button variant="primary" size="sm">Reconnect Google Drive</Button></a>
      </div>}
    </div>
  );
  if(!canManage) return (
    <div>
      <div style={{display:"flex", alignItems:"center", gap:8, fontSize:13.5, fontWeight:600, marginBottom:6}}><span style={{width:8, height:8, borderRadius:99, background:"var(--amber)"}}/>Not connected{st.offline? " (server not reachable here)":""}</div>
      <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.6}}>Google Drive isn't connected yet — ask an admin{st.offline? "" : " to connect it in Settings"}. The Content Library still shows the last saved file list.</div>
    </div>
  );
  if(st.signInConfigured) return (
    <div>
      <div style={{display:"flex", alignItems:"center", gap:8, fontSize:13.5, fontWeight:600, marginBottom:6}}><span style={{width:8, height:8, borderRadius:99, background:"var(--amber)"}}/>Not connected</div>
      <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.6, marginBottom:12}}>Sign in with the Google account that owns <strong>Sanjugo Marketing Contents Final</strong> (e.g. admin@sanjugo.co.uk) and allow read-only Drive access. You only do this once — after that it works for the whole team.</div>
      <a href="/api/google/connect" style={{textDecoration:"none"}}><Button variant="primary">Connect Google Drive</Button></a>
    </div>
  );
  return (
    <div>
      <div style={{display:"flex", alignItems:"center", gap:8, fontSize:13.5, fontWeight:600, marginBottom:6}}><span style={{width:8, height:8, borderRadius:99, background:"var(--amber)"}}/>Not set up{st.offline? " (server not reachable here)":""}</div>
      <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.6, marginBottom:10}}>One-time setup so an admin can connect Google Drive with a single sign-in. Your files stay private — Creator Studio only gets view access.</div>
      <ol style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.7, margin:"0 0 10px", paddingLeft:20}}>
        <li>In Google Cloud (project <strong>Creator Studio</strong>), enable the <strong>Google Drive API</strong>.</li>
        <li>Google Auth Platform → set up the consent screen with audience <strong>Internal</strong>.</li>
        <li>Clients → Create client → <strong>Web application</strong>, with redirect URI <span style={code}>{origin}/api/google/callback</span></li>
        <li>In Terminal, in the contentflow-app folder: <span style={code}>wrangler secret put GOOGLE_CLIENT_ID</span> and <span style={code}>wrangler secret put GOOGLE_CLIENT_SECRET</span></li>
        <li>Reload this page and press <strong>Connect Google Drive</strong>.</li>
      </ol>
      <Button variant="ghost" size="sm" icon="refresh" onClick={()=>window.location.reload()}>Check again</Button>
    </div>
  );
}
