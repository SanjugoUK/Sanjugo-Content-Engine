name = "contentflow"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# Filled in automatically by the setup commands in README.md — you shouldn't need to touch this.
[[d1_databases]]
binding = "DB"
database_name = "contentflow-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "contentflow-media"
