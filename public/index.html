/* Dropdown with "No campaign" plus a quick "+ New" so creators never have to leave the form. */
function CampaignPicker({value, brand, onChange}){
  const {state, dispatch} = useApp();
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const options = [{value:"", label:"No campaign"}, ...state.campaigns.filter(c=>c.brand===brand && (!c.archived || c.id===value)).map(c=>({value:c.id, label:c.name}))];
  function add(){
    const n = name.trim(); if(!n) return;
    const c = {id:uid("c"), brand, name:n, archived:false, createdAt:new Date().toISOString()};
    dispatch({type:"ADD_CAMPAIGN", campaign:c});
    onChange(c.id); setName(""); setAdding(false);
  }
  if(adding){
    return (
      <div style={{display:"flex", gap:6}}>
        <input autoFocus value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") add(); if(e.key==="Escape") setAdding(false); }} placeholder="New campaign name"
          style={{flex:1, minWidth:0, padding:"8px 10px", borderRadius:9, border:"1px solid var(--accent)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        <Button variant="primary" size="sm" onClick={add} disabled={!name.trim()}>Add</Button>
        <IconButton icon="x" title="Cancel" onClick={()=>setAdding(false)}/>
      </div>
    );
  }
  return (
    <div style={{display:"flex", gap:6}}>
      <Select value={value} onChange={onChange} options={options} style={{flex:1, minWidth:0}}/>
      <Button variant="ghost" size="sm" icon="plus" onClick={()=>setAdding(true)} style={{flexShrink:0}}>New</Button>
    </div>
  );
}

  const counts = {};
  state.contentItems.forEach(i=>{ counts[i.campaign||""] = (counts[i.campaign||""]||0)+1; });
  const list = state.campaigns.filter(c=> showArchived || !c.archived);
  const archivedCount = state.campaigns.filter(c=>c.archived).length;
  function add(){
    const n = name.trim(); if(!n) return;
    dispatch({type:"ADD_CAMPAIGN", campaign:{id:uid("c"), brand:BRANDS[0].id, name:n, archived:false, createdAt:new Date().toISOString()}});
    dispatch({type:"ADD_TOAST", message:"Campaign added — "+n});
    setName("");
  }
  const inputStyle = {padding:"8px 10px", borderRadius:8, border:"1px solid var(--border)", fontSize:13, background:"var(--surface)", color:"var(--ink)"};
  return (
    <div>
      <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:14}}>
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter" && add()} placeholder="New campaign name, e.g. Christmas Menu 2026" style={{...inputStyle, flex:1, minWidth:200}}/>
        <Button variant="primary" icon="plus" onClick={add} disabled={!name.trim()}>Add campaign</Button>
      </div>
      <div style={{border:"1px solid var(--border)", borderRadius:10, overflow:"hidden"}}>
        <div style={{display:"flex", alignItems:"center", gap:10, padding:"10px 12px", background:"var(--surface-2)", fontSize:12.5}}>
          <span style={{flex:1, fontWeight:600}}>No campaign</span>
          <span className="num" style={{color:"var(--ink-mute)"}}>{counts[""]||0} posts</span>
          <span className="cf-hide-narrow" style={{fontSize:11.5, color:"var(--ink-mute)", width:170, textAlign:"right"}}>Built in — always available</span>
        </div>
        {list.map(c=>(
          <div key={c.id} style={{display:"flex", alignItems:"center", gap:10, padding:"8px 12px", borderTop:"1px solid var(--border)", flexWrap:"wrap"}}>
            <input defaultValue={c.name} key={c.name} onBlur={e=>{ const v=e.target.value.trim(); if(v && v!==c.name){ dispatch({type:"UPDATE_CAMPAIGN", id:c.id, patch:{name:v}}); dispatch({type:"ADD_TOAST", message:"Campaign renamed"}); } else e.target.value=c.name; }}
              onKeyDown={e=>e.key==="Enter" && e.target.blur()} title="Click to rename"
              style={{...inputStyle, flex:1, minWidth:160, border:"1px solid transparent", background:"transparent", fontWeight:600, opacity:c.archived?.6:1}}
              onFocus={e=>{ e.target.style.border="1px solid var(--border)"; e.target.style.background="var(--surface)"; }}/>
            {c.archived && <Badge label="Archived" color="var(--ink-mute)" soft="var(--surface-2)"/>}
            <span className="num" style={{fontSize:12.5, color:"var(--ink-mute)"}}>{counts[c.id]||0} posts</span>
            <div style={{display:"flex", gap:6}}>
              <Button variant="ghost" size="sm" onClick={()=>dispatch({type:"UPDATE_CAMPAIGN", id:c.id, patch:{archived:!c.archived}})}>{c.archived? "Restore":"Archive"}</Button>
              <Button variant="ghost" size="sm" onClick={()=>setConfirmDelete(c)} style={{color:"var(--red)"}}>Delete</Button>
            </div>
            <textarea defaultValue={c.details||""} key={"d"+(c.details||"")} rows={1} placeholder="Dates, rules, codes — AI Dev + uses this when writing captions"
              onBlur={e=>{ const v=e.target.value.trim(); if(v!==(c.details||"")) dispatch({type:"UPDATE_CAMPAIGN", id:c.id, patch:{details:v}}); }}
              style={{...inputStyle, flexBasis:"100%", fontSize:12, color:"var(--ink-soft)", border:"1px solid transparent", background:"transparent", resize:"vertical", padding:"2px 10px", fontFamily:"inherit", opacity:c.archived?.6:1}}
              onFocus={e=>{ e.target.style.border="1px solid var(--border)"; e.target.style.background="var(--surface)"; }}/>
          </div>
        ))}
      </div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10, fontSize:12, color:"var(--ink-mute)", gap:10, flexWrap:"wrap"}}>
        <span>Tap a name to rename</span>
        {archivedCount>0 && <Button variant="text" size="sm" onClick={()=>setShowArchived(v=>!v)}>{showArchived? "Hide archived" : "Show archived ("+archivedCount+")"}</Button>}
      </div>
      <Modal open={!!confirmDelete} onClose={()=>setConfirmDelete(null)} width={420}>
        {confirmDelete && <div style={{padding:22}}>
          <div style={{fontSize:16, fontWeight:700, marginBottom:8}}>Delete "{confirmDelete.name}"?</div>
          <div style={{fontSize:13, color:"var(--ink-soft)", lineHeight:1.5, marginBottom:18}}>
            {(counts[confirmDelete.id]||0) > 0 ? <>{counts[confirmDelete.id]} post{counts[confirmDelete.id]>1?"s":""} in this campaign will move to <strong>No campaign</strong>. Nothing else is deleted.</> : "No posts use this campaign."}
            {" "}If you might need it again, Archive it instead.
          </div>
          <div style={{display:"flex", justifyContent:"flex-end", gap:8}}>
            <Button variant="ghost" onClick={()=>setConfirmDelete(null)}>Cancel</Button>
            <Button variant="danger" onClick={()=>{ dispatch({type:"DELETE_CAMPAIGN", id:confirmDelete.id}); setConfirmDelete(null); }}>Delete campaign</Button>
          </div>
        </div>}
      </Modal>
    </div>
  );
}

/* ============================== CREATE CONTENT WIZARD ============================== */
function TextField({label, value, onChange, placeholder, textarea, hint}){
  const id = "f_"+label.replace(/\W+/g,"_").toLowerCase();
  return (
    <div style={{marginBottom:14}}>
      <label htmlFor={id} style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>{label}</label>
      {textarea ? (
        <textarea id={id} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} style={{width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:10, fontSize:13, fontFamily:"inherit", resize:"vertical", background:"var(--surface)", color:"var(--ink)"}}/>
      ):(
        <input id={id} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%", borderRadius:10, border:"1px solid var(--border)", padding:"9px 11px", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
      )}
      {hint && <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:4}}>{hint}</div>}
    </div>
  );
}

const WIZARD_STEPS = ["Basic Info","Master Media","Select Platforms","Platform Variations","Schedule & Submit"];

function CreateContentPage(){
  const {state, dispatch} = useApp();
  const user = USERS.find(u=>u.id===state.currentUserId);
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    title:"", campaign: "", brand: BRANDS[0].id, pillar: PILLARS[0], creator: user.id, approver: ANY_APPROVER, priority:"normal", notes:"", music:{title:"", url:""},
    format:"post", mediaType:"video", aspectRatio:"9:16", duration:20, fileName:"", gallery:[], galleryStatus:"",
    platforms:["instagram"], scheduledAt:"", variants:{},
    ...(state.createPrefill || {}),
  });
  function set(patch){ setForm(f=>({...f, ...patch})); }

  // Pull a file from the Drive content library into this post: fill in what the filename tells us,
  // then (when Drive is connected) copy the file into Creator Studio so it previews and plays like an upload.
  async function pickLibrary(file, connected){
    const m = file.meta || {};
    const patch = {
      libraryRef: libraryRefOf(file), fileName: file.name, mediaType: file.kind==="video" ? "video" : "image",
      previewUrl: libThumbUrl(file, connected), previewLoading:false, fileUrl:null, uploadStatus: connected ? "importing" : "linked", uploadError:null,
      gallery:[], galleryStatus:"",
    };
    if(m.category && LIB_PILLAR[m.category]) patch.pillar = LIB_PILLAR[m.category];
    if(m.social && LIB_PLATFORMS[m.social]) patch.platforms = LIB_PLATFORMS[m.social];
    // A finished Workspace video with music mixed in: keep the song (and its caption credit) with the new post.
    const note = String(file.note || ""), credit = /🎵 Music: .+?\((?:CC[^)]*|Public domain)\)/.exec(note), plain = /Music: (.+?) \(mixed in\)/.exec(note);
    if(credit || plain){ const tm = credit && /“(.+?)” by (.+?) \(/.exec(credit[0]); patch.music = {title: tm ? tm[1]+" — "+tm[2] : plain[1], url:"", baked:true, credit: credit ? credit[0] : ""}; }
    setForm(f=>({...f, ...patch, title: f.title || suggestedTitle(file)}));
    if(!connected) return;
    const still = f => f.libraryRef && f.libraryRef.id===file.id;
    try{
      const r = await fetch("/api/library/import", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id:file.id})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't copy the file from Drive ("+r.status+")");
      const isVideo = (d.mime||"").startsWith("video/");
      setForm(f=> still(f) ? {...f, fileUrl:d.url, uploadStatus:"done", mediaType: isVideo? "video":"image", ...(isVideo? {} : {previewUrl:d.url})} : f);
      const info = await readMediaInfo(d.url, isVideo);
      if(info) setForm(f=>{
        if(!still(f)) return f;
        const p = {}; const ar = nearestAspect(info.w, info.h);
        if(ar) p.aspectRatio = ar;
        if(isVideo && isFinite(info.duration) && info.duration>0) p.duration = Math.round(info.duration);
        return {...f, ...p};
      });
    }catch(e){
      setForm(f=> still(f) ? {...f, uploadStatus:"failed", uploadError:e.message} : f);
      dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"});
    }
  }
  // Arrived from the library page ("Create post from this") or a #/create?barcode= link.
  useEffect(()=>{
    const pickId = form.libraryPick, code = form.libraryBarcode;
    if(!pickId && !code) return;
    const fresh = form.wsFresh;
    setForm(f=>({...f, libraryPick:null, libraryBarcode:null, wsFresh:null}));
    // A video just filed from the Workspace may be newer than the cached library list.
    loadLibrary(!!fresh).then(lib=>{
      const file = lib.files.find(x=> pickId ? x.id===pickId : x.barcode===String(code).toUpperCase());
      if(!file){ dispatch({type:"ADD_TOAST", message:"Couldn't find "+(code||"that file")+" in the content library", variant:"warn"}); return; }
      pickLibrary(file, !!lib.status.connected);
      setStep(1);
    }).catch(()=>{});
  }, []);
  function setVariant(p, patch){ setForm(f=>({...f, variants:{...f.variants, [p]:{...(f.variants[p]||{}), ...patch}}})); }
  function togglePlatform(p){ set({platforms: form.platforms.includes(p)? form.platforms.filter(x=>x!==p) : [...form.platforms, p]}); }
  const story = form.format==="story";
  // Multi-photo posts: the first photo plus up to 9 more. Each is re-saved for Instagram (see carouselReadyPhoto).
  const galleryRef = useRef(form.gallery); galleryRef.current = form.gallery;
  async function addPhotos(sources, {includeCurrent=true}={}){
    const list = sources.slice(0, MAX_PHOTOS);
    setForm(f=>({...f, galleryStatus:"Preparing "+list.length+" photo"+(list.length>1?"s":"")+"…"}));
    try{
      let g = includeCurrent ? galleryRef.current : [];
      if(includeCurrent && !g.length && form.fileUrl && form.mediaType==="image") g = [await carouselReadyPhoto(form.fileUrl, form.fileName)];
      for(const src of list){
        if(g.length >= MAX_PHOTOS) break;
        g = [...g, await carouselReadyPhoto(src.url || src, src.name)];
        const now = g; setForm(f=>({...f, gallery: now}));
      }
      const m = galleryMedia(g);
      setForm(f=>({...f, gallery:g, galleryStatus:"", mediaType:"image", fileUrl:m.fileUrl, previewUrl:m.previewUrl, aspectRatio:m.aspectRatio, uploadStatus:"done",
        fileName: g.length>1? g.length+" photos" : f.fileName}));
    }catch(e){
      setForm(f=>({...f, galleryStatus:"", ...(f.uploadStatus==="uploading" && !f.gallery.length? {uploadStatus:"failed", uploadError:e.message} : {})}));
      dispatch({type:"ADD_TOAST", message:e.message || "Couldn't add that photo", variant:"danger"});
    }
  }
  function removePhoto(i){
    const g = form.gallery.filter((_, j)=>j!==i);
    const m = galleryMedia(g);
    set({gallery:g, fileUrl:m.fileUrl, previewUrl:m.previewUrl, aspectRatio:m.aspectRatio, fileName: g.length>1? g.length+" photos" : (g.length? "1 photo" : "")});
  }
  function movePhoto(i){
    if(i<1) return;
    const g = [...form.gallery]; [g[i-1], g[i]] = [g[i], g[i-1]];
    const m = galleryMedia(g);
    set({gallery:g, fileUrl:m.fileUrl, previewUrl:m.previewUrl, aspectRatio:m.aspectRatio});
  }
  async function addLibraryPhoto(file, connected){
    if(!connected){ dispatch({type:"ADD_TOAST", message:"Connect Google Drive in Settings to add library photos", variant:"warn"}); return; }
    if(file.kind==="video"){ dispatch({type:"ADD_TOAST", message:"Multi-photo posts take photos only", variant:"warn"}); return; }
    try{
      const r = await fetch("/api/library/import", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id:file.id})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't copy the photo from Drive");
      await addPhotos([{url:d.url, name:file.name}]);
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
  }
  function setFormat(fmt){
    if(fmt==="story") set({format:"story", aspectRatio:"9:16", platforms: form.platforms.filter(p=>STORY_PLATFORMS.includes(p)).length ? form.platforms.filter(p=>STORY_PLATFORMS.includes(p)) : ["instagram"]});
    else set({format:"post"});
  }

  const warnings = useMemo(()=>{
    const w = [];
    if(form.gallery.length>1){
      if(form.platforms.includes("youtube")) w.push("YouTube can't post photos — untick YouTube for this multi-photo post.");
      if(form.platforms.includes("tiktok")) w.push("TikTok photo posts go up from the TikTok app (Make can't post them), then mark them as published.");
      if(form.platforms.includes("gbp")) w.push(isGbpPhoto(form.variants.gbp) ? (gbpCategory(form.variants.gbp)==="COVER" ? "Google uses only the first photo as the cover." : "All "+form.gallery.length+" photos go into the Google gallery.") : "Google Business shows the first photo only.");
      if(form.gallery.some(x=>x.trimmed)) w.push("Some photos were trimmed to fit Instagram's 4:5–1.91:1 shape — check the preview.");
    }
    if(form.galleryStatus) w.push("Still preparing photos — wait for them to finish before submitting.");
    if(story){
      if(form.aspectRatio!=="9:16") w.push("Stories are full-screen 9:16 — current media is "+form.aspectRatio+", so it will be cropped or letterboxed.");
      if(form.mediaType==="video" && form.duration>60) w.push("Story videos longer than 60s are split into several story frames.");
    }
    if(!story) form.platforms.forEach(p=>{
      const v = form.variants[p]||{};
      if(p==="youtube" && !v.title) w.push("YouTube Shorts is missing a title.");
      if((p==="instagram"||p==="facebook"||(p==="gbp" && !isGbpPhoto(v))) && !v.caption && !v.postDescription) w.push(PLATFORM_META[p].label+" is missing a caption.");
      if(p==="gbp" && isGbpPhoto(v) && form.mediaType==="video" && form.gallery.length<2) w.push("Google gallery photos need a photo — this post is a video.");
      if(p==="tiktok" && !v.caption) w.push("TikTok is missing a caption.");
    });
    if((form.platforms.includes("tiktok")||form.platforms.includes("youtube")) && form.aspectRatio!=="9:16") w.push("TikTok / YouTube Shorts expect a 9:16 aspect ratio — current media is "+form.aspectRatio+".");
    if(!story && form.duration>60 && form.platforms.includes("tiktok")) w.push("Video is over 60s — long-form for TikTok may reduce reach.");
    if(form.platforms.length===0) w.push("Select at least one platform.");
    if(!form.scheduledAt && step===4) w.push("No publishing date/time set — content will be saved as approved-but-unscheduled.");
    if(form.uploadStatus==="uploading") w.push("Still uploading the original file — wait for it to finish before submitting.");
    if(form.uploadStatus==="importing") w.push("Still copying the file from Google Drive — wait for it to finish before submitting.");
    if(form.uploadStatus==="linked") w.push("Linked to library file "+(form.libraryRef&&form.libraryRef.barcode||"")+", but Google Drive isn't connected so the file itself wasn't copied — upload it here, or connect Drive in Settings.");
    if(form.uploadStatus==="failed") w.push((form.uploadError? form.uploadError+" — " : "The file upload failed — ")+"re-upload it, or continue and add it later.");
    const conflict = state.contentItems.some(it=> it.brand===form.brand && it.platforms.some(p=>form.platforms.includes(p)) && Object.values(it.variants).some(v=> v.scheduledAt && form.scheduledAt && Math.abs(new Date(v.scheduledAt)-new Date(form.scheduledAt))<30*60000));
    if(conflict) w.push("Another post from this brand is scheduled within 30 minutes of this time.");
    const byPhone = cleanMusic(form.music) && !form.musicMix ? form.platforms.filter(p=>MUSIC_PLATFORMS.includes(p)) : [];
    if(byPhone.length && !story) w.push("🎵 With a song, "+byPhone.map(p=>PLATFORM_META[p].label).join(" and ")+" won't post automatically — Instagram doesn't let apps add music. Post it from the phone at its time (Download → add the song → Mark as published). If the song is already in your video, clear the Music box.");
    return w;
  }, [form, step, state.contentItems]);

  function buildItem(status){
    const variants = {};
    form.platforms.forEach(p=>{
      const {hashtagsText, ...fv} = form.variants[p] || {};
      const carousel = !story && form.gallery.length>1;
      variants[p] = makeVariant(p, {status: status==="draft"?"draft":"submitted", scheduledAt: fv.overrideTime || form.scheduledAt || null, ...fv, hashtags: story? [] : parseTags(hashtagsText),
        ...(story? {postType:"Story"} : carousel && (p==="instagram"||p==="facebook")? {postType:"Carousel"} : carousel && p==="tiktok"? {postType:"Photos"} : {})});
    });
    // A song mixed into the video that needs a credit: make sure every caption ends with it (platforms added later too).
    const credit = form.music && form.music.baked && form.music.credit;
    if(credit && !story) form.platforms.forEach(p=>{
      if(p==="gbp") return; const key = p==="youtube" ? "description" : "caption"; const v = variants[p];
      if(v && !String(v[key]||"").includes(credit)) variants[p] = {...v, [key]: (String(v[key]||"").replace(/\n+$/, "") ? String(v[key]).replace(/\n+$/, "")+"\n\n" : "")+credit};
    });
    return {
      id: uid("ct"), title: form.title||"Untitled content", brand: form.brand, campaign: form.campaign, pillar: form.pillar,
      creator: form.creator, approver: form.approver, priority: form.priority, notes: form.notes, music: cleanMusic(form.music), status,
      createdAt: new Date().toISOString(), platforms: form.platforms, currentVersion: 1, format: story? "story" : "post",
      media: (!story && form.gallery.length>1) ? galleryMedia(form.gallery)
        : {type:form.mediaType, duration: form.mediaType==="video"?Number(form.duration):null, aspectRatio: form.aspectRatio, previewUrl: form.previewUrl || null, fileUrl: form.fileUrl || null},
      due: form.scheduledAt || new Date().toISOString(),
      versions:[{version:1, editor:USERS.find(u=>u.id===form.creator).name, date:new Date().toISOString(), changes: status==="draft"?"Initial draft created.":"Initial draft created and submitted for approval.", decision:"—", feedback:null}],
      variants, gradient: grad(form.title||"x"+Math.random()), libraryRef: form.libraryRef || null,
    };
  }

  // Live preview of the post as it stands (re-built as the form changes; the id stays put so the player doesn't restart).
  const [previewPlatform, setPreviewPlatform] = useState(null);
  useEffect(()=>{ if(!form.platforms.includes(previewPlatform)) setPreviewPlatform(form.platforms[0] || null); }, [form.platforms.join(",")]);
  const previewItem = useMemo(()=>{
    if(!form.previewUrl && !form.fileUrl && !form.gallery.length) return null;
    try{ return {...buildItem("draft"), id:"preview", gradient: grad(form.title||"preview")}; }catch(e){ return null; }
  }, [form]);

  const narrowScreen = useIsNarrow(900);
  const [previewOpen, setPreviewOpen] = useState(false);
  // Starts muted (browsers block autoplay with sound); one tap turns the sound on.
  const [previewMuted, setPreviewMuted] = useState(true);
  const previewHasVideo = form.mediaType==="video" && !!form.fileUrl;
  const renderPreview = h => (<>
            {form.platforms.length>1 && <div className="cf-noscrollbar" style={{display:"flex", gap:5, overflowX:"auto", marginBottom:10}}>
              {form.platforms.map(p=>(
                <button key={p} onClick={()=>setPreviewPlatform(p)} style={{display:"flex", alignItems:"center", gap:5, padding:"4px 9px 4px 4px", borderRadius:99, border:"1px solid "+(previewPlatform===p? PLATFORM_HEX[p] : "var(--border)"), background: previewPlatform===p? PLATFORM_HEX[p]+"14" : "var(--surface)", fontSize:11.5, fontWeight:600, cursor:"pointer", color:"var(--ink)", flexShrink:0}}>
                  <PlatformIcon platform={p} size={10}/>{PLATFORM_META[p].label}
                </button>
              ))}
            </div>}
            <div style={{height:h, marginBottom:12}}>
              <PhonePreview platform={previewPlatform} item={previewItem} variant={previewItem.variants[previewPlatform]} brand={BRANDS.find(b=>b.id===form.brand)} playing={true} muted={previewMuted} onAutoMuted={()=>setPreviewMuted(true)}/>
            </div>
            {previewHasVideo && <div style={{display:"flex", justifyContent:"center", marginTop:-4, marginBottom:12}}>
              <button onClick={()=>setPreviewMuted(m=>!m)} title={previewMuted?"Turn sound on":"Mute"}
                style={{display:"flex", alignItems:"center", gap:6, padding:"7px 14px", borderRadius:99, border:"1px solid "+(previewMuted?"var(--border)":"var(--accent)"), background: previewMuted?"var(--surface)":"var(--accent-soft)", color: previewMuted?"var(--ink-soft)":"var(--accent)", fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
                <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>{previewMuted ? <path d="m16 9.5 5 5M21 9.5l-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/> : <path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/>}</svg>
                {previewMuted? "Sound off · tap for sound" : "Sound on"}
              </button>
            </div>}
  </>);

  function submit(status){
    const item = buildItem(status);
    dispatch({type:"CREATE_CONTENT", item});
    dispatch({type:"ADD_TOAST", message: status==="draft"? "Saved as draft" : "Submitted for approval"});
    dispatch({type:"SET_ROUTE", route: status==="draft"?"calendar":"queue"});
  }

  return (
    <div>
      <PageHeader title="Create Content" subtitle="Build one creative concept and tailor it per platform."/>
      {/* Phones get a one-line "Step 2 of 5 · Master Media" with a progress bar instead of five labels. */}
      <div className="cf-wiz-mini" style={{display:"none", marginBottom:16}}>
        <div style={{display:"flex", alignItems:"center", gap:8, fontSize:13, fontWeight:700, marginBottom:8}}>
          <span style={{color:"var(--accent)"}}>Step {step+1} of {WIZARD_STEPS.length}</span><span style={{color:"var(--ink-soft)"}}>· {WIZARD_STEPS[step]}</span>
        </div>
        <div style={{display:"flex", gap:4}}>{WIZARD_STEPS.map((x,i)=><span key={x} onClick={()=>i<=step && setStep(i)} style={{flex:1, height:4, borderRadius:99, background: i<step? "var(--green)" : i===step? "var(--accent)" : "var(--surface-2)", cursor: i<=step? "pointer":"default"}}/>)}</div>
      </div>
      <style>{`@media (max-width:600px){ .cf-wiz-mini{display:block !important;} .cf-wiz-steps{display:none !important;} }`}</style>
      <div className="cf-wiz-steps" style={{display:"flex", gap:0, marginBottom:22, overflowX:"auto"}}>
        {WIZARD_STEPS.map((s,i)=>(
          <div key={s} style={{display:"flex", alignItems:"center", flex:1, minWidth:120}}>
            <div onClick={()=>i<=step && setStep(i)} style={{display:"flex", alignItems:"center", gap:8, cursor:i<=step?"pointer":"default"}}>
              <div style={{width:26,height:26,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700, flexShrink:0, background: i<step?"var(--green)": i===step?"var(--accent)":"var(--surface-2)", color: i<=step?"#fff":"var(--ink-mute)"}}>{i<step? <Icon name="check" size={13}/> : i+1}</div>
              <span style={{fontSize:12.5, fontWeight:700, color:i===step?"var(--ink)":"var(--ink-mute)", whiteSpace:"nowrap"}}>{s}</span>
            </div>
            {i<WIZARD_STEPS.length-1 && <div style={{flex:1, height:2, background:"var(--border)", margin:"0 8px"}}/>}
          </div>
        ))}
      </div>

      <div className="cf-wiz-grid" style={{display:"grid", gridTemplateColumns:"1fr 280px", gap:18, alignItems:"start"}}>
        <Card style={{padding:22}}>
          {step===0 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:8}}>Content style</label>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16}}>
                {[["post","Post / Reel","Feed post, reel, Short or Google update — Make can publish it"],["story","Story","Full-screen 9:16 for Instagram, Facebook and TikTok — disappears after 24 hours"]].map(([k,l,d])=>(
                  <button key={k} type="button" onClick={()=>setFormat(k)} style={{textAlign:"left", padding:"11px 13px", borderRadius:11, cursor:"pointer", fontFamily:"inherit", color:"var(--ink)",
                    border:"1.5px solid "+(form.format===k?"var(--accent)":"var(--border)"), background: form.format===k?"var(--accent-soft)":"var(--surface)"}}>
                    <div style={{display:"flex", alignItems:"center", gap:8, fontWeight:700, fontSize:13.5}}>
                      {k==="story" ? <span style={{width:18, height:18, borderRadius:99, border:"2px solid #d62976", display:"inline-block", flexShrink:0}}/> : <Icon name="grid" size={16}/>}{l}
                    </div>
                    <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:4, lineHeight:1.4}}>{d}</div>
                  </button>
                ))}
              </div>
              <TextField label="Content title" value={form.title} onChange={v=>set({title:v})} placeholder="e.g. Autumn Roast — Hero Reel"/>
              <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                {BRANDS.length>1 && <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Brand</label>
                  <Select value={form.brand} onChange={v=>set({brand:v})} options={BRANDS.map(b=>({value:b.id,label:b.name}))}/>
                </div>}
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Campaign <span style={{fontWeight:500, color:"var(--ink-mute)"}}>(optional)</span></label>
                  <CampaignPicker value={form.campaign} brand={form.brand} onChange={v=>set({campaign:v})}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Content pillar</label>
                  <Select value={form.pillar} onChange={v=>set({pillar:v})} options={PILLARS.map(p=>({value:p,label:p}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Priority</label>
                  <Select value={form.priority} onChange={v=>set({priority:v})} options={Object.entries(PRIORITY_META).map(([k,v])=>({value:k,label:v.label}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Assigned creator</label>
                  <Select value={form.creator} onChange={v=>set({creator:v})} options={activeUsers().map(u=>({value:u.id,label:u.name}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Assigned approver</label>
                  <Select value={form.approver} onChange={v=>set({approver:v})} options={approverOptions()}/>
                </div>
              </div>
              <TextField label="Note for the approvers" value={form.notes} onChange={v=>set({notes:v})} placeholder="Anything the approver should know… (shown at the top of the approval card)" textarea/>
            </div>
          )}
          {step===1 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:8}}>From the content library</label>
              <div style={{marginBottom:6}}><LibraryPicker onPick={pickLibrary}/></div>
              <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:16}}>Type the barcode from the Drive library — the file, dish, category and platform fill in for you. Or <a href="#" onClick={e=>{e.preventDefault(); dispatch({type:"SET_ROUTE", route:"library"});}} style={{color:"var(--accent)"}}>browse the library</a>.</div>
              <div style={{display:"flex", alignItems:"center", gap:10, fontSize:11.5, color:"var(--ink-mute)", fontWeight:600, marginBottom:12}}><span style={{flex:1, height:1, background:"var(--border)"}}/>OR UPLOAD A FILE<span style={{flex:1, height:1, background:"var(--border)"}}/></div>
              <label htmlFor="cf-upload" style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8, border:"2px dashed var(--border)", borderRadius:14, padding:"32px 16px", cursor:"pointer", background:"var(--surface-2)", marginBottom:16}}>
                <Icon name="upload" size={26} style={{color:"var(--ink-mute)"}}/>
                <div style={{fontSize:13, fontWeight:700}}>Drag & drop, or click to upload</div>
                <div style={{fontSize:11.5, color:"var(--ink-mute)"}}>MP4, MOV, JPG or PNG up to 100MB — bigger videos: use the content library{story? "" : ". Pick several photos at once for a multi-photo post (up to 10)."}</div>
                <input id="cf-upload" type="file" accept="image/*,video/*" multiple={!story} style={{display:"none"}} onChange={e=>{
                  const picked = [...e.target.files]; e.target.value = "";
                  const photos = picked.filter(x=>x.type.startsWith("image/"));
                  if(photos.length>1){
                    // Several photos at once → a multi-photo post.
                    set({fileName: photos.length+" photos", mediaType:"image", gallery:[], fileUrl:null, previewUrl:null, uploadStatus:"uploading", libraryRef:null, previewLoading:false});
                    addPhotos(photos, {includeCurrent:false});
                    return;
                  }
                  const f=picked[0]; if(!f) return;
                  const isVideo = f.type.startsWith("video/");
                  set({fileName:f.name, mediaType: isVideo?"video":"image", previewLoading:true, uploadStatus:"uploading", fileUrl:null, gallery:[], galleryStatus:""});
                  // Small poster/thumbnail for instant feedback in the UI...
                  const task = isVideo ? videoFileToPoster(f, 480, 0.72) : imageFileToPreview(f, 480, 0.78);
                  task.then(dataUrl=>{ set({previewUrl:dataUrl, previewLoading:false}); })
                       .catch(()=>{ set({previewLoading:false}); });
                  readMediaInfo(f, isVideo).then(info=>{
                    if(!info) return;
                    const patch = {};
                    const ar = nearestAspect(info.w, info.h);
                    if(ar) patch.aspectRatio = ar;
                    if(isVideo && isFinite(info.duration) && info.duration>0) patch.duration = Math.round(info.duration);
                    if(Object.keys(patch).length) set(patch);
                  });
                  // ...and the actual file, uploaded for real so it can be rewatched/reopened later by anyone.
                  uploadMediaFile(f).then(({url})=>{
                    set({fileUrl:url, uploadStatus:"done"});
                  }).catch(()=>{
                    set({uploadStatus:"failed"});
                    dispatch({type:"ADD_TOAST", message:"Upload failed — check your connection and try again.", variant:"danger"});
                  });
                }}/>
              </label>
              {form.fileName && (
                <div style={{display:"flex", gap:12, alignItems:"center", padding:12, borderRadius:12, background:"var(--surface-2)", marginBottom:16}}>
                  <div style={{width:52,height:52,borderRadius:10,overflow:"hidden",flexShrink:0, position:"relative"}}>
                    <Thumb item={{gradient:grad(form.fileName), media:{type:form.mediaType, duration:form.duration, previewUrl:form.previewUrl}}} radius={10} iconSize={18}/>
                    {form.previewLoading && <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,.25)"}}><Icon name="clock" size={16} style={{color:"#fff"}}/></div>}
                  </div>
                  <div style={{flex:1, overflow:"hidden"}}>
                    <div style={{fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{form.fileName}</div>
                    <div style={{fontSize:11, fontWeight:600, marginTop:2, color: form.uploadStatus==="failed"?"var(--red)": form.uploadStatus==="done"?"var(--green)": form.uploadStatus==="linked"?"var(--amber)":"var(--ink-mute)"}}>
                      {form.uploadStatus==="uploading"?"Uploading original file…": form.uploadStatus==="importing"?"Copying from Google Drive…": form.uploadStatus==="linked"?"Linked to the library — file not copied (Drive not connected)": form.uploadStatus==="done"?(form.libraryRef? "Copied from Google Drive — ready to preview":"Uploaded — will be rewatchable by the whole team"): form.uploadStatus==="failed"?(form.uploadError||"Upload failed"): ""}
                    </div>
                    {form.libraryRef && (()=>{ const prior = libraryUsageMap(state.contentItems)[form.libraryRef.id]; return prior && prior.length ? (
                      <div style={{marginTop:6, padding:"7px 9px", borderRadius:7, background:"var(--amber-soft)", fontSize:11.5, lineHeight:1.5, color:"var(--ink)", whiteSpace:"normal"}}>
                        <strong>{form.libraryRef.barcode||"This file"} was already used</strong> in {prior.length} post{prior.length>1?"s":""}:
                        {prior.slice(0,3).map(it=><div key={it.id}>• "{it.title}" — {Object.values(it.variants||{}).map(variantUseLine).join("; ")}</div>)}
                      </div>) : null; })()}
                    {form.libraryRef && <div style={{display:"flex", alignItems:"center", gap:6, marginTop:5, fontSize:11.5}}>
                      <BarcodeChip code={form.libraryRef.barcode}/><span style={{color:"var(--ink-mute)"}}>{form.libraryRef.branch}</span>
                      <a href={driveFileUrl(form.libraryRef.id)} target="_blank" rel="noopener noreferrer" style={{color:"var(--accent)", fontWeight:600}}>Drive</a>
                      <button onClick={()=>set({libraryRef:null, ...(form.uploadStatus==="linked"? {uploadStatus:null, fileName:""} : {})})} style={{border:"none", background:"none", color:"var(--ink-mute)", cursor:"pointer", fontSize:11.5, textDecoration:"underline"}}>unlink</button>
                    </div>}
                  </div>
                </div>
              )}
              {!story && form.mediaType==="image" && (form.fileUrl || form.gallery.length>0 || form.galleryStatus) && (
                <div style={{border:"1px solid var(--border)", borderRadius:12, padding:12, marginBottom:16}}>
                  <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10, flexWrap:"wrap"}}>
                    <span style={{fontSize:12.5, fontWeight:700}}>Photos in this post</span>
                    <span style={{fontSize:11.5, color:"var(--ink-mute)"}}>{form.gallery.length>1? form.gallery.length+" of "+MAX_PHOTOS+" · shown in this order" : "Add more to make a multi-photo (carousel) post"}</span>
                    {form.galleryStatus && <span style={{fontSize:11.5, fontWeight:600, color:"var(--accent)"}}>{form.galleryStatus}</span>}
                  </div>
                  <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center"}}>
                    {(form.gallery.length? form.gallery : [{previewUrl:form.previewUrl, fileUrl:form.fileUrl}]).map((ph, i)=>(
                      <div key={(ph.fileUrl||"")+i} style={{position:"relative", width:64, height:64, borderRadius:8, overflow:"hidden", background:"#000", flexShrink:0}}>
                        {(ph.previewUrl||ph.fileUrl) && <img src={ph.previewUrl||ph.fileUrl} alt="" style={{width:"100%", height:"100%", objectFit:"cover"}}/>}
                        <span style={{position:"absolute", left:3, top:3, background:"rgba(0,0,0,.65)", color:"#fff", borderRadius:4, fontSize:10, fontWeight:700, padding:"0 4px"}}>{i+1}</span>
                        {form.gallery.length>1 && <button title="Remove" onClick={()=>removePhoto(i)} style={{position:"absolute", right:2, top:2, width:18, height:18, borderRadius:99, border:"none", background:"rgba(0,0,0,.65)", color:"#fff", fontSize:11, lineHeight:"18px", padding:0, cursor:"pointer"}}>✕</button>}
                        {form.gallery.length>1 && i>0 && <button title="Move earlier" onClick={()=>movePhoto(i)} style={{position:"absolute", left:2, bottom:2, width:18, height:18, borderRadius:99, border:"none", background:"rgba(0,0,0,.65)", color:"#fff", fontSize:11, lineHeight:"18px", padding:0, cursor:"pointer"}}>‹</button>}
                      </div>
                    ))}
                    {(form.gallery.length || 1) < MAX_PHOTOS && !form.galleryStatus && form.uploadStatus!=="uploading" && form.uploadStatus!=="importing" && (
                      <label style={{width:64, height:64, borderRadius:8, border:"2px dashed var(--border)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2, cursor:"pointer", fontSize:10.5, fontWeight:600, color:"var(--ink-mute)", flexShrink:0}}>
                        <Icon name="plus" size={16}/>Add photo
                        <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length) addPhotos(fs); }}/>
                      </label>
                    )}
                  </div>
                  {(form.gallery.length || 1) < MAX_PHOTOS && !form.galleryStatus && <div style={{marginTop:10}}><LibraryPicker onPick={addLibraryPhoto}/></div>}
                </div>
              )}
              <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Media type</label>
                  <Select value={form.mediaType} onChange={v=>set({mediaType:v})} options={[{value:"video",label:"Video"},{value:"image",label:"Image"}]}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Aspect ratio</label>
                  <Select value={form.aspectRatio} onChange={v=>set({aspectRatio:v})} options={["9:16","1:1","4:5","16:9"].map(a=>({value:a,label:a}))}/>
                </div>
                {form.mediaType==="video" && <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Duration (sec)</label>
                  <input type="number" value={form.duration} onChange={e=>set({duration:e.target.value})} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>}
              </div>
            </div>
          )}
          {step===2 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:10}}>Select platforms</label>
              {story && <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:10}}>Stories can go on Instagram, Facebook and TikTok.</div>}
              <div style={{display:"flex", flexDirection:"column", gap:8}}>
                {Object.entries(PLATFORM_META).filter(([k])=>!story || STORY_PLATFORMS.includes(k)).map(([k,v])=>(
                  <label key={k} style={{display:"flex", alignItems:"center", gap:10, padding:"11px 13px", borderRadius:11, border:"1px solid "+(form.platforms.includes(k)?"var(--accent)":"var(--border)"), background: form.platforms.includes(k)?"var(--accent-soft)":"var(--surface)", cursor:"pointer"}}>
                    <input type="checkbox" checked={form.platforms.includes(k)} onChange={()=>togglePlatform(k)} style={{width:16,height:16}}/>
                    <PlatformIcon platform={k}/>
                    <span style={{fontWeight:700, fontSize:13.5}}>{v.label}</span>
                  </label>
                ))}
              </div>
            </div>
          )}
          {step===3 && (
            <div style={{display:"flex", flexDirection:"column", gap:16}}>
              {form.platforms.length===0 && <EmptyState icon="grid" title="No platforms selected" subtitle="Go back and select at least one platform to continue."/>}
              {form.mediaType==="video" && form.gallery.length<=1 && <Card style={{padding:16}}>
                <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10}}><span style={{color:"var(--violet)", display:"inline-flex"}}><Icon name="musicNote" size={16}/></span><span style={{fontWeight:700, fontSize:14}}>Add music to the video</span></div>
                <VideoMusicEditor form={form} setForm={setForm}/>
              </Card>}
              {!form.musicMix && form.platforms.some(p=>MUSIC_PLATFORMS.includes(p)) && <Card style={{padding:16}}>
                <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:10}}><span style={{color:"var(--violet)", display:"inline-flex"}}><Icon name="musicNote" size={16}/></span><span style={{fontWeight:700, fontSize:14}}>Or: a song from Instagram's own library (optional)</span></div>
                <MusicFields value={form.music} onChange={m=>set({music:m})}/>
              </Card>}
              {form.platforms.map(p=>{
                const v = form.variants[p]||{};
                return (
                  <Card key={p} style={{padding:16}}>
                    <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:12}}><PlatformIcon platform={p}/><span style={{fontWeight:700, fontSize:14}}>{PLATFORM_META[p].label}{story? " Story" : ""}</span></div>
                    {story && <>
                      {p!=="tiktok" && <TextField label="Link sticker (optional)" value={v.url||""} onChange={val=>setVariant(p,{url:val})} placeholder="https://sanjugo.co.uk/…" hint="Shown on the story as a tappable link."/>}
                      <TextField label="Posting notes (optional)" value={v.storyNotes||""} onChange={val=>setVariant(p,{storyNotes:val})} textarea placeholder="Stickers, @mentions, music, poll question…" hint="Stories have no caption — note anything to add when posting it from the app."/>
                    </>}
                    {!story && (p==="instagram"||p==="facebook") && <>
                      <TextField label="Caption" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="Write a caption…"/>
                      <TextField label="Hashtags" value={v.hashtagsText||""} onChange={val=>setVariant(p,{hashtagsText:val})} placeholder="#brand #campaign"/>
                      <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <TextField label="Location tag" value={v.location||""} onChange={val=>setVariant(p,{location:val})} placeholder="Optional"/>
                        <TextField label="First comment" value={v.firstComment||""} onChange={val=>setVariant(p,{firstComment:val})} placeholder="Optional"/>
                      </div>
                    </>}
                    {!story && p==="tiktok" && <>
                      <TextField label="Caption" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="Write a caption…"/>
                      <TextField label="Hashtags" value={v.hashtagsText||""} onChange={val=>setVariant(p,{hashtagsText:val})} placeholder="#brand #campaign"/>
                      <div style={{display:"flex", gap:16, flexWrap:"wrap", marginBottom:6}}>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.commentsEnabled} onChange={e=>setVariant(p,{commentsEnabled:e.target.checked})}/>Comments enabled</label>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.duetEnabled} onChange={e=>setVariant(p,{duetEnabled:e.target.checked})}/>Duet enabled</label>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.stitchEnabled} onChange={e=>setVariant(p,{stitchEnabled:e.target.checked})}/>Stitch enabled</label>
                      </div>
                    </>}
                    {p==="youtube" && <>
                      <TextField label="Title" value={v.title||""} onChange={val=>setVariant(p,{title:val})} placeholder="Video title"/>
                      <TextField label="Description" value={v.description||""} onChange={val=>setVariant(p,{description:val})} textarea placeholder="Video description"/>
                      <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <div><label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>Visibility</label><Select value={v.visibility||"Public"} onChange={val=>setVariant(p,{visibility:val})} options={["Public","Unlisted","Private"].map(x=>({value:x,label:x}))}/></div>
                        <TextField label="Playlist" value={v.playlist||""} onChange={val=>setVariant(p,{playlist:val})} placeholder="Optional"/>
                      </div>
                    </>}
                    {p==="gbp" && <>
                      <div style={{marginBottom:14}}>
                        <label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>Google listing</label>
                        <Select value={gbpListing(v)} onChange={val=>setVariant(p,{listing:val})} options={GBP_LISTINGS}/>
                        <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:4}}>Which branch's Google Business listing gets this.</div>
                      </div>
                      <div style={{marginBottom:14}}>
                        <label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>What to post</label>
                        <Select value={isGbpPhoto(v)? "photo" : "update"} onChange={val=>setVariant(p,{gbpType:val, ...(val==="photo"? {category:gbpCategory(v)} : {})})} options={GBP_TYPES}/>
                        <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:4}}>{isGbpPhoto(v) ? "Adds the photo(s) to the listing's Photos." : "Shows under Updates on the listing, with a button."}</div>
                      </div>
                      {isGbpPhoto(v) ? <>
                        <div style={{marginBottom:14}}>
                          <label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>Photo category</label>
                          <Select value={gbpCategory(v)} onChange={val=>setVariant(p,{category:val})} options={GBP_PHOTO_CATEGORIES}/>
                          <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:4}}>{gbpCategory(v)==="COVER" ? "Replaces the main photo people see first on the listing." : "Every photo in this post is added to the listing's Photos (max 5MB each)."}</div>
                        </div>
                        <TextField label="Photo description (optional)" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} placeholder="e.g. Salmon don with ikura"/>
                      </> : <>
                        <TextField label="Post description" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="What's the update?"/>
                        <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                          <div><label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>CTA type</label><Select value={v.cta||"Learn More"} onChange={val=>setVariant(p,{cta:val})} options={["Learn More","Order Online","Book","Call Now"].map(x=>({value:x,label:x}))}/></div>
                          <TextField label="CTA URL" value={v.url||""} onChange={val=>setVariant(p,{url:val})} placeholder="https://…"/>
                        </div>
                      </>}
                    </>}
                  </Card>
                );
              })}
            </div>
          )}
          {step===4 && (
            <div>
              <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:6}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Publishing date</label>
                  <input type="date" value={form.scheduledAt? form.scheduledAt.slice(0,10) : ""} onChange={e=>{ const t=form.scheduledAt? form.scheduledAt.slice(11,16):"09:00"; set({scheduledAt: e.target.value+"T"+t+":00"}); }} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Publishing time</label>
                  <input type="time" value={form.scheduledAt? form.scheduledAt.slice(11,16) : ""} onChange={e=>{ const d=form.scheduledAt? form.scheduledAt.slice(0,10) : new Date().toISOString().slice(0,10); set({scheduledAt: d+"T"+e.target.value+":00"}); }} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>
              </div>
              <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:16}}>Applies to all selected platforms unless overridden below.</div>
              {form.platforms.map(p=>(
