function StorageSettings(){
  const {dispatch} = useApp();
  const [rep, setRep] = useState(null);
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState(false);
  const load = ()=> fetch("/api/storage", {cache:"no-store"}).then(async r=>{ const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"Storage report unavailable"); return d; }).then(setRep).catch(e=>setRep({error:e.message}));
  useEffect(()=>{ load(); }, []);
  async function clean(){
    setBusy(true);
    try{
      const r = await fetch("/api/storage/cleanup", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Clean-up failed");
      dispatch({type:"ADD_TOAST", message: d.freedBytes ? "Freed "+fmtBytes(d.freedBytes)+" — "+d.archived+" archived to Drive, "+d.deleted+" removed" : "Nothing to clean up right now", variant: d.errors && d.errors.length ? "warn" : "ok"});
      load();
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  if(!rep) return <Skeleton h={90}/>;
  if(rep.error) return <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>{rep.error} — storage details are available on the live site.</div>;
  const pct = Math.min(100, rep.totalBytes/rep.limitBytes*100);
  const cats = [["uploads","Post uploads","var(--accent)"],["library","Library files in posts","var(--blue)"],["thumbnails","Thumbnails","var(--violet)"],["system","System","var(--ink-mute)"]];
  const row = (a)=>(
    <div key={a.key} style={{display:"flex", alignItems:"center", gap:10, padding:"7px 0", borderTop:"1px solid var(--border)", fontSize:12.5}}>
      <span style={{flex:1, minWidth:0, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{(a.titles && a.titles[0]) || a.key}</span>
      <span style={{color:"var(--ink-mute)", whiteSpace:"nowrap"}}>{a.action==="archive"? "→ Drive archive" : a.category==="library"? "→ Drive library" : "delete (unused)"}</span>
      {a.dueAt && a.ready===false && <span style={{color:"var(--ink-mute)", whiteSpace:"nowrap"}}>{fmtDate(a.dueAt,{day:"numeric",month:"short"})}</span>}
      <span className="num" style={{width:64, textAlign:"right"}}>{fmtBytes(a.size)}</span>
    </div>
  );
  return (
    <div>
      <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:10, flexWrap:"wrap", marginBottom:8}}>
        <div><span className="num" style={{fontSize:22, fontWeight:600}}>{fmtBytes(rep.totalBytes)}</span> <span style={{color:"var(--ink-mute)", fontSize:13}}>of {fmtBytes(rep.limitBytes)} used · {rep.objectCount} files</span></div>
        <span style={{fontSize:12.5, color: pct>80? "var(--red)" : pct>50? "var(--amber)" : "var(--green)", fontWeight:600}}>{(100-pct).toFixed(1)}% free</span>
      </div>
      <div style={{display:"flex", height:10, borderRadius:6, overflow:"hidden", background:"var(--surface-2)", marginBottom:10}}>
        {cats.map(([k,,c])=> rep.byCategory[k].bytes>0 && <div key={k} title={k} style={{width:Math.max(0.6, rep.byCategory[k].bytes/rep.limitBytes*100)+"%", background:c}}/>)}
      </div>
      <div style={{display:"flex", gap:16, flexWrap:"wrap", fontSize:12, color:"var(--ink-soft)", marginBottom:14}}>
        {cats.map(([k,l,c])=><span key={k} style={{display:"flex", alignItems:"center", gap:6}}><span style={{width:8, height:8, borderRadius:2, background:c}}/>{l}: <strong className="num">{fmtBytes(rep.byCategory[k].bytes)}</strong> ({rep.byCategory[k].count})</span>)}
      </div>
      <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.6, background:"var(--surface-2)", borderRadius:8, padding:"10px 12px", marginBottom:12}}>
        <strong>How storage is kept free:</strong> a post's video/photo stays here while it's being reviewed, scheduled or if it's rejected. <strong>{rep.policy.publishedGraceDays} days after it's published</strong> on every platform, it leaves Creator Studio storage — library files point back to the Drive library, and uploads are moved to the <strong>Creator Studio Archive</strong> folder in Drive. Uploads never used in a post are removed after {rep.policy.orphanGraceHours} hours. Links keep working either way. This runs automatically every night.
      </div>
      <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", fontSize:12.5, marginBottom:6}}>
        <span><strong className="num">{rep.readyNow.count}</strong> file{rep.readyNow.count===1?"":"s"} ready to clear now ({fmtBytes(rep.readyNow.bytes)})</span>
        <span style={{color:"var(--ink-mute)"}}>· {rep.upcoming.count} waiting out the {rep.policy.publishedGraceDays}-day window ({fmtBytes(rep.upcoming.bytes)})</span>
        <span style={{color:"var(--ink-mute)"}}>· {rep.archivedToDrive.count} archived to Drive so far</span>
      </div>
      {!rep.canArchive && rep.readyNow.items.concat(rep.upcoming.items).some(a=>a.action==="archive") && <div style={{fontSize:12, color:"var(--amber)", fontWeight:600, marginBottom:8}}>Reconnect Google Drive (above) so uploads can be moved to the Drive archive.</div>}
      <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center"}}>
        <Button variant="primary" icon="refresh" onClick={clean} disabled={busy || rep.readyNow.count===0}>{busy? "Cleaning up…" : "Clean up now"}</Button>
        {(rep.readyNow.count+rep.upcoming.count)>0 && <Button variant="ghost" size="sm" onClick={()=>setOpen(v=>!v)}>{open? "Hide details" : "Show what will be cleared"}</Button>}
        {rep.lastCleanup && <span style={{fontSize:12, color:"var(--ink-mute)"}}>Last run {fmtDateTime(rep.lastCleanup.at)} ({rep.lastCleanup.trigger}) · freed {fmtBytes(rep.lastCleanup.freedBytes)}{rep.lastCleanup.errors && rep.lastCleanup.errors.length? " · "+rep.lastCleanup.errors.length+" error(s)" : ""}</span>}
      </div>
      {open && <div style={{marginTop:12}}>
        {rep.readyNow.items.length>0 && <><div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", margin:"6px 0"}}>Ready now</div>{rep.readyNow.items.map(row)}</>}
        {rep.upcoming.items.length>0 && <><div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", margin:"12px 0 6px"}}>Coming up (date it clears)</div>{rep.upcoming.items.map(row)}</>}
      </div>}
    </div>
  );
}

/* Two-step button: first tap arms it ("Confirm remove?"), second tap does it; resets after a few seconds.
   Used instead of window.confirm(), which some browsers and iPhone home-screen apps silently block. */
function ConfirmButton({children, confirmLabel, onConfirm, disabled, size="sm", style}){
  const [armed, setArmed] = useState(false);
  useEffect(()=>{ if(!armed) return; const t = setTimeout(()=>setArmed(false), 4000); return ()=>clearTimeout(t); }, [armed]);
  return armed
    ? <Button variant="danger" size={size} disabled={disabled} onClick={()=>{ setArmed(false); onConfirm(); }} style={style}>{confirmLabel || "Confirm"}</Button>
    : <Button variant="ghost" size={size} disabled={disabled} onClick={()=>setArmed(true)} style={{color:"var(--red)", ...style}}>{children}</Button>;
}

/* Dropdown with "No campaign" plus a quick "+ New" so creators never have to leave the form. */
function CampaignPicker({value, brand, onChange}){
  const {state, dispatch} = useApp();
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const options = [{value:"", label:"No campaign"}, ...state.campaigns.filter(c=>c.brand===brand && (!c.archived || c.id===value)).map(c=>({value:c.id, label:c.name}))];
  function add(){
    const n = name.trim(); if(!n) return;
    const c = {id:uid("c"), brand, name:n, archived:false, createdAt:new Date().toISOString()};
    dispatch({type:"ADD_CAMPAIGN", campaign:c});
    onChange(c.id); setName(""); setAdding(false);
  }
  if(adding){
    return (
      <div style={{display:"flex", gap:6}}>
        <input autoFocus value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") add(); if(e.key==="Escape") setAdding(false); }} placeholder="New campaign name"
          style={{flex:1, minWidth:0, padding:"8px 10px", borderRadius:9, border:"1px solid var(--accent)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        <Button variant="primary" size="sm" onClick={add} disabled={!name.trim()}>Add</Button>
        <IconButton icon="x" title="Cancel" onClick={()=>setAdding(false)}/>
      </div>
    );
  }
  return (
    <div style={{display:"flex", gap:6}}>
      <Select value={value} onChange={onChange} options={options} style={{flex:1, minWidth:0}}/>
      <Button variant="ghost" size="sm" icon="plus" onClick={()=>setAdding(true)} style={{flexShrink:0}}>New</Button>
    </div>
  );
}

const WIZARD_STEPS = ["Basic Info","Master Media","Select Platforms","Platform Variations","Schedule & Submit"];

function CreateContentPage(){
  const {state, dispatch} = useApp();
  const user = USERS.find(u=>u.id===state.currentUserId);
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    title:"", campaign: "", brand: BRANDS[0].id, pillar: PILLARS[0], creator: user.id, approver: reviewers().length>1 ? ANY_APPROVER : ((reviewers()[0]||USERS[0]).id), priority:"normal", notes:"",
    mediaType:"video", aspectRatio:"9:16", duration:20, fileName:"",
    platforms:["instagram"], scheduledAt:"", variants:{},
    ...(state.createPrefill || {}),
  });
  function set(patch){ setForm(f=>({...f, ...patch})); }

  // Pull a file from the Drive content library into this post: fill in what the filename tells us,
  // then (when Drive is connected) copy the file into Creator Studio so it previews and plays like an upload.
  async function pickLibrary(file, connected){
    const m = file.meta || {};
    const patch = {
      libraryRef: libraryRefOf(file), fileName: file.name, mediaType: file.kind==="video" ? "video" : "image",
      previewUrl: libThumbUrl(file, connected), previewLoading:false, fileUrl:null, uploadStatus: connected ? "importing" : "linked", uploadError:null,
    };
    if(m.category && LIB_PILLAR[m.category]) patch.pillar = LIB_PILLAR[m.category];
    if(m.social && LIB_PLATFORMS[m.social]) patch.platforms = LIB_PLATFORMS[m.social];
    setForm(f=>({...f, ...patch, title: f.title || suggestedTitle(file)}));
    if(!connected) return;
    const still = f => f.libraryRef && f.libraryRef.id===file.id;
    try{
      const r = await fetch("/api/library/import", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id:file.id})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't copy the file from Drive ("+r.status+")");
      const isVideo = (d.mime||"").startsWith("video/");
      setForm(f=> still(f) ? {...f, fileUrl:d.url, uploadStatus:"done", mediaType: isVideo? "video":"image", ...(isVideo? {} : {previewUrl:d.url})} : f);
      const info = await readMediaInfo(d.url, isVideo);
      if(info) setForm(f=>{
        if(!still(f)) return f;
        const p = {}; const ar = nearestAspect(info.w, info.h);
        if(ar) p.aspectRatio = ar;
        if(isVideo && isFinite(info.duration) && info.duration>0) p.duration = Math.round(info.duration);
        return {...f, ...p};
      });
    }catch(e){
      setForm(f=> still(f) ? {...f, uploadStatus:"failed", uploadError:e.message} : f);
      dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"});
    }
  }
  // Arrived from the library page ("Create post from this") or a #/create?barcode= link.
  useEffect(()=>{
    const pickId = form.libraryPick, code = form.libraryBarcode;
    if(!pickId && !code) return;
    setForm(f=>({...f, libraryPick:null, libraryBarcode:null}));
    loadLibrary().then(lib=>{
      const file = lib.files.find(x=> pickId ? x.id===pickId : x.barcode===String(code).toUpperCase());
      if(!file){ dispatch({type:"ADD_TOAST", message:"Couldn't find "+(code||"that file")+" in the content library", variant:"warn"}); return; }
      pickLibrary(file, !!lib.status.connected);
      setStep(1);
    }).catch(()=>{});
  }, []);
  function setVariant(p, patch){ setForm(f=>({...f, variants:{...f.variants, [p]:{...(f.variants[p]||{}), ...patch}}})); }
  function togglePlatform(p){ set({platforms: form.platforms.includes(p)? form.platforms.filter(x=>x!==p) : [...form.platforms, p]}); }

  const warnings = useMemo(()=>{
    const w = [];
    form.platforms.forEach(p=>{
      const v = form.variants[p]||{};
      if(p==="youtube" && !v.title) w.push("YouTube Shorts is missing a title.");
      if((p==="instagram"||p==="facebook"||p==="gbp") && !v.caption && !v.postDescription) w.push(PLATFORM_META[p].label+" is missing a caption.");
      if(p==="tiktok" && !v.caption) w.push("TikTok is missing a caption.");
    });
    if((form.platforms.includes("tiktok")||form.platforms.includes("youtube")) && form.aspectRatio!=="9:16") w.push("TikTok / YouTube Shorts expect a 9:16 aspect ratio — current media is "+form.aspectRatio+".");
    if(form.duration>60 && form.platforms.includes("tiktok")) w.push("Video is over 60s — long-form for TikTok may reduce reach.");
    if(form.platforms.length===0) w.push("Select at least one platform.");
    if(!form.scheduledAt && step===4) w.push("No publishing date/time set — content will be saved as approved-but-unscheduled.");
    if(form.uploadStatus==="uploading") w.push("Still uploading the original file — wait for it to finish before submitting.");
    if(form.uploadStatus==="importing") w.push("Still copying the file from Google Drive — wait for it to finish before submitting.");
    if(form.uploadStatus==="linked") w.push("Linked to library file "+(form.libraryRef&&form.libraryRef.barcode||"")+", but Google Drive isn't connected so the file itself wasn't copied — upload it here, or connect Drive in Settings.");
    if(form.uploadStatus==="failed") w.push((form.uploadError? form.uploadError+" — " : "The file upload failed — ")+"re-upload it, or continue and add it later.");
    const conflict = state.contentItems.some(it=> it.brand===form.brand && it.platforms.some(p=>form.platforms.includes(p)) && Object.values(it.variants).some(v=> v.scheduledAt && form.scheduledAt && Math.abs(new Date(v.scheduledAt)-new Date(form.scheduledAt))<30*60000));
    if(conflict) w.push("Another post from this brand is scheduled within 30 minutes of this time.");
    return w;
  }, [form, step, state.contentItems]);

  function buildItem(status){
    const variants = {};
    form.platforms.forEach(p=>{
      const {hashtagsText, ...fv} = form.variants[p] || {};
      variants[p] = makeVariant(p, {status: status==="draft"?"draft":"submitted", scheduledAt: fv.overrideTime || form.scheduledAt || null, ...fv, hashtags: parseTags(hashtagsText)});
    });
    return {
      id: uid("ct"), title: form.title||"Untitled content", brand: form.brand, campaign: form.campaign, pillar: form.pillar,
      creator: form.creator, approver: form.approver, priority: form.priority, notes: form.notes, status,
      createdAt: new Date().toISOString(), platforms: form.platforms, currentVersion: 1,
      media:{type:form.mediaType, duration: form.mediaType==="video"?Number(form.duration):null, aspectRatio: form.aspectRatio, previewUrl: form.previewUrl || null, fileUrl: form.fileUrl || null},
      due: form.scheduledAt || new Date().toISOString(),
      versions:[{version:1, editor:USERS.find(u=>u.id===form.creator).name, date:new Date().toISOString(), changes: status==="draft"?"Initial draft created.":"Initial draft created and submitted for approval.", decision:"—", feedback:null}],
      variants, gradient: grad(form.title||"x"+Math.random()), libraryRef: form.libraryRef || null,
    };
  }

  function submit(status){
    const item = buildItem(status);
    dispatch({type:"CREATE_CONTENT", item});
    dispatch({type:"ADD_TOAST", message: status==="draft"? "Saved as draft" : "Submitted for approval"});
    dispatch({type:"SET_ROUTE", route: status==="draft"?"calendar":"queue"});
  }

  return (
    <div>
      <PageHeader title="Create Content" subtitle="Build one creative concept and tailor it per platform."/>
      <div style={{display:"flex", gap:0, marginBottom:22, overflowX:"auto"}}>
        {WIZARD_STEPS.map((s,i)=>(
          <div key={s} style={{display:"flex", alignItems:"center", flex:1, minWidth:120}}>
            <div onClick={()=>i<=step && setStep(i)} style={{display:"flex", alignItems:"center", gap:8, cursor:i<=step?"pointer":"default"}}>
              <div style={{width:26,height:26,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700, flexShrink:0, background: i<step?"var(--green)": i===step?"var(--accent)":"var(--surface-2)", color: i<=step?"#fff":"var(--ink-mute)"}}>{i<step? <Icon name="check" size={13}/> : i+1}</div>
              <span style={{fontSize:12.5, fontWeight:700, color:i===step?"var(--ink)":"var(--ink-mute)", whiteSpace:"nowrap"}}>{s}</span>
            </div>
            {i<WIZARD_STEPS.length-1 && <div style={{flex:1, height:2, background:"var(--border)", margin:"0 8px"}}/>}
          </div>
        ))}
      </div>

      <div className="cf-wiz-grid" style={{display:"grid", gridTemplateColumns:"1fr 280px", gap:18, alignItems:"start"}}>
        <Card style={{padding:22}}>
          {step===0 && (
            <div>
              <TextField label="Content title" value={form.title} onChange={v=>set({title:v})} placeholder="e.g. Autumn Roast — Hero Reel"/>
              <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Brand</label>
                  <Select value={form.brand} onChange={v=>set({brand:v})} options={BRANDS.map(b=>({value:b.id,label:b.name}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Campaign <span style={{fontWeight:500, color:"var(--ink-mute)"}}>(optional)</span></label>
                  <CampaignPicker value={form.campaign} brand={form.brand} onChange={v=>set({campaign:v})}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Content pillar</label>
                  <Select value={form.pillar} onChange={v=>set({pillar:v})} options={PILLARS.map(p=>({value:p,label:p}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Priority</label>
                  <Select value={form.priority} onChange={v=>set({priority:v})} options={Object.entries(PRIORITY_META).map(([k,v])=>({value:k,label:v.label}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Assigned creator</label>
                  <Select value={form.creator} onChange={v=>set({creator:v})} options={activeUsers().map(u=>({value:u.id,label:u.name}))}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Assigned approver</label>
                  <Select value={form.approver} onChange={v=>set({approver:v})} options={approverOptions()}/>
                </div>
              </div>
              <TextField label="Internal notes" value={form.notes} onChange={v=>set({notes:v})} placeholder="Anything the approver should know…" textarea/>
            </div>
          )}
          {step===1 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:8}}>From the content library</label>
              <div style={{marginBottom:6}}><LibraryPicker onPick={pickLibrary}/></div>
              <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:16}}>Type the barcode from the Drive library — the file, dish, category and platform fill in for you. Or <a href="#" onClick={e=>{e.preventDefault(); dispatch({type:"SET_ROUTE", route:"library"});}} style={{color:"var(--accent)"}}>browse the library</a>.</div>
              <div style={{display:"flex", alignItems:"center", gap:10, fontSize:11.5, color:"var(--ink-mute)", fontWeight:600, marginBottom:12}}><span style={{flex:1, height:1, background:"var(--border)"}}/>OR UPLOAD A FILE<span style={{flex:1, height:1, background:"var(--border)"}}/></div>
              <label htmlFor="cf-upload" style={{display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8, border:"2px dashed var(--border)", borderRadius:14, padding:"32px 16px", cursor:"pointer", background:"var(--surface-2)", marginBottom:16}}>
                <Icon name="upload" size={26} style={{color:"var(--ink-mute)"}}/>
                <div style={{fontSize:13, fontWeight:700}}>Drag & drop, or click to upload</div>
                <div style={{fontSize:11.5, color:"var(--ink-mute)"}}>MP4, MOV, JPG or PNG up to 100MB — bigger videos: use the content library</div>
                <input id="cf-upload" type="file" accept="image/*,video/*" style={{display:"none"}} onChange={e=>{
                  const f=e.target.files[0]; if(!f) return;
                  const isVideo = f.type.startsWith("video/");
                  set({fileName:f.name, mediaType: isVideo?"video":"image", previewLoading:true, uploadStatus:"uploading", fileUrl:null});
                  // Small poster/thumbnail for instant feedback in the UI...
                  const task = isVideo ? videoFileToPoster(f, 480, 0.72) : imageFileToPreview(f, 480, 0.78);
                  task.then(dataUrl=>{ set({previewUrl:dataUrl, previewLoading:false}); })
                       .catch(()=>{ set({previewLoading:false}); });
                  readMediaInfo(f, isVideo).then(info=>{
                    if(!info) return;
                    const patch = {};
                    const ar = nearestAspect(info.w, info.h);
                    if(ar) patch.aspectRatio = ar;
                    if(isVideo && isFinite(info.duration) && info.duration>0) patch.duration = Math.round(info.duration);
                    if(Object.keys(patch).length) set(patch);
                  });
                  // ...and the actual file, uploaded for real so it can be rewatched/reopened later by anyone.
                  uploadMediaFile(f).then(({url})=>{
                    set({fileUrl:url, uploadStatus:"done"});
                  }).catch(()=>{
                    set({uploadStatus:"failed"});
                    dispatch({type:"ADD_TOAST", message:"Upload failed — check your connection and try again.", variant:"danger"});
                  });
                }}/>
              </label>
              {form.fileName && (
                <div style={{display:"flex", gap:12, alignItems:"center", padding:12, borderRadius:12, background:"var(--surface-2)", marginBottom:16}}>
                  <div style={{width:52,height:52,borderRadius:10,overflow:"hidden",flexShrink:0, position:"relative"}}>
                    <Thumb item={{gradient:grad(form.fileName), media:{type:form.mediaType, duration:form.duration, previewUrl:form.previewUrl}}} radius={10} iconSize={18}/>
                    {form.previewLoading && <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,.25)"}}><Icon name="clock" size={16} style={{color:"#fff"}}/></div>}
                  </div>
                  <div style={{flex:1, overflow:"hidden"}}>
                    <div style={{fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{form.fileName}</div>
                    <div style={{fontSize:11, fontWeight:600, marginTop:2, color: form.uploadStatus==="failed"?"var(--red)": form.uploadStatus==="done"?"var(--green)": form.uploadStatus==="linked"?"var(--amber)":"var(--ink-mute)"}}>
                      {form.uploadStatus==="uploading"?"Uploading original file…": form.uploadStatus==="importing"?"Copying from Google Drive…": form.uploadStatus==="linked"?"Linked to the library — file not copied (Drive not connected)": form.uploadStatus==="done"?(form.libraryRef? "Copied from Google Drive — ready to preview":"Uploaded — will be rewatchable by the whole team"): form.uploadStatus==="failed"?(form.uploadError||"Upload failed"): ""}
                    </div>
                    {form.libraryRef && (()=>{ const prior = libraryUsageMap(state.contentItems)[form.libraryRef.id]; return prior && prior.length ? (
                      <div style={{marginTop:6, padding:"7px 9px", borderRadius:7, background:"var(--amber-soft)", fontSize:11.5, lineHeight:1.5, color:"var(--ink)", whiteSpace:"normal"}}>
                        <strong>{form.libraryRef.barcode||"This file"} was already used</strong> in {prior.length} post{prior.length>1?"s":""}:
                        {prior.slice(0,3).map(it=><div key={it.id}>• "{it.title}" — {Object.values(it.variants||{}).map(variantUseLine).join("; ")}</div>)}
                      </div>) : null; })()}
                    {form.libraryRef && <div style={{display:"flex", alignItems:"center", gap:6, marginTop:5, fontSize:11.5}}>
                      <BarcodeChip code={form.libraryRef.barcode}/><span style={{color:"var(--ink-mute)"}}>{form.libraryRef.branch}</span>
                      <a href={driveFileUrl(form.libraryRef.id)} target="_blank" rel="noopener noreferrer" style={{color:"var(--accent)", fontWeight:600}}>Drive</a>
                      <button onClick={()=>set({libraryRef:null, ...(form.uploadStatus==="linked"? {uploadStatus:null, fileName:""} : {})})} style={{border:"none", background:"none", color:"var(--ink-mute)", cursor:"pointer", fontSize:11.5, textDecoration:"underline"}}>unlink</button>
                    </div>}
                  </div>
                </div>
              )}
              <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Media type</label>
                  <Select value={form.mediaType} onChange={v=>set({mediaType:v})} options={[{value:"video",label:"Video"},{value:"image",label:"Image"}]}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Aspect ratio</label>
                  <Select value={form.aspectRatio} onChange={v=>set({aspectRatio:v})} options={["9:16","1:1","4:5","16:9"].map(a=>({value:a,label:a}))}/>
                </div>
                {form.mediaType==="video" && <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Duration (sec)</label>
                  <input type="number" value={form.duration} onChange={e=>set({duration:e.target.value})} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>}
              </div>
            </div>
          )}
          {step===2 && (
            <div>
              <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:10}}>Select platforms</label>
              <div style={{display:"flex", flexDirection:"column", gap:8}}>
                {Object.entries(PLATFORM_META).map(([k,v])=>(
                  <label key={k} style={{display:"flex", alignItems:"center", gap:10, padding:"11px 13px", borderRadius:11, border:"1px solid "+(form.platforms.includes(k)?"var(--accent)":"var(--border)"), background: form.platforms.includes(k)?"var(--accent-soft)":"var(--surface)", cursor:"pointer"}}>
                    <input type="checkbox" checked={form.platforms.includes(k)} onChange={()=>togglePlatform(k)} style={{width:16,height:16}}/>
                    <PlatformIcon platform={k}/>
                    <span style={{fontWeight:700, fontSize:13.5}}>{v.label}</span>
                  </label>
                ))}
              </div>
            </div>
          )}
          {step===3 && (
            <div style={{display:"flex", flexDirection:"column", gap:16}}>
              {form.platforms.length===0 && <EmptyState icon="grid" title="No platforms selected" subtitle="Go back and select at least one platform to continue."/>}
              {form.platforms.map(p=>{
                const v = form.variants[p]||{};
                return (
                  <Card key={p} style={{padding:16}}>
                    <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:12}}><PlatformIcon platform={p}/><span style={{fontWeight:700, fontSize:14}}>{PLATFORM_META[p].label}</span></div>
                    {(p==="instagram"||p==="facebook") && <>
                      <TextField label="Caption" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="Write a caption…"/>
                      <TextField label="Hashtags" value={v.hashtagsText||""} onChange={val=>setVariant(p,{hashtagsText:val})} placeholder="#brand #campaign"/>
                      <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <TextField label="Location tag" value={v.location||""} onChange={val=>setVariant(p,{location:val})} placeholder="Optional"/>
                        <TextField label="First comment" value={v.firstComment||""} onChange={val=>setVariant(p,{firstComment:val})} placeholder="Optional"/>
                      </div>
                    </>}
                    {p==="tiktok" && <>
                      <TextField label="Caption" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="Write a caption…"/>
                      <TextField label="Hashtags" value={v.hashtagsText||""} onChange={val=>setVariant(p,{hashtagsText:val})} placeholder="#brand #campaign"/>
                      <div style={{display:"flex", gap:16, flexWrap:"wrap", marginBottom:6}}>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.commentsEnabled} onChange={e=>setVariant(p,{commentsEnabled:e.target.checked})}/>Comments enabled</label>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.duetEnabled} onChange={e=>setVariant(p,{duetEnabled:e.target.checked})}/>Duet enabled</label>
                        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:600}}><input type="checkbox" checked={!!v.stitchEnabled} onChange={e=>setVariant(p,{stitchEnabled:e.target.checked})}/>Stitch enabled</label>
                      </div>
                    </>}
                    {p==="youtube" && <>
                      <TextField label="Title" value={v.title||""} onChange={val=>setVariant(p,{title:val})} placeholder="Video title"/>
                      <TextField label="Description" value={v.description||""} onChange={val=>setVariant(p,{description:val})} textarea placeholder="Video description"/>
                      <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <div><label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>Visibility</label><Select value={v.visibility||"Public"} onChange={val=>setVariant(p,{visibility:val})} options={["Public","Unlisted","Private"].map(x=>({value:x,label:x}))}/></div>
                        <TextField label="Playlist" value={v.playlist||""} onChange={val=>setVariant(p,{playlist:val})} placeholder="Optional"/>
                      </div>
                    </>}
                    {p==="gbp" && <>
                      <TextField label="Post description" value={v.caption||""} onChange={val=>setVariant(p,{caption:val})} textarea placeholder="What's the update?"/>
                      <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14}}>
                        <div><label style={{fontSize:12.5,fontWeight:700,display:"block",marginBottom:6}}>CTA type</label><Select value={v.cta||"Learn More"} onChange={val=>setVariant(p,{cta:val})} options={["Learn More","Order Online","Book","Call Now"].map(x=>({value:x,label:x}))}/></div>
                        <TextField label="CTA URL" value={v.url||""} onChange={val=>setVariant(p,{url:val})} placeholder="https://…"/>
                      </div>
                    </>}
                  </Card>
                );
              })}
            </div>
          )}
          {step===4 && (
            <div>
              <div className="cf-field-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:6}}>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Publishing date</label>
                  <input type="date" value={form.scheduledAt? form.scheduledAt.slice(0,10) : ""} onChange={e=>{ const t=form.scheduledAt? form.scheduledAt.slice(11,16):"09:00"; set({scheduledAt: e.target.value+"T"+t+":00"}); }} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>
                <div>
                  <label style={{fontSize:12.5, fontWeight:700, display:"block", marginBottom:6}}>Publishing time</label>
                  <input type="time" value={form.scheduledAt? form.scheduledAt.slice(11,16) : ""} onChange={e=>{ const d=form.scheduledAt? form.scheduledAt.slice(0,10) : new Date().toISOString().slice(0,10); set({scheduledAt: d+"T"+e.target.value+":00"}); }} style={{width:"100%", borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px"}}/>
                </div>
              </div>
              <div style={{fontSize:11.5, color:"var(--ink-mute)", marginBottom:16}}>Applies to all selected platforms unless overridden below.</div>
              {form.platforms.map(p=>(
                <div key={p} style={{display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderTop:"1px solid var(--border)"}}>
                  <PlatformIcon platform={p} size={14}/>
                  <span style={{fontSize:12.5, fontWeight:700, width:130}}>{PLATFORM_META[p].label}</span>
                  <input type="datetime-local" onChange={e=>setVariant(p,{overrideTime: e.target.value? e.target.value+":00":null})} style={{borderRadius:8, border:"1px solid var(--border)", padding:"6px 9px", fontSize:12.5}}/>
                </div>
              ))}
            </div>
          )}
          <div style={{display:"flex", justifyContent:"space-between", marginTop:24, paddingTop:18, borderTop:"1px solid var(--border)"}}>
            <Button variant="ghost" icon="chevronLeft" onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}>Back</Button>
            <div style={{display:"flex", gap:10}}>
              <Button variant="ghost" onClick={()=>submit("draft")} disabled={form.uploadStatus==="uploading"||form.uploadStatus==="importing"}>{form.uploadStatus==="uploading"||form.uploadStatus==="importing"?"Waiting for file…":"Save as Draft"}</Button>
              {step<4 ? <Button variant="primary" onClick={()=>setStep(s=>Math.min(4,s+1))}>Continue</Button>
                : <Button variant="success" icon="check" onClick={()=>submit("submitted")} disabled={form.uploadStatus==="uploading"||form.uploadStatus==="importing"}>{form.uploadStatus==="uploading"||form.uploadStatus==="importing"?"Waiting for file…":"Submit for Approval"}</Button>}
            </div>
          </div>
        </Card>

        <Card style={{padding:16, position:"sticky", top:16}}>
          <SectionTitle>Preview</SectionTitle>
          <div style={{height:150, borderRadius:12, overflow:"hidden", marginBottom:12}}>
            <Thumb item={{gradient:grad(form.title||"preview"), media:{type:form.mediaType, duration:form.duration, previewUrl:form.previewUrl}}} radius={12} iconSize={26}/>
          </div>
          <div style={{fontWeight:700, fontSize:14, marginBottom:4}}>{form.title || "Untitled content"}</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:12}}>{BRANDS.find(b=>b.id===form.brand).name} · {campaignLabel(state.campaigns, form.campaign)}</div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:14}}>{form.platforms.map(p=><PlatformIcon key={p} platform={p} size={14}/>)}</div>
          <div style={{fontSize:11.5, fontWeight:700, color:"var(--ink-mute)", textTransform:"uppercase", letterSpacing:".4px", marginBottom:8}}>Validation</div>
          {warnings.length===0 ? (
            <div style={{display:"flex", gap:6, alignItems:"center", fontSize:12.5, color:"var(--green)", fontWeight:600}}><Icon name="check" size={14}/>Looks good</div>
          ):(
            <div style={{display:"flex", flexDirection:"column", gap:7}}>
              {warnings.map((w,i)=><div key={i} style={{display:"flex", gap:6, fontSize:12, color:"var(--amber)"}}><Icon name="warn" size={13} style={{marginTop:1, flexShrink:0}}/>{w}</div>)}
            </div>
          )}
        </Card>
      </div>
      <style>{`@media (max-width:900px){ .cf-wiz-grid{ grid-template-columns:1fr !important; } }`}</style>
    </div>
  );
}

/* ============================== PUBLISHED CONTENT ============================== */
function PostAnalyticsDrawer({post, onClose}){
  if(!post) return null;
  const metrics = [
    {label:"Views", value:post.views, icon:"trend"}, {label:"Reach", value:post.reach, icon:"share"},
    {label:"Likes", value:post.likes, icon:"heart"}, {label:"Comments", value:post.comments, icon:"comment"},
    {label:"Shares", value:post.shares, icon:"share"}, {label:"Saves", value:post.saves, icon:"save"},
  ];
  return (
    <Drawer open={!!post} onClose={onClose} width={520}>
      <div style={{padding:20, borderBottom:"1px solid var(--border)"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11.5, color:"var(--ink-mute)", fontWeight:600, marginBottom:3, display:"flex", alignItems:"center", gap:6}}><PlatformIcon platform={post.platform} size={12}/>{post.account || PLATFORM_META[post.platform].label}</div>

/* Sample history so the analytics screens and the forecaster have something realistic to work with before real
   platform stats are connected. Every post built here is flagged `sample:true` and the page labels it clearly. */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const SAMPLE_TITLES = ["Salmon Nigiri Close-Up","Red Dragon Roll — Hands-On","Chef's Knife Skills","Bento Lunch Box Build","Matcha Cheesecake Slice","Sake Pairing Night","Weekend Set Menu","Behind the Counter","Tempura Crunch ASMR","Omakase Experience","Rainbow Roll Assembly","Gyoza Fold Tutorial","Katsu Curry Pour","Miso Soup from Scratch","Friday Night Rush","Meet the Chef","Shoreditch Lunch Queue","Dragon Roll Reveal","Sashimi Platter Build","Yuzu Mocktail","Tuna Tataki Sear","Staff Picks","Customer Reactions","Wasabi Myths","Sushi Rice Secrets"];
const PLATFORM_BASE = {
  instagram:{min:2500, max:16000, conv:4.5}, tiktok:{min:4000, max:42000, conv:3.2}, facebook:{min:900, max:6500, conv:2.4},
  youtube:{min:1200, max:14000, conv:3.8}, gbp:{min:150, max:900, conv:0.8},
};
function buildSampleHistory(){
  const rnd = mulberry32(20260922);
  const posts = [];
  for(let dayBack=118; dayBack>=1; dayBack--){
    const d = new Date(TODAY); d.setDate(d.getDate()-dayBack);
    const chance = [0.35,0.45,0.45,0.55,0.7,0.75,0.6][d.getDay()];
    if(rnd() > chance) continue;
    const hour = [8,10,12,13,15,16,17,18,19,20,21,22][Math.floor(rnd()*12)];
    d.setHours(hour, Math.floor(rnd()*4)*15, 0, 0);
    const title = SAMPLE_TITLES[Math.floor(rnd()*SAMPLE_TITLES.length)];
    const pillar = PILLARS[Math.floor(rnd()*PILLARS.length)];
    const campaign = dayBack < 45 ? (rnd()<0.6? "c_augshoot" : rnd()<0.5? "c_evergreen" : "") : (rnd()<0.6? "c_evergreen" : "");
    const quality = 0.55 + rnd()*0.9;
    const plats = ["instagram"];
    if(rnd()<0.75) plats.push("tiktok");
    if(rnd()<0.55) plats.push("facebook");
    if(rnd()<0.4) plats.push("youtube");
    if(rnd()<0.18) plats.push("gbp");
    const trend = 1 + (118-dayBack)/118*0.45;
    const pillarBoost = {"Behind the Scenes":1.15, "Education":1.1, "UGC":1.2, "Promotion":0.85, "Product":1, "Seasonal":1.05}[pillar]||1;
    plats.forEach(platform=>{
      const b = PLATFORM_BASE[platform];
      const views = Math.round((b.min + rnd()*(b.max-b.min)) * quality * trend * pillarBoost * (hour>=17? 1.12 : 1));
      const likes = Math.round(views*(0.035+rnd()*0.05)), comments = Math.round(views*(0.003+rnd()*0.01));
      const shares = Math.round(views*(0.003+rnd()*0.018)), saves = Math.round(views*(0.004+rnd()*0.025));
      const engagementRate = (likes+comments+shares+saves)/views*100;
      posts.push({
        id:"sp_"+dayBack+"_"+platform, sample:true, contentId:"sample_"+dayBack, contentTitle:title, brand:"sanjugo", campaign, pillar, platform,
        account: BRANDS[0].accounts[platform], publishedAt:d.toISOString(), gradient:grad(title),
        views, reach: Math.round(views*(0.68+rnd()*0.2)), likes, comments, shares, saves, engagementRate,
        followsGained: Math.round(views/1000 * b.conv * (engagementRate/8) * (0.6+rnd()*0.8)),
        analyticsUpdatedAt: dayOffset(0,7,45),
        snapshots:[2,6,24,72,168].map((hrs,i)=>{ const k=[0.18,0.4,0.68,0.9,1][i]; return {label: hrs<24? hrs+"h" : (hrs/24)+"d", hours:hrs, views:Math.round(views*k), likes:Math.round(likes*k), comments:Math.round(comments*k), shares:Math.round(shares*k), saves:Math.round(saves*k)}; }),
      });
    });
  }
  return posts;
}
const SAMPLE_HISTORY = buildSampleHistory();

const METRICS = [
  {key:"views", label:"Views"}, {key:"reach", label:"Reach"}, {key:"engagements", label:"Engagements"},
  {key:"engagementRate", label:"Engagement rate", pct:true}, {key:"likes", label:"Likes"}, {key:"comments", label:"Comments"},
  {key:"shares", label:"Shares"}, {key:"saves", label:"Saves"}, {key:"followsGained", label:"Followers gained"},
];
const SUM_KEYS = ["views","reach","likes","comments","shares","saves","followsGained"];
function metricTotals(posts){
  const t = {posts:posts.length}; SUM_KEYS.forEach(k=>t[k]=0);
  posts.forEach(p=>SUM_KEYS.forEach(k=>{ t[k] += p[k]||0; }));
  t.engagements = t.likes+t.comments+t.shares+t.saves;
  t.engagementRate = t.views ? t.engagements/t.views*100 : 0;
  return t;
}
function postMetric(p, key){ return key==="engagements" ? p.likes+p.comments+p.shares+p.saves : key==="engagementRate" ? p.engagementRate : (p[key]||0); }
function fmtMetric(key, v){ return key==="engagementRate" ? fmtPct(v) : fmtNum(Math.round(v)); }
function quantile(arr, q){ if(!arr.length) return 0; const a=[...arr].sort((x,y)=>x-y); const i=(a.length-1)*q; const lo=Math.floor(i), hi=Math.ceil(i); return a[lo]+(a[hi]-a[lo])*(i-lo); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
/* How a post's numbers arrive over its first week — used to turn per-post totals into a daily timeline. */
const DAY_SPREAD = [0.68, 0.14, 0.08, 0.03, 0.03, 0.02, 0.02];
function dailySeries(posts, key, start, days){
  const out = Array(days).fill(0), views = Array(days).fill(0);
  const s0 = startOfDay(start).getTime();
  posts.forEach(p=>{
    const d0 = Math.round((startOfDay(p.publishedAt).getTime()-s0)/86400000);
    DAY_SPREAD.forEach((f,k)=>{
      const i = d0+k; if(i<0 || i>=days) return;
      if(key==="engagementRate"){ out[i] += (p.likes+p.comments+p.shares+p.saves)*f; views[i] += p.views*f; }
      else out[i] += postMetric(p,key)*f;
    });
  });
  return key==="engagementRate" ? out.map((v,i)=> views[i]? v/views[i]*100 : 0) : out.map(Math.round);
}

function Delta({cur, prev, pct}){
  if(!prev) return <span style={{fontSize:11.5, color:"var(--ink-mute)"}}>no prior data</span>;
  const diff = pct ? cur-prev : (cur-prev)/prev*100;
  const up = diff >= 0;
  return <span className="num" style={{fontSize:11.5, fontWeight:600, color: up? "var(--green)":"var(--red)"}}>{up? "▲":"▼"} {Math.abs(diff).toFixed(1)}{pct? " pts":"%"} <span style={{color:"var(--ink-mute)", fontWeight:500}}>vs prev.</span></span>;
}

        {/* Engagement mix */}
        <Card style={{padding:18}}>

          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>{fmtNum(cur.engagements)} engagements · {fmtPct(cur.engagementRate)} of views</div>
          <div style={{display:"flex", height:12, borderRadius:6, overflow:"hidden", marginBottom:14, background:"var(--surface-2)"}}>
            {mix.map(([l,k,c])=> cur.engagements>0 && <div key={k} title={l} style={{width:(cur[k]/cur.engagements*100)+"%", background:c}}/>)}
          </div>

              <span style={{width:92, textAlign:"right"}}>{compare && <Delta cur={cur[k]} prev={prev[k]}/>}</span>
            </div>
          ))}
        </Card>
      </div>

      <div className="cf-an-grid" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16}}>
        {/* Best time to post */}
        <Card style={{padding:18}}>
          <div style={{fontSize:14.5, fontWeight:700, marginBottom:2}}>Best time to post</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>
            Average engagement rate by day and time (all dates, current filters){bestCell && <> · best: <strong style={{color:"var(--ink)"}}>{WEEKDAYS[bestCell.wd]} {BUCKETS[bestCell.b][0].toLowerCase()}</strong></>}
          </div>

            <span/>{BUCKETS.map(([l])=><span key={l} style={{textAlign:"center", color:"var(--ink-mute)", fontWeight:600, overflow:"hidden", textOverflow:"ellipsis"}}>{l}</span>)}
            {heat.map((row,wd)=>(
              <React.Fragment key={wd}>
                <span style={{color:"var(--ink-mute)", fontWeight:600, alignSelf:"center"}}>{WEEKDAYS[wd]}</span>
                {row.map((c,b)=>{
                  const k = c ? (c.v-heatMin)/((heatMax-heatMin)||1) : 0;
                  return <div key={b} title={c? WEEKDAYS[wd]+" "+BUCKETS[b][0]+": "+fmtPct(c.v)+" avg ("+c.n+" posts)" : "No posts"} style={{height:28, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:600,
                    background: c ? `color-mix(in srgb, var(--accent) ${Math.round(12+k*78)}%, var(--surface))` : "var(--surface-2)", color: c && k>0.55 ? "#fff" : "var(--ink-soft)", outline: bestCell && bestCell.wd===wd && bestCell.b===b ? "2px solid var(--ink)" : "none"}}>
                    {c ? c.v.toFixed(1) : ""}
                  </div>;
                })}
              </React.Fragment>
            ))}
          </div>
        </Card>

        {/* Content type performance */}
        <Card style={{padding:18}}>
          <div style={{fontSize:14.5, fontWeight:700, marginBottom:2}}>Content type performance</div>
          <div style={{fontSize:12, color:"var(--ink-mute)", marginBottom:14}}>Average views per post · engagement rate</div>
          {pillarRows.length===0 ? <div style={{fontSize:12.5, color:"var(--ink-mute)"}}>No posts in this range.</div> : pillarRows.map(r=>(
            <div key={r.pl} style={{marginBottom:11}}>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:12.5, marginBottom:4}}>
                <span style={{fontWeight:600}}>{r.pl} <span style={{color:"var(--ink-mute)", fontWeight:500}}>· {r.n} posts</span></span>
                <span className="num"><strong>{fmtNum(Math.round(r.avgViews))}</strong> <span style={{color:"var(--ink-mute)"}}>· {fmtPct(r.er)}</span></span>
              </div>
              <div style={{height:6, borderRadius:9, background:"var(--surface-2)"}}><div style={{height:"100%", width:(r.avgViews/maxPillar*100)+"%", borderRadius:9, background:"var(--accent)"}}/></div>
            </div>
          ))}
        </Card>
      </div>

      {/* Every post, sortable */}
      <Card style={{padding:0, overflow:"hidden", marginBottom:16}}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap", padding:"14px 18px 12px"}}>
          <div>
            <div style={{fontSize:14.5, fontWeight:700}}>Post performance</div>
            <div style={{fontSize:12, color:"var(--ink-mute)"}}>{rows.length} posts · tap a column to sort, tap a post for its detail</div>
          </div>
          <div style={{position:"relative"}}>
            <Icon name="search" size={14} style={{position:"absolute", left:10, top:9, color:"var(--ink-mute)"}}/>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search posts" style={{...inputStyle, paddingLeft:30, width:200}}/>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse", minWidth:900}}>
            <thead><tr>
              <th onClick={()=>sortBy("title")} style={{...th, textAlign:"left", position:"sticky", left:0, zIndex:1}}>Post{arrow("title")}</th>
              <th onClick={()=>sortBy("publishedAt")} style={th}>Published{arrow("publishedAt")}</th>
              {cols.map(([k,l])=><th key={k} onClick={()=>sortBy(k)} style={{...th, color: sort.key===k? "var(--ink)":th.color}}>{l}{arrow(k)}</th>)}
            </tr></thead>
            <tbody>
              {rows.length===0 && <tr><td colSpan={cols.length+2} style={{...td, textAlign:"center", color:"var(--ink-mute)", padding:24}}>No posts match.</td></tr>}
              {rows.slice(0, showRows).map(p=>(
                <tr key={p.id} className="cf-row" onClick={()=>setOpenPost(p)} style={{cursor:"pointer"}}>
                  <td style={{...td, textAlign:"left", position:"sticky", left:0, background:"var(--surface)", maxWidth:260}}>

                      <span style={{width:30, height:30, borderRadius:6, overflow:"hidden", flexShrink:0}}><Thumb item={{gradient:p.gradient, media:{type:"video"}}} radius={6} iconSize={11} bare/></span>
                      <span style={{minWidth:0}}>

                      </span>

                  <td style={{...td, color:"var(--ink-soft)"}}>{fmtDate(p.publishedAt,{day:"numeric",month:"short"})}</td>
                  {cols.map(([k])=><td key={k} className="num" style={{...td, fontWeight: sort.key===k? 700:400}}>{k==="followsGained"? "+":""}{fmtMetric(k, postMetric(p,k))}</td>)}
