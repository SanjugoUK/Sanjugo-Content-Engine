      <GrowthForecaster allPosts={allPosts} defaultPlatform={filters.platforms[0]||"instagram"}/>

      <PostAnalyticsDrawer post={openPost} onClose={()=>setOpenPost(null)}/>
      <style>{`@media (max-width:900px){ .cf-an-grid{ grid-template-columns:1fr !important; } .cf-kpis{ grid-template-columns:repeat(2, 1fr) !important; }
        .cf-an-filters{ display:grid !important; grid-template-columns:1fr 1fr; } .cf-an-filters > *{ width:auto !important; min-width:0; } .cf-an-compare{ grid-column:1 / -1; margin-left:0 !important; } } .cf-row:hover td{ background:var(--surface-2) !important; }`}</style>
    </div>
  );
}

/* "If we post N more at this level, what happens?" — a simple, explainable model built from past posts:
   followers ≈ posts × views × (followers per 1k views, from history) × (engagement vs. usual)^0.8.
   The range uses the 25th–75th percentile of past conversion, so it's honest about uncertainty. */
function GrowthForecaster({allPosts, defaultPlatform}){
  const narrow = useIsNarrow(900);
  const [platform, setPlatform] = useState(defaultPlatform);
  useEffect(()=>{ setPlatform(defaultPlatform); }, [defaultPlatform]);
  const since = new Date(TODAY); since.setDate(since.getDate()-90);
  const hist = allPosts.filter(p=>p.platform===platform && new Date(p.publishedAt)>=since && p.views>0);
  const convs = hist.map(p=>(p.followsGained||0)/p.views*1000);
  const medViews = Math.round(quantile(hist.map(p=>p.views), 0.5));
  const histER = hist.length ? metricTotals(hist).engagementRate : 0;
  const reachRatio = hist.length ? metricTotals(hist).reach/metricTotals(hist).views : 0.8;
  const [count, setCount] = useState(4);
  const [views, setViews] = useState(medViews);
  const [er, setEr] = useState(Number(histER.toFixed(1)));
  const [target, setTarget] = useState(100);
  const followersKey = "contentflow_followers_"+platform;
  const [followers, setFollowers] = useState(()=>{ try{ return localStorage.getItem(followersKey)||""; }catch(e){ return ""; } });
  useEffect(()=>{
    setViews(medViews); setEr(Number(histER.toFixed(1)));
    try{ setFollowers(localStorage.getItem(followersKey)||""); }catch(e){ setFollowers(""); }
  }, [platform, hist.length]);
  function saveFollowers(v){ setFollowers(v); try{ localStorage.setItem(followersKey, v); }catch(e){} }

  const erFactor = histER>0 ? Math.pow(Math.max(er,0.1)/histER, 0.8) : 1;
  const perPost = c => views/1000 * c * erFactor;
  const mid = count * perPost(quantile(convs, 0.5));
  const low = count * perPost(quantile(convs, 0.25));
  const high = count * perPost(quantile(convs, 0.75));
  const totalViews = count*views;
  const engagements = totalViews*er/100;
  const t = metricTotals(hist);
  const split = ["likes","comments","shares","saves"].map(k=>[k, t.engagements? engagements*t[k]/t.engagements : 0]);
  const cur = Number(followers)||0;
  const postsForTarget = perPost(quantile(convs,0.5))>0 ? Math.ceil(target/perPost(quantile(convs,0.5))) : null;
  const confidence = hist.length>=15 ? ["Good", "var(--green)"] : hist.length>=5 ? ["Fair", "var(--amber)"] : ["Low", "var(--red)"];
  const maxViews = Math.max(1000, Math.round(quantile(hist.map(p=>p.views), 0.95)*2/100)*100);

  const perPlatform = Object.keys(PLATFORM_META).map(pl=>{
    const h = allPosts.filter(p=>p.platform===pl && new Date(p.publishedAt)>=since && p.views>0);
    if(h.length<3) return null;
    const v = quantile(h.map(p=>p.views),0.5), c = quantile(h.map(p=>(p.followsGained||0)/p.views*1000),0.5);
    return {pl, n:h.length, followers: count*v/1000*c};
  }).filter(Boolean).sort((a,b)=>b.followers-a.followers);
  const maxPl = Math.max(1, ...perPlatform.map(r=>r.followers));

  const label = {fontSize:12, fontWeight:600, color:"var(--ink-soft)", display:"flex", justifyContent:"space-between", marginBottom:6};
  const numIn = {width:90, padding:"5px 8px", borderRadius:7, border:"1px solid var(--border)", fontSize:12.5, textAlign:"right", background:"var(--surface)", color:"var(--ink)"};
  return (
    <Card style={{padding:0, overflow:"hidden", marginBottom:16}}>
      <div style={{padding:"16px 18px", borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:14.5, fontWeight:700}}>Growth forecaster</div>
          <div style={{fontSize:12, color:"var(--ink-mute)"}}>Estimate followers from your next posts, based on the last 90 days on each platform.</div>
        </div>
        <Select value={platform} onChange={setPlatform} options={Object.entries(PLATFORM_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:170}}/>
      </div>
      {hist.length===0 ? <EmptyState icon="trend" title={"No "+PLATFORM_META[platform].label+" history yet"} subtitle="Publish a few posts on this platform and the forecaster will calibrate itself."/> :
      <div style={{display:"grid", gridTemplateColumns: narrow? "1fr" : "1fr 1.1fr"}}>
        <div style={{padding:18, borderRight: narrow? "none":"1px solid var(--border)", borderBottom: narrow? "1px solid var(--border)":"none"}}>
          <div style={{marginBottom:18}}>
            <div style={label}><span>Posts to publish</span><input type="number" min={1} max={60} value={count} onChange={e=>setCount(Math.max(1, Math.min(60, Number(e.target.value)||1)))} style={numIn}/></div>
            <input type="range" min={1} max={30} value={Math.min(count,30)} onChange={e=>setCount(Number(e.target.value))} style={{width:"100%", accentColor:"var(--accent)"}}/>
          </div>
          <div style={{marginBottom:18}}>
            <div style={label}><span>Views per post <span style={{color:"var(--ink-mute)", fontWeight:500}}>(usual: {fmtNum(medViews)})</span></span><input type="number" min={0} step={100} value={views} onChange={e=>setViews(Math.max(0, Number(e.target.value)||0))} style={numIn}/></div>
            <input type="range" min={0} max={maxViews} step={100} value={Math.min(views, maxViews)} onChange={e=>setViews(Number(e.target.value))} style={{width:"100%", accentColor:"var(--accent)"}}/>
          </div>
          <div style={{marginBottom:18}}>
            <div style={label}><span>Engagement rate % <span style={{color:"var(--ink-mute)", fontWeight:500}}>(usual: {fmtPct(histER)})</span></span><input type="number" min={0} max={40} step={0.1} value={er} onChange={e=>setEr(Math.max(0, Number(e.target.value)||0))} style={numIn}/></div>
            <input type="range" min={0} max={Math.max(20, Math.ceil(histER*2))} step={0.1} value={er} onChange={e=>setEr(Number(e.target.value))} style={{width:"100%", accentColor:"var(--accent)"}}/>
          </div>
          <div style={{...label, marginBottom:0}}><span>Current followers <span style={{color:"var(--ink-mute)", fontWeight:500}}>(optional)</span></span><input type="number" min={0} value={followers} placeholder="e.g. 2400" onChange={e=>saveFollowers(e.target.value)} style={numIn}/></div>
          <div style={{fontSize:11.5, color:"var(--ink-mute)", marginTop:14, display:"flex", gap:6, alignItems:"center"}}>
            <span style={{width:7, height:7, borderRadius:99, background:confidence[1]}}/>Confidence: {confidence[0]} · based on {hist.length} {PLATFORM_META[platform].label} posts
            <Button variant="text" size="sm" onClick={()=>{ setViews(medViews); setEr(Number(histER.toFixed(1))); setCount(4); }} style={{marginLeft:"auto"}}>Reset</Button>
          </div>
        </div>
        <div style={{padding:18}}>
          <div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", marginBottom:4}}>Expected new followers from {count} post{count>1?"s":""}</div>
          <div style={{display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap", marginBottom:4}}>
            <span className="num" style={{fontSize:34, fontWeight:700, letterSpacing:"-.5px"}}>+{fmtNum(Math.round(mid))}</span>
            <span className="num" style={{fontSize:13, color:"var(--ink-soft)"}}>likely range {fmtNum(Math.round(low))} – {fmtNum(Math.round(high))}</span>
          </div>
          {cur>0 && <div style={{fontSize:13, color:"var(--ink-soft)", marginBottom:4}}>
            {fmtNum(cur)} → <strong className="num" style={{color:"var(--ink)"}}>{fmtNum(Math.round(cur+mid))}</strong> followers <span className="num" style={{color:"var(--green)", fontWeight:600}}>(+{(mid/cur*100).toFixed(1)}%)</span>
          </div>}
          <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, margin:"14px 0"}}>
            {[["Views", totalViews], ["Reach", totalViews*reachRatio], ["Engagements", engagements]].map(([l,v])=>(
              <div key={l} style={{border:"1px solid var(--border)", borderRadius:8, padding:"9px 10px"}}>
                <div style={{fontSize:11, color:"var(--ink-mute)", fontWeight:600}}>{l}</div>
                <div className="num" style={{fontSize:16, fontWeight:700}}>{fmtNum(Math.round(v))}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:12, color:"var(--ink-soft)", marginBottom:16}} className="num">
            ≈ {split.map(([k,v])=>fmtNum(Math.round(v))+" "+k).join(" · ")}
          </div>
          <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", padding:"10px 12px", borderRadius:8, background:"var(--surface-2)", fontSize:12.5, marginBottom:16}}>
            To gain <input type="number" min={1} value={target} onChange={e=>setTarget(Math.max(1, Number(e.target.value)||1))} style={{...numIn, width:70}}/> followers you'd need about
            <strong className="num">{postsForTarget!=null? postsForTarget+" posts" : "—"}</strong> at these numbers.
          </div>
          {perPlatform.length>1 && <>
            <div style={{fontSize:12, fontWeight:600, color:"var(--ink-mute)", marginBottom:8}}>Same {count} posts at each platform's usual level</div>
            {perPlatform.map(r=>(
              <div key={r.pl} style={{display:"flex", alignItems:"center", gap:8, marginBottom:6, fontSize:12.5}}>
                <span style={{width:110, display:"flex", alignItems:"center", gap:6, fontWeight: r.pl===platform? 700:500}}><PlatformIcon platform={r.pl} size={10}/>{PLATFORM_META[r.pl].label}</span>
                <span style={{flex:1, height:6, borderRadius:9, background:"var(--surface-2)"}}><span style={{display:"block", height:"100%", width:(r.followers/maxPl*100)+"%", background:PLATFORM_HEX[r.pl], borderRadius:9}}/></span>
                <span className="num" style={{width:50, textAlign:"right", fontWeight:600}}>+{fmtNum(Math.round(r.followers))}</span>
              </div>
            ))}
          </>}
          <div style={{fontSize:11, color:"var(--ink-mute)", marginTop:12, lineHeight:1.5}}>An estimate from past performance, not a guarantee — trends, timing and the algorithm all move the real result.</div>
        </div>
      </div>}
    </Card>
  );
}

/* ============================== TEAM CHAT ============================== */
/* Messages live in their own server table (/api/chat) and are polled every few seconds while the app is open.
   If the API isn't reachable (e.g. opened as a plain file), chat falls back to this device only and says so. */
const CHAT_LOCAL_KEY = "contentflow_chat_local_v1";
function readSeen(userId){ try{ return Number(localStorage.getItem("contentflow_chat_seen_"+userId)||0); }catch(e){ return 0; } }
function writeSeen(userId, id){ try{ localStorage.setItem("contentflow_chat_seen_"+userId, String(id)); }catch(e){} }
function readLocalChat(){ try{ return JSON.parse(localStorage.getItem(CHAT_LOCAL_KEY)||"[]"); }catch(e){ return []; } }
const EVERYONE_RE = /(^|\s)@(everyone|all|team)\b/i;
// "AI Dev +" — the Team Chat AI assistant (answers on the server). Its tag is kept apart from the real "AI Dev".
const BOT_ID = "ai_bot", BOT_NAME = "AI Dev +";
const BOT_RE = /@ai\s?dev\s?\+/i;
function findMentions(text){
  text = text.replace(new RegExp(BOT_RE.source, "gi"), " ");
  if(EVERYONE_RE.test(text)) return activeUsers().map(u=>u.id);
  const t = text.toLowerCase();
  return USERS.filter(u=> t.includes("@"+u.name.toLowerCase())).map(u=>u.id);
}

function useChat(currentUserId, dispatch){
  const [messages, setMessages] = useState([]);
  const [mode, setMode] = useState("loading"); // loading | server | local
  const [seen, setSeen] = useState(()=>readSeen(currentUserId));
  const [botPending, setBotPending] = useState([]); // ids of my questions AI Dev + is still answering
  const lastId = useRef(0);
  const loadedOnce = useRef(false);
  const modeRef = useRef("loading");
  const userRef = useRef(currentUserId);
  userRef.current = currentUserId;
  useEffect(()=>{ setSeen(readSeen(currentUserId)); }, [currentUserId]);

  const merge = useCallback(incoming=>{
    if(!incoming || !incoming.length) return;
    setMessages(prev=>{
      const ids = new Set(prev.map(m=>m.id));
      const add = incoming.filter(m=>!ids.has(m.id));
      return add.length ? [...prev, ...add].sort((a,b)=>a.id-b.id) : prev;
    });
    lastId.current = Math.max(lastId.current, ...incoming.map(m=>m.id));
    if(loadedOnce.current){
      incoming.filter(m=>m.author!==userRef.current && (m.mentions||[]).includes(userRef.current)).forEach(m=>{
        const who = USERS.find(u=>u.id===m.author);
        const short = m.text.replace(/\s@[^\n]*$/, "").split("\n")[0];
        dispatch({type:"ADD_TOAST", message: m.author==="system" ? short.slice(0,110) : m.author===BOT_ID ? BOT_NAME+" replied: “"+m.text.slice(0,70)+(m.text.length>70?"…":"")+"”" : (who? who.name : "Someone")+" mentioned you in Team Chat: “"+m.text.slice(0,60)+(m.text.length>60?"…":"")+"”"});
      });
    }
  }, [dispatch]);

  const poll = useCallback(async ()=>{
    try{
      const res = await fetch("/api/chat"+(lastId.current? "?since="+lastId.current : ""), {cache:"no-store"});
      if(!res.ok) throw new Error("chat "+res.status);
      const data = await res.json();
      modeRef.current = "server"; setMode("server");
      merge(data.messages||[]);
    }catch(e){
      if(modeRef.current!=="server"){ modeRef.current = "local"; setMode("local"); merge(readLocalChat()); }
    }
    loadedOnce.current = true;
  }, [merge]);

  useEffect(()=>{
    let cancelled = false, timer = null;
    const tick = async ()=>{
      await poll();
      if(!cancelled) timer = setTimeout(tick, document.hidden? 30000 : 4000);
    };
    tick();
    const onVisible = ()=>{ if(!document.hidden && !cancelled){ clearTimeout(timer); tick(); } };
    document.addEventListener("visibilitychange", onVisible);
    return ()=>{ cancelled = true; clearTimeout(timer); document.removeEventListener("visibilitychange", onVisible); };
  }, [poll]);

  const send = useCallback(async (text, contentId)=>{
    const body = {author: userRef.current, text: text.trim(), mentions: findMentions(text), contentId: contentId||null};
    if(!body.text) return false;
    if(modeRef.current==="server"){
      try{
        const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
        if(!res.ok) throw new Error("send "+res.status);
        const data = await res.json();
        merge([data.message]);
        writeSeen(userRef.current, data.message.id); setSeen(data.message.id);
        if(BOT_RE.test(body.text)) askBot(data.message.id);
        return true;
      }catch(e){
        dispatch({type:"ADD_TOAST", message:"Message not sent — check your connection and try again.", variant:"danger"});
        return false;
      }
    }
    const msg = {...body, id: Date.now(), createdAt: new Date().toISOString()};
    try{ localStorage.setItem(CHAT_LOCAL_KEY, JSON.stringify([...readLocalChat(), msg].slice(-500))); }catch(e){}
    merge([msg]); writeSeen(userRef.current, msg.id); setSeen(msg.id);
    return true;
  }, [merge, dispatch]);

  async function askBot(messageId){
    setBotPending(p=>[...p, messageId]);
    try{
      const res = await fetch("/api/chat/bot", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({messageId})});
      const data = await res.json().catch(()=>({}));
      if(data.message){ merge([data.message]); setBotPending(p=>p.filter(x=>x!==messageId)); return; }
      if(!res.ok && res.status!==202) dispatch({type:"ADD_TOAST", message: data.error || "AI Dev + couldn't answer — try again.", variant:"danger"});
    }catch(e){ /* the answer still arrives through the normal chat refresh */ }
    setTimeout(()=>setBotPending(p=>p.filter(x=>x!==messageId)), 1500);
  }

  const newestId = messages.length ? messages[messages.length-1].id : 0;
  const markSeen = useCallback(()=>{
    if(newestId > readSeen(userRef.current)){ writeSeen(userRef.current, newestId); setSeen(newestId); }
  }, [newestId]);
  const unreadList = messages.filter(m=> m.id>seen && m.author!==currentUserId);
  const unread = unreadList.length;
  const mentionUnread = unreadList.filter(m=>(m.mentions||[]).includes(currentUserId)).length;
  return useMemo(()=>({messages, mode, send, markSeen, unread, mentionUnread, seen, botPending}), [messages, mode, send, markSeen, unread, mentionUnread, seen, botPending]);
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
const mentionRe = () => new RegExp("(@ai\\s?dev\\s?\\+|@(?:"+[...USERS.map(u=>u.name)].sort((a,b)=>b.length-a.length).map(escapeRe).join("|")+"|everyone|all|team)\\b)", "i");
function ChatText({text, me}){
  const meName = (USERS.find(u=>u.id===me)||{}).name||"";
  return text.split(mentionRe()).map((part,i)=>{
    if(i%2===0) return <React.Fragment key={i}>{part}</React.Fragment>;
    const isMe = part.toLowerCase()==="@"+meName.toLowerCase() || /^@(everyone|all|team)$/i.test(part);
    return <span key={i} style={{fontWeight:600, color: isMe? "var(--accent-dark)" : "var(--blue)", background: isMe? "var(--accent-soft)" : "var(--blue-soft)", borderRadius:4, padding:"0 3px"}}>{part}</span>;
  });
}
function dayLabel(iso){
  const d = new Date(iso), t = new Date();
  const y = new Date(); y.setDate(t.getDate()-1);
  const same = (a,b)=> a.toDateString()===b.toDateString();
  if(same(d,t)) return "Today";
  if(same(d,y)) return "Yesterday";
  return d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
}

function ChatPage(){
  const {state, chat, openDetails} = useApp();
  const me = state.currentUserId;
  const narrow = useIsNarrow(900);
  const [text, setText] = useState("");
  const [linkId, setLinkId] = useState("");
  const [linkOpen, setLinkOpen] = useState(false);
  const [view, setView] = useState("all"); // all | mentions | updates
  const onlyMentions = view==="mentions";
  const [sending, setSending] = useState(false);
  const [mention, setMention] = useState(null); // {query, start} while typing "@…"
  const [mIndex, setMIndex] = useState(0);
  const listRef = useRef(null);
  const taRef = useRef(null);
  const firstUnread = useRef(chat.seen);

  useEffect(()=>{ chat.markSeen(); }, [chat.messages.length, me]);
  const shown = view==="mentions" ? chat.messages.filter(m=>(m.mentions||[]).includes(me))
    : view==="updates" ? chat.messages.filter(m=>m.author==="system") : chat.messages;
  useEffect(()=>{
    const el = listRef.current; if(!el) return;
    el.scrollTop = el.scrollHeight;
  }, [shown.length, view]);

  const candidates = mention ? [{key:BOT_ID, label:BOT_NAME, sub:"AI assistant — ask it anything", bot:true}, ...activeUsers().filter(u=>u.id!==me).map(u=>({key:u.id, label:u.name, sub:ROLE_META[u.role].label, user:u})), {key:"everyone", label:"everyone", sub:"Notify the whole team"}]
      .filter(c=>c.label.toLowerCase().startsWith(mention.query.toLowerCase())) : [];

  function onChange(e){
    const v = e.target.value; setText(v);
    const caret = e.target.selectionStart;
    const m = /(^|\s)@([^\s@]*)$/.exec(v.slice(0, caret));
    if(m){ setMention({query:m[2], start: caret - m[2].length - 1}); setMIndex(0); } else setMention(null);
    e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140)+"px";
  }
  function pick(c){
    const caret = taRef.current ? taRef.current.selectionStart : text.length;
    const next = text.slice(0, mention.start) + "@" + c.label + " " + text.slice(caret);
    setText(next); setMention(null);
    setTimeout(()=>{ const el = taRef.current; if(el){ el.focus(); const pos = mention.start + c.label.length + 2; el.setSelectionRange(pos, pos); } }, 0);
  }
  async function submit(){
    if(!text.trim() || sending) return;
    setSending(true);
    const ok = await chat.send(text, linkId);
    setSending(false);
    if(ok){ setText(""); setLinkId(""); setLinkOpen(false); if(taRef.current) taRef.current.style.height = "auto"; }
  }
  function onKeyDown(e){
    if(mention && candidates.length){
      if(e.key==="ArrowDown"){ e.preventDefault(); setMIndex(i=>(i+1)%candidates.length); return; }
      if(e.key==="ArrowUp"){ e.preventDefault(); setMIndex(i=>(i-1+candidates.length)%candidates.length); return; }
      if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); pick(candidates[mIndex]); return; }
      if(e.key==="Escape"){ setMention(null); return; }
    }
    if(e.key==="Enter" && !e.shiftKey && !narrow){ e.preventDefault(); submit(); }
  }

  const linkable = [...state.contentItems].sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0)).slice(0,40);
  const linked = linkId && state.contentItems.find(i=>i.id===linkId);
  let lastDay = null, prev = null;

  return (
    <div>
      <PageHeader title="Team Chat" subtitle={narrow? "Type @ to mention someone." : "Keep each other posted — type @ to mention someone."} action={narrow ? null :
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <div style={{display:"flex"}}>{activeUsers().map((u,i)=><span key={u.id} title={u.name} style={{marginLeft:i?-8:0, borderRadius:99, boxShadow:"0 0 0 2px var(--surface)"}}><Avatar user={u} size={28}/></span>)}</div>
        </div>
      }/>
      <Card style={{padding:0, display:"flex", flexDirection:"column", height: narrow? "calc(100dvh - 200px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))" : "calc(100dvh - 190px)", minHeight:380, overflow:"hidden"}}>
        <div style={{display:"flex", alignItems:"center", gap:6, padding:"10px 14px", borderBottom:"1px solid var(--border)"}}>
          {[["All", "all"], ["Mentions of me", "mentions"], ["Updates", "updates"]].map(([label, v])=>(
            <button key={v} onClick={()=>setView(v)} style={{padding:"6px 11px", borderRadius:7, border:"1px solid "+(view===v?"var(--ink)":"var(--border)"), background: view===v? "var(--ink)":"var(--surface)", color: view===v? "var(--surface)":"var(--ink-soft)", fontSize:12.5, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap"}}>{label}</button>
          ))}
          <span style={{flex:1}}/>
          <span style={{display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--ink-mute)"}}>
            <span style={{width:7, height:7, borderRadius:99, background: chat.mode==="server"? "var(--green)" : chat.mode==="local"? "var(--amber)" : "var(--ink-mute)"}}/>
            {chat.mode==="server"? "Live" : chat.mode==="local"? "This device only" : "Connecting…"}
          </span>
        </div>
        {chat.mode==="local" && <div style={{padding:"8px 14px", fontSize:12, background:"var(--amber-soft)", color:"var(--amber)", fontWeight:600}}>Can't reach the chat server here, so messages are only saved on this device. On the live site, everyone sees them.</div>}

        <div ref={listRef} style={{flex:1, minHeight:0, overflowY:"auto", padding:"8px 0 12px"}}>
          {shown.length===0 ? (
            <EmptyState icon="chat" title={view==="mentions"? "No mentions yet" : view==="updates"? "No updates yet" : "No messages yet"} subtitle={view==="mentions"? "When someone @mentions you, it shows up here." : view==="updates"? "Creator Studio posts here when something is sent for approval, approved, sent back or published." : "Say hello — e.g. “@Cyrus I've made the changes, ready for approval.”"}/>
          ) : shown.map(m=>{
            const isUpdate = m.author==="system", isBot = m.author===BOT_ID;
            const author = isUpdate ? {id:"system", name:"Creator Studio"} : isBot ? {id:BOT_ID, name:BOT_NAME} : (USERS.find(u=>u.id===m.author) || {name:"Unknown", avatarColor:"#888", id:m.author});
            const day = dayLabel(m.createdAt);
            const showDay = day!==lastDay; lastDay = day;
            const grouped = !showDay && prev && prev.author===m.author && (new Date(m.createdAt)-new Date(prev.createdAt) < 5*60000);
            const showUnreadLine = !onlyMentions && prev && prev.id<=firstUnread.current && m.id>firstUnread.current && m.author!==me;
            prev = m;
            const mentionsMe = (m.mentions||[]).includes(me) && m.author!==me;
            const item = m.contentId && state.contentItems.find(i=>i.id===m.contentId);
            return (
              <React.Fragment key={m.id}>
                {showDay && <div style={{display:"flex", alignItems:"center", gap:10, padding:"12px 16px 6px", fontSize:11.5, fontWeight:600, color:"var(--ink-mute)"}}><span style={{flex:1, height:1, background:"var(--border)"}}/>{day}<span style={{flex:1, height:1, background:"var(--border)"}}/></div>}
                {showUnreadLine && <div style={{display:"flex", alignItems:"center", gap:10, padding:"4px 16px", fontSize:11, fontWeight:700, color:"var(--red)"}}><span style={{flex:1, height:1, background:"var(--red)", opacity:.4}}/>New</div>}
                <div style={{display:"flex", gap:10, padding: grouped? "1px 16px" : "8px 16px 1px", background: mentionsMe? "var(--accent-soft)" : "transparent", borderLeft: mentionsMe? "3px solid var(--accent)" : "3px solid transparent"}}>
                  <div style={{width:32, flexShrink:0}}>{!grouped && (isUpdate ? <img src={LOGO_SANJUGO} alt="" style={{width:32, height:32, borderRadius:99}}/> : isBot ? <BotAvatar size={32}/> : <Avatar user={author} size={32}/>)}</div>
                  <div style={{flex:1, minWidth:0}}>
                    {!grouped && <div style={{display:"flex", alignItems:"baseline", gap:8, marginBottom:1}}>
                      <span style={{fontSize:13.5, fontWeight:700}}>{author.name}</span>{isUpdate && <span style={{fontSize:10, fontWeight:700, letterSpacing:".4px", padding:"1px 6px", borderRadius:4, background:"var(--surface-2)", color:"var(--ink-mute)"}}>UPDATE</span>}{isBot && <span style={{fontSize:10, fontWeight:700, letterSpacing:".4px", padding:"1px 6px", borderRadius:4, background:"var(--violet-soft)", color:"var(--violet)"}}>AI</span>}
                      <span style={{fontSize:11.5, color:"var(--ink-mute)"}}>{new Date(m.createdAt).toLocaleTimeString("en-GB",{hour:"2-digit", minute:"2-digit"})}</span>
                    </div>}
                    <div style={{fontSize:13.5, lineHeight:1.5, whiteSpace:"pre-wrap", wordBreak:"break-word", color:"var(--ink)"}}><ChatText text={m.text} me={me}/></div>
                    {item && <button onClick={()=>openDetails(item)} style={{display:"flex", alignItems:"center", gap:9, marginTop:6, padding:6, paddingRight:12, borderRadius:8, border:"1px solid var(--border)", background:"var(--surface)", cursor:"pointer", maxWidth:360, textAlign:"left"}}>
                      <span style={{width:34, height:34, borderRadius:6, overflow:"hidden", flexShrink:0}}><Thumb item={item} radius={6} iconSize={12}/></span>
                      <span style={{flex:1, minWidth:0}}>
                        <span style={{display:"block", fontSize:12.5, fontWeight:600, color:"var(--ink)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{item.title}</span>
                        <span style={{display:"block", fontSize:11, color:"var(--ink-mute)"}}>{STATUS_META[item.status].label} · open post</span>
                      </span>
                    </button>}
                  </div>
                </div>
              </React.Fragment>
            );
          })}
          {chat.botPending.length>0 && view!=="updates" && <div style={{display:"flex", gap:10, padding:"8px 16px", alignItems:"center"}}>
            <BotAvatar size={32}/>
            <span style={{fontSize:13, color:"var(--ink-mute)", display:"flex", alignItems:"center", gap:6}}><strong style={{color:"var(--ink)"}}>{BOT_NAME}</strong> is thinking<span className="cf-dots"><span>.</span><span>.</span><span>.</span></span></span>
          </div>}
        </div>

        <div style={{borderTop:"1px solid var(--border)", padding:"10px 12px", position:"relative", background:"var(--surface)"}}>
          {mention && candidates.length>0 && (
            <div style={{position:"absolute", left:12, bottom:"100%", marginBottom:6, width:260, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, boxShadow:"var(--shadow-lg)", overflow:"hidden", zIndex:5}}>
              <div style={{padding:"7px 11px", fontSize:11, fontWeight:600, color:"var(--ink-mute)", borderBottom:"1px solid var(--border)"}}>Mention</div>
              {candidates.map((c,i)=>(
                <button key={c.key} onMouseDown={e=>{ e.preventDefault(); pick(c); }} onMouseEnter={()=>setMIndex(i)}
                  style={{width:"100%", display:"flex", alignItems:"center", gap:9, padding:"8px 11px", border:"none", background: i===mIndex? "var(--surface-2)":"transparent", cursor:"pointer", textAlign:"left", color:"var(--ink)"}}>
                  {c.bot ? <BotAvatar size={24}/> : c.user ? <Avatar user={c.user} size={24}/> : <span style={{width:24, height:24, borderRadius:99, background:"var(--surface-2)", display:"flex", alignItems:"center", justifyContent:"center"}}><Icon name="team" size={13}/></span>}
                  <span style={{flex:1}}><span style={{display:"block", fontSize:13, fontWeight:600}}>{c.label}</span><span style={{display:"block", fontSize:11, color:"var(--ink-mute)"}}>{c.sub}</span></span>
                </button>
              ))}
            </div>
          )}
          {linked && <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:8, padding:"6px 8px", borderRadius:8, background:"var(--surface-2)", fontSize:12.5}}>
            <Icon name="link" size={14} style={{color:"var(--ink-mute)"}}/><span style={{flex:1, minWidth:0, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", fontWeight:600}}>{linked.title}</span>
            <button onClick={()=>setLinkId("")} aria-label="Remove link" style={{border:"none", background:"none", cursor:"pointer", color:"var(--ink-mute)", display:"flex"}}><Icon name="x" size={14}/></button>
          </div>}
          {linkOpen && !linked && <div style={{marginBottom:8}}>
            <Select value={linkId} onChange={v=>{ setLinkId(v); setLinkOpen(false); }} placeholder="Choose a post to attach…" options={linkable.map(i=>({value:i.id, label:i.title+" — "+STATUS_META[i.status].label}))}/>

// ---------- Push alerts (lock screen / desktop notifications) ----------
// Each device opts in once; the server then sends approval requests, decisions and @mentions to it even when
// Creator Studio is closed. iPhone/iPad only allow this for the Home Screen app (iOS 16.4+).
const pushEnv = ()=>{
  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  return {ios, standalone, supported};
};
function pushDeviceName(){
  const ua = navigator.userAgent || "";
  const os = /iPhone/.test(ua)? "iPhone" : /iPad/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)? "iPad" : /Android/.test(ua)? "Android" : /Mac/.test(ua)? "Mac" : /Windows/.test(ua)? "Windows" : "Computer";
  const br = /Edg\//.test(ua)? "Edge" : /Firefox\//.test(ua)? "Firefox" : /Chrome\//.test(ua)? "Chrome" : /Safari\//.test(ua)? "Safari" : "";
  return os + (br && !pushEnv().standalone ? " · "+br : " · app");
}
async function pushRegistration(){
  if(!("serviceWorker" in navigator)) return null;
  return (await navigator.serviceWorker.getRegistration()) || await navigator.serviceWorker.register("/sw.js");
}
async function currentPushSub(){
  const reg = await pushRegistration();
  return reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
}
async function savePushSub(sub, userId){
  const r = await fetch("/api/push/subscribe", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({subscription: sub.toJSON(), userId, device: pushDeviceName()})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Couldn't save this device");
  // Remembered so the service worker can re-register if the browser rotates the subscription.
  try{ const c = await caches.open("contentflow-push"); await c.put("/push-owner", new Response(userId)); }catch(e){}
}
async function enablePush(userId){
  // Must run straight from a tap — browsers only show the permission prompt for a user gesture.
  const perm = await Notification.requestPermission();
  if(perm!=="granted") throw new Error(perm==="denied" ? "Alerts are blocked for this site — allow notifications in your browser or phone settings, then try again." : "Alerts weren't allowed.");
  const reg = await pushRegistration();
  await navigator.serviceWorker.ready;
  const kr = await fetch("/api/push/key", {cache:"no-store"});
  const {publicKey} = await kr.json().catch(()=>({}));
  if(!kr.ok || !publicKey) throw new Error("Alerts need the live site — the server isn't reachable.");
  const raw = atob(publicKey.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((publicKey.length+3)%4));
  const key = Uint8Array.from(raw, c=>c.charCodeAt(0));
  let sub = await reg.pushManager.getSubscription();
  if(sub){
    // A subscription made with a different server key can't receive our pushes — replace it.
    const old = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
    if(old && (old.length!==key.length || old.some((b,i)=>b!==key[i]))){ await sub.unsubscribe(); sub = null; }
  }
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
  await savePushSub(sub, userId);
  return sub;
}

function PushSettings(){
  const {state, dispatch} = useApp();
  const env = useMemo(pushEnv, []);
  const [sub, setSub] = useState(undefined); // undefined = checking
  const [busy, setBusy] = useState(false);
  const [perm, setPerm] = useState(()=> ("Notification" in window) ? Notification.permission : "default");
  useEffect(()=>{ if(env.supported) currentPushSub().then(setSub).catch(()=>setSub(null)); else setSub(null); }, []);
  const toast = (message, variant)=>dispatch({type:"ADD_TOAST", message, variant});

  async function turnOn(){
    setBusy(true);
    try{ const s = await enablePush(state.currentUserId); setSub(s); toast("Alerts are on for this device"); }
    catch(e){ toast(e.message || "Couldn't turn on alerts", "danger"); }
    setPerm(Notification.permission); setBusy(false);
  }
  async function turnOff(){
    setBusy(true);
    try{
      const s = await currentPushSub();
      if(s){ await fetch("/api/push/unsubscribe", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({endpoint:s.endpoint})}).catch(()=>{}); await s.unsubscribe(); }
      setSub(null); toast("Alerts are off for this device");
    }catch(e){ toast(e.message || "Couldn't turn off alerts", "danger"); }
    setBusy(false);
  }
  async function test(){
    setBusy(true);
    try{
      const r = await fetch("/api/push/test", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({endpoint: sub.endpoint})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Test failed");
      toast("Test sent — it should pop up in a few seconds");
    }catch(e){ toast(e.message, "danger"); }
    setBusy(false);
  }

  const note = (text)=> <div style={{fontSize:12.5, color:"var(--ink-soft)", lineHeight:1.55, marginTop:10}}>{text}</div>;
  let body;
  if(env.ios && !env.standalone){
    body = note(<>On iPhone and iPad, alerts only work in the Home Screen app. In Safari tap <strong>Share</strong> → <strong>Add to Home Screen</strong>, open <strong>Creator Studio</strong> from the new icon, and turn alerts on here. (Needs iOS 16.4 or later.)</>);
  }else if(!env.supported){
    body = note("This browser can't show alerts. Use Chrome, Edge, Safari or Firefox on a computer, Chrome on Android, or the Home Screen app on iPhone.");
  }else if(sub===undefined){
    body = <Skeleton h={36}/>;
  }else if(sub){
    body = <>
      <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginTop:10}}>
        <Badge label="On for this device" color="var(--green)" soft icon="check"/>
        <Button size="sm" icon="send" onClick={test} disabled={busy}>Send a test</Button>
        <Button size="sm" variant="subtle" onClick={turnOff} disabled={busy}>Turn off</Button>
      </div>
      {note("Alerts on this device go to "+((USERS.find(u=>u.id===state.currentUserId)||{}).name||"you")+". Turn them on separately on each phone and computer you use.")}
    </>;
  }else if(perm==="denied"){
    body = note("Alerts are blocked for this site. Allow notifications for it in your browser's site settings (or the phone's Settings → Notifications), then come back and turn them on.");
  }else{
    body = <div style={{marginTop:10}}><Button variant="primary" size="sm" icon="bell" onClick={turnOn} disabled={busy}>{busy? "Turning on…" : "Turn on alerts on this device"}</Button></div>;
  }
  return (
    <div style={{borderTop:"1px solid var(--border)", marginTop:14, paddingTop:14}}>
      <div style={{fontSize:13, lineHeight:1.55}}><strong>Phone &amp; desktop alerts</strong><br/><span style={{color:"var(--ink-soft)"}}>Get a notification — even with Creator Studio closed — when a post is waiting for your approval, when there's a decision on your post, or when someone @mentions you.</span></div>
      {body}
    </div>
  );
}

function StatsRefresh(){

  const mk = useMakeStore();

  if(!info) return <Skeleton h={40}/>;

  const anyPull = MAKE_PLATFORMS.some(p=>makeReady("pull", p));
  async function pull(){
    setBusy(true);
    try{
      const r = await fetch("/api/make/pull", {method:"POST"});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Couldn't reach Make");
      dispatch({type:"ADD_TOAST", message:"Fetching the latest stats from "+(d.requested||[]).map(p=>PLATFORM_META[p].label).join(", ")+" — Analytics updates in a minute or two"});
      [20000, 45000, 90000].forEach(ms=>setTimeout(()=>{ loadRealAnalytics(true); loadMakeInfo(); }, ms));
    }catch(e){ dispatch({type:"ADD_TOAST", message:e.message, variant:"danger"}); }
    setBusy(false);
  }
  return (
    <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
      <Button size="sm" icon="refresh" disabled={busy || !anyPull} onClick={pull}>{busy? "Asking Make…" : "Get latest stats now"}</Button>

    </div>
  );
}

        <div><label style={{fontSize:11.5, fontWeight:700, display:"block", marginBottom:5}}>Day</label><Select value={draft.weekday} onChange={v=>setDraft(d=>({...d, weekday:v}))} options={WEEKDAY_LABELS.map((w,i)=>({value:i,label:w}))} style={{width:140}}/></div>
        <div><label style={{fontSize:11.5, fontWeight:700, display:"block", marginBottom:5}}>Time</label><input type="time" value={draft.time} onChange={e=>setDraft(d=>({...d, time:e.target.value}))} style={{borderRadius:9, border:"1px solid var(--border)", padding:"8px 10px", fontSize:12.5}}/></div>
        <div><label style={{fontSize:11.5, fontWeight:700, display:"block", marginBottom:5}}>Platform</label><Select value={draft.platform} onChange={v=>setDraft(d=>({...d, platform:v}))} options={Object.entries(PLATFORM_META).map(([k,v])=>({value:k,label:v.label}))} style={{width:160}}/></div>
        <div><label style={{fontSize:11.5, fontWeight:700, display:"block", marginBottom:5}}>Content type</label><Select value={draft.type} onChange={v=>setDraft(d=>({...d, type:v}))} options={CONTENT_TYPE_OPTIONS.map(t=>({value:t,label:t.charAt(0).toUpperCase()+t.slice(1)}))} style={{width:140}}/></div>
        <Button variant="primary" icon="plus" onClick={addRow}>Add slot</Button>
      </div>
    </div>
  );
}

function AdminEmailEditor({emails, onChange, viewerEmail}){
  const [draft, setDraft] = useState("");
  function addEmail(){
    const e = draft.trim().toLowerCase();
    if(!e || !e.includes("@") || emails.includes(e)) return;
    onChange([...emails, e]); setDraft("");
  }
  function removeEmail(e){ if(emails.length<=1) return; onChange(emails.filter(x=>x!==e)); }
  return (
    <div>
      <div style={{display:"flex", flexDirection:"column", gap:8, marginBottom:14}}>
        {emails.map(e=>(
          <div key={e} style={{display:"flex", alignItems:"center", gap:10, padding:"9px 12px", borderRadius:10, border:"1px solid var(--border)", background:"var(--surface-2)"}}>
            <Icon name="team" size={14} style={{color:"var(--ink-mute)"}}/>
            <span style={{fontSize:12.5, fontWeight:600, flex:1}}>{e}</span>
            {e===viewerEmail && <Badge label="You" color="var(--green)" soft="var(--green-soft)"/>}
            {emails.length>1 && <IconButton icon="x" onClick={()=>removeEmail(e)}/>}
          </div>
        ))}
      </div>
      <div style={{display:"flex", gap:10}}>
        <input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") addEmail();}} placeholder="name@sanjugo.co.uk" style={{flex:1, minWidth:200, padding:"9px 12px", borderRadius:9, border:"1px solid var(--border)", fontSize:13, background:"var(--surface)", color:"var(--ink)"}}/>
        <Button variant="primary" icon="plus" onClick={addEmail}>Add admin</Button>
      </div>
    </div>
  );
}

/* ============================== APP ROOT ============================== */
function App(){
  const [state, dispatch] = useReducer(reducer, null, initState);
  const [detailItem, setDetailItem] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const caps = useCaps();
  const chat = useChat(state.currentUserId, dispatch);

  // Who's signed in (when Cloudflare Access sign-in is on) and the live team list.
  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      try{
        const r = await fetch("/api/me", {cache:"no-store"});
        const d = await r.json().catch(()=>({}));
        if(cancelled) return;
        if(r.status===401 || r.status===403) { dispatch({type:"SET_ME", me:null, lock:{code:d.code, message:d.error}}); return; }
        if(r.ok) dispatch({type:"SET_ME", me:d});
        const t = await fetch("/api/team", {cache:"no-store"});
        if(t.ok && !cancelled){ const td = await t.json(); if(Array.isArray(td.members) && td.members.length) dispatch({type:"TEAM_LOADED", members:td.members}); }
      }catch(e){ /* offline or no server: keep the built-in team */ }
      if(!cancelled) dispatch({type:"BOOT_DONE"});
    })();
    const fallback = setTimeout(()=>dispatch({type:"BOOT_DONE"}), 3000); // never wait forever on a slow network
    return ()=>{ cancelled = true; clearTimeout(fallback); };
  }, []);

  // Deep links from outside the app (e.g. the Drive content library page, push alerts): #/library?q=G219, #/create?barcode=G219, #/chat, #/queue?tab=changes
  useEffect(()=>{
    const openFromHash = ()=>{
      const m = /^#\/(library|create|settings|chat|queue)(?:\?(.*))?$/.exec(window.location.hash || "");
      if(!m) return;
      const params = new URLSearchParams(m[2] || "");
      if(m[1]==="chat") dispatch({type:"SET_ROUTE", route:"chat"});
      else if(m[1]==="queue") dispatch({type:"SET_ROUTE", route:"queue", queueTab: params.get("tab") || null});
      else if(m[1]==="settings") dispatch({type:"SET_ROUTE", route:"settings", driveReturn: params.get("drive") ? {drive: params.get("drive"), msg: params.get("msg")} : null});
      else if(m[1]==="library") dispatch({type:"SET_ROUTE", route:"library", libraryQuery: params.get("q") || ""});
      else dispatch({type:"SET_ROUTE", route:"create", createPrefill: params.get("barcode") ? {libraryBarcode: params.get("barcode")} : null});
      try{ history.replaceState(null, "", window.location.pathname + window.location.search); }catch(e){}
    };
    openFromHash();
    window.addEventListener("hashchange", openFromHash);
    const onSwMessage = e=>{ if(e.data && e.data.type==="open"){ try{ window.location.hash = new URL(e.data.url).hash; }catch(err){} } };
    if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", onSwMessage);
    return ()=>{ window.removeEventListener("hashchange", openFromHash); if("serviceWorker" in navigator) navigator.serviceWorker.removeEventListener("message", onSwMessage); };
  }, []);

  useMakeSync(state, dispatch);

  // If this device has alerts on, make sure they go to whoever is using it now (e.g. after switching name).
  useEffect(()=>{
    if(!state.bootDone || !("Notification" in window) || Notification.permission!=="granted") return;
    currentPushSub().then(sub=>{ if(sub) return savePushSub(sub, state.currentUserId); }).catch(()=>{});
  }, [state.currentUserId, state.bootDone]);

  useEffect(()=>{ savePersisted(state); }, [state.contentItems, state.activityLog, state.currentUserId, state.currentBrandId, state.decisionHistory, state.theme, state.campaigns]);

  // Pull the shared server copy once on load — this is what makes content visible across every
  // device/teammate instead of being stuck in one browser's localStorage.
  useEffect(()=>{
    let cancelled = false;
    fetchServerState().then(data=>{
      if(data){ try{ sessionStorage.removeItem("cf_reset_reload"); }catch(e){} }
      if(!cancelled && data) dispatch({type:"LOAD_STATE", data});
    });
    return ()=>{ cancelled = true; };
  }, []);

  // Push changes back up, debounced so a burst of edits (typing, dragging) doesn't fire a request per keystroke.
  const pushTimer = useRef(null);
  useEffect(()=>{
    if(!state.serverLoaded) return; // don't push the seed data over a real server copy before we've loaded it
    if(pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(()=> pushServerState(state), 700);
    return ()=>clearTimeout(pushTimer.current);
  }, [state.contentItems, state.activityLog, state.decisionHistory, state.calendarTemplate, state.adminEmails, state.theme, state.campaigns, state.chatUpdates, state.serverLoaded]);

  useEffect(()=>{
    if(state.toasts.length===0) return;
    const t = setTimeout(()=> dispatch({type:"REMOVE_TOAST", id: state.toasts[0].id}), 3400);
    return ()=>clearTimeout(t);
  }, [state.toasts]);

  // Long-term settings (admin allowlist + the recurring calendar template) live in the artifact's
  // shared `db`, so they persist across sessions/devices rather than one browser's localStorage.
  useEffect(()=>{
    if(!caps.ready || !caps.db) return;
    const ref = caps.db.doc("settings/config");
    let cancelled = false;
    ref.get().then(snap=>{
      if(cancelled) return;
      if(!snap.exists){
        ref.set({adminEmails:[DEFAULT_ADMIN_EMAIL], calendarTemplate:DEFAULT_CALENDAR_TEMPLATE, updatedAt:new Date().toISOString()}).catch(()=>{});
      }
    }).catch(()=>{});
    const unsub = ref.onSnapshot(snap=>{
      if(!snap.exists) return;
      const d = snap.data();
      if(Array.isArray(d.adminEmails)) dispatch({type:"SET_ADMIN_EMAILS", emails:d.adminEmails});
      if(Array.isArray(d.calendarTemplate)) dispatch({type:"SET_TEMPLATE", template:d.calendarTemplate});
    }, ()=>{});
    return ()=>{ cancelled=true; unsub(); };
  }, [caps.ready, caps.db]);

  const user = USERS.find(u=>u.id===state.currentUserId);
  const perms = PERMS[user.role];
  const viewerIsRealAdmin = !!(caps.viewerEmail && state.adminEmails.includes(caps.viewerEmail));
  const ctx = useMemo(()=>({state, dispatch, openDetails: setDetailItem, caps, viewerIsRealAdmin, chat}), [state, caps, viewerIsRealAdmin, chat]);

  useEffect(()=>{
    if(state.route==="create" && !perms.create) dispatch({type:"SET_ROUTE", route:"dashboard"});
  }, [state.route, user.role]);

  const pages = {
    dashboard: <DashboardPage/>, calendar: <ContentCalendarPage/>, queue: <ApprovalQueuePage key={state.queueTab||""}/>,
    create: <CreateContentPage key={JSON.stringify(state.createPrefill||{})}/>, published: <PublishedContentPage/>, analytics: <AnalyticsPage/>,
    team: <TeamPage/>, settings: <SettingsPage/>, chat: <ChatPage/>, library: <LibraryPage key={state.libraryQuery||""}/>,
  };
  const titles = {dashboard:"Dashboard", calendar:"Calendar", queue:"Approval Queue", create:"Create Content", published:"Published", analytics:"Analytics", team:"Team", settings:"Settings", chat:"Team Chat", library:"Content Library"};

  if(state.lock) return <LockScreen lock={state.lock}/>;
  const accessOn = !!(state.me && state.me.accessEnabled);
  const chosen = state.signedInAs && USERS.find(u=>u.id===state.signedInAs && u.active!==false);
  if(!state.bootDone && !chosen) return <div style={{minHeight:"100vh", background:"var(--bg)"}}/>;
  if(!accessOn && !chosen) return <WelcomeScreen dispatch={dispatch} teamRev={state.teamRev}/>;

  return (
    <AppCtx.Provider value={ctx}>
      <div style={{display:"flex", height:"100%", minHeight:"100vh"}}>
        <Sidebar open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
        <div style={{flex:1, minWidth:0, display:"flex", flexDirection:"column"}}>
          <MobileTopBar onMenu={()=>setSidebarOpen(true)} title={titles[state.route]}/>
          <main style={{flex:1, padding:"26px 28px 60px", maxWidth:1280, width:"100%", margin:"0 auto"}} className="cf-main">
            {pages[state.route] || <DashboardPage/>}
          </main>
        </div>
      </div>
      <div className="cf-statusbar-bg" style={{position:"fixed", top:0, left:0, right:0, height:"env(safe-area-inset-top, 0px)", background:"var(--surface)", zIndex:30, pointerEvents:"none"}}/>
      <ContentDetailDrawer item={detailItem} onClose={()=>setDetailItem(null)}/>
      <ToastHost toasts={state.toasts} remove={id=>dispatch({type:"REMOVE_TOAST", id})}/>
      <style>{`@media (max-width:600px){ .cf-main{ padding:18px 16px 50px !important; } }`}</style>
    </AppCtx.Provider>
  );
}

function WelcomeScreen({dispatch}){
  const people = activeUsers();
  const [pick, setPick] = useState(()=> (people.find(u=>u.id===readWelcome()) || {}).id || "");
  const who = people.find(u=>u.id===pick);
  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:"calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px))", background:"var(--bg)"}}>
      <div style={{maxWidth:400, width:"100%", textAlign:"center"}}>
        <img src={LOGO_SANJUGO} alt="Sanjugo" style={{width:84, height:84, borderRadius:99, marginBottom:18, boxShadow:"0 0 0 6px var(--surface), var(--shadow-md)"}}/>
        <div style={{fontSize:13, fontWeight:600, letterSpacing:".8px", textTransform:"uppercase", color:"var(--accent)", marginBottom:6}}>Sanjugo</div>
        <h1 style={{fontSize:28, margin:"0 0 8px", fontWeight:600}}>Welcome to Creator Studio</h1>
        <div style={{fontSize:14.5, color:"var(--ink-soft)", lineHeight:1.55, marginBottom:28}}>Plan, approve and publish Sanjugo's content — all in one place.</div>
        <div style={{background:"var(--surface)", border:"1px solid var(--border)", borderRadius:14, padding:20, textAlign:"left", boxShadow:"var(--shadow-sm)"}}>
          <label htmlFor="cf-who" style={{display:"block", fontSize:13, fontWeight:600, marginBottom:8}}>Who's signing in?</label>
          <div style={{position:"relative", marginBottom:14}}>
            <select id="cf-who" value={pick} onChange={e=>setPick(e.target.value)}
              style={{appearance:"none", width:"100%", padding:"12px 36px 12px 14px", borderRadius:10, border:"1px solid var(--border)", background:"var(--surface)", color: pick? "var(--ink)" : "var(--ink-mute)", fontSize:15, fontWeight:500, cursor:"pointer"}}>
              <option value="">Select your name</option>
              {people.map(u=><option key={u.id} value={u.id}>{u.name} — {ROLE_META[u.role].label}</option>)}
            </select>
            <Icon name="chevronDown" size={16} style={{position:"absolute", right:12, top:14, color:"var(--ink-mute)", pointerEvents:"none"}}/>
          </div>
          <Button variant="primary" size="lg" disabled={!pick} onClick={()=>dispatch({type:"WELCOME_SIGN_IN", id:pick})} style={{width:"100%", justifyContent:"center"}}>
            {who ? "Continue as "+who.name : "Continue"}
          </Button>
        </div>
        <div style={{fontSize:12, color:"var(--ink-mute)", marginTop:16, lineHeight:1.5}}>Not on the list? Ask an admin to add you in Settings → Team &amp; access.</div>
      </div>
    </div>
  );
}

function LockScreen({lock}){
  const signedOut = lock.code==="signed_out";
  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:24, background:"var(--bg)"}}>
      <div style={{maxWidth:420, width:"100%", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:12, padding:28, textAlign:"center", boxShadow:"var(--shadow-md)"}}>
        <img src={LOGO_SANJUGO} alt="Sanjugo" style={{width:48, height:48, borderRadius:99, marginBottom:14}}/>
        <div style={{fontSize:18, fontWeight:600, marginBottom:8}}>{signedOut ? "Please sign in again" : "You don't have access yet"}</div>
        <div style={{fontSize:13.5, color:"var(--ink-soft)", lineHeight:1.6, marginBottom:20}}>{lock.message || "Ask a Creator Studio admin to add your email in Settings → Team & access."}</div>
        <div style={{display:"flex", gap:8, justifyContent:"center", flexWrap:"wrap"}}>
          <Button variant="primary" onClick={()=>window.location.reload()}>Try again</Button>
          <a href="/cdn-cgi/access/logout" style={{textDecoration:"none"}}><Button variant="ghost">Use a different email</Button></a>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("cf-root"));
root.render(<App/>);

  // Registers the service worker so Creator Studio can be installed as an app (home-screen icon,
  // full-screen, no browser bar) instead of only living as a browser tab.
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("/sw.js").catch(()=>{ /* not fatal — app still works as a normal page */ });
    });
  }
</script>
