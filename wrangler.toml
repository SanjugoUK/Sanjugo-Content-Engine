name = "sanjugo-content-engine"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# The Google Drive folder that holds the content library ("Sanjugo Marketing Contents Final").
[vars]
LIBRARY_FOLDER_ID = "11YpaH0QMfCekJEH3oiqEAvO3Cc-wTaqO"

[assets]
directory = "./public"
binding = "ASSETS"

# Filled in automatically by the setup commands in README.md — you shouldn't need to touch this.
[[d1_databases]]
binding = "DB"
database_name = "contentflow-db"
database_id = "32fd6952-121c-4f8f-8676-aaaa76c6dc55"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "contentflow-media"
